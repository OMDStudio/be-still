he same way, after supper He took the cup, saying, “This cup is the new covenant in My blood; do this, as often as you drink it, in remembrance of Me.” For as often as you eat this bread and drink this cup, you proclaim the Lord’s death until He comes.","BBE":"For it was handed down to me from the Lord, as I gave it to you, that the Lord Jesus, on the night when Judas was false to him, took bread, And when it had been broken with an act of praise, he said, This is my body which is for you: do this in memory of me. In the same way, with the cup, after the meal, he said, This cup is the new testament in my blood: do this, whenever you take it, in memory of me. For whenever you take the bread and the cup you give witness to the Lord's death till he comes.","Darby":"For I received from the Lord, that which I also delivered to you, that the Lord Jesus, in the night in which he was delivered up, took bread, and having given thanks broke [it], and said, This is my body, which [is] for you: this do in remembrance of me. In like manner also the cup, after having supped, saying, This cup is the new covenant in my blood: this do, as often as ye shall drink [it], in remembrance of me. For as often as ye shall eat this bread, and drink the cup, ye announce the death of the Lord, until he come.","Geneva1599":"For I haue receiued of the Lord that which I also haue deliuered vnto you, to wit, That the Lord Iesus in the night when he was betrayed, tooke bread: And when hee had giuen thankes, hee brake it, and sayde, Take, eate: this is my body, which is broken for you: this doe ye in remembrance of me. After the same maner also he tooke the cup, when he had supped, saying, This cup is the Newe Testament in my blood: this doe as oft as ye drinke it, in remembrance of me. For as often as ye shall eate this bread, and drinke this cup, ye shewe the Lords death till hee come.","Webster":"For I have received from the Lord, that which also I delivered to you, That the Lord Jesus, the [same] night in which he was betrayed, took bread: And when he had given thanks, he broke [it], and said, Take, eat: this is my body, which is broken for you: this do in remembrance of me. After the same manner also [he took] the cup, when he had supped, saying, This cup is the new testament in my blood: this do ye, as often as ye drink [it], in remembrance of me. For as often as ye eat this bread, and drink this cup, ye do show the Lord's death till he shall come.","YLT":"For I--I received from the Lord that which also I did deliver to you, that the Lord Jesus in the night in which he was delivered up, took bread, and having given thanks, he brake, and said, `Take ye, eat ye, this is my body, that for you is being broken; this do ye--to the remembrance of me.' In like manner also the cup after the supping, saying, `This cup is the new covenant in my blood; this do ye, as often as ye may drink it --to the remembrance of me;' for as often as ye may eat this bread, and this cup may drink, the death of the Lord ye do shew forth--till he may come;","NHEB":"For I received from the Lord that which also I delivered to you, that the Lord Jesus on the night in which he was betrayed took bread. When he had given thanks, he broke it, and said, \"This is my body, which is for you. Do this in memory of me.\" In the same way he also took the cup, after supper, saying, \"This cup is the New Covenant in my blood. Do this, as often as you drink, in memory of me.\" For as often as you eat this bread and drink this cup, you proclaim the Lord's death until he comes."}},{"r":"John 6:35","x":{"KJV":"And Jesus said unto them, I am the bread of life: he that cometh to me shall never hunger; and he that believeth on me shall never thirst.","DRC":"And Jesus said to them: I am the bread of life. He that cometh to me shall not hunger: and he that believeth in me shall never thirst.","CPDV":"Then Jesus said to them: “I am the bread of life. Whoever comes to me shall not hunger, and whoever believes in me shall never thirst.","ASV":"Jesus said unto them, I am the bread of life: he that cometh to me shall not hunger, and he that believeth on me shall never thirst.","BSB":"Jesus answered, “I am the bread of life. Whoever comes to Me will never hunger, and whoever believes in Me will never thirst.","BBE":"And this was the answer of Jesus: I am the bread of life. He who comes to me will never be in need of food, and he who has faith in me will never be in need of drink.","Darby":"[And] Jesus said to them, I am the bread of life: he that comes to me shall never hunger, and he that believes on me shall never thirst at any time.","Geneva1599":"And Iesus saide vnto them, I am that bread of life: he that commeth to me, shall not hunger, and he that beleeueth in me, shall neuer thirst.","Webster":"And Jesus said to them, I am the bread of life: he that cometh to me, shall never hunger; and he that believeth on me, shall never thirst.","YLT":"And Jesus said to them, `I am the bread of the life; he who is coming unto me may not hunger, and he who is believing in me may not thirst--at any time;","NHEB":"Jesus said to them, \"I am the bread of life. He who comes to me will not be hungry, and he who believes in me will never be thirsty."}}],"l":[{"r":"Moroni 4:3","x":"O God, the Eternal Father, we ask thee in the name of thy Son, Jesus Christ, to bless and sanctify this bread to the souls of all those who partake of it; that they may eat in remembrance of the body of thy Son, and witness unto thee, O God, the Eternal Father, that they are willing to take upon them the name of thy Son, and always remember him, and keep his commandments which he hath given them, that they may always have his Spirit to be with them. Amen."},{"r":"Moroni 5:2","x":"O God, the Eternal Father, we ask thee, in the name of thy Son, Jesus Christ, to bless and sanctify this wine to the souls of all those who drink of it, that they may do it in remembrance of the blood of thy Son, which was shed for them; that they may witness unto thee, O God, the Eternal Father, that they do always remember him, that they may have his Spirit to be with them. Amen."},{"r":"3 Nephi 18:7","x":"And this shall ye do in remembrance of my body, which I have shown unto you. And it shall be a testimony unto the Father that ye do always remember me. And if ye do always remember me ye shall have my Spirit to be with you."}]},{"id":"baptism","t":"baptism","g":"Spiritual life","p":["baptism","baptized","getting baptized","water"],"k":[],"v":[{"r":"Matthew 28:19","x":{"KJV":"Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:","DRC":"Going therefore, teach ye all nations: baptizing them in the name of the Father and of the Son and of the Holy Ghost.","CPDV":"Therefore, go forth and teach all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit,","ASV":"Go ye therefore, and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit:","BSB":"Therefore go and make disciples of all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Spirit,","BBE":"Go then, and make disciples of all the nations, giving them baptism in the name of the Father and of the Son and of the Holy Spirit:","Darby":"Go [therefore] and make disciples of all the nations, baptising them to the name of the Father, and of the Son, and of the Holy Spirit;","Geneva1599":"Go therefore, and teach all nations, baptizing them in the Name of the Father, and the Sonne, and the holy Ghost,","Webster":"Go ye therefore and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Spirit.","YLT":"having gone, then, disciple all the nations, (baptizing them--to the name of the Father, and of the Son, and of the Holy Spirit,","NHEB":"Therefore go, and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit,"}},{"r":"Acts 2:38","x":{"KJV":"Then Peter said unto them, Repent, and be baptized every one of you in the name of Jesus Christ for the remission of sins, and ye shall receive the gift of the Holy Ghost.","DRC":"But Peter said to them: Do penance: and be baptized every one of you in the name of Jesus Christ, for the remission of your sins. And you shall receive the gift of the Holy Ghost.","CPDV":"Yet truly, Peter said to them: “Do penance; and be baptized, each one of you, in the name of Jesus Christ, for the remission of your sins. And you shall receive the gift of the Holy Spirit.","ASV":"And Peter said unto them, Repent ye, and be baptized every one of you in the name of Jesus Christ unto the remission of your sins; and ye shall receive the gift of the Holy Spirit.","BSB":"Peter replied, “Repent and be baptized, every one of you, in the name of Jesus Christ for the forgiveness of your sins, and you will receive the gift of the Holy Spirit.","BBE":"And Peter said, Let your hearts be changed, every one of you, and have baptism in the name of Jesus Christ, for the forgiveness of your sins; and you will have the Holy Spirit given to you.","Darby":"And Peter said to them, Repent, and be baptised, each one of you, in the name of Jesus Christ, for remission of sins, and ye will receive the gift of the Holy Spirit.","Geneva1599":"Then Peter said vnto them, Amend your liues, and bee baptized euery one of you in the Name of Iesus Christ for the remission of sinnes: and ye shall receiue the gift of the holy Ghost.","Webster":"Then Peter said to them, Repent, and be baptized every one of you in the name of Jesus Christ, for the remission of sins, and ye shall receive the gift of the Holy Spirit.","YLT":"and Peter said unto them, `Reform, and be baptized each of you on the name of Jesus Christ, to remission of sins, and ye shall receive the gift of the Holy Spirit,","NHEB":"Peter said to them, \"Repent, and be baptized, every one of you, in the name of Jesus Christ for the forgiveness of your sins, and you will receive the gift of the Holy Spirit."}},{"r":"Romans 6:4","x":{"KJV":"Therefore we are buried with him by baptism into death: that like as Christ was raised up from the dead by the glory of the Father, even so we also should walk in newness of life.","DRC":"For we are buried together with him by baptism into death: that, as Christ is risen from the dead by the glory of the Father, so we also may walk in newness of life.","CPDV":"For through baptism we have been buried with him into death, so that, in the manner that Christ rose from the dead, by the glory of the Father, so may we also walk in the newness of life.","ASV":"We were buried therefore with him through baptism into death: that like as Christ was raised from the dead through the glory of the Father, so we also might walk in newness of life.","BSB":"We were therefore buried with Him through baptism into death, in order that, just as Christ was raised from the dead through the glory of the Father, we too may walk in newness of life.","BBE":"We have been placed with him among the dead through baptism into death: so that as Christ came again from the dead by the glory of the Father, we, in the same way, might be living in new life.","Darby":"We have been buried therefore with him by baptism unto death, in order that, even as Christ has been raised up from among [the] dead by the glory of the Father, so we also should walk in newness of life.","Geneva1599":"We are buried then with him by baptisme into his death, that like as Christ was raysed vp from the dead to the glorie of the Father, so we also should walke in newnesse of life.","Webster":"Therefore we are buried with him by baptism into death: that as Christ was raised from the dead by the glory of the Father, even so we also should walk in newness of life.","YLT":"we were buried together, then, with him through the baptism to the death, that even as Christ was raised up out of the dead through the glory of the Father, so also we in newness of life might walk.","NHEB":"We were buried therefore with him through baptism to death, that just like Christ was raised from the dead through the glory of the Father, so we also might walk in newness of life."}}],"l":[{"r":"2 Nephi 31:5","x":"And now, if the Lamb of God, he being holy, should have need to be baptized by water, to fulfil all righteousness, O then, how much more need have we, being unholy, to be baptized, yea, even by water!"},{"r":"Mosiah 18:10","x":"Now I say unto you, if this be the desire of your hearts, what have you against being baptized in the name of the Lord, as a witness before him that ye have entered into a covenant with him, that ye will serve him and keep his commandments, that he may pour out his Spirit more abundantly upon you?"},{"r":"3 Nephi 11:33","x":"And whoso believeth in me, and is baptized, the same shall be saved; and they are they who shall inherit the kingdom of God."}]},{"id":"covenants","t":"covenants","g":"Spiritual life","p":["covenant","promises with God","keep my promises to God","temple"],"k":[],"v":[{"r":"Jeremiah 31:33","x":{"KJV":"But this shall be the covenant that I will make with the house of Israel; After those days, saith the LORD, I will put my law in their inward parts, and write it in their hearts; and will be their God, and they shall be my people.","DRC":"But this shall be the covenant that I will make with the house of Israel, after those days, saith the Lord: I will give my law in their bowels, and I will write it in their heart: and I will be their God, and they shall be my people.","CPDV":"But this will be the covenant that I will form with the house of Israel, after those days, says the Lord: I will give my law to their inner most being, and I will write it upon their heart. And I will be their God, and they shall be my people.","ASV":"But this is the covenant that I will make with the house of Israel after those days, saith Jehovah: I will put my law in their inward parts, and in their heart will I write it; and I will be their God, and they shall be my people.","BSB":"“But this is the covenant I will make with the house of Israel after those days, declares the LORD. I will put My law in their minds and inscribe it on their hearts. And I will be their God, and they will be My people.","BBE":"But this is the agreement which I will make with the people of Israel after those days, says the Lord; I will put my law in their inner parts, writing it in their hearts; and I will be their God, and they will be my people.","Darby":"For this is the covenant that I will make with the house of Israel, after those days, saith Jehovah: I will put my law in their inward parts, and will write it in their heart; and I will be theirGod, and they shall be my people.","Geneva1599":"But this shall be the couenant that I will make with the house of Israel, After those dayes, saith the Lord, I will put my Lawe in their inward partes, and write it in their hearts, and wil be their God, and they shalbe my people.","Webster":"But this [shall be] the covenant that I will make with the house of Israel; After those days, saith the LORD, I will put my law in their inward parts, and write it in their hearts; and will be their God, and they shall be my people.","YLT":"For this is the covenant that I make, With the house of Israel, after those days, An affirmation of Jehovah, I have given My law in their inward part, And on their heart I do write it, And I have been to them for God, And they are to me for a people.","NHEB":"\"But this is the covenant that I will make with the house of Israel after those days,\" says the Lord: \"I will put my law in their inward parts, and in their heart will I write it; and I will be their God, and they shall be my people:"}},{"r":"Deuteronomy 7:9","x":{"KJV":"Know therefore that the LORD thy God, he is God, the faithful God, which keepeth covenant and mercy with them that love him and keep his commandments to a thousand generations;","DRC":"And thou shalt know that the Lord thy God, he is a strong and faithful God, keeping his covenant and mercy to them that love him, and to them that keep his commandments, unto a thousand generations:","CPDV":"And you shall know that the Lord your God himself is a strong and faithful God, preserving his covenant and his mercy for those who love him and those who keep his precepts for a thousand generations,","ASV":"Know therefore that Jehovah thy God, he is God, the faithful God, who keepeth covenant and lovingkindness with them that love him and keep his commandments to a thousand generations,","BSB":"Know therefore that the LORD your God is God, the faithful God who keeps His covenant of loving devotion for a thousand generations of those who love Him and keep His commandments.","BBE":"Be certain, then, that the Lord your God is God; whose faith and mercy are unchanging, who keeps his word through a thousand generations to those who have love for him and keep his laws;","Darby":"And thou shalt know that Jehovah thyGod, he isGod, the faithfulGod, who keepeth covenant and mercy to a thousand generations with them that love him and keep his commandments;","Geneva1599":"That thou mayest knowe, that the Lord thy God, he is God, the faithfull God which keepeth couenant and mercie vnto them that loue him and keepe his commandements, euen to a thousand generations,","Webster":"Know therefore that the LORD thy God, he [is] God, the faithful God, who keepeth covenant and mercy with them that love him and keep his commandments to a thousand generations:","YLT":"`And thou hast known that Jehovah thy God He is God, the faithful God, keeping the covenant, and the kindness, to those loving Him, and to those keeping His commands--to a thousand generations,","NHEB":"Know therefore that the Lord your God, he is God, the faithful God, who keeps covenant and loving kindness with them who love him and keep his commandments to a thousand generations,"}},{"r":"Hebrews 8:10","x":{"KJV":"For this is the covenant that I will make with the house of Israel after those days, saith the Lord; I will put my laws into their mind, and write them in their hearts: and I will be to them a God, and they shall be to me a people:","DRC":"For this is the testament which I will make to the house of Israel after those days, saith the Lord: I will give my laws into their mind: and in their heart will I write them. And I will be their God: and they shall be my people.","CPDV":"For this is the testament which I will set before the house of Israel, after those days, says the Lord. I will instill my laws in their minds, and I will inscribe my laws on their hearts. And so, I will be their God, and they shall be my people.","ASV":"For this is the covenant that I will make with the house of Israel After those days, saith the Lord; I will put my laws into their mind, And on their heart also will I write them: And I will be to them a God, And they shall be to me a people:","BSB":"For this is the covenant I will make with the house of Israel after those days, declares the Lord. I will put My laws in their minds and inscribe them on their hearts. And I will be their God, and they will be My people.","BBE":"For this is the agreement which I will make with the people of Israel after those days: I will put my laws into their minds, writing them in their hearts: and I will be their God, and they will be my people:","Darby":"Because this [is] the covenant that I will covenant to the house of Israel after those days, saith the Lord: Giving my laws into their mind, I will write them also upon their hearts; and I will be to them forGod, and they shall be to me for people.","Geneva1599":"For this is the Testament that I will make with the house of Israel, After those dayes, saith the Lord, I will put my Lawes in their minde, and in their heart I will write them, and I wil be their God, and they shalbe my people,","Webster":"For this [is] the covenant that I will make with the house of Israel after those days, saith the Lord; I will put my laws into their mind, and write them in their hearts: and I will be to them a God, and they shall be to me a people:","YLT":"because this is the covenant that I will make with the house of Israel, after those days, saith the Lord, giving My laws into their mind, and upon their hearts I will write them, and I will be to them for a God, and they shall be to Me for a people;","NHEB":"\"For this is the covenant that I will make with the house of Israel. After those days,\" says the Lord; \"I will put my laws into their mind, I will also write them on their heart. I will be their God, and they will be my people."}}],"l":[{"r":"Mosiah 18:10","x":"Now I say unto you, if this be the desire of your hearts, what have you against being baptized in the name of the Lord, as a witness before him that ye have entered into a covenant with him, that ye will serve him and keep his commandments, that he may pour out his Spirit more abundantly upon you?"},{"r":"Mosiah 5:5","x":"And we are willing to enter into a covenant with our God to do his will, and to be obedient to his commandments in all things that he shall command us, all the remainder of our days, that we may not bring upon ourselves a never-ending torment, as has been spoken by the angel, that we may not drink out of the cup of the wrath of God."},{"r":"D&C 82:10","x":"I, the Lord, am bound when ye do what I say; but when ye do not what I say, ye have no promise."}]},{"id":"the-sabbath","t":"the Sabbath","g":"Spiritual life","p":["Sabbath","Sunday","day of rest","keep it holy"],"k":[],"v":[{"r":"Exodus 20:8","x":{"KJV":"Remember the sabbath day, to keep it holy.","DRC":"Remember that thou keep holy the sabbath day.","CPDV":"Remember that you are to sanctify the day of the Sabbath.","ASV":"Remember the sabbath day, to keep it holy.","BSB":"Remember the Sabbath day by keeping it holy.","BBE":"Keep in memory the Sabbath and let it be a holy day.","Darby":"Remember the sabbath day to hallow it.","Geneva1599":"Remember the Sabbath day, to keepe it holy.","Webster":"Remember the sabbath-day to keep it holy.","YLT":"`Remember the Sabbath-day to sanctify it;","NHEB":"\"Remember the Sabbath day, to keep it holy."}},{"r":"Isaiah 58:13-14","x":{"KJV":"If thou turn away thy foot from the sabbath, from doing thy pleasure on my holy day; and call the sabbath a delight, the holy of the LORD, honourable; and shalt honour him, not doing thine own ways, nor finding thine own pleasure, nor speaking thine own words: Then shalt thou delight thyself in the LORD; and I will cause thee to ride upon the high places of the earth, and feed thee with the heritage of Jacob thy father: for the mouth of the LORD hath spoken it.","DRC":"If thou turn away thy foot from the sabbath, from doing thy own will in my holy day, and call the sabbath delightful, and the holy of the Lord glorious, and glorify him, while thou dost not thy own ways, and thy own will is not found, to speak a word: Then shalt thou be delighted in the Lord, and I will lift thee up above the high places of the earth, and will feed thee with the inheritance of Jacob thy father. For the mouth of the Lord hath spoken it.","CPDV":"If you restrain your foot on the Sabbath, from doing your own will on my holy day, and if you call the Sabbath delightful, and the Holy of the Lord glorious, and if you glorify him, while you do not act according to your own ways, and your own will is not found, not even to speak a word, then you will find delight in the Lord, and I will take you up, above the heights of the earth, and I will nourish you with the inheritance of Jacob, your father. For the mouth of the Lord has spoken.","ASV":"If thou turn away thy foot from the sabbath, from doing thy pleasure on my holy day; and call the sabbath a delight, and the holy of Jehovah honorable; and shalt honor it, not doing thine own ways, nor finding thine own pleasure, nor speaking thine own words: then shalt thou delight thyself in Jehovah; and I will make thee to ride upon the high places of the earth; and I will feed thee with the heritage of Jacob thy father: for the mouth of Jehovah hath spoken it.","BSB":"If you turn your foot from breaking the Sabbath, from doing as you please on My holy day, if you call the Sabbath a delight, and the LORD’s holy day honorable, if you honor it by not going your own way or seeking your own pleasure or speaking idle words, then you will delight yourself in the LORD, and I will make you ride on the heights of the land and feed you with the heritage of your father Jacob.” For the mouth of the LORD has spoken.","BBE":"If you keep the Sabbath with care, not doing your business on my holy day; and if the Sabbath seems to you a delight, and the new moon of the Lord a thing to be honoured; and if you give respect to him by not doing your business, or going after your pleasure, or saying unholy words; Then the Lord will be your delight; and I will put you on the high places of the earth; and I will give you the heritage of Jacob your father: for the mouth of the Lord has said it.","Darby":"If thou turn back thy foot from the sabbath, [from] doing thy pleasure on my holy day, and call the sabbath a delight, the holy [day] of Jehovah, honourable; and thou honour him, not doing thine own ways, nor finding thine own pleasure, nor speaking [idle] words; then shalt thou delight thyself in Jehovah, and I will cause thee to ride on the high places of the earth, and feed thee with the heritage of Jacob thy father: for the mouth of Jehovah hath spoken.","Geneva1599":"If thou turne away thy foote from the Sabbath, from doing thy will on mine holy day, and call the Sabbath a delite, to consecrate it, as glorious to the Lord, and shalt honour him, not doing thine owne wayes, nor seeking thine owne will, nor speaking a vaine word, Then shalt thou delite in the Lord, and I wil cause thee to mount vpon the hie places of the earth, and feede thee with the heritage of Iaakob thy father: for the mouth of ye Lord hath spoken it.","Webster":"If thou shalt turn away thy foot from the sabbath, [from] doing thy pleasure on my holy day; and call the sabbath a delight, the holy of the LORD, honorable; and shalt honor him, not doing thy own ways, nor finding thy own pleasure, nor speaking [thy own] words: Then shalt thou delight thyself in the LORD; and I will cause thee to ride upon the high places of the earth, and feed thee with the heritage of Jacob thy father: for the mouth of the LORD hath spoken [it].","YLT":"If thou dost turn from the sabbath thy foot, Doing thine own pleasure on My holy day, And hast cried to the sabbath, `A delight,' To the holy of Jehovah, `Honoured,' And hast honoured it, without doing thine own ways, Without finding thine own pleasure, And speaking a word. Then dost thou delight thyself on Jehovah, And I have caused thee to ride on high places of earth, And have caused thee to eat the inheritance of Jacob thy father, For the mouth of Jehovah hath spoken!","NHEB":"\"If you turn away your foot from the Sabbath, from doing your pleasure on my holy day; and call the Sabbath a delight, and the holy of the Lord honorable; and shall honor it, not doing your own ways, nor finding your own pleasure, nor speaking your own words: then you shall delight yourself in the Lord; and I will make you to ride on the high places of the earth; and I will feed you with the heritage of Jacob your father:\" for the mouth of the Lord has spoken it."}},{"r":"Mark 2:27","x":{"KJV":"And he said unto them, The sabbath was made for man, and not man for the sabbath:","DRC":"And he said to them: The sabbath was made for man, and not man for the sabbath.","CPDV":"And he said to them: “The Sabbath was made for man, and not man for the Sabbath.","ASV":"And he said unto them, The sabbath was made for man, and not man for the sabbath:","BSB":"Then Jesus declared, “The Sabbath was made for man, not man for the Sabbath.","BBE":"And he said to them, The Sabbath was made for man, and not man for the Sabbath;","Darby":"And he said to them, The sabbath was made on account of man, not man on account of the sabbath;","Geneva1599":"And hee sayde to them, The Sabbath was made for man, and not man for the Sabbath.","Webster":"And he said to them, The sabbath was made for man, and not man for the sabbath:","YLT":"And he said to them, `The sabbath for man was made, not man for the sabbath,","NHEB":"He said to them, \"The Sabbath was made for man, not man for the Sabbath."}}],"l":[{"r":"D&C 59:9-10","x":"And that thou mayest more fully keep thyself unspotted from the world, thou shalt go to the house of prayer and offer up thy sacraments upon my holy day; For verily this is a day appointed unto you to rest from your labors, and to pay thy devotions unto the Most High;"},{"r":"D&C 59:12","x":"But remember that on this, the Lord's day, thou shalt offer thine oblations and thy sacraments unto the Most High, confessing thy sins unto thy brethren, and before the Lord."},{"r":"Mosiah 18:23","x":"And he commanded them that they should observe the sabbath day, and keep it holy, and also every day they should give thanks to the Lord their God."}]},{"id":"christmas","t":"Christmas","g":"Holidays and seasons","p":["Christmas","merry Christmas","December","nativity"],"k":[],"v":[{"r":"Luke 2:10-11","x":{"KJV":"And the angel said unto them, Fear not: for, behold, I bring you good tidings of great joy, which shall be to all people. For unto you is born this day in the city of David a Saviour, which is Christ the Lord.","DRC":"And the angel said to them: Fear not; for, behold, I bring you good tidings of great joy that shall be to all the people: For, this day is born to you a Saviour, who is Christ the Lord, in the city of David.","CPDV":"And the Angel said to them: “Do not be afraid. For, behold, I proclaim to you a great joy, which will be for all the people. For today a Savior has been born for you in the city of David: he is Christ the Lord.","ASV":"And the angel said unto them, Be not afraid; for behold, I bring you good tidings of great joy which shall be to all the people: for there is born to you this day in the city of David a Saviour, who is Christ the Lord.","BSB":"But the angel said to them, “Do not be afraid! For behold, I bring you good news of great joy that will be for all the people: Today in the city of David a Savior has been born to you. He is Christ the Lord!","BBE":"And the angel said, Have no fear; for truly, I give you good news of great joy which will be for all the people: For on this day, in the town of David, a Saviour has come to birth, who is Christ the Lord.","Darby":"And the angel said to them, Fear not, for behold, I announce to you glad tidings of great joy, which shall be to all the people; for to-day a Saviour has been born to you in David's city, who is Christ [the] Lord.","Geneva1599":"Then the Angel saide vnto them, Be not afraid: for behold, I bring you glad tidings of great ioy, that shalbe to all the people, That is, that vnto you is borne this day in the citie of Dauid, a Sauiour, which is Christ the Lord.","Webster":"And the angel said to them, Fear not: for behold, I bring you good tidings of great joy which shall be to all people. For to you is born this day, in the city of David, a Savior, who is Christ the Lord.","YLT":"And the messenger said to them, `Fear not, for lo, I bring you good news of great joy, that shall be to all the people-- because there was born to you to-day a Saviour--who is Christ the Lord--in the city of David,","NHEB":"The angel said to them, \"Do not be afraid, for behold, I bring you good news of great joy which will be to all the people. For there is born to you, this day, in the city of David, a Savior, who is Messiah, the Lord."}},{"r":"Isaiah 9:6","x":{"KJV":"For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace.","DRC":"For a CHILD IS BORN to us, and a son is given to us, and the government is upon his shoulder: and his name shall be called Wonderful, Counsellor, God the Mighty, the Father of the world to come, the Prince of Peace.","CPDV":"For unto us a child is born, and unto us a son is given. And leadership is placed upon his shoulder. And his name shall be called: wonderful Counselor, mighty God, father of the future age, Prince of Peace.","ASV":"For unto us a child is born, unto us a son is given; and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, Mighty God, Everlasting Father, Prince of Peace.","BSB":"For unto us a child is born, unto us a son is given, and the government will be upon His shoulders. And He will be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace.","BBE":"For to us a child has come, to us a son is given; and the government has been placed in his hands; and he has been named Wise Guide, Strong God, Father for ever, Prince of Peace.","Darby":"For unto us a child is born, unto us a son is given; and the government shall be upon his shoulder; and his name is called Wonderful, Counsellor, MightyGod, Father of Eternity, Prince of Peace.","Geneva1599":"For vnto vs a childe is borne, and vnto vs a Sonne is giuen: and the gouernement is vpon his shoulder, and he shall call his name Wonderfull, Counseller, The mightie God, The euerlasting Father, The prince of peace,","Webster":"For to us a child is born, to us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counselor, The mighty God, The everlasting Father, The Prince of Peace.","YLT":"For a Child hath been born to us, A Son hath been given to us, And the princely power is on his shoulder, And He doth call his name Wonderful, Counsellor, Mighty God, Father of Eternity, Prince of Peace.","NHEB":"For to us a child is born. To us a son is given; and the government will be on his shoulders. His name will be called Wonderful, Counselor, Mighty God, Everlasting Father, Prince of Peace."}},{"r":"Matthew 1:23","x":{"KJV":"Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us.","DRC":"Behold a virgin shall be with child, and bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us.","CPDV":"“Behold, a virgin shall conceive in her womb, and she shall give birth to a son. And they shall call his name Emmanuel, which means: God is with us.”","ASV":"Behold, the virgin shall be with child, and shall bring forth a son, And they shall call his name Immanuel; which is, being interpreted, God with us.","BSB":"“Behold, the virgin will be with child and will give birth to a son, and they will call Him Immanuel” (which means, “God with us”).","BBE":"See, the virgin will be with child, and will give birth to a son, and they will give him the name Immanuel, that is, God with us.","Darby":"Behold, the virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which is, being interpreted, 'God with us.'","Geneva1599":"Behold, a virgine shalbe with childe, and shall beare a sonne, and they shall call his name Emmanuel, which is by interpretation, God with vs.","Webster":"Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us.","YLT":"`Lo, the virgin shall conceive, and she shall bring forth a son, and they shall call his name Emmanuel,' which is, being interpreted `With us he is God.'","NHEB":"\"Behold, the virgin shall be with child, and shall bring forth a son. They shall call his name Immanuel;\" which is, being interpreted, \"God with us.\""}}],"l":[{"r":"1 Nephi 11:20-21","x":"And I looked and beheld the virgin again, bearing a child in her arms. And the angel said unto me: Behold the Lamb of God, yea, even the Son of the Eternal Father! Knowest thou the meaning of the tree which thy father saw?"},{"r":"Mosiah 3:8","x":"And he shall be called Jesus Christ, the Son of God, the Father of heaven and earth, the Creator of all things from the beginning; and his mother shall be called Mary."},{"r":"3 Nephi 1:13","x":"Lift up your head and be of good cheer; for behold, the time is at hand, and on this night shall the sign be given, and on the morrow come I into the world, to show unto the world that I will fulfil all that which I have caused to be spoken by the mouth of my holy prophets."}]},{"id":"the-birth-of-christ","t":"the birth of Christ","g":"Holidays and seasons","p":["baby Jesus","born in Bethlehem","manger","shepherds","wise men"],"k":[],"v":[{"r":"Luke 2:7","x":{"KJV":"And she brought forth her firstborn son, and wrapped him in swaddling clothes, and laid him in a manger; because there was no room for them in the inn.","DRC":"And she brought forth her first born son and wrapped him up in swaddling clothes and laid him in a manger: because there was no room for them in the inn.","CPDV":"And she brought forth her firstborn son. And she wrapped him in swaddling clothes and laid him in a manger, because there was no room for them at the inn.","ASV":"And she brought forth her firstborn son; and she wrapped him in swaddling clothes, and laid him in a manger, because there was no room for them in the inn.","BSB":"And she gave birth to her firstborn, a Son. She wrapped Him in swaddling cloths and laid Him in a manger, because there was no room for them in the inn.","BBE":"And she had her first son; and folding him in linen, she put him to rest in the place where the cattle had their food, because there was no room for them in the house.","Darby":"and she brought forth her first-born son, and wrapped him up in swaddling-clothes and laid him in the manger, because there was no room for them in the inn.","Geneva1599":"And she brought foorth her first begotten sonne, and wrapped him in swadling clothes, and laide him in a cratch, because there was no roome for them in the ynne.","Webster":"And she brought forth her first-born son, and wrapped him in swaddling-clothes, and laid him in a manger; because there was no room for them in the inn.","YLT":"and she brought forth her son--the first-born, and wrapped him up, and laid him down in the manger, because there was not for them a place in the guest-chamber.","NHEB":"She brought forth her firstborn son, and she wrapped him in bands of cloth, and placed him in a feeding trough, because there was no room for them in the inn."}},{"r":"Luke 2:13-14","x":{"KJV":"And suddenly there was with the angel a multitude of the heavenly host praising God, and saying, Glory to God in the highest, and on earth peace, good will toward men.","DRC":"And suddenly there was with the angel a multitude of the heavenly army, praising God and saying: Glory to God in the highest: and on earth peace to men of good will.","CPDV":"And suddenly there was with the Angel a multitude of the celestial army, praising God and saying, “Glory to God in the highest, and on earth peace to men of good will.”","ASV":"And suddenly there was with the angel a multitude of the heavenly host praising God, and saying, Glory to God in the highest, And on earth peace among men in whom he is well pleased.","BSB":"And suddenly there appeared with the angel a great multitude of the heavenly host, praising God and saying: “Glory to God in the highest, and on earth peace to men on whom His favor rests!”","BBE":"And suddenly there was with the angel a great band of spirits from heaven, giving praise to God, and saying, Glory to God in the highest, and on the earth peace among men with whom he is well pleased.","Darby":"And suddenly there was with the angel a multitude of the heavenly host, praisingGod and saying, Glory toGod in the highest, and on earth peace, good pleasure in men.","Geneva1599":"And straightway there was with the Angel a multitude of heauenly souldiers, praising God, and saying, Glory be to God in the high heauens, and peace in earth, and towards men good will.","Webster":"And suddenly there was with the angel a multitude of the heavenly host praising God, and saying, Glory to God in the highest, and on earth peace, good will towards men.","YLT":"And suddenly there came with the messenger a multitude of the heavenly host, praising God, and saying, `Glory in the highest to God, and upon earth peace, among men--good will.'","NHEB":"Suddenly, there was with the angel a multitude of the heavenly army praising God, and saying, \"Glory to God in the highest, on earth peace among men in whom he is well pleased.\""}},{"r":"Matthew 2:10-11","x":{"KJV":"When they saw the star, they rejoiced with exceeding great joy. And when they were come into the house, they saw the young child with Mary his mother, and fell down, and worshipped him: and when they had opened their treasures, they presented unto him gifts; gold, and frankincense, and myrrh.","DRC":"And seeing the star they rejoiced with exceeding great joy. And entering into the house, they found the child with Mary his mother, and falling down they adored him: and opening their treasures, they offered him gifts; gold, frankincense, and myrrh.","CPDV":"Then, seeing the star, they were gladdened by a very great joy. And entering the home, they found the boy with his mother Mary. And so, falling prostrate, they adored him. And opening their treasures, they offered him gifts: gold, frankincense, and myrrh.","ASV":"And when they saw the star, they rejoiced with exceeding great joy. And they came into the house and saw the young child with Mary his mother; and they fell down and worshipped him; and opening their treasures they offered unto him gifts, gold and frankincense and myrrh.","BSB":"When they saw the star, they rejoiced with great delight. On coming to the house, they saw the Child with His mother Mary, and they fell down and worshiped Him. Then they opened their treasures and presented Him with gifts of gold and frankincense and myrrh.","BBE":"And when they saw the star they were full of joy. And they came into the house, and saw the young child with Mary, his mother; and falling down on their faces they gave him worship; and from their store they gave him offerings of gold, perfume, and spices.","Darby":"And when they saw the star they rejoiced with exceeding great joy. And having come into the house they saw the little child with Mary his mother, and falling down did him homage. And having opened their treasures, they offered to him gifts, gold, and frankincense, and myrrh.","Geneva1599":"And when they sawe the starre, they reioyced with an exceeding great ioy, And went into the house, and founde the babe with Mary his mother, and fell downe, and worshipped him, and opened their treasures, and presented vnto him giftes, euen golde, and frankincense, and myrrhe.","Webster":"When they saw the star, they rejoiced with exceeding great joy. And when they had come into the house, they saw the young child with Mary his mother, and fell down, and worshiped him: and when they had opened their treasures, they presented to him gifts; gold, and frankincense, and myrrh.","YLT":"And having seen the star, they rejoiced with exceeding great joy, and having come to the house, they found the child with Mary his mother, and having fallen down they bowed to him, and having opened their treasures, they presented to him gifts, gold, and frankincense, and myrrh,","NHEB":"And when they saw the star, they rejoiced with exceedingly great joy. And they came into the house and saw the young child with Mary, his mother, and they fell down and worshiped him. Then, opening their treasures, they offered to him gifts: gold, frankincense, and myrrh."}}],"l":[{"r":"Alma 7:10","x":"And behold, he shall be born of Mary, at Jerusalem which is the land of our forefathers, she being a virgin, a precious and chosen vessel, who shall be overshadowed and conceive by the power of the Holy Ghost, and bring forth a son, yea, even the Son of God."},{"r":"3 Nephi 1:13","x":"Lift up your head and be of good cheer; for behold, the time is at hand, and on this night shall the sign be given, and on the morrow come I into the world, to show unto the world that I will fulfil all that which I have caused to be spoken by the mouth of my holy prophets."},{"r":"Helaman 14:5","x":"And behold, there shall a new star arise, such an one as ye never have beheld; and this also shall be a sign unto you."}]},{"id":"easter","t":"Easter","g":"Holidays and seasons","p":["Easter","holy week","Palm Sunday","Good Friday"],"k":[],"v":[{"r":"Matthew 28:5-6","x":{"KJV":"And the angel answered and said unto the women, Fear not ye: for I know that ye seek Jesus, which was crucified. He is not here: for he is risen, as he said. Come, see the place where the Lord lay.","DRC":"And the angel answering, said to the women: Fear not you: for I know that you seek Jesus who was crucified. He is not here. For he is risen, as he said. Come, and see the place where the Lord was laid.","CPDV":"Then the Angel responded by saying to the women: “Do not be afraid. For I know that you are seeking Jesus, who was crucified. He is not here. For he has risen, just as he said. Come and see the place where the Lord was placed.","ASV":"And the angel answered and said unto the women, Fear not ye; for I know that ye seek Jesus, who hath been crucified. He is not here; for he is risen, even as he said. Come, see the place where the Lord lay.","BSB":"But the angel said to the women, “Do not be afraid, for I know that you are looking for Jesus, who was crucified. He is not here; He has risen, just as He said! Come, see the place where He lay.","BBE":"And the angel said to the women, Have no fear: for I see that you are searching for Jesus, who was put to death on the cross. He is not here, for he has come to life again, even as he said. Come, see the Lord's resting-place.","Darby":"And the angel answering said to the women, Fear not ye, for I know that ye seek Jesus the crucified one. He is not here, for he is risen, as he said. Come, see the place where the Lord lay.","Geneva1599":"But the Angel answered, and said to the women, Feare ye not: for I know that ye seeke Iesus which was crucified: He is not here, for he is risen; as he saide: come, see the place where the Lord was laid,","Webster":"And the angel answered and said to the women, Fear ye not: for I know that ye seek Jesus, who was crucified. He is not here: for he is risen, as he said. Come, see the place where the Lord lay.","YLT":"And the messenger answering said to the women, `Fear not ye, for I have known that Jesus, who hath been crucified, ye seek; he is not here, for he rose, as he said; come, see the place where the Lord was lying;","NHEB":"The angel answered the women, \"Do not be afraid, for I know that you seek Jesus, who has been crucified. He is not here, for he has risen, just like he said. Come, see the place where he was lying."}},{"r":"John 11:25","x":{"KJV":"Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:","DRC":"Jesus said to her: I am the resurrection and the life: he that believeth in me, although he be dead, shall live:","CPDV":"Jesus said to her: “I am the Resurrection and the Life. Whoever believes in me, even though he has died, he shall live.","ASV":"Jesus said unto her, I am the resurrection, and the life: he that believeth on me, though he die, yet shall he live;","BSB":"Jesus said to her, “I am the resurrection and the life. Whoever believes in Me will live, even though he dies.","BBE":"Jesus said to her, I am myself that day and that life; he who has faith in me will have life even if he is dead;","Darby":"Jesus said to her, I am the resurrection and the life: he that believes on me, though he have died, shall live;","Geneva1599":"Iesus saide vnto her, I am the resurrection and the life: he that beleeueth in me, though he were dead, yet shall he liue.","Webster":"Jesus said to her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:","YLT":"Jesus said to her, `I am the rising again, and the life; he who is believing in me, even if he may die, shall live;","NHEB":"Jesus said to her, \"I am the resurrection and the life. He who believes in me will still live, even if he dies."}},{"r":"1 Corinthians 15:55-57","x":{"KJV":"O death, where is thy sting? O grave, where is thy victory? The sting of death is sin; and the strength of sin is the law. But thanks be to God, which giveth us the victory through our Lord Jesus Christ.","DRC":"O death, where is thy victory? O death, where is thy sting? Now the sting of death is sin: and the power of sin is the law. But thanks be to God, who hath given us the victory through our Lord Jesus Christ.","CPDV":"“O death, where is your victory? O death, where is your sting?” Now the sting of death is sin, and the power of sin is the law. But thanks be to God, who has given us victory through our Lord Jesus Christ.","ASV":"O death, where is thy victory? O death, where is thy sting? The sting of death is sin; and the power of sin is the law: but thanks be to God, who giveth us the victory through our Lord Jesus Christ.","BSB":"“Where, O Death, is your victory? Where, O Death, is your sting?” The sting of death is sin, and the power of sin is the law. But thanks be to God, who gives us the victory through our Lord Jesus Christ!","BBE":"O death, where is your power? O death, where are your pains? The pain of death is sin; and the power of sin is the law: But praise be to God who gives us strength to overcome through our Lord Jesus Christ.","Darby":"Where, O death, [is] thy sting? where, O death, thy victory? Now the sting of death [is] sin, and the power of sin the law; but thanks toGod, who gives us the victory by our Lord Jesus Christ.","Geneva1599":"O death where is thy sting? O graue where is thy victorie? The sting of death is sinne: and ye strength of sinne is the Lawe. But thankes be vnto God, which hath giuen vs victorie through our Lord Iesus Christ.","Webster":"O death, where [is] thy sting? O grave, where [is] thy victory? The sting of death [is] sin; and the strength of sin [is] the law. But thanks [be] to God, who giveth us the victory, through our Lord Jesus Christ.","YLT":"where, O Death, thy sting? where, O Hades, thy victory?' and the sting of the death is the sin, and the power of the sin the law; and to God--thanks, to Him who is giving us the victory through our Lord Jesus Christ;","NHEB":"\"Death, where is your victory? Death, where is your sting?\" The sting of death is sin, and the power of sin is the law. But thanks be to God, who gives us the victory through our Lord Jesus Christ."}}],"l":[{"r":"3 Nephi 11:14","x":"Arise and come forth unto me, that ye may thrust your hands into my side, and also that ye may feel the prints of the nails in my hands and in my feet, that ye may know that I am the God of Israel, and the God of the whole earth, and have been slain for the sins of the world."},{"r":"Alma 11:42","x":"Now, there is a death which is called a temporal death; and the death of Christ shall loose the bands of this temporal death, that all shall be raised from this temporal death."},{"r":"Mosiah 16:8","x":"But there is a resurrection, therefore the grave hath no victory, and the sting of death is swallowed up in Christ."}]},{"id":"thanksgiving","t":"Thanksgiving","g":"Holidays and seasons","p":["Thanksgiving","give thanks","harvest","grateful table"],"k":[],"v":[{"r":"Psalms 100:4","x":{"KJV":"Enter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.","DRC":"Go ye into his gates with praise, into his courts with hymns: and give glory to him. Praise ye his name:","CPDV":"Enter his gates with confession, his courts with hymns, and acknowledge him. Praise his name.","ASV":"Enter into his gates with thanksgiving, And into his courts with praise: Give thanks unto him, and bless his name.","BSB":"Enter His gates with thanksgiving and His courts with praise; give thanks to Him and bless His name.","BBE":"Come into his doors with joy, and into his house with praise; give him honour, blessing his name.","Darby":"Enter into his gates with thanksgiving [and] into his courts with praise; give thanks unto him, bless his name:","Geneva1599":"Enter into his gates with prayse, and into his courts with reioycing: prayse him and blesse his Name.","Webster":"Enter into his gates with thanksgiving, [and] into his courts with praise: be thankful to him, [and] bless his name.","YLT":"Enter ye His gates with thanksgiving, His courts with praise, Give ye thanks to Him, bless ye His Name.","NHEB":"Enter into his gates with thanksgiving, into his courts with praise. Give thanks to him, and bless his name."},"a":{"DRC":"Psalms 99:4","CPDV":"Psalms 99:4"}},{"r":"Psalms 107:1","x":{"KJV":"O give thanks unto the LORD, for he is good: for his mercy endureth for ever.","DRC":"Give glory to the Lord, for he is good: for his mercy endureth for ever.","CPDV":"Alleluia. Confess to the Lord, for he is good, for his mercy is with every generation.","ASV":"O give thanks unto Jehovah; for he is good; For his lovingkindness endureth for ever.","BSB":"Give thanks to the LORD, for He is good; His loving devotion endures forever.","BBE":"O give praise to the Lord, for he is good: for his mercy is unchanging for ever.","Darby":"Give ye thanks unto Jehovah; for he is good; for his loving-kindness [endureth] for ever.","Geneva1599":"Praise the Lord, because he is good: for his mercie endureth for euer.","Webster":"O give thanks to the LORD, for [he is] good; for his mercy [endureth] for ever.","YLT":"`Give ye thanks to Jehovah, For good, for to the age h 43:19","x":{"KJV":"Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert.","DRC":"Behold I do new things, and now they shall spring forth, verily you shall know them: I will make a way in the wilderness, and rivers in the desert.","CPDV":"Behold, I am accomplishing new things. And presently, they will spring forth. With certainty, you will know them. I will make a way in the desert, and rivers in an impassible place.","ASV":"Behold, I will do a new thing; now shall it spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert.","BSB":"Behold, I am about to do something new; even now it is coming. Do you not see it? Indeed, I will make a way in the wilderness and streams in the desert.","BBE":"See, I am doing a new thing; now it is starting; will you not take note of it? I will even make a way in the waste land, and rivers in the dry country.","Darby":"behold, I do a new thing; now it shall spring forth: shall ye not know it? I will even make a way in the wilderness, rivers in the waste.","Geneva1599":"Behold, I do a new thing: now shall it come foorth: shall you not knowe it? I wil euen make a way in the desert, and floods in the wildernesse.","Webster":"Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, [and] rivers in the desert.","YLT":"Lo, I am doing a new thing, now it springeth up, Do ye not know it? Yea, I put in a wilderness a way, In a desolate place--floods.","NHEB":"Behold, I will do a new thing. It springs forth now. Do you not know it? I will even make a way in the wilderness, and rivers in the desert."}},{"r":"Lamentations 3:22-23","x":{"KJV":"It is of the LORD's mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness.","DRC":"Heth. The mercies of the Lord that we are not consumed: because his commiserations have not failed. Heth. They are new every morning, great is thy faithfulness.","CPDV":"HETH. By the mercies of the Lord, we are not consumed. For his compassion has not passed away. HETH. I know it at first light; great is your faithfulness.","ASV":"It is of Jehovah’s lovingkindnesses that we are not consumed, because his compassions fail not. They are new every morning; great is thy faithfulness.","BSB":"Because of the loving devotion of the LORD we are not consumed, for His mercies never fail. They are new every morning; great is Your faithfulness!","BBE":"It is through the Lord's love that we have not come to destruction, because his mercies have no limit. They are new every morning; great is your good faith.","Darby":"It is of Jehovah's loving-kindness we are not consumed, because his compassions fail not; they are new every morning: great is thy faithfulness.","Geneva1599":"It is the Lordes mercies that wee are not consumed, because his compassions faile not. They are renued euery morning: great is thy faithfulnesse.","Webster":"[It is of] the LORD'S mercies that we are not consumed, because his compassions fail not. [They are] new every morning: great [is] thy faithfulness.","YLT":"The kindnesses of Jehovah! For we have not been consumed, For not ended have His mercies. New every morning, abundant is thy faithfulness.","NHEB":"The Lord 's faithful love does not cease; his compassion does not fail. They are new every morning; great is your faithfulness."}},{"r":"Psalms 65:11","x":{"KJV":"Thou crownest the year with thy goodness; and thy paths drop fatness.","DRC":"Thou shalt bless the crown of the year of thy goodness: and thy fields shall be filled with plenty.","CPDV":"You will bless the crown of the year with your kindness, and your fields will be filled with abundance.","ASV":"Thou crownest the year with thy goodness; And thy paths drop fatness.","BSB":"You crown the year with Your bounty, and Your paths overflow with plenty.","B const NAMES={KJV:"King James Version",ASV:"American Standard Version",BSB:"Berean Standard Bible",BBE:"Bible in Basic English",Darby:"Darby Bible",Geneva1599:"Geneva Bible (1599)",Webster:"Webster Bible",YLT:"Young's Literal Translation",NHEB:"New Heart English Bible",DRC:"Douay-Rheims (Catholic)",CPDV:"Catholic Public Domain Version"};
const $=s=>document.querySelector(s), out=$('#out'), tr=$('#tr'), lds=$('#lds'), q=$('#q');
function get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
Object.entries(NAMES).forEach(([k,n])=>{const o=document.createElement('option');o.value=k;o.textContent=n;tr.appendChild(o)});
tr.value=NAMES[get('tr','KJV')]?get('tr','KJV'):'KJV'; lds.checked=get('lds','0')==='1';
let current=null, speaking=false;
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function verses(t){
  const v=t.v.map(x=>({ref:(x.a&&x.a[tr.value])||x.r, text:x.x[tr.value]||x.x.KJV}));
  if(lds.checked) t.l.forEach(x=>v.push({ref:x.r,text:x.x,lds:true}));
  return v;
}
function speakBtn(getText){
  const b=el('button','listen');b.type='button';
  const set=on=>{b.innerHTML=on?'<svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg>Stop':'<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>Listen'};
  set(false);
  if(!('speechSynthesis' in window)){b.hidden=true;return b}
  b.onclick=()=>{
    speechSynthesis.cancel();
    if(b.dataset.on==='1'){b.dataset.on='0';set(false);return}
    document.querySelectorAll('.listen').forEach(x=>{if(x.dataset.on==='1'){x.dataset.on='0';x.innerHTML=x.innerHTML.replace(/Stop$/,'Listen')}});
    const u=new SpeechSynthesisUtterance(getText());u.rate=.88;u.pitch=1;
    u.onend=()=>{b.dataset.on='0';set(false)};
    b.dataset.on='1';set(true);speechSynthesis.speak(u);
  };
  return b;
}
function verseBlock(v){const f=el('figure','verse');f.appendChild(el('p',null,v.text));f.appendChild(el('cite',null,v.ref));return f}
const CRISIS=/suicid|kill myself|end my life|want to die|don'?t want to (live|be here)|self.?harm|hurt myself|cut myself/i;
function show(t,opts={}){
  current={t,opts}; speechSynthesis&&speechSynthesis.cancel();
  out.innerHTML='';
  if(opts.care){const c=el('div','care');c.innerHTML='You matter, and you don\'t have to carry this alone. If you\'re thinking about ending your life, please reach out right now. In the U.S., call or text <a href="tel:988">988</a> to talk with someone.';out.appendChild(c)}
  if(opts.today){out.appendChild(el('h2',null,'For today'))}else{out.appendChild(el('p','kicker',t.g));out.appendChild(el('h2',null,cap(t.t)))}
  const vs=verses(opts.today?{...t,v:[t.v[0]],l:[]}:t);
  out.appendChild(speakBtn(()=>vs.map(v=>v.ref+'. '+v.text).join(' ... ')));
  const box=el('div');box.style.marginTop='1.2rem';
  let ldsHead=false;
  vs.forEach(v=>{if(v.lds&&!ldsHead){box.appendChild(el('h3',null,'Latter-day Saint scripture'));ldsHead=true}box.appendChild(verseBlock(v))});
  out.appendChild(box);
  if(opts.related&&opts.related.length){
    out.appendChild(el('h3',null,'Also for you'));
    const m=el('div','more');opts.related.forEach(r=>{const c=el('button','chip',cap(r.t));c.type='button';c.onclick=()=>show(r);m.appendChild(c)});out.appendChild(m);
  }
  if(!opts.today) out.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
}
function search(){
  const text=q.value.trim(); if(!text) {q.focus();return}
  const care=CRISIS.test(text);
  let r=rank(T,text).map(x=>x.t);
  if(care){const d=T.filter(t=>['depression','hope','feeling unloved'].includes(t.t));r=[...d,...r.filter(x=>!d.includes(x))]}
  if(!r.length){out.innerHTML='';out.appendChild(el('p','empty','No topic matched those words. Try saying it another way, like "I\'m afraid" or "I feel alone," or browse every topic below.'));return}
  show(r[0],{related:r.slice(1,4),care});
}
$('#go').onclick=search;
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();search()}});
tr.onchange=()=>{put('tr',tr.value);if(current)show(current.t,current.opts)};
lds.onchange=()=>{put('lds',lds.checked?'1':'0');if(current)show(current.t,current.opts)};
// browse
const groups=$('#groups'),byG={};T.forEach(t=>(byG[t.g]=byG[t.g]||[]).push(t));
Object.entries(byG).forEach(([g,ts])=>{const d=el('div','group');d.appendChild(el('h4',null,g));const m=el('div','more');ts.forEach(t=>{const c=el('button','chip',cap(t.t));c.type='button';c.onclick=()=>show(t);m.appendChild(c)});d.appendChild(m);groups.appendChild(d)});
// start: ?t=topic-id or ?q=words, else today's verse
const P=new URLSearchParams(location.search);
const byId=P.get('t')&&T.find(t=>t.id===P.get('t'));
if(byId) show(byId);
else if(P.get('q')){q.value=P.get('q');search()}
else{const day=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);show(T[(day*37)%T.length],{today:true})}
</script>
</body>
</html>
