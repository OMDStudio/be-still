better","social media makes me feel"],"k":[],"v":[{"r":"Galatians 6:4","x":{"KJV":"But let every man prove his own work, and then shall he have rejoicing in himself alone, and not in another.","DRC":"But let every one prove his own work: and so he shall have glory in himself only and not in another.","CPDV":"So let each one prove his own work. And in this way, he shall have glory in himself only, and not in another.","ASV":"But let each man prove his own work, and then shall he have his glorying in regard of himself alone, and not of his neighbor.","BSB":"Each one should test his own work. Then he will have reason to boast in himself alone, and not in someone else.","BBE":"But let every man make test of his work, and then will his cause for glory be in himself only, and not in his neighbour.","Darby":"but let each prove his own work, and then he will have his boast in what belongs to himself alone, and not in what belongs to another.","Geneva1599":"But let euery man prooue his owne worke: and then shall he haue reioycing in himselfe onely and not in another.","Webster":"But let every man prove his own work, and then shall he have rejoicing in himself alone, and not in another.","YLT":"and his own work let each one prove, and then in regard to himself alone the glorying he shall have, and not in regard to the other,","NHEB":"But let each man test his own work, and then he will take pride in himself and not in his neighbor."}},{"r":"Psalms 139:14","x":{"KJV":"I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well.","DRC":"I will praise thee, for thou art fearfully magnified: wonderful are thy works, and my soul knoweth right well.","CPDV":"I will confess to you, for you have been magnified terribly. Your works are miraculous, as my soul knows exceedingly well.","ASV":"I will give thanks unto thee; for I am fearfully and wonderfully made: Wonderful are thy works; And that my soul knoweth right well.","BSB":"I praise You, for I am fearfully and wonderfully made. Marvelous are Your works, and I know this very well.","BBE":"I will give you praise, for I am strangely and delicately formed; your works are great wonders, and of this my soul is fully conscious.","Darby":"I will praise thee, for I am fearfully, wonderfully made. Marvellous are thy works; and [that] my soul knoweth right well.","Geneva1599":"I will praise thee, for I am fearefully and wonderously made: marueilous are thy workes, and my soule knoweth it well.","Webster":"I will praise thee: for I am fearfully [and] wonderfully made: wonderful [are] thy works; and [that] my soul well knoweth.","YLT":"I confess Thee, because that with wonders I have been distinguished. Wonderful are Thy works, And my soul is knowing it well.","NHEB":"I will give thanks to you, for I am fearfully and wonderfully made. Your works are wonderful. My soul knows that very well."},"a":{"DRC":"Psalms 138:14","CPDV":"Psalms 138:14"}},{"r":"2 Corinthians 10:12","x":{"KJV":"For we dare not make ourselves of the number, or compare ourselves with some that commend themselves: but they measuring themselves by themselves, and comparing themselves among themselves, are not wise.","DRC":"For we dare not match or compare ourselves with some that commend themselves: but we measure ourselves by ourselves and compare ourselves with ourselves.","CPDV":"For we would not dare to interpose or compare ourselves with certain ones who commend themselves. But we measure ourselves by ourselves, and we compare ourselves with ourselves.","ASV":"For we are not bold to number or compare ourselves with certain of them that commend themselves: but they themselves, measuring themselves by themselves, and comparing themselves with themselves, are without understanding.","BSB":"We do not dare to classify or compare ourselves with some who commend themselves. When they measure themselves by themselves and compare themselves with themselves, they show their ignorance.","BBE":"For we will not make comparison of ourselves with some of those who say good things about themselves: but these, measuring themselves by themselves, and making comparison of themselves with themselves, are not wise.","Darby":"For we dare not class ourselves or compare ourselves with some who commend themselves; but these, measuring themselves by themselves, and comparing themselves with themselves, are not intelligent.","Geneva1599":"For wee dare not make our selues of the nomber, or to compare our selues to them, which praise themselues: but they vnderstand not that they measure themselues with themselues, and compare themselues with themselues.","Webster":"For we dare not make ourselves of the number, or compare ourselves with some that commend themselves: but they measuring themselves by themselves, and comparing themselves among themselves, are not wise.","YLT":"For we do not make bold to rank or to compare ourselves with certain of those commending themselves, but they, among themselves measuring themselves, and comparing themselves with themselves, are not wise,","NHEB":"For we are not bold to number or compare ourselves with some of those who commend themselves. But they themselves, measuring themselves by themselves, and comparing themselves with themselves, are without understanding."}}],"l":[{"r":"D&C 46:11","x":"For all have not every gift given unto them; for there are many gifts, and to every man is given a gift by the Spirit of God."},{"r":"Moroni 10:17","x":"And all these gifts come by the Spirit of Christ; and they come unto every man severally, according as he will."},{"r":"D&C 18:10","x":"Remember the worth of souls is great in the sight of God;"}]},{"id":"being-chosen","t":"being chosen","g":"Identity and worth","p":["chosen","called by God","set apart","God picked me"],"k":[],"v":[{"r":"1 Peter 2:9","x":{"KJV":"But ye are a chosen generation, a royal priesthood, an holy nation, a peculiar people; that ye should shew forth the praises of him who hath called you out of darkness into his marvellous light:","DRC":"But you are a chosen generation, a kingly priesthood, a holy nation, a purchased people: that you may declare his virtues, who hath called you out of darkness into his marvelous light:","CPDV":"But you are a chosen generation, a royal priesthood, a holy nation, an acquired people, so that you may announce the virtues of him who has called you out of darkness into his marvelous light.","ASV":"But ye are an elect race, a royal priesthood, a holy nation, a people for God’s own possession, that ye may show forth the excellencies of him who called you out of darkness into his marvellous light:","BSB":"But you are a chosen people, a royal priesthood, a holy nation, a people for God’s own possession, to proclaim the virtues of Him who called you out of darkness into His marvelous light.","BBE":"But you are a special people, a holy nation, priests and kings, a people given up completely to God, so that you may make clear the virtues of him who took you out of the dark into the light of heaven.","Darby":"But ye [are] a chosen race, a kingly priesthood, a holy nation, a people for a possession, that ye might set forth the excellencies of him who has called you out of darkness to his wonderful light;","Geneva1599":"But yee are a chosen generation, a royall Priesthoode, an holy nation, a people set at libertie, that yee shoulde shewe foorth the vertues of him that hath called you out of darkenesse into his marueilous light,","Webster":"But ye [are] a chosen generation, a royal priesthood, a holy nation, a peculiar people; that ye should show forth the praises of him who hath called you out of darkness into his marvelous light:","YLT":"and ye are a choice race, a royal priesthood, a holy nation, a people acquired, that the excellences ye may shew forth of Him who out of darkness did call you to His wondrous light;","NHEB":"But you are a chosen race, a royal priesthood, a holy nation, a people for God's own possession, that you may proclaim the excellence of him who called you out of darkness into his marvelous light:"}},{"r":"John 15:16","x":{"KJV":"Ye have not chosen me, but I have chosen you, and ordained you, that ye should go and bring forth fruit, and that your fruit should remain: that whatsoever ye shall ask of the Father in my name, he may give it you.","DRC":"You have not chosen me: but I have chosen you; and have appointed you, that you should go and should bring forth fruit; and your fruit should remain: that whatsoever you shall ask of the Father in my name, he may give it you.","CPDV":"You have not chosen me, but I have chosen you. And I have appointed you, so that you may go forth and bear fruit, and so that your fruit may last. Then whatever you have asked of the Father in my name, he shall give to you.","ASV":"Ye did not choose me, but I chose you, and appointed you, that ye should go and bear fruit, and that your fruit should abide: that whatsoever ye shall ask of the Father in my name, he may give it you.","BSB":"You did not choose Me, but I chose you. And I appointed you to go and bear fruit—fruit that will remain—so that whatever you ask the Father in My name, He will give you.","BBE":"You did not take me for yourselves, but I took you for myself; and I gave you the work of going about and producing fruit which will be for ever; so that whatever request you make to the Father in my name he may give it to you.","Darby":"Ye have not chosen me, but I have chosen you, and have set you that ye should go and [that] ye should bear fruit, and [that] your fruit should abide, that whatsoever ye shall ask the Father in my name he may give you.","Geneva1599":"Ye haue not chosen me, but I haue chosen you, and ordeined you, that ye goe and bring foorth fruite, and that your fruite remaine, that whatsoeuer ye shall aske of the Father in my Name, he may giue it you.","Webster":"Ye have not chosen me, but I have chosen you, and ordained you, that ye should go and bring forth fruit, and [that] your fruit should remain: that whatever ye shall ask of the Father in my name, he may give it you.","YLT":"`Ye did not choose out me, but I chose out you, and did appoint you, that ye might go away, and might bear fruit, and your fruit might remain, that whatever ye may ask of the Father in my name, He may give you.","NHEB":"You did not choose me, but I chose you, and appointed you, that you should go and bear fruit, and that your fruit should remain; that whatever you will ask of the Father in my name, he may give it to you."}},{"r":"Jeremiah 1:5","x":{"KJV":"Before I formed thee in the belly I knew thee; and before thou camest forth out of the womb I sanctified thee, and I ordained thee a prophet unto the nations.","DRC":"Before I formed thee in the bowels of thy mother, I knew thee: and before thou camest forth out of the womb, I sanctified thee, and made thee a prophet unto the nations.","CPDV":"“Before I formed you in the womb, I knew you. And before you went forth from the womb, I sanctified you. And I made you a prophet to the nations.”","ASV":"Before I formed thee in the belly I knew thee, and before thou camest forth out of the womb I sanctified thee; I have appointed thee a prophet unto the nations.","BSB":"“Before I formed you in the womb I knew you, and before you were born I set you apart and appointed you as a prophet to the nations.”","BBE":"Before you were formed in the body of your mother I had knowledge of you, and before your birth I made you holy; I have given you the work of being a prophet to the nations.","Darby":"Before I formed thee in the belly I knew thee; and before thou camest forth out of the womb I hallowed thee, I appointed thee a prophet unto the nations.","Geneva1599":"Before I formed thee in the wombe, I knewe thee, and before thou camest out of the wombe, I sanctified thee, and ordeined thee to be a Prophet vnto the nations.","Webster":"Before I formed thee in embryo I knew thee; and before thou wast born I sanctified thee, [and] I ordained thee a prophet to the nations.","YLT":"`Before I form thee in the belly, I have known thee; and before thou comest forth from the womb I have separated thee, a prophet to nations I have made thee.'","NHEB":"\"Before I formed you in the belly, I knew you. Before you came forth out of the womb, I sanctified you. I have appointed you a prophet to the nations.\""}}],"l":[{"r":"Abraham 3:23","x":"And God saw these souls that they were good, and he stood in the midst of them, and he said: These I will make my rulers; for he stood among those that were spirits, and he saw that they were good; and he said unto me: Abraham, thou art one of them; thou wast chosen before thou wast born."},{"r":"D&C 138:55-56","x":"I observed that they were also among the noble and great ones who were chosen in the beginning to be rulers in the Church of God. Even before they were born, they, with many others, received their first lessons in the world of spirits and were prepared to come forth in the due time of the Lord to labor in his vineyard for the salvation of the souls of men."},{"r":"Alma 13:3","x":"And this is the manner after which they were ordained—being called and prepared from the foundation of the world according to the foreknowledge of God, on account of their exceeding faith and good works; in the first place being left to choose good or evil; therefore they having chosen good, and exercising exceedingly great faith, are called with a holy calling, yea, with that holy calling which was prepared with, and according to, a preparatory redemption for such."}]},{"id":"true-beauty","t":"true beauty","g":"Identity and worth","p":["I'm ugly","beauty","how I look","outward appearance"],"k":[],"v":[{"r":"1 Samuel 16:7","x":{"KJV":"But the LORD said unto Samuel, Look not on his countenance, or on the height of his stature; because I have refused him: for the LORD seeth not as man seeth; for man looketh on the outward appearance, but the LORD looketh on the heart.","DRC":"And the Lord said to Samuel: Look not on his countenance, nor on the height of his stature: because I have rejected him, nor do I judge according to the look of man: for man seeth those things that appear, but the Lord beholdeth the heart.","CPDV":"And the Lord said to Samuel: “You should not look with favor on his face, nor on the height of his stature. For I have rejected him. Neither do I judge by the appearance of a man. For man sees those things that are apparent, but the Lord beholds the heart.”","ASV":"But Jehovah said unto Samuel, Look not on his countenance, or on the height of his stature; because I have rejected him: for Jehovah seeth not as man seeth; for man looketh on the outward appearance, but Jehovah looketh on the heart.","BSB":"But the LORD said to Samuel, “Do not consider his appearance or height, for I have rejected him; the LORD does not see as man does. For man sees the outward appearance, but the LORD sees the heart.”","BBE":"But the Lord said to Samuel, Do not take note of his face or how tall he is, because I will not have him: for the Lord's view is not man's; man takes note of the outer form, but the Lord sees the heart.","Darby":"But Jehovah said to Samuel, Look not on his countenance, or on the height of his stature; because I have rejected him; for it is not as man seeth; for man looketh upon the outward appearance, but Jehovah looketh upon the heart.","Geneva1599":"But the Lord said vnto Samuel, Looke not on his countenance, nor on the height of his stature, because I haue refused him: for God seeth not as man seeth: for man looketh on the outward appearance, but the Lord beholdeth the heart.","Webster":"But the LORD said to Samuel, Look not on his countenance, or on the hight of his stature; because I have refused him: for [the LORD seeth] not as man seeth; for man looketh on the outward appearance, but the LORD looketh on the heart.","YLT":"And Jehovah saith unto Samuel, `Look not unto his appearance, and unto the height of his stature, for I have rejected him; for it is not as man seeth--for man looketh at the eyes, and Jehovah looketh at the heart.'","NHEB":"But the Lord said to Samuel, \"Do not look on his face, or on the height of his stature; because I have rejected him: for I see not as man sees; for man looks at the outward appearance, but the Lord looks at the heart.\""}},{"r":"1 Peter 3:3-4","x":{"KJV":"Whose adorning let it not be that outward adorning of plaiting the hair, and of wearing of gold, or of putting on of apparel; But let it be the hidden man of the heart, in that which is not corruptible, even the ornament of a meek and quiet spirit, which is in the sight of God of great price.","DRC":"Whose adorning, let it not be the outward plaiting of the hair, or the wearing of gold, or the putting on of apparel: But the hidden man of the heart, in the incorruptibility of a quiet and a meek spirit which is rich in the sight of God.","CPDV":"For you, there should be no unnecessary adornment of the hair, or surrounding with gold, or the wearing of ornate clothing. Instead, you should be a hidden person of the heart, with the incorruptibility of a quiet and meek spirit, rich in the sight of God.","ASV":"Whose adorning let it not be the outward adorning of braiding the hair, and of wearing jewels of gold, or of putting on apparel; but let it be the hidden man of the heart, in the incorruptible apparel of a meek and quiet spirit, which is in the sight of God of great price.","BSB":"Your beauty should not come from outward adornment, such as braided hair or gold jewelry or fine clothes, but from the inner disposition of your heart, the unfading beauty of a gentle and quiet spirit, which is precious in God’s sight.","BBE":"Do not let your ornaments be those of the body such as dressing of the hair, or putting on of jewels of gold or fair clothing; But let them be those of the unseen man of the heart, the ever-shining ornament of a gentle and quiet spirit, which is of great price in the eyes of God.","Darby":"whose adorning let it not be that outward one of tressing of hair, and wearing gold, or putting on apparel; but the hidden man of the heart, in the incorruptible [ornament] of a meek and quiet spirit, which in the sight ofGod is of great price.","Geneva1599":"Whose apparelling, let it not be that outwarde, with broyded heare, and golde put about, or in putting on of apparell: But let it bee the hidde man of the heart, which consisteth in the incorruption of a meeke and quiet spirite, which is before God a thing much set by.","Webster":"Whose adorning let it not be that outward [adorning] of plaiting the hair, and of wearing gold, or of putting on apparel; But [let it be] the hidden man of the heart, in that which is not corruptible, [even the ornament] of a meek and quiet spirit, which is in the sight of God of great price.","YLT":"whose adorning--let it not be that which is outward, of plaiting of hair, and of putting around of things of gold, or of putting on of garments, but--the hidden man of the heart, in the incorruptible thing of the meek and quiet spirit, which is, before God, of great price,","NHEB":"Let your beauty be not just the outward adorning of braiding the hair, and of wearing jewels of gold, or of putting on fine clothing; but in the hidden person of the heart, in the incorruptible adornment of a gentle and quiet spirit, which is in the sight of God very precious."}},{"r":"Proverbs 31:30","x":{"KJV":"Favour is deceitful, and beauty is vain: but a woman that feareth the LORD, she shall be praised.","DRC":"Favour is deceitful, and beauty is vain: the woman that feareth the Lord, she shall be praised.","CPDV":"Charm is false, and beauty is vain. The woman who fears the Lord, the same shall be praised.","ASV":"Grace is deceitful, and beauty is vain; But a woman that feareth Jehovah, she shall be praised.","BSB":"Charm is deceptive and beauty is fleeting, but a woman who fears the LORD is to be praised.","BBE":"Fair looks are a deceit, and a beautiful form is of no value; but a woman who has the fear of the Lord is to be praised.","Darby":"Gracefulness is deceitful and beauty is vain; a woman [that] feareth Jehovah, she shall be praised.","Geneva1599":"Fauour is deceitfull, and beautie is vanitie: but a woman that feareth the Lord, she shall be praysed.","Webster":"Favor [is] deceitful, and beauty [is] vain: [but] a woman [that] feareth the LORD, she shall be praised.","YLT":"The grace is false, and the beauty is vain, A woman fearing Jehovah, she may boast herself.","NHEB":"Charm is deceitful, and beauty is vain; but a woman who fears the Lord, she shall be praised."}}],"l":[{"r":"Alma 5:14","x":"And now behold, I ask of you, my brethren of the church, have ye spiritually been born of God? Have ye received his image in your countenances? Have ye experienced this mighty change in your hearts?"},{"r":"Alma 5:19","x":"I say unto you, can ye look up to God at that day with a pure heart and clean hands? I say unto you, can you look up, having the image of God engraven upon your countenances?"},{"r":"Moroni 7:48","x":"Wherefore, my beloved brethren, pray unto the Father with all the energy of heart, that ye may be filled with this love, which he hath bestowed upon all who are true followers of his Son, Jesus Christ; that ye may become the sons of God; that when he shall appear we shall be like him, for we shall see him as he is; that we may have this hope; that we may be purified even as he is pure. Amen."}]},{"id":"aging","t":"aging","g":"Identity and worth","p":["getting old","growing older","old age","gray hair"],"k":[],"v":[{"r":"Isaiah 46:4","x":{"KJV":"And even to your old age I am he; and even to hoar hairs will I carry you: I have made, and I will bear; even I will carry, and will deliver you.","DRC":"Even to your old age I am the same, and to your grey hairs I will carry you: I have made you, and I will bear: I will carry and will save.","CPDV":"Even to your old age, I am the same. And even with your grey hairs, I will carry you. I have made you, and I will sustain you. I will carry you, and I will save you.","ASV":"and even to old age I am he, and even to hoar hairs will I carry you; I have made, and I will bear; yea, I will carry, and will deliver.","BSB":"Even to your old age, I will be the same, and I will bear you up when you turn gray. I have made you, and I will carry you; I will sustain you and deliver you.","BBE":"Even when you are old I will be the same, and when you are grey-haired I will take care of you: I will still be responsible for what I made; yes, I will take you and keep you safe.","Darby":"Even to old age, I [am] HE, and unto hoary hairs I will carry [you]: It is I that have made, and I will bear, and I will carry, and will deliver.","Geneva1599":"Therefore vnto olde age, I the same, euen I will beare you vntill the hoare heares: I haue made you: I will also beare you, and I will cary you and I will deliuer you.","Webster":"And [even] to [your] old age I [am] he; and [even] to hoary hairs will I carry [you]: I have made, and I will bear; even I will carry, and will deliver [you].","YLT":"Even to old age I am He, and to grey hairs I carry, I made, and I bear, yea, I carry and deliver.","NHEB":"and even to old age I am he, and even to gray hairs will I carry you. I have made, and I will bear; yes, I will carry, and will deliver."}},{"r":"Psalms 92:14","x":{"KJV":"They shall still bring forth fruit in old age; they shall be fat and flourishing;","DRC":"They shall still increase in a fruitful old age: and shall be well treated,","CPDV":"They will still be multiplied in a fruitful old age, and they will endure well,","ASV":"They shall still bring forth fruit in old age; They shall be full of sap and green:","BSB":"In old age they will still bear fruit; healthy and green they will remain,","BBE":"They will give fruit even when they are old; they will be fertile and full of growth;","Darby":"They are still vigorous in old age, they are full of sap and green;","Geneva1599":"They shall still bring foorth fruite in their age: they shall be fat and flourishing,","Webster":"They shall still bring forth fruit in old age; they shall be fat and flourishing;","YLT":"Still they bring forth in old age, Fat and flourishing are they,","NHEB":"They will still bring forth fruit in old age. They will be full of sap and green,"},"a":{"DRC":"Psalms 91:15","CPDV":"Psalms 91:15"}},{"r":"Proverbs 16:31","x":{"KJV":"The hoary head is a crown of glory, if it be found in the way of righteousness.","DRC":"Old age is a crown of dignity, when it is found in the ways of justice.","CPDV":"Old age is a crown of dignity, when it is found in the ways of justice.","ASV":"The hoary head is a crown of glory; It shall be found in the way of righteousness.","BSB":"Gray hair is a crown of glory; it is attained along the path of righteousness.","BBE":"The grey head is a crown of glory, if it is seen in the way of righteousness.","Darby":"The hoary head is a crown of glory, [if] it is found in the way of righteousness.","Geneva1599":"Age is a crowne of glory, when it is founde in the way of righteousnes.","Webster":"The hoary head [is] a crown of glory, [if] it is found in the way of righteousness.","YLT":"A crown of beauty are grey hairs, In the way of righteousness it is found.","NHEB":"Gray hair is a crown of glory. It is attained by a life of righteousness."}}],"l":[{"r":"Mosiah 2:41","x":"And moreover, I would desire that ye should consider on the blessed and happy state of those that keep the commandments of God. For behold, they are blessed in all things, both temporal and spiritual; and if they hold out faithful to the end they are received into heaven, that thereby they may dwell with God in a state of never-ending happiness. O remember, remember that these things are true; for the Lord God hath spoken it."},{"r":"D&C 89:18-20","x":"And all saints who remember to keep and do these sayings, walking in obedience to the commandments, shall receive health in their navel and marrow to their bones; And shall find wisdom and great treasures of knowledge, even hidden treasures; And shall run and not be weary, and shall walk and not faint."},{"r":"Alma 40:23","x":"The soul shall be restored to the body, and the body to the soul; yea, and every limb and joint shall be restored to its body; yea, even a hair of the head shall not be lost; but all things shall be restored to their proper and perfect frame."}]},{"id":"feeling-unworthy","t":"feeling unworthy","g":"Identity and worth","p":["unworthy","I don't deserve","not worthy","I'm not good enough for God"],"k":[],"v":[{"r":"Romans 5:8","x":{"KJV":"But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.","DRC":"But God commendeth his charity towards us: because when as yet we were sinners according to the time.","CPDV":"But God demonstrates his love for us in that, while we were yet sinners, at the proper time,","ASV":"But God commendeth his own love toward us, in that, while we were yet sinners, Christ died for us.","BSB":"But God proves His love for us in this: While we were still sinners, Christ died for us.","BBE":"But God has made clear his love to us, in that, when we were still sinners, Christ gave his life for us.","Darby":"butGod commends his love to us, in that, we being still sinners, Christ has died for us.","Geneva1599":"But God setteth out his loue towards vs, seeing that while we were yet sinners, Christ died for vs.","Webster":"But God commendeth his love towards us, in that while we were yet sinners, Christ died for us.","YLT":"and God doth commend His own love to us, that, in our being still sinners, Christ did die for us;","NHEB":"But God commends his own love toward us, in that while we were yet sinners, Christ died for us."}},{"r":"Ephesians 2:8-9","x":{"KJV":"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: Not of works, lest any man should boast.","DRC":"For by grace you are saved through faith: and that not of yourselves, for it is the gift of God. Not of works, that no man may glory.","CPDV":"For by grace, you have been saved through faith. And this is not of yourselves, for it is a gift of God. And this is not of works, so that no one may glory.","ASV":"for by grace have ye been saved through faith; and that not of yourselves, it is the gift of God; not of works, that no man should glory.","BSB":"For it is by grace you have been saved through faith, and this not from yourselves; it is the gift of God, not by works, so that no one can boast.","BBE":"Because by grace you have salvation through faith; and that not of yourselves: it is given by God: Not by works, so that no man may take glory to himself.","Darby":"For ye are saved by grace, through faith; and this not of yourselves; it isGod's gift: not on the principle of works, that no one might boast.","Geneva1599":"For by grace are ye saued through faith, and that not of your selues: it is the gift of God, Not of workes, least any man should boast himselfe.","Webster":"For by grace are ye saved, through faith; and that not of yourselves: [it is] the gift of God: Not by works, lest any man should boast.","YLT":"for by grace ye are having been saved, through faith, and this not of you--of God the gift, not of works, that no one may boast;","NHEB":"for by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, that no one would boast."}},{"r":"Luke 15:20","x":{"KJV":"And he arose, and came to his father. But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him.","DRC":"And rising up, he came to his father. And when he was yet a great way off, his father saw him and was moved with compassion and running to him fell upon his neck and kissed him.","CPDV":"And rising up, he went to his father. But while he was still at a distance, his father saw him, and he was moved with compassion, and running to him, he fell upon his neck and kissed him.","ASV":"And he arose, and came to his father. But while he was yet afar off, his father saw him, and was moved with compassion, and ran, and fell on his neck, and kissed him.","BSB":"So he got up and went to his father. But while he was still in the distance, his father saw him and was filled with compassion. He ran to his son, embraced him, and kissed him.","BBE":"And he got up and went to his father. But while he was still far away, his father saw him and was moved with pity for him and went quickly and took him in his arms and gave him a kiss.","Darby":"And he rose up and went to his own father. But while he was yet a long way off, his father saw him, and was moved with compassion, and ran, and fell upon his neck, and covered him with kisses.","Geneva1599":"So hee arose and came to his father, and when hee was yet a great way off, his father sawe him, and had compassion, and ranne and fell on his necke, and kissed him.","Webster":"And he arose, and came to his father. But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him.","YLT":"`And having risen, he went unto his own father, and he being yet far distant, his father saw him, and was moved with compassion, and having ran he fell upon his neck and kissed him;","NHEB":"\"He arose, and came to his father. But while he was still far off, his father saw him, and was moved with compassion, and ran, and fell on his neck, and kissed him."}}],"l":[{"r":"Moroni 10:32","x":"Yea, come unto Christ, and be perfected in him, and deny yourselves of all ungodliness; and if ye shall deny yourselves of all ungodliness, and love God with all your might, mind and strength, then is his grace sufficient for you, that by his grace ye may be perfect in Christ; and if by the grace of God ye are perfect in Christ, ye can in nowise deny the power of God."},{"r":"Ether 12:27","x":"And if men come unto me I will show unto them their weakness. I give unto men weakness that they may be humble; and my grace is sufficient for all men that humble themselves before me; for if they humble themselves before me, and have faith in me, then will I make weak things become strong unto them."},{"r":"2 Nephi 25:23","x":"For we labor diligently to write, to persuade our children, and also our brethren, to believe in Christ, and to be reconciled to God; for we know that it is by grace that we are saved, after all we can do."}]},{"id":"doubt","t":"doubt","g":"Faith and doubt","p":["I doubt","is it true","losing my faith","I'm not sure I believe"],"k":["doubting"],"v":[{"r":"Mark 9:24","x":{"KJV":"And straightway the father of the child cried out, and said with tears, Lord, I believe; help thou mine unbelief.","DRC":"And immediately the father of the boy crying out, with tears said: I do believe, Lord. Help my unbelief.","CPDV":"And immediately the father of the boy, crying out with tears, said: “I do believe, Lord. Help my unbelief.”","ASV":"Straightway the father of the child cried out, and said, I believe; help thou mine unbelief.","BSB":"Immediately the boy’s father cried out, “I do believe; help my unbelief!”","BBE":"Straight away the father of the child gave a cry, saying, I have faith; make my feeble faith stronger.","Darby":"And immediately the father of the young child crying out said [with tears], I believe, help mine unbelief.","Geneva1599":"And straightway the father of the childe crying with teares, saide, Lord, I beleeue: helpe my vnbeliefe.","Webster":"And immediately the father of the child cried out, and said with tears, Lord, I believe; help thou my unbelief.","YLT":"and immediately the father of the child, having cried out, with tears said, `I believe, sir; be helping mine unbelief.'","NHEB":"Immediately the father of the child exclaimed, \"I believe. Help my unbelief!\""},"a":{"DRC":"Mark 9:23","CPDV":"Mark 9:23"}},{"r":"James 1:5-6","x":{"KJV":"If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him. But let him ask in faith, nothing wavering. For he that wavereth is like a wave of the sea driven with the wind and tossed.","DRC":"But if any of you want wisdom, let him ask of God who giveth to all men abundantly and upbraideth not. And it shall be given him. But let him ask in faith, nothing wavering. For he that wavereth is like a wave of the sea, which is moved and carried about by the wind.","CPDV":"But if anyone among you is in need of wisdom, let him petition God, who gives abundantly to all without reproach, and it shall be given to him. But he should ask with faith, doubting nothing. For he who doubts is like a wave on the ocean, which is moved about by the wind and carried away;","ASV":"But if any of you lacketh wisdom, let him ask of God, who giveth to all liberally and upbraideth not; and it shall be given him. But let him ask in faith, nothing doubting: for he that doubteth is like the surge of the sea driven by the wind and tossed.","BSB":"Now if any of you lacks wisdom, he should ask God, who gives generously to all without finding fault, and it will be given to him. But he must ask in faith, without doubting, because he who doubts is like a wave of the sea, blown and tossed by the wind.","BBE":"But if any man among you is without wisdom, let him make his request to God, who gives freely to all without an unkind word, and it will be given to him. Let him make his request in faith, doubting nothing; for he who has doubt in his heart is like the waves of the sea, which are troubled by the driving of the wind.","Darby":"But if any one of you lack wisdom, let him ask ofGod, who gives to all freely and reproaches not, and it shall be given to him: but let him ask in faith, nothing doubting. For he that doubts is like a wave of the sea driven by the wind and tossed about;","Geneva1599":"If any of you lacke wisedome, let him aske of God, which giueth to all men liberally, and reprocheth no man, and it shalbe giuen him. But let him aske in faith, and wauer not: for hee that wauereth, is like a waue of the sea, tost of the winde, and caried away.","Webster":"If any of you lacketh wisdom, let him ask of God, who giveth to all [men] liberally, and upbraideth not; and it shall be given to him. But let him ask in faith, nothing wavering. For he that wavereth is like a wave of the sea driven with the wind and tossed.","YLT":"and if any of you do lack wisdom, let him ask from God, who is giving to all liberally, and not reproaching, and it shall be given to him; and let him ask in faith, nothing doubting, for he who is doubting hath been like a wave of the sea, driven by wind and tossed,","NHEB":"But if any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach; and it will be given to him. But let him ask in faith, without any doubting, for he who doubts is like a wave of the sea, driven by the wind and tossed."}},{"r":"John 20:27","x":{"KJV":"Then saith he to Thomas, Reach hither thy finger, and behold my hands; and reach hither thy hand, and thrust it into my side: and be not faithless, but believing.","DRC":"Then he said to Thomas: Put in thy finger hither and see my hands. And bring hither the hand and put it into my side. And be not faithless, but believing.","CPDV":"Next, he said to Thomas: “Look at my hands, and place your finger here; and bring your hand close, and place it at my side. And do not choose to be unbelieving, but faithful.”","ASV":"Then saith he to Thomas, Reach hither thy finger, and see my hands; and reach hither thy hand, and put it into my side: and be not faithless, but believing.","BSB":"Then Jesus said to Thomas, “Put your finger here and look at My hands. Reach out your hand and put it into My side. Stop doubting and believe.”","BBE":"Then he said to Thomas, Put out your finger, and see my hands; and put your hand here into my side: and be no longer in doubt but have belief.","Darby":"Then he says to Thomas, Bring thy finger here and see my hands; and bring thy hand and put it into my side; and be not unbelieving, but believing.","Geneva1599":"After saide he to Thomas, Put thy finger here, and see mine hands, and put forth thine hand, and put it into my side, and be not faithlesse, but faithfull.","Webster":"Then saith he to Thomas, Reach hither thy finger, and behold my hands; and reach hither thy hand, and thrust [it] into my side; and be not faithless, but believing.","YLT":"then he saith to Thomas, `Bring thy finger hither, and see my hands, and bring thy hand, and put it to my side, and become not unbelieving, but believing.'","NHEB":"Then he said to Thomas, \"Reach here your finger, and see my hands. Reach here your hand, and put it into my side. Do not be unbelieving, but believing.\""}}],"l":[{"r":"Alma 32:27","x":"But behold, if ye will awake and arouse your faculties, even to an experiment upon my words, and exercise a particle of faith, yea, even if ye can no more than desire to believe, let this desire work in you, even until ye believe in a manner that ye can give place for a portion of my words."},{"r":"Moroni 10:4","x":"And when ye shall receive these things, I would exhort you that ye would ask God, the Eternal Father, in the name of Christ, if these things are not true; and if ye shall ask with a sincere heart, with real intent, having faith in Christ, he will manifest the truth of it unto you, by the power of the Holy Ghost."},{"r":"D&C 6:36","x":"Look unto me in every thought; doubt not, fear not."}]},{"id":"faith","t":"faith","g":"Faith and doubt","p":["increase my faith","have faith","believe","faith in God"],"k":[],"v":[{"r":"Hebrews 11:1","x":{"KJV":"Now faith is the substance of things hoped for, the evidence of things not seen.","DRC":"Now, faith is the substance of things to be hoped for, the evidence of things that appear not.","CPDV":"Now, faith is the substance of things hoped for, the evidence of things not apparent.","ASV":"Now faith is assurance of things hoped for, a conviction of things not seen.","BSB":"Now faith is the assurance of what we hope for and the certainty of what we do not see.","BBE":"Now faith is the substance of things hoped for, and the sign that the things not seen are true.","Darby":"Now faith is [the] substantiating of things hoped for, [the] conviction of things not seen.","Geneva1599":"Now faith is the grounds of things, which are hoped for, and the euidence of things which are not seene.","Webster":"Now faith is the substance of things hoped for, the evidence of things not seen.","YLT":"And faith is of things hoped for a confidence, of matters not seen a conviction,","NHEB":"Now faith is assurance of things hoped for, proof of things not seen."}},{"r":"Romans 10:17","x":{"KJV":"So then faith cometh by hearing, and hearing by the word of God.","DRC":"Faith then cometh by hearing; and hearing by the word of Christ.","CPDV":"Therefore, faith is from hearing, and hearing is through the Word of Christ.","ASV":"So belief cometh of hearing, and hearing by the word of Christ.","BSB":"Consequently, faith comes by hearing, and hearing by the word of Christ.","BBE":"So faith comes by hearing, and hearing by the word of Christ.","Darby":"So faith then [is] by a report, but the report byGod's word.","Geneva1599":"Then faith is by hearing, and hearing by the worde of God.","Webster":"So then, faith [cometh] by hearing, and hearing by the word of God.","YLT":"so then the faith is by a report, and the report through a saying of God,","NHEB":"So faith comes by hearing, and hearing by the word of Christ."}},{"r":"Matthew 17:20","x":{"KJV":"And Jesus said unto them, Because of your unbelief: for verily I say unto you, If ye have faith as a grain of mustard seed, ye shall say unto this mountain, Remove hence to yonder place; and it shall remove; and nothing shall be impossible unto you.","DRC":"Jesus said to them: Because of your unbelief. For, amen I say to you, if you have faith as a grain of mustard seed, you shall say to this mountain: Remove from hence hither, and it shall remove: and nothing shall be impossible to you.","CPDV":"Jesus said to them: “Because of your unbelief. Amen I say to you, certainly, if you will have faith like a grain of mustard seed, you will say to this mountain, ‘Move from here to there,’ and it shall move. And nothing will be impossible for you.","ASV":"And he saith unto them, Because of your little faith: for verily I say unto you, If ye have faith as a grain of mustard seed, ye shall say unto this mountain, Remove hence to yonder place; and it shall remove; and nothing shall be impossible unto you.","BSB":"“Because you have so little faith,” He answered. “For truly I tell you, if you have faith the size of a mustard seed, you can say to this mountain, ‘Move from here to there,’ and it will move. Nothing will be impossible for you.”","BBE":"And he says to them, Because of your little faith: for truly I say to you, If you have faith as a grain of mustard seed, you will say to this mountain, Be moved from this place to that; and it will be moved; and nothing will be impossible to you.","Darby":"And he says to them, Because of your unbelief; for verily I say unto you, If ye have faith as a grain of mustard [seed], ye shall say to this mountain, Be transported hence there, and it shall transport itself; and nothing shall be impossible to you.","Geneva1599":"And Iesus said vnto them, Because of your vnbeliefe: for verely I say vnto you, if ye haue faith as much as is a graine of mustarde seede, ye shall say vnto this mountaine, Remooue hence to yonder place, and it shall remoue: and nothing shalbe vnpossible vnto you.","Webster":"And Jesus said to them, Because of your unbelief: for verily I say to you, If ye have faith as a grain of mustard-seed, ye shall say to this mountain, Remove hence to yonder place, and it shall remove; and nothing shall be impossible to you.","YLT":"And Jesus said to them, `Through your want of faith; for verily I say to you, if ye may have faith as a grain of mustard, ye shall say to this mount, Remove hence to yonder place, and it shall remove, and nothing shall be impossible to you,","NHEB":"So he said to them, \"Because of your little faith. For truly I tell you, if you have faith as a grain of mustard seed, you will tell this mountain, 'Move from here to there,' and it will move; and nothing will be impossible for you.\" ["},"a":{"DRC":"Matthew 17:19","CPDV":"Matthew 17:19"}}],"l":[{"r":"Alma 32:21","x":"And now as I said concerning faith—faith is not to have a perfect knowledge of things; therefore if ye have faith ye hope for things which are not seen, which are true."},{"r":"Ether 12:6","x":"And now, I, Moroni, would speak somewhat concerning these things; I would show unto the world that faith is things which are hoped for and not seen; wherefore, dispute not because ye see not, for ye receive no witness until after the trial of your faith."},{"r":"Moroni 7:33","x":"And Christ hath said: If ye will have faith in me ye shall have power to do whatsoever thing is expedient in me."}]},{"id":"unanswered-prayer","t":"unanswered prayer","g":"Faith and doubt","p":["God isn't answering","my prayers aren't answered","why won't God answer","silence from God"],"k":[],"v":[{"r":"Isaiah 55:8-9","x":{"KJV":"For my thoughts are not your thoughts, neither are your ways my ways, saith the LORD. For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","DRC":"For my thoughts are not your thoughts: nor your ways my ways, saith the Lord. For as the heavens are exalted above the earth, so are my ways exalted above your ways, and my thoughts above your thoughts.","CPDV":"For my thoughts are not your thoughts, and your ways are not my ways, says the Lord. For just as the heavens are exalted above the earth, so also are my ways exalted above your ways, and my thoughts above your thoughts.","ASV":"For my thoughts are not your thoughts, neither are your ways my ways, saith Jehovah. For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","BSB":"“For My thoughts are not your thoughts, neither are your ways My ways,” declares the LORD. “For as the heavens are higher than the earth, so My ways are higher than your ways and My thoughts than your thoughts.","BBE":"For my thoughts are not your thoughts, or your ways my ways, says the Lord. For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","Darby":"For my thoughts are not your thoughts, neither are your ways my ways, saith Jehovah. For [as] the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","Geneva1599":"For my thoughtes are not your thoughts, neither are your wayes my wayes, sayth the Lord. For as ye heauens are higher then the earth, so are my wayes higher then your wayes, and my thoughtes aboue your thoughts.","Webster":"For my thoughts [are] not your thoughts, neither [are] your ways my ways, saith the LORD. For [as] the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","YLT":"For not My thoughts are your thoughts, Nor your ways My ways, --an affirmation of Jehovah, For high have the heavens been above the earth, So high have been My ways above your ways, And My thoughts above your thoughts.","NHEB":"\"For my thoughts are not your thoughts, neither are your ways my ways,\" says the Lord. \"For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts."}},{"r":"Psalms 13:1-5","x":{"KJV":"How long wilt thou forget me, O LORD? for ever? how long wilt thou hide thy face from me? How long shall I take counsel in my soul, having sorrow in my heart daily? how long shall mine enemy be exalted over me? Consider and hear me, O LORD my God: lighten mine eyes, lest I sleep the sleep of death; Lest mine enemy say, I have prevailed against him; and those that trouble me rejoice when I am moved. But I have trusted in thy mercy; my heart shall rejoice in thy salvation.","DRC":"Unto the end, a psalm for David. How long, O Lord, wilt thou forget me unto the end? how long dost thou turn away thy face from me? How long shall I take counsels in my soul, sorrow in my heart all the day? How long shall my enemy be exalted over me? Consider, and hear me, O Lord, my God. Enlighten my eyes, that I never sleep in death: Lest at any time my enemy say: I have prevailed against him. They that trouble me, will rejoice when I am moved:","CPDV":"Unto the end. A Psalm of David. How long, O Lord? Will you forget me until the end? How long will you turn your face away from me? How long can I take counsel in my soul, sorrowing in my heart throughout the day? How long will my enemy be exalted over me? Look upon me and listen to me, O Lord my God. Enlighten my eyes, lest I fall asleep forever in death, lest at any time my enemy may say, “I have prevailed against him.” Those who trouble me will exult, if I have been disturbed.","ASV":"For the Chief Musician. A Psalm of David. How long, O Jehovah? wilt thou forget me for ever? How long wilt thou hide thy face from me? How long shall I take counsel in my soul, Having sorrow in my heart all the day? How long shall mine enemy be exalted over me? Consider and answer me, O Jehovah my God: Lighten mine eyes, lest I sleep the sleep of death; Lest mine enemy say, I have prevailed against him; Lest mine adversaries rejoice when I am moved. But I have trusted in thy lovingkindness; My heart shall rejoice in thy salvation.","BSB":"For the choirmaster. A Psalm of David. How long, O LORD? Will You forget me forever? How long will You hide Your face from me? How long must I wrestle in my soul, with sorrow in my heart each day? How long will my enemy dominate me? Consider me and respond, O LORD my God. Give light to my eyes, lest I sleep in death, lest my enemy say, “I have overcome him,” and my foes rejoice when I fall. But I have trusted in Your loving devotion; my heart will rejoice in Your salvation.","BBE":"Will you for ever put me out of your memory, O Lord? will your face for ever be turned away from me? How long is my soul to be in doubt, with sorrow in my heart all the day? how long will he who is against me be given power over me? Let my voice come before you, and give me an answer, O Lord my God; let your light be shining on me, so that the sleep of death may not overtake me; And he who is against me may not say, I have overcome him; and those who are troubling me may not be glad when I am moved. But I have had faith in your mercy; my heart will be glad in your salvation.","Darby":"To the chief Musician. A Psalm of David. How long, Jehovah, wilt thou forget me for ever? how long wilt thou hide thy face from me? How long shall I take counsel in my soul, with sorrow in my heart daily? how long shall mine enemy be exalted over me? Consider, answer me, O Jehovah myGod! lighten mine eyes, lest I sleep the [sleep of] death; Lest mine enemy say, I have prevailed against him! [lest] mine adversaries be joyful when I am moved. As for me, I have confided in thy loving-kindness; my heart shall be joyful in thy salvation.","Geneva1599":"To him that excelleth. A Psalme of Dauid. Howe long wilt thou forget me, O Lord, for euer? howe long wilt thou hide thy face from me? How long shall I take counsell within my selfe, hauing wearinesse dayly in mine heart? how long shall mine enemie be exalted aboue me? Beholde, and heare mee, O Lord my God: lighten mine eyes, that I sleepe not in death: Lest mine enemie say, I haue preuailed against him: and they that afflict me, reioyce when I slide. But I trust in thy mercie: mine heart shall reioyce in thy saluation: I will sing to the Lord, because he hath delt louingly with me.","Webster":"To the chief Musician, A Psalm of David. How long wilt thou forget me, O LORD? for ever? how long wilt thou hide thy face from me? How long shall I take counsel in my soul, [having] sorrow in my heart daily? how long shall my enemy be exalted over me? Consider [and] hear me, O LORD my God: lighten my eyes, lest I sleep [the sleep] of death; Lest my enemy say, I have prevailed against him; [and] those that trouble me rejoice when I am moved. But I have trusted in thy mercy; my heart shall rejoice in thy salvation.","YLT":"To the Overseer. --A Psalm of David. Till when, O Jehovah, Dost Thou forget me? --for ever? Till when dost Thou hide Thy face from me? Till when do I set counsels in my soul? Sorrow in my heart daily? Till when is mine enemy exalted over me? Look attentively; Answer me, O Jehovah, my God, Enlighten mine eyes, lest I sleep in death, Lest mine enemy say, `I overcame him,' Mine adversaries joy when I am moved. And I, in Thy kindness I have trusted, Rejoice doth my heart in Thy salvation.","NHEB":"For the Chief Musician. A Psalm by David. How long, Lord? Will you forget me forever? How long will you hide your face from me? How long shall I take counsel in my soul, having sorrow in my heart every day? How long shall my enemy triumph over me? Behold, and answer me, Lord, my God. Give light to my eyes, lest I sleep in death; Lest my enemy say, \"I have prevailed against him;\" Lest my adversaries rejoice when I fall. But I trust in your loving kindness. My heart rejoices in your salvation."},"a":{"DRC":"Psalms 12:1-5","CPDV":"Psalms 12:1-5"}},{"r":"Luke 18:1","x":{"KJV":"And he spake a parable unto them to this end, that men ought always to pray, and not to faint;","DRC":"And he spoke also a parable to them, that we ought always to pray and not to faint,","CPDV":"Now he also told them a parable, that we should continually pray and not cease,","ASV":"And he spake a parable unto them to the end that they ought always to pray, and not to faint;","BSB":"Then Jesus told them a parable about their need to pray at all times and not lose heart:","BBE":"And he made a story for them, the point of which was that men were to go on making prayer and not get tired;","Darby":"And he spoke also a parable to them to the purport that they should always pray and not faint,","Geneva1599":"And he spake also a parable vnto them, to this ende, that they ought alwayes to pray, and not to waxe faint,","Webster":"And he spoke a parable to them [to this end], that men ought always [to] pray, and not to faint;","YLT":"And he spake also a simile to them, that it behoveth us always to pray, and not to faint,","NHEB":"He also spoke a parable to them that they must always pray, and not give up,"}}],"l":[{"r":"D&C 88:68","x":"Therefore, sanctify yourselves that your minds become single to God, and the days will come that you shall see him; for he will unveil his face unto you, and it shall be in his own time, and in his own way, and according to his own will."},{"r":"D&C 98:2","x":"Waiting patiently on the Lord, for your prayers have entered into the ears of the Lord of Sabaoth, and are recorded with this seal and testament—the Lord hath sworn and decreed that they shall be granted."},{"r":"Ether 12:6","x":"And now, I, Moroni, would speak somewhat concerning these things; I would show unto the world that faith is things which are hoped for and not seen; wherefore, dispute not because ye see not, for ye receive no witness until after the trial of your faith."}]},{"id":"hearing-god","t":"hearing God","g":"Faith and doubt","p":["how do I hear God","God's voice","still small voice","revelation"],"k":[],"v":[{"r":"1 Kings 19:11-12","x":{"KJV":"And he said, Go forth, and stand upon the mount before the LORD. And, behold, the LORD passed by, and a great and strong wind rent the mountains, and brake in pieces the rocks before the LORD; but the LORD was not in the wind: and after the wind an earthquake; but the LORD was not in the earthquake: And after the earthquake a fire; but the LORD was not in the fire: and after the fire a still small voice.","DRC":"And he said to him: Go forth, and stand upon the mount before the Lord: and behold the Lord passeth, and a great and strong wind before the Lord, overthrowing the mountains, and breaking the rocks in pieces: but the Lord is not in the wind. And after the wind, an earthquake: but the Lord is not in the earthquake. And after the earthquake, a fire: but the Lord is not in the fire. And after the fire, a whistling of a gentle air.","CPDV":"And he said to him, “Go out and stand on the mount before the Lord.” And behold, the Lord passed by. And there was a great and strong wind, tearing apart the mountains, and crushing the rocks before the Lord. But the Lord was not in the wind. And after the wind, there was an earthquake. But the Lord was not in the earthquake. And after the earthquake, there was a fire. But the Lord was not in the fire. And after the fire, there was the whisper of a gentle breeze.","ASV":"And he said, Go forth, and stand upon the mount before Jehovah. And, behold, Jehovah passed by, and a great and strong wind rent the mountains, and brake in pieces the rocks before Jehovah; but Jehovah was not in the wind: and after the wind an earthquake; but Jehovah was not in the earthquake: and after the earthquake a fire; but Jehovah was not in the fire: and after the fire a still small voice.","BSB":"Then the LORD said, “Go out and stand on the mountain before the LORD. Behold, the LORD is about to pass by.” And a great and mighty wind tore into the mountains and shattered the rocks before the LORD, but the LORD was not in the wind. After the wind there was an earthquake, but the LORD was not in the earthquake. After the earthquake there was a fire, but the LORD was not in the fire. And after the fire came a still, small voice.","BBE":"Then he said, Go out and take your place on the mountain before the Lord. Then the Lord went by, and mountains were parted by the force of a great wind, and rocks were broken before the Lord; but the Lord was not in the wind. And after the wind there was an earth-shock, but the Lord was not in the earth-shock. And after the earth-shock a fire, but the Lord was not in the fire. And after the fire, the sound of a soft breath.","Darby":"And he said, Go forth, and stand upon the mount before Jehovah. And behold, Jehovah passed by, and a great and strong wind rent the mountains, and broke in pieces the rocks before Jehovah: Jehovah was not in the wind. And after the wind, an earthquake: Jehovah was not in the earthquake. And after the earthquake, a fire: Jehovah was not in the fire. And after the fire, a soft gentle voice.","Geneva1599":"And he saide, Come out, and stand vpon the mount before the Lord. And beholde, the Lord went by, and a mightie strong winde rent the mountaines, and brake the rockes before the Lord: but the Lord was not in the winde: and after the wind came an earthquake: but the Lord was not in the earthquake: And after the earthquake came fire: but the Lord was not in the fire: and after the fire came a still and soft voyce.","Webster":"And he said, Go forth, and stand upon the mount before the LORD. And behold, the LORD passed by, and a great and strong wind rent the mountains, and broke in pieces the rocks before the LORD; [but] the LORD [was] not in the wind: and after the wind an earthquake; [but] the LORD [was] not in the earthquake: And after the earthquake a fire; [but] the LORD [was] not in the fire: and after the fire a still small voice.","YLT":"And He saith, `Go out, and thou hast stood in the mount before Jehovah.' And lo, Jehovah is passing by, and a wind--great and strong--is rending mountains, and shivering rocks before Jehovah: --not in the wind is Jehovah; and after the wind a shaking: --not in the shaking is Jehovah; and after the shaking a fire: --not in the fire is Jehovah; and after the fire a voice still small;","NHEB":"He said, \"Go out, and stand on the mountain before the Lord.\" Behold, the Lord passed by, and a great and strong wind tore the mountains, and broke in pieces the rocks before the Lord; but the Lord was not in the wind. After the wind an earthquake; but the Lord was not in the earthquake. After the earthquake a fire passed; but the Lord was not in the fire: and after the fire a still small voice."}},{"r":"John 10:27","x":{"KJV":"My sheep hear my voice, and I know them, and they follow me:","DRC":"My sheep hear my voice. And I know them: and they follow me.","CPDV":"My sheep hear my voice. And I know them, and they follow me.","ASV":"My sheep hear my voice, and I know them, and they follow me:","BSB":"My sheep listen to My voice; I know them, and they follow Me.","BBE":"My sheep give ear to my voice, and I have knowledge of them, and they come after me:","Darby":"My sheep hear my voice, and I know them, and they follow me;","Geneva1599":"My sheepe heare my voyce, and I knowe them, and they follow me,","Webster":"My sheep hear my voice, and I know them, and they follow me:","YLT":"according as I said to you: My sheep my voice do hear, and I know them, and they follow me,","NHEB":"My sheep hear my voice, and I know them, and they follow me."}},{"r":"Isaiah 30:21","x":{"KJV":"And thine ears shall hear a word behind thee, saying, This is the way, walk ye in it, when ye turn to the right hand, and when ye turn to the left.","DRC":"And thy ears shall hear the word of one admonishing thee behind thy back: This is the way, walk ye in it: and go not aside neither to the right hand, nor to the left.","CPDV":"And your ears will listen to the word of one admonishing you behind your back: “This is the way! Walk in it! And do not turn aside, neither to the right, nor to the left.”","ASV":"and thine ears shall hear a word behind thee, saying, This is the way, walk ye in it; when ye turn to the right hand, and when ye turn to the left.","BSB":"And whether you turn to the right or to the left, your ears will hear this command behind you: “This is the way. Walk in it.”","BBE":"And at your back, when you are turning to the right hand or to the left, a voice will be sounding in your ears, saying, This is the way in which you are to go.","Darby":"And when ye turn to the right hand or when ye turn to the left, thine ears shall hear a word behind thee, saying, This is the way, walk ye in it.","Geneva1599":"And thine eares shall heare a worde behind thee, saying, This is the way, walke ye in it, when thou turnest to the right hand, and when thou turnest to the left.","Webster":"And thy ears shall hear a word behind thee, saying, This [is] the way, walk ye in it, when ye turn to the right hand, and when ye turn to the left.","YLT":"And thine ear heareth a word behind thee, Saying, `This is the way, go ye in it,' When ye turn to the right, And when ye turn to the left.","NHEB":"and when you turn to the right hand, and when you turn to the left, your ears will hear a voice behind you, saying, \"This is the way. Walk in it.\""}}],"l":[{"r":"D&C 8:2","x":"Yea, behold, I will tell you in your mind and in your heart, by the Holy Ghost, which shall come upon you and which shall dwell in your heart."},{"r":"Helaman 5:30","x":"And it came to pass when they heard this voice, and beheld that it was not a voice of thunder, neither was it a voice of a great tumultuous noise, but behold, it was a still voice of perfect mildness, as if it had been a whisper, and it did pierce even to the very soul—"},{"r":"D&C 6:22-23","x":"Verily, verily, I say unto you, if you desire a further witness, cast your mind upon the night that you cried unto me in your heart, that you might know concerning the truth of these things. Did I not speak peace to your mind concerning the matter? What greater witness can you have than from God?"}]},{"id":"waiting-on-the-lord","t":"waiting on the Lord","g":"Faith and doubt","p":["waiting","how long Lord","God's timing","be patient with God"],"k":[],"v":[{"r":"Isaiah 40:31","x":{"KJV":"But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.","DRC":"But they that hope in the Lord shall renew their strength, they shall take wings as eagles, they shall run and not be weary, they shall walk and not faint.","CPDV":"But those who hope in the Lord will renew their strength. They will take up wings like eagles. They will run and not struggle. They will walk and not tire.","ASV":"but they that wait for Jehovah shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; they shall walk, and not faint.","BSB":"But those who wait upon the LORD will renew their strength; they will mount up with wings like eagles; they will run and not grow weary, they will walk and not faint.","BBE":"But those who are waiting for the Lord will have new strength; they will get wings like eagles: running, they will not be tired, and walking, they will have no weariness.","Darby":"but they that wait upon Jehovah shall renew [their] strength: they shall mount up with wings as eagles; they shall run, and not tire; they shall walk, and not faint.","Geneva1599":"But they that waite vpon the Lord, shall renue their strength: they shall lift vp the wings as the eagles: they shall runne, and not be wearie, and they shall walke and not faint.","Webster":"But they that wait upon the LORD shall renew [their] strength; they shall mount up with wings as eagles; they shall run, and not be weary; they shall walk, and not faint.","YLT":"But those expecting Jehovah pass to power, They raise up the pinion as eagles, They run and are not fatigued, They go on and do not faint!","NHEB":"But those who wait for the Lord will renew their strength. They will mount up with wings like eagles. They will run, and not be weary. They will walk, and not faint."}},{"r":"Psalms 27:14","x":{"KJV":"Wait on the LORD: be of good courage, and he shall strengthen thine heart: wait, I say, on the LORD.","DRC":"Expect the Lord, do manfully, and let thy heart take courage, and wait thou for the Lord.","CPDV":"Wait for the Lord, act manfully; and let your heart be strengthened, and remain with the Lord.","ASV":"Wait for Jehovah: Be strong, and let thy heart take courage; Yea, wait thou for Jehovah.","BSB":"Wait patiently for the LORD; be strong and courageous. Wait patiently for the LORD!","BBE":"Let your hope be in the Lord: take heart and be strong; yes, let your hope be in the Lord.","Darby":"Wait for Jehovah; be strong and let thy heart take courage: yea, wait for Jehovah.","Geneva1599":"Hope in the Lord: be strong, and he shall comfort thine heart, and trust in the Lord.","Webster":"Wait on the LORD: be of good courage, and he will strengthen thy heart: wait, I say, on the LORD.","YLT":"Look unto Jehovah--be strong, And He doth strengthen thy heart, Yea, look unto Jehovah!","NHEB":"Wait for the Lord. Be strong, and let your heart take courage. Yes, wait for the Lord."},"a":{"DRC":"Psalms 26:14","CPDV":"Psalms 26:14"}},{"r":"Lamentations 3:25","x":{"KJV":"The LORD is good unto them that wait for him, to the soul that seeketh him.","DRC":"Teth. The Lord is good to them that hope in him, to the soul that seeketh him.","CPDV":"TETH. The Lord is good to those who hope in him, to the soul that seeks him.","ASV":"Jehovah is good unto them that wait for him, to the soul that seeketh him.","BSB":"The LORD is good to those who wait for Him, to the soul who seeks Him.","BBE":"The Lord is good to those who are waiting for him, to the soul which is looking for him.","Darby":"Jehovah is good unto them that wait for him, to the soul [that] seeketh him.","Geneva1599":"The Lord is good vnto them, that trust in him, and to the soule that seeketh him.","Webster":"The LORD [is] good to them that wait for him, to the soul [that] seeketh him.","YLT":"Good is Jehovah to those waiting for Him, To the soul that seeketh Him.","NHEB":"The Lord is good to those who wait for him, to the soul that seeks him."}}],"l":[{"r":"D&C 98:2","x":"Waiting patiently on the Lord, for your prayers have entered into the ears of the Lord of Sabaoth, and are recorded with this seal and testament—the Lord hath sworn and decreed that they shall be granted."},{"r":"D&C 88:68","x":"Therefore, sanctify yourselves that your minds become single to God, and the days will come that you shall see him; for he will unveil his face unto you, and it shall be in his own time, and in his own way, and according to his own will."},{"r":"Moroni 7:41","x":"And what is it that ye shall hope for? Behold I say unto you that ye shall have hope through the atonement of Christ and the power of his resurrection, to be raised unto life eternal, and this because of your faith in him according to the promise."}]},{"id":"trusting-god","t":"trusting God","g":"Faith and doubt","p":["trust God","let go and let God","surrender","rely on God"],"k":["trust"],"v":[{"r":"Proverbs 3:5-6","x":{"KJV":"Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths.","DRC":"Have confidence in the Lord with all thy heart, and lean not upon thy own prudence. In all thy ways think on him, and he will direct thy steps.","CPDV":"Have confidence in the Lord with all your heart, and do not depend upon your own prudence. In all your ways, consider him, and he himself will direct your steps.","ASV":"Trust in Jehovah with all thy heart, And lean not upon thine own understanding: In all thy ways acknowledge him, And he will direct thy paths.","BSB":"Trust in the LORD with all your heart, and lean not on your own understanding; in all your ways acknowledge Him, and He will make your paths straight.","BBE":"Put all your hope in God, not looking to your reason for support. In all your ways give ear to him, and he will make straight your footsteps.","Darby":"Confide in Jehovah with all thy heart, and lean not unto thine own intelligence; in all thy ways acknowledge him, and he will make plain thy paths.","Geneva1599":"Trust in the Lord with all thine heart, and leane not vnto thine owne wisdome. In all thy wayes acknowledge him, and he shall direct thy wayes.","Webster":"Trust in the LORD with all thy heart; and lean not to thy own understanding. In all thy ways acknowledge him, and he will direct thy paths.","YLT":"Trust unto Jehovah with all thy heart, And unto thine own understanding lean not. In all thy ways know thou Him, And He doth make straight thy paths.","NHEB":"Trust in the Lord with all your heart, and do not lean on your own understanding. In all your ways acknowledge him, and he will make your paths straight."}},{"r":"Psalms 56:3","x":{"KJV":"What time I am afraid, I will trust in thee.","DRC":"From the height of the day I shall fear: but I will trust in thee.","CPDV":"From the height of the day, I will be afraid. But truly, I will hope in you.","ASV":"What time I am afraid, I will put my trust in thee.","BSB":"When I am afraid, I put my trust in You.","BBE":"In the time of my fear, I will have faith in you.","Darby":"In the day that I am afraid, I will confide in thee.","Geneva1599":"When I was afrayd, I trusted in thee.","Webster":"In the time when I am afraid, I will trust in thee.","YLT":"The day I am afraid I am confident toward Thee.","NHEB":"When I am afraid, I will put my trust in you."},"a":{"DRC":"Psalms 55:4","CPDV":"Psalms 55:4"}},{"r":"Isaiah 26:4","x":{"KJV":"Trust ye in the LORD for ever: for in the LORD JEHOVAH is everlasting strength:","DRC":"You have hoped in the Lord for evermore, in the Lord God mighty for ever.","CPDV":"You have trusted in the Lord for all eternity, in the Lord God almighty forever.","ASV":"Trust ye in Jehovah for ever; for in Jehovah, even Jehovah, is an everlasting rock.","BSB":"Trust in the LORD forever, because GOD the LORD is the Rock eternal.","BBE":"Let your hope be in the Lord for ever: for the Lord Jah is an unchanging Rock.","Darby":"Confide ye in Jehovah for ever; for in Jah, Jehovah, is the rock of ages.","Geneva1599":"Trust in the Lord for euer: for in the Lord God is strength for euermore.","Webster":"Trust ye in the LORD for ever: for in the LORD JEHOVAH [is] everlasting strength:","YLT":"Trust ye in Jehovah for ever, For in Jah Jehovah is a rock of ages,","NHEB":"Trust in the Lord forever; for in Yah, the Lord, is an everlasting Rock."}}],"l":[{"r":"Alma 36:3","x":"And now, O my son Helaman, behold, thou art in thy youth, and therefore, I beseech of thee that thou wilt hear my words and learn of me; for I do know that whosoever shall put their trust in God shall be supported in their trials, and their troubles, and their afflictions, and shall be lifted up at the last day."},{"r":"2 Nephi 4:34","x":"O Lord, I have trusted in thee, and I will trust in thee forever. I will not put my trust in the arm of flesh; for I know that cursed is he that putteth his trust in the arm of flesh. Yea, cursed is he that putteth his trust in man or maketh flesh his arm."},{"r":"D&C 84:88","x":"And whoso receiveth you, there I will be also, for I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up."}]},{"id":"spiritual-dryness","t":"spiritual dryness","g":"Faith and doubt","p":["I feel nothing","spiritually dry","going through the motions","numb"],"k":[],"v":[{"r":"Psalms 42:1-2","x":{"KJV":"As the hart panteth after the water brooks, so panteth my soul after thee, O God. My soul thirsteth for God, for the living God: when shall I come and appear before God?","DRC":"As the hart panteth after the fountains of water; so my soul panteth after thee, O God. My soul hath thirsted after the strong living God; when shall I come and appear before the face of God?","CPDV":"As the deer longs for fountains of water, so my soul longs for you, O God. My soul has thirsted for the strong living God. When will I draw close and appear before the face of God?","ASV":"For the Chief Musician. Maschil of the sons of Korah. As the hart panteth after the water brooks, So panteth my soul after thee, O God. My soul thirsteth for God, for the living God: When shall I come and appear before God?","BSB":"For the choirmaster. A Maskil of the sons of Korah. As the deer pants for streams of water, so my soul longs after You, O God. My soul thirsts for God, the living God. When shall I come and appear in God’s presence?","BBE":"Like the desire of the roe for the water-streams, so is my soul's desire for you, O God. My soul is dry for need of God, the living God; when may I come and see the face of God?","Darby":"To the chief Musician. An instruction; of the sons of Korah. As the hart panteth after the water-brooks, so panteth my soul after thee, OGod. My soul thirsteth forGod, for the livingGod: when shall I come and appear beforeGod?","Geneva1599":"To him that excelleth. A Psalme to give instruction, committed to the sonnes of Korah. As the harte brayeth for the riuers of water, so panteth my soule after thee, O God. My soule thirsteth for God, euen for the liuing God: when shall I come and appeare before the presence of God?","Webster":"To the chief Musician, Maschil, for the sons of Korah. As the hart panteth after the water brooks, so my soul panteth after thee, O God. My soul thirsteth for God, for the living God: when shall I come and appear before God?","YLT":"To the Overseer. --An Instruction. By sons of Korah. As a hart doth pant for streams of water, So my soul panteth toward Thee, O God. My soul thirsted for God, for the living God, When do I enter and see the face of God?","NHEB":"For the Chief Musician. A contemplation by the sons of Korah. As the deer pants for the water brooks, so my soul pants after you, God. My soul thirsts for God, for the living God. When shall I come and appear before God?"},"a":{"DRC":"Psalms 41:2-3","CPDV":"Psalms 41:2-3"}},{"r":"Psalms 63:1","x":{"KJV":"O God, thou art my God; early will I seek thee: my soul thirsteth for thee, my flesh longeth for thee in a dry and thirsty land, where no water is;","DRC":"O God, my God, to thee do I watch at break of day. For thee my soul hath thirsted; for thee my flesh, O how many ways!","CPDV":"O God, my God: to you, I keep vigil until first light. For you, my soul has thirsted, to you my body, in so many ways.","ASV":"A Psalm of David, when he was in the wilderness of Judah. O God, thou art my God; earnestly will I seek thee: My soul thirsteth for thee, my flesh longeth for thee, In a dry and weary land, where no water is.","BSB":"A Psalm of David, when he was in the Wilderness of Judah. O God, You are my God. Earnestly I seek You; my soul thirsts for You. My body yearns for You in a dry and weary land without water.","BBE":"O God, you are my God; early will I make my search for you: my soul is dry for need of you, my flesh is wasted with desire for you, as a dry and burning land where no water is;","Darby":"A Psalm of David; when he was in the wilderness of Judah. OGod, thou art myGod; early will I seek thee. My soul thirsteth for thee, my flesh languisheth for thee, in a dry and weary land without water:","Geneva1599":"A Psalme of David. When he was in the wildernesse of Judah. O God, thou art my God, earely will I seeke thee: my soule thirsteth for thee: my flesh longeth greatly after thee in a barren and drye land without water.","Webster":"A Psalm of David, when he was in the wilderness of Judah. O God, thou [art] my God; early will I seek thee: my soul thirsteth for thee, my flesh longeth for thee in a dry and thirsty land, where no water is;","YLT":"A Psalm of David, in his being in the wilderness of Judah. O God, Thou art my God, earnestly do I seek Thee, Thirsted for Thee hath my soul, Longed for Thee hath my flesh, In a land dry and weary, without waters.","NHEB":"A Psalm by David, when he was in the desert of Judah. God, you are my God. I will earnestly seek you. My soul thirsts for you. My flesh longs for you, in a dry and weary land, where there is no water."},"a":{"DRC":"Psalms 62:2","CPDV":"Psalms 62:2"}},{"r":"Isaiah 58:11","x":{"KJV":"And the LORD shall guide thee continually, and satisfy thy soul in drought, and make fat thy bones: and thou shalt be like a watered garden, and like a spring of water, whose waters fail not.","DRC":"And the Lord will give thee rest continually, and will fill thy soul with brightness, and deliver thy bones, and thou shalt be like a watered garden, and like a fountain of water whose waters shall not fail.","CPDV":"And the Lord will give you rest continually, and he will fill your soul with splendor, and he will free your bones, and you will be like a watered garden and like a fountain of water whose waters will not fail.","ASV":"and Jehovah will guide thee continually, and satisfy thy soul in dry places, and make strong thy bones; and thou shalt be like a watered garden, and like a spring of water, whose waters fail not.","BSB":"The LORD will always guide you; He will satisfy you in a sun-scorched land and strengthen your frame. You will be like a well-watered garden, like a spring whose waters never fail.","BBE":"And the Lord will be your guide at all times; in dry places he will give you water in full measure, and will make strong your bones; and you will be like a watered garden, and like an ever-flowing spring.","Darby":"and Jehovah will guide thee continually, and satisfy thy soul in drought, and strengthen thy bones; and thou shalt be like a watered garden, and like a water-spring, whose waters deceive not.","Geneva1599":"And the Lord shall guide thee continually, and satisfie thy soule in drought, and make fat thy bones: and thou shalt be like a watred garden, and like a spring of water, whose waters faile not.","Webster":"And the LORD will guide thee continually, and satisf
