espair, out of the miry clay; He set my feet upon a rock, and made my footsteps firm.","BBE":"When I was waiting quietly for the Lord, his heart was turned to me, and he gave ear to my cry. He took me up out of a deep waste place, out of the soft and sticky earth; he put my feet on a rock, and made my steps certain.","Darby":"To the chief Musician. Of David. A Psalm. I waited patiently for Jehovah; and he inclined unto me, and heard my cry. And he brought me up out of the pit of destruction, out of the miry clay, and set my feet upon a rock; he hath established my goings:","Geneva1599":"To him that excelleth. A Psalme of David. I Waited paciently for the Lord, and he inclined vnto me, and heard my cry. Hee brought mee also out of the horrible pit, out of the myrie clay, and set my feete vpon the rocke, and ordered my goings.","Webster":"To the chief Musician, A Psalm of David. I waited patiently for the LORD; and he inclined to me, and heard my cry. He brought me up also out of a horrible pit, out of the miry clay, and set my feet upon a rock, [and] established my goings.","YLT":"To the Overseer. --A Psalm of David. I have diligently expected Jehovah, And He inclineth to me, and heareth my cry, And He doth cause me to come up From a pit of desolation--from mire of mud, And He raiseth up on a rock my feet, He is establishing my steps.","NHEB":"For the Chief Musician. A Psalm by David. I waited patiently for the Lord. He turned to me, and heard my cry. He brought me up also out of a horrible pit, out of the miry clay. He set my feet on a rock, and gave me a firm place to stand."},"a":{"DRC":"Psalms 39:2-3","CPDV":"Psalms 39:2-3"}},{"r":"Psalms 34:17-18","x":{"KJV":"The righteous cry, and the LORD heareth, and delivereth them out of all their troubles. The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.","DRC":"The just cried, and the Lord heard them: and delivered them out of all their troubles. The Lord is nigh unto them that are of a contrite heart: and he will save the humble of spirit.","CPDV":"The just cried out, and the Lord heard them, and he freed them from all their tribulations. The Lord is near to those who are troubled in heart, and he will save the humble in spirit.","ASV":"The righteous cried, and Jehovah heard, And delivered them out of all their troubles. Jehovah is nigh unto them that are of a broken heart, And saveth such as are of a contrite spirit.","BSB":"The righteous cry out, and the LORD hears; He delivers them from all their troubles. The LORD is near to the brokenhearted; He saves the contrite in spirit.","BBE":"The cry of the upright comes before the Lord, and he takes them out of all their troubles. The Lord is near the broken-hearted; he is the saviour of those whose spirits are crushed down.","Darby":"[The righteous] cry, and Jehovah heareth, and delivereth them out of all their troubles. Jehovah is nigh to those that are of a broken heart, and saveth them that are of a contrite spirit.","Geneva1599":"The righteous crie, and the Lord heareth them, and deliuereth them out of all their troubles. The Lord is neere vnto them that are of a contrite heart, and will saue such as be afflicted in Spirite.","Webster":"[The righteous] cry, and the LORD heareth, and delivereth them out of all their troubles. The LORD [is] nigh to them that are of a broken heart; and saveth such as are of a contrite spirit.","YLT":"They cried, and Jehovah heard, And from all their distresses delivered them. Near is Jehovah to the broken of heart, And the bruised of spirit He saveth.","NHEB":"They cried, and the Lord hears, and delivers them out of all their troubles. The Lord is near to those who have a broken heart, and saves those who have a crushed spirit."},"a":{"DRC":"Psalms 33:18-19","CPDV":"Psalms 33:18-19"}},{"r":"Isaiah 61:3","x":{"KJV":"To appoint unto them that mourn in Zion, to give unto them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness; that they might be called trees of righteousness, the planting of the LORD, that he might be glorified.","DRC":"To appoint to the mourners of Sion, and to give them a crown for ashes, the oil of joy for mourning, a garment of praise for the spirit of grief: and they shall be called in it the mighty ones of justice, the planting of the Lord to glorify him.","CPDV":"to take up the mourners of Zion and to give them a crown in place of ashes, an oil of joy in place of mourning, a cloak of praise in place of a spirit of grief. And there, they shall be called the strong ones of justice, the planting of the Lord, unto glorification.","ASV":"to appoint unto them that mourn in Zion, to give unto them a garland for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness; that they may be called trees of righteousness, the planting of Jehovah, that he may be glorified.","BSB":"to console the mourners in Zion— to give them a crown of beauty for ashes, the oil of joy for mourning, and a garment of praise for a spirit of despair. So they will be called oaks of righteousness, the planting of the LORD, that He may be glorified.","BBE":"To give them a fair head-dress in place of dust, the oil of joy in place of the clothing of grief, praise in place of sorrow; so that they may be named trees of righteousness, the planting of the Lord, and so that he may have glory.","Darby":"to appoint unto them that mourn in Zion, that beauty should be given unto them instead of ashes, the oil of joy instead of mourning, the garment of praise instead of the spirit of heaviness: that they might be called terebinths of righteousness, the planting of Jehovah, that he may be glorified.","Geneva1599":"To appoint vnto them that mourne in Zion, and to giue vnto them beautie for ashes, the oyle of ioye for mourning, the garment of gladnesse for the spirit of heauinesse, that they might be called trees of righteousnesse, the planting of the Lord, that he might be glorified.","Webster":"To appoint to them that mourn in Zion, to give to them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness; that they may be called trees of righteousness, the planting of the LORD, that he may be glorified.","YLT":"To appoint to mourners in Zion, To give to them beauty instead of ashes, The oil of joy instead of mourning, A covering of praise for a spirit of weakness, And He is calling to them, `Trees of righteousness, The planting of Jehovah--to be beautified.'","NHEB":"to appoint to those who mourn in Zion, to give to them a garland for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness; that they may be called trees of righteousness, the planting of the Lord, that he may be glorified."}}],"l":[{"r":"Alma 26:27","x":"Now when our hearts were depressed, and we were about to turn back, behold, the Lord comforted us, and said: Go amongst thy brethren, the Lamanites, and bear with patience thine afflictions, and I will give unto you success."},{"r":"D&C 121:7-8","x":"My son, peace be unto thy soul; thine adversity and thine afflictions shall be but a small moment; And then, if thou endure it well, God shall exalt thee on high; thou shalt triumph over all thy foes."},{"r":"D&C 136:29","x":"If thou art sorrowful, call on the Lord thy God with supplication, that your souls may be joyful."}]},{"id":"discouragement","t":"discouragement","g":"Emotions","p":["discouraged","want to give up","nothing works","defeated"],"k":[],"v":[{"r":"Galatians 6:9","x":{"KJV":"And let us not be weary in well doing: for in due season we shall reap, if we faint not.","DRC":"And in doing good, let us not fail. For in due time we shall reap, not failing.","CPDV":"And so, let us not be deficient in doing good. For in due time, we shall reap without fail.","ASV":"And let us not be weary in well-doing: for in due season we shall reap, if we faint not.","BSB":"Let us not grow weary in well-doing, for in due time we will reap a harvest if we do not give up.","BBE":"And let us not get tired of well-doing; for at the right time we will get in the grain, if we do not give way to weariness.","Darby":"but let us not lose heart in doing good; for in due time, if we do not faint, we shall reap.","Geneva1599":"Let vs not therefore be weary of well doing: for in due season we shall reape, if we faint not.","Webster":"And let us not be weary in well-doing: for in due season we shall reap, if we faint not.","YLT":"and in the doing good we may not be faint-hearted, for at the proper time we shall reap--not desponding;","NHEB":"Let us not be weary in doing good, for we will reap in due season, if we do not give up."}},{"r":"Joshua 1:9","x":{"KJV":"Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.","DRC":"Behold I command thee, take courage, and be strong. Fear not, and be not dismayed: because the Lord thy God is with thee in all things whatsoever thou shalt go to.","CPDV":"Behold, I am instructing you. Be strengthened, and be steadfast. Do not dread, and do not fear. For the Lord your God is with you in all things, wherever you may go.”","ASV":"Have not I commanded thee? Be strong and of good courage; be not affrighted, neither be thou dismayed: for Jehovah thy God is with thee whithersoever thou goest.","BSB":"Have I not commanded you to be strong and courageous? Do not be afraid; do not be discouraged, for the LORD your God is with you wherever you go.”","BBE":"Have I not given you your orders? Take heart and be strong; have no fear and do not be troubled; for the Lord your God is with you wherever you go,","Darby":"Have I not commanded thee: Be strong and courageous? Be not afraid, neither be dismayed; for Jehovah thyGod is with thee whithersoever thou goest.","Geneva1599":"Haue not I commanded thee, saying, Be strong and of a good courage, feare not, nor be discouraged? for I the Lord thy God will be with thee, whithersoeuer thou goest.","Webster":"Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God [is] with thee whithersoever thou goest.","YLT":"`Have not I commanded thee? be strong and courageous; be not terrified nor affrighted, for with thee is Jehovah thy God in every place whither thou goest.'","NHEB":"Haven't I commanded you? Be strong and of good courage. Do not be afraid, neither be dismayed: for the Lord your God is with you wherever you go."}},{"r":"2 Corinthians 4:16","x":{"KJV":"For which cause we faint not; but though our outward man perish, yet the inward man is renewed day by day.","DRC":"For which cause we faint not: but though our outward man is corrupted, yet the inward man is renewed day by day.","CPDV":"For this reason, we are not insufficient. But it is as though our outer man is corrupted, while our inner man is renewed from day to day.","ASV":"Wherefore we faint not; but though our outward man is decaying, yet our inward man is renewed day by day.","BSB":"Therefore we do not lose heart. Though our outer self is wasting away, yet our inner self is being renewed day by day.","BBE":"For which cause we do not give way to weariness; but though our outer man is getting feebler, our inner man is made new day by day.","Darby":"Wherefore we faint not; but if indeed our outward man is consumed, yet the inward is renewed day by day.","Geneva1599":"Therefore we faint not, but though our outward man perish, yet the inward man is renewed daily.","Webster":"For which cause we faint not; but though our outward man is wasted, yet the inward [man] is renewed day by day.","YLT":"wherefore, we faint not, but if also our outward man doth decay, yet the inward is renewed day by day;","NHEB":"Therefore we do not faint, but though our outward man is decaying, yet our inward man is renewed day by day."}}],"l":[{"r":"Alma 26:27","x":"Now when our hearts were depressed, and we were about to turn back, behold, the Lord comforted us, and said: Go amongst thy brethren, the Lamanites, and bear with patience thine afflictions, and I will give unto you success."},{"r":"D&C 64:33","x":"Wherefore, be not weary in well-doing, for ye are laying the foundation of a great work. And out of small things proceedeth that which is great."},{"r":"2 Nephi 31:20","x":"Wherefore, ye must press forward with a steadfastness in Christ, having a perfect brightness of hope, and a love of God and of all men. Wherefore, if ye shall press forward, feasting upon the word of Christ, and endure to the end, behold, thus saith the Father: Ye shall have eternal life."}]},{"id":"jealousy","t":"jealousy","g":"Emotions","p":["jealous","envy","they have what I want","envious"],"k":[],"v":[{"r":"Proverbs 14:30","x":{"KJV":"A sound heart is the life of the flesh: but envy the rottenness of the bones.","DRC":"Soundness of heart is the life of the flesh: but envy is the rottenness of the bones.","CPDV":"The well-being of the heart is life for the flesh. But envy is decay for the bones.","ASV":"A tranquil heart is the life of the flesh; But envy is the rottenness of the bones.","BSB":"A tranquil heart is life to the body, but envy rots the bones.","BBE":"A quiet mind is the life of the body, but envy is a disease in the bones.","Darby":"A sound heart is the life of the flesh; but envy the rottenness of the bones.","Geneva1599":"A sounde heart is the life of the flesh: but enuie is the rotting of the bones.","Webster":"A sound heart [is] the life of the flesh: but envy the rottenness of the bones.","YLT":"A healed heart is life to the flesh, And rottenness to the bones is envy.","NHEB":"The life of the body is a heart at peace, but envy rots the bones."}},{"r":"James 3:16","x":{"KJV":"For where envying and strife is, there is confusion and every evil work.","DRC":"For where envying and contention is: there is inconstancy and every evil work.","CPDV":"For wherever envy and contention is, there too is inconstancy and every depraved work.","ASV":"For where jealousy and faction are, there is confusion and every vile deed.","BSB":"For where jealousy and selfish ambition exist, there will be disorder and every evil practice.","BBE":"For where envy is, and the desire to get the better of others, there is no order, but every sort of evil-doing.","Darby":"For where emulation and strife [are], there [is] disorder and every evil thing.","Geneva1599":"For where enuying and strife is, there is sedition, and all maner of euill workes.","Webster":"For where envying and strife [is], there [is] confusion and every evil work.","YLT":"for where zeal and rivalry are, there is insurrection and every evil matter;","NHEB":"For where jealousy and selfish ambition are, there is confusion and every evil deed."}},{"r":"Galatians 5:26","x":{"KJV":"Let us not be desirous of vain glory, provoking one another, envying one another.","DRC":"Let us not be made desirous of vain glory, provoking one another, envying one another.","CPDV":"Let us not become desirous of empty glory, provoking one another, envying one another.","ASV":"Let us not become vainglorious, provoking one another, envying one another.","BSB":"Let us not become conceited, provoking and envying one another.","BBE":"Let us not be full of self-glory, making one another angry, having envy of one another.","Darby":"Let us not become vain-glorious, provoking one another, envying one another.","Geneva1599":"Let vs not be desirous of vaine glorie, prouoking one another, enuying one another.","Webster":"Let us not be desirous of vain-glory, provoking one another, envying one another.","YLT":"let us not become vain-glorious--one another provoking, one another envying!","NHEB":"Let us not become conceited, provoking one another, and envying one another."}}],"l":[{"r":"D&C 67:10","x":"And again, verily I say unto you that it is your privilege, and a promise I give unto you that have been ordained unto this ministry, that inasmuch as you strip yourselves from jealousies and fears, and humble yourselves before me, for ye are not sufficiently humble, the veil shall be rent and you shall see me and know that I am—not with the carnal neither natural mind, but with the spiritual."},{"r":"Moroni 7:45","x":"And charity suffereth long, and is kind, and envieth not, and is not puffed up, seeketh not her own, is not easily provoked, thinketh no evil, and rejoiceth not in iniquity but rejoiceth in the truth, beareth all things, believeth all things, hopeth all things, endureth all things."},{"r":"Alma 38:12","x":"Use boldness, but not overbearance; and also see that ye bridle all your passions, that ye may be filled with love; see that ye refrain from idleness."}]},{"id":"bitterness","t":"bitterness","g":"Emotions","p":["bitter","resentful","can't let go of it","holding a grudge"],"k":[],"v":[{"r":"Ephesians 4:31-32","x":{"KJV":"Let all bitterness, and wrath, and anger, and clamour, and evil speaking, be put away from you, with all malice: And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ's sake hath forgiven you.","DRC":"Let all bitterness and anger and indignation and clamour and blasphemy be put away from you, with all malice. And be ye kind one to another: merciful, forgiving one another, even as God hath forgiven you in Christ.","CPDV":"Let all bitterness and anger and indignation and outcry and blasphemy be taken away from you, along with all malice. And be kind and merciful to one another, forgiving one another, just as God has forgiven you in Christ.","ASV":"Let all bitterness, and wrath, and anger, and clamor, and railing, be put away from you, with all malice: and be ye kind one to another, tenderhearted, forgiving each other, even as God also in Christ forgave you.","BSB":"Get rid of all bitterness, rage and anger, outcry and slander, along with every form of malice. Be kind and tenderhearted to one another, forgiving each other just as in Christ God forgave you.","BBE":"Let all bitter, sharp and angry feeling, and noise, and evil words, be put away from you, with all unkind acts; And be kind to one another, full of pity, having forgiveness for one another, even as God in Christ had forgiveness for you.","Darby":"Let all bitterness, and heat of passion, and wrath, and clamour, and injurious language, be removed from you, with all malice; and be to one another kind, compassionate, forgiving one another, so asGod also in Christ has forgiven you.","Geneva1599":"Let all bitternesse, and anger, and wrath, crying, and euill speaking be put away from you, with all maliciousnesse. Be ye courteous one to another, and tender hearted, freely forgiuing one another, euen as God for Christes sake, freely forgaue you.","Webster":"Let all bitterness, and wrath, and anger, and clamor, and evil-speaking, be put away from you, with all malice: And be ye kind one to another, tender-hearted, forgiving one another, even as God for Christ's sake hath forgiven you.","YLT":"Let all bitterness, and wrath, and anger, and clamour, and evil-speaking, be put away from you, with all malice, and become one to another kind, tender-hearted, forgiving one another, according as also God in Christ did forgive you.","NHEB":"Let all bitterness, wrath, anger, outcry, and slander, be put away from you, with all malice. And be kind to one another, tenderhearted, forgiving each other, just as God also in Christ forgave you."}},{"r":"Hebrews 12:15","x":{"KJV":"Looking diligently lest any man fail of the grace of God; lest any root of bitterness springing up trouble you, and thereby many be defiled;","DRC":"Looking diligently, lest any man be wanting to the grace of God: lest any root of bitterness springing up do hinder and by it many be defiled:","CPDV":"Be contemplative, lest anyone lack the grace of God, lest any root of bitterness spring up and impede you, and by it, many might be defiled,","ASV":"looking carefully lest there be any man that falleth short of the grace of God; lest any root of bitterness springing up trouble you, and thereby the many be defiled;","BSB":"See to it that no one falls short of the grace of God, and that no root of bitterness springs up to cause trouble and defile many.","BBE":"Looking with care to see that no man among you in his behaviour comes short of the grace of God; for fear that some bitter root may come up to be a trouble to you, and that some of you may be made unclean by it;","Darby":"watching lest [there be] any one who lacks the grace ofGod; lest any root of bitterness springing up trouble [you], and many be defiled by it;","Geneva1599":"Take heede, that no man fall away from the grace of God: let no roote of bitternes spring vp and trouble you, lest thereby many be defiled.","Webster":"Looking diligently, lest any man fail of the grace of God; lest any root of bitterness springing up, trouble [you], and by it many be defiled;","YLT":"looking diligently over lest any one be failing of the grace of God, lest any root of bitterness springing up may give trouble, and through this many may be defiled;","NHEB":"looking carefully lest there be any man who falls short of the grace of God; lest any root of bitterness springing up trouble you, and many be defiled by it;"}},{"r":"Romans 12:19","x":{"KJV":"Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord.","DRC":"Revenge not yourselves, my dearly beloved; but give place unto wrath, for it is written: Revenge is mine, I will repay, saith the Lord.","CPDV":"Do not defend yourselves, dearest ones. Instead, step aside from wrath. For it is written: “Vengeance is mine. I shall give retribution, says the Lord.”","ASV":"Avenge not yourselves, beloved, but give place unto the wrath of God: for it is written, Vengeance belongeth unto me; I will recompense, saith the Lord.","BSB":"Do not avenge yourselves, beloved, but leave room for God’s wrath. For it is written: “Vengeance is Mine; I will repay, says the Lord.”","BBE":"Do not give punishment for wrongs done to you, dear brothers, but give way to the wrath of God; for it is said in the holy Writings, Punishment is mine, I will give reward, says the Lord.","Darby":"not avenging yourselves, beloved, but give place to wrath; for it is written, Vengeance [belongs] to me, I will recompense, saith the Lord.","Geneva1599":"Dearely beloued, auenge not your selues, but giue place vnto wrath: for it is written, Vengeance is mine: I will repay, saith the Lord.","Webster":"Dearly beloved, avenge not yourselves, but [rather] give place to wrath: for it is written, Vengeance [is] mine; I will repay, saith the Lord.","YLT":"not avenging yourselves, beloved, but give place to the wrath, for it hath been written, `Vengeance is Mine,","NHEB":"Do not seek revenge yourselves, beloved, but give place to God's wrath. For it is written, \"Vengeance belongs to me; I will repay, says the Lord.\""}}],"l":[{"r":"D&C 64:10","x":"I, the Lord, will forgive whom I will forgive, but of you it is required to forgive all men."},{"r":"Moroni 7:45","x":"And charity suffereth long, and is kind, and envieth not, and is not puffed up, seeketh not her own, is not easily provoked, thinketh no evil, and rejoiceth not in iniquity but rejoiceth in the truth, beareth all things, believeth all things, hopeth all things, endureth all things."},{"r":"Alma 38:12","x":"Use boldness, but not overbearance; and also see that ye bridle all your passions, that ye may be filled with love; see that ye refrain from idleness."}]},{"id":"joy","t":"joy","g":"Emotions","p":["joy","happy","rejoice","delight"],"k":[],"v":[{"r":"Nehemiah 8:10","x":{"KJV":"Then he said unto them, Go your way, eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared: for this day is holy unto our Lord: neither be ye sorry; for the joy of the LORD is your strength.","DRC":"And he said to them: Go, eat fat meats, and drink sweet wine, and send portions to them that have not prepared for themselves: because it is the holy day of the Lord, and be not sad: for the joy of the Lord is our strength.","CPDV":"And he said to them: “Go, eat fat foods and drink sweet drinks, and send portions to those who have not prepared for themselves. For it is the holy day of the Lord. And do not be sad. For the joy of the Lord is also our strength.”","ASV":"Then he said unto them, Go your way, eat the fat, and drink the sweet, and send portions unto him for whom nothing is prepared; for this day is holy unto our Lord: neither be ye grieved; for the joy of Jehovah is your strength.","BSB":"Then Nehemiah told them, “Go and eat what is rich, drink what is sweet, and send out portions to those who have nothing prepared, since today is holy to our Lord. Do not grieve, for the joy of the LORD is your strength.”","BBE":"Then he said to them, Go away now, and take the fat for your food and the sweet for your drink, and send some to him for whom nothing is made ready: for this day is holy to our Lord: and let there be no grief in your hearts; for the joy of the Lord is your strong place.","Darby":"And he said to them, Go your way, eat the fat, and drink the sweet, and send portions to them for whom nothing is prepared; for the day is holy to our Lord; and be not grieved, for the joy of Jehovah is your strength.","Geneva1599":"He saide also vnto the, Go, and eate of the fat, and drinke the sweete, and send part vnto them, for whome none is prepared: for this day is holie vnto our Lord: be ye not sorie therefore: for the ioy of the Lord is your strength.","Webster":"Then he said to them, Go your way, eat the fat, and drink the sweet, and send portions to them for whom nothing is prepared: for [this] day [is] holy to our Lord: neither be ye sad; for the joy of the LORD is your strength.","YLT":"And he saith to them, `Go, eat fat things, and drink sweet things, and sent portions to him for whom nothing is prepared, for to-day is holy to our Lord, and be not grieved, for the joy of Jehovah is your strength.'","NHEB":"Then he said to them, \"Go your way. Eat the fat, drink the sweet, and send portions to him for whom nothing is prepared; for this day is holy to our Lord. Do not be grieved; for the joy of the Lord is your strength.\""}},{"r":"Psalms 16:11","x":{"KJV":"Thou wilt shew me the path of life: in thy presence is fulness of joy; at thy right hand there are pleasures for evermore.","DRC":"Thou hast made known to me the ways of life, thou shalt fill me with joy with thy countenance: at thy right hand are delights even to the end.","CPDV":"You have made known to me the ways of life; you will fill me with joy by your countenance. At your right hand are delights, even to the end.","ASV":"Thou wilt show me the path of life: In thy presence is fulness of joy; In thy right hand there are pleasures for evermore.","BSB":"You have made known to me the path of life; You will fill me with joy in Your presence, with eternal pleasures at Your right hand.","BBE":"You will make clear to me the way of life; where you are joy is complete; in your right hand there are pleasures for ever and ever.","Darby":"Thou wilt make known to me the path of life: thy countenance is fulness of joy; at thy right hand are pleasures for evermore.","Geneva1599":"Thou wilt shew me the path of life: in thy presence is the fulnesse of ioy: and at thy right hand there are pleasures for euermore.","Webster":"Thou wilt show me the path of life: in thy presence [is] fullness of joy; at thy right hand [are] pleasures for evermore.","YLT":"Thou causest me to know the path of life; Fulness of joys is with Thy presence, Pleasant things by Thy right hand for ever!","NHEB":"You will show me the path of life. In your presence is fullness of joy. In your right hand there are pleasures forevermore."},"a":{"DRC":"Psalms 15:11","CPDV":"Psalms 15:11"}},{"r":"John 15:11","x":{"KJV":"These things have I spoken unto you, that my joy might remain in you, and that your joy might be full.","DRC":"These things I have spoken to you, that my joy may be in you, and your joy may be filled.","CPDV":"These things I have spoken to you, so that my joy may be in you, and your joy may be fulfilled.","ASV":"These things have I spoken unto you, that my joy may be in you, and that your joy may be made full.","BSB":"I have told you these things so that My joy may be in you and your joy may be complete.","BBE":"I have said these things to you so that I may have joy in you and so that your joy may be complete.","Darby":"I have spoken these things to you that my joy may be in you, and your joy be full.","Geneva1599":"These things haue I spoken vnto you, that my ioy might remaine in you, and that your ioy might be full.","Webster":"These things have I spoken to you, that my joy may remain in you, and [that] your joy may be full.","YLT":"these things I have spoken to you, that my joy in you may remain, and your joy may be full.","NHEB":"I have spoken these things to you, that my joy may be in you, and that your joy may be made full."}}],"l":[{"r":"2 Nephi 2:25","x":"Adam fell that men might be; and men are, that they might have joy."},{"r":"Alma 36:20","x":"And oh, what joy, and what marvelous light I did behold; yea, my soul was filled with joy as exceeding as was my pain!"},{"r":"Mosiah 4:3","x":"And it came to pass that after they had spoken these words the Spirit of the Lord came upon them, and they were filled with joy, having received a remission of their sins, and having peace of conscience, because of the exceeding faith which they had in Jesus Christ who should come, according to the words which king Benjamin had spoken unto them."}]},{"id":"contentment","t":"contentment","g":"Emotions","p":["content","enough","satisfied","stop wanting more"],"k":[],"v":[{"r":"Philippians 4:11-12","x":{"KJV":"Not that I speak in respect of want: for I have learned, in whatsoever state I am, therewith to be content. I know both how to be abased, and I know how to abound: every where and in all things I am instructed both to be full and to be hungry, both to abound and to suffer need.","DRC":"I speak not as it were for want. For I have learned, in whatsoever state I am, to be content therewith. I know both how to be brought low, and I know how to abound (every where and in all things I am instructed): both to be full and to be hungry: both to abound and to suffer need.","CPDV":"I am not saying this as if out of need. For I have learned that, in whatever state I am, it is sufficient. I know how to be humbled, and I know how to abound. I am prepared for anything, anywhere: either to be full or to be hungry, either to have abundance or to endure scarcity.","ASV":"Not that I speak in respect of want: for I have learned, in whatsoever state I am, therein to be content. I know how to be abased, and I know also how to abound: in everything and in all things have I learned the secret both to be filled and to be hungry, both to abound and to be in want.","BSB":"I am not saying this out of need, for I have learned to be content regardless of my circumstances. I know how to live humbly, and I know how to abound. I am accustomed to any and every situation—to being filled and being hungry, to having plenty and having need.","BBE":"But I will not say anything about my needs, for I am able, wherever I am, to be dependent on myself. It is the same to me if I am looked down on or honoured; everywhere and in all things I have the secret of how to be full and how to go without food; how to have wealth and how to be in need.","Darby":"Not that I speak as regards privation, for as to me I have learnt in those circumstances in which I am, to be satisfied in myself. I know both how to be abased and I know how to abound. In everything and in all things I am initiated both to be full and to be hungry, both to abound and to suffer privation.","Geneva1599":"I speake not because of want: for I haue learned in whatsoeuer state I am, therewith to bee content. And I can be abased, and I can abounde: euery where in all things I am instructed, both to be full, and to be hungrie, and to abounde, and to haue want.","Webster":"Not that I speak in respect of want: for I have learned, in whatever state I am, [with that] to be content. I know both how to be abased, and I know how to abound: every where and in all things I am instructed both to be full and to be hungry, both to abound and to suffer need.","YLT":"not that in respect of want I say it, for I did learn in the things in which I am--to be content; I have known both to be abased, and I have known to abound; in everything and in all things I have been initiated, both to be full and to be hungry, both to abound and to be in want.","NHEB":"Not that I speak in respect to lack, for I have learned in whatever state I am, to be content in it. I know how to be humbled, and I know also how to abound. In everything and in all things I have learned the secret both to be filled and to be hungry, both to abound and to be in need."}},{"r":"Hebrews 13:5","x":{"KJV":"Let your conversation be without covetousness; and be content with such things as ye have: for he hath said, I will never leave thee, nor forsake thee.","DRC":"Let your manners be without covetousness, contented with such things as you have. For he hath said: I will not leave thee: neither will I forsake thee.","CPDV":"Let your behavior be without avarice; be content with what you are offered. For he himself has said, “I will not abandon you, and I will not neglect you.”","ASV":"Be ye free from the love of money; content with such things as ye have: for himself hath said, I will in no wise fail thee, neither will I in any wise forsake thee.","BSB":"Keep your lives free from the love of money and be content with what you have, for God has said: “Never will I leave you, never will I forsake you.”","BBE":"Be free from the love of money and pleased with the things which you have; for he himself has said, I will be with you at all times.","Darby":"[Let your] conversation [be] without love of money, satisfied with [your] present circumstances; for he has said, I will not leave thee, neither will I forsake thee.","Geneva1599":"Let your conuersation be without couetousnesse, and be content with those things that ye haue, for he hath said,","Webster":"[Let your] manner of life [be] without covetousness; [and be] content with such things as ye have: for he hath said, I will never leave thee, nor forsake thee.","YLT":"Without covetousness the behaviour, being content with the things present, for He hath said, `No, I will not leave, no, nor forsake thee,'","NHEB":"Be free from the love of money, content with such things as you have, for he has said, \"I will never leave you or forsake you.\""}},{"r":"1 Timothy 6:6","x":{"KJV":"But godliness with contentment is great gain.","DRC":"But godliness with contentment is great gain.","CPDV":"But piety with sufficiency is great gain.","ASV":"But godliness with contentment is great gain:","BSB":"Of course, godliness with contentment is great gain.","BBE":"But true faith, with peace of mind, is of great profit:","Darby":"But piety with contentment is great gain.","Geneva1599":"But godlinesse is great gaine, if a man be content with that he hath.","Webster":"But godliness with contentment is great gain.","YLT":"but it is great gain--the piety with contentment;","NHEB":"But godliness with contentment is great gain."}}],"l":[{"r":"Alma 29:3-4","x":"But behold, I am a man, and do sin in my wish; for I ought to be content with the things which the Lord hath allotted unto me. I ought not to harrow up in my desires the firm decree of a just God, for I know that he granteth unto men according to their desire, whether it be unto death or unto life; yea, I know that he allotteth unto men, yea, decreeth unto them decrees which are unalterable, according to their wills, whether they be unto salvation or unto destruction."},{"r":"D&C 98:1","x":"Verily I say unto you my friends, fear not, let your hearts be comforted; yea, rejoice evermore, and in everything give thanks;"},{"r":"Mosiah 2:41","x":"And moreover, I would desire that ye should consider on the blessed and happy state of those that keep the commandments of God. For behold, they are blessed in all things, both temporal and spiritual; and if they hold out faithful to the end they are received into heaven, that thereby they may dwell with God in a state of never-ending happiness. O remember, remember that these things are true; for the Lord God hath spoken it."}]},{"id":"peace","t":"peace","g":"Emotions","p":["I need peace","calm","still","peace of mind","quiet my heart"],"k":["calm"],"v":[{"r":"John 14:27","x":{"KJV":"Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.","DRC":"Peace I leave with you: my peace I give unto you: not as the world giveth, do I give unto you. Let not your heart be troubled: nor let it be afraid.","CPDV":"Peace I leave for you; my Peace I give to you. Not in the way that the world gives, do I give to you. Do not let your heart be troubled, and let it not fear.","ASV":"Peace I leave with you; my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be fearful.","BSB":"Peace I leave with you; My peace I give to you. I do not give to you as the world gives. Do not let your hearts be troubled; do not be afraid.","BBE":"May peace be with you; my peace I give to you: I give it not as the world gives. Let not your heart be troubled; let it be without fear.","Darby":"I leave peace with you; I give my peace to you: not as the world gives do I give to you. Let not your heart be troubled, neither let it fear.","Geneva1599":"Peace I leaue with you: my peace I giue vnto you: not as the worlde giueth, giue I vnto you. Let not your heart be troubled, nor feare.","Webster":"Peace I leave with you, my peace I give to you: not as the world giveth, give I to you. Let not your heart be troubled, neither let it be afraid.","YLT":"`Peace I leave to you; my peace I give to you, not according as the world doth give do I give to you; let not your heart be troubled, nor let it be afraid;","NHEB":"Peace I leave with you. My peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled, neither let it be afraid."}},{"r":"Philippians 4:7","x":{"KJV":"And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.","DRC":"And the peace of God, which surpasseth all understanding, keep your hearts and minds in Christ Jesus.","CPDV":"And so shall the peace of God, which exceeds all understanding, guard your hearts and minds in Christ Jesus.","ASV":"And the peace of God, which passeth all understanding, shall guard your hearts and your thoughts in Christ Jesus.","BSB":"And the peace of God, which surpasses all understanding, will guard your hearts and your minds in Christ Jesus.","BBE":"And the peace of God, which is deeper than all knowledge, will keep your hearts and minds in Christ Jesus.","Darby":"and the peace ofGod, which surpasses every understanding, shall guard your hearts and your thoughts by Christ Jesus.","Geneva1599":"And the peace of God which passeth all vnderstanding, shall preserue your heartes and mindes in Christ Iesus.","Webster":"And the peace of God, which passeth all understanding, will keep your hearts and minds through Christ Jesus.","YLT":"and the peace of God, that is surpassing all understanding, shall guard your hearts and your thoughts in Christ Jesus.","NHEB":"And the peace of God, which surpasses all understanding, will guard your hearts and your thoughts in Christ Jesus."}},{"r":"Isaiah 26:3","x":{"KJV":"Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.","DRC":"The old error is passed away: thou wilt keep peace: peace, because we have hoped in thee.","CPDV":"The old error has gone away. You will serve peace: peace, for we have hoped in you.","ASV":"Thou wilt keep him in perfect peace, whose mind is stayed on thee; because he trusteth in thee.","BSB":"You will keep in perfect peace the steadfast of mind, because he trusts in You.","BBE":"The man whose heart is unmoved you will keep in peace, because his hope is in you.","Darby":"Thou wilt keep in perfect peace the mind stayed [on thee], for he confideth in thee.","Geneva1599":"By an assured purpose wilt thou preserue perfite peace, because they trusted in thee.","Webster":"Thou wilt keep [him] in perfect peace, [whose] mind [is] stayed [on thee]: because he trusteth in thee.","YLT":"An imagination supported Thou fortifiest peace--peace! For in Thee it is confident.","NHEB":"You will keep whoever's mind is steadfast in perfect peace, because he trusts in you."}}],"l":[{"r":"D&C 19:23","x":"Learn of me, and listen to my words; walk in the meekness of my Spirit, and you shall have peace in me."},{"r":"D&C 59:23","x":"But learn that he who doeth the works of righteousness shall receive his reward, even peace in this world, and eternal life in the world to come."},{"r":"D&C 121:7","x":"My son, peace be unto thy soul; thine adversity and thine afflictions shall be but a small moment;"}]},{"id":"hope","t":"hope","g":"Emotions","p":["I need hope","hopeful","something to hold on to","hope again"],"k":[],"v":[{"r":"Romans 15:13","x":{"KJV":"Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost.","DRC":"Now the God of hope fill you with all joy and peace in believing: that you may abound in hope and in the power of the Holy Ghost.","CPDV":"So may the God of hope fill you with every joy and with peace in believing, so that you may abound in hope and in the virtue of the Holy Spirit.","ASV":"Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, in the power of the Holy Spirit.","BSB":"Now may the God of hope fill you with all joy and peace as you believe in Him, so that you may overflow with hope by the power of the Holy Spirit.","BBE":"Now may the God of hope make you full of joy and peace through faith, so that all hope may be yours in the power of the Holy Spirit.","Darby":"Now theGod of hope fill you with all joy and peace in believing, so that ye should abound in hope by [the] power of [the] Holy Spirit.","Geneva1599":"Nowe the God of hope fill you with all ioye, and peace in beleeuing, that ye may abound in hope, through the power of the holy Ghost.","Webster":"Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Spirit.","YLT":"and the God of the hope shall fill you with all joy and peace in the believing, for your abounding in the hope in power of the Holy Spirit.","NHEB":"Now may the God of hope fill you with all joy and peace in believing, that you may abound in hope, in the power of the Holy Spirit."}},{"r":"Jeremiah 29:11","x":{"KJV":"For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.","DRC":"For I know the thoughts that I think towards you, saith the Lord, thoughts of peace, and not of affliction, to give you an end and patience.","CPDV":"For I know the thoughts that I think over you, says the Lord: thoughts of peace and not of affliction, so that I may give you patience and an end.","ASV":"For I know the thoughts that I think toward you, saith Jehovah, thoughts of peace, and not of evil, to give you hope in your latter end.","BSB":"For I know the plans I have for you, declares the LORD, plans to prosper you and not to harm you, to give you a future and a hope.","BBE":"For I am conscious of my thoughts about you, says the Lord, thoughts of peace and not of evil, to give you hope at the end.","Darby":"For I know the thoughts that I think toward you, saith Jehovah, thoughts of peace, and not of evil, to give you in your latter end a hope.","Geneva1599":"For I knowe the thoughtes, that I haue thought towards you, saith the Lord, euen the thoughtes of peace, and not of trouble, to giue you an ende, and your hope.","Webster":"For I know the thoughts that I think towards you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.","YLT":"For I have known the thoughts that I am thinking towards you--an affirmation of Jehovah; thoughts of peace, and not of evil, to give to you posterity and hope.","NHEB":"For I know the plans that I have for you,' says the Lord, 'plans for your welfare, and not for calamity, to give you hope and a future."}},{"r":"Lamentations 3:21-23","x":{"KJV":"This I recall to my mind, therefore have I hope. It is of the LORD's mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness.","DRC":"Zain. These things I shall think over in my heart, therefore will I hope. Heth. The mercies of the Lord that we are not consumed: because his commiserations have not failed. Heth. They are new every morning, great is thy faithfulness.","CPDV":"ZAIN. These recollections are in my heart; therefore, I shall hope. HETH. By the mercies of the Lord, we are not consumed. For his compassion has not passed away. HETH. I know it at first light; great is your faithfulness.","ASV":"This I recall to my mind; therefore have I hope. It is of Jehovah’s lovingkindnesses that we are not consumed, because his compassions fail not. They are new every morning; great is thy faithfulness.","BSB":"Yet I call this to mind, and therefore I have hope: Because of the loving devotion of the LORD we are not consumed, for His mercies never fail. They are new every morning; great is Your faithfulness!","BBE":"This I keep in mind, and because of this I have hope. It is through the Lord's love that we have not come to destruction, because his mercies have no limit. They are new every morning; great is your good faith.","Darby":"— This I recall to heart, therefore have I hope. It is of Jehovah's loving-kindness we are not consumed, because his compassions fail not; they are new every morning: great is thy faithfulness.","Geneva1599":"I consider this in mine heart: therefore haue I hope. It is the Lordes mercies that wee are not consumed, because his compassions faile not. They are renued euery morning: great is thy faithfulnesse.","Webster":"This I recall to my mind, therefore have I hope. [It is of] the LORD'S mercies that we are not consumed, because his compassions fail not. [They are] new every morning: great [is] thy faithfulness.","YLT":"This I turn to my heart--therefore I hope. The kindnesses of Jehovah! For we have not been consumed, For not ended have His mercies. New every morning, abundant is thy faithfulness.","NHEB":"But this I call to my mind; therefore I have hope: The Lord 's faithful love does not cease; his compassion does not fail. They are new every morning; great is your faithfulness."}}],"l":[{"r":"Ether 12:4","x":"Wherefore, whoso believeth in God might with surety hope for a better world, yea, even a place at the right hand of God, which hope cometh of faith, maketh an anchor to the souls of men, which would make them sure and steadfast, always abounding in good works, being led to glorify God."},{"r":"Moroni 7:41","x":"And what is it that ye shall hope for? Behold I say unto you that ye shall have hope through the atonement of Christ and the power of his resurrection, to be raised unto life eternal, and this because of your faith in him according to the promise."},{"r":"2 Nephi 31:20","x":"Wherefore, ye must press forward with a steadfastness in Christ, having a perfect brightness of hope, and a love of God and of all men. Wherefore, if ye shall press forward, feasting upon the word of Christ, and endure to the end, behold, thus saith the Father: Ye shall have eternal life."}]},{"id":"self-worth","t":"self-worth","g":"Identity and worth","p":["I'm worthless","do I matter","value myself","not good enough"],"k":[],"v":[{"r":"Psalms 139:14","x":{"KJV":"I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well.","DRC":"I will praise thee, for thou art fearfully magnified: wonderful are thy works, and my soul knoweth right well.","CPDV":"I will confess to you, for you have been magnified terribly. Your works are miraculous, as my soul knows exceedingly well.","ASV":"I will give thanks unto thee; for I am fearfully and wonderfully made: Wonderful are thy works; And that my soul knoweth right well.","BSB":"I praise You, for I am fearfully and wonderfully made. Marvelous are Your works, and I know this very well.","BBE":"I will give you praise, for I am strangely and delicately formed; your works are great wonders, and of this my soul is fully conscious.","Darby":"I will praise thee, for I am fearfully, wonderfully made. Marvellous are thy works; and [that] my soul knoweth right well.","Geneva1599":"I will praise thee, for I am fearefully and wonderously made: marueilous are thy workes, and my soule knoweth it well.","Webster":"I will praise thee: for I am fearfully [and] wonderfully made: wonderful [are] thy works; and [that] my soul well knoweth.","YLT":"I confess Thee, because that with wonders I have been distinguished. Wonderful are Thy works, And my soul is knowing it well.","NHEB":"I will give thanks to you, for I am fearfully and wonderfully made. Your works are wonderful. My soul knows that very well."},"a":{"DRC":"Psalms 138:14","CPDV":"Psalms 138:14"}},{"r":"Matthew 10:29-31","x":{"KJV":"Are not two sparrows sold for a farthing? and one of them shall not fall on the ground without your Father. But the very hairs of your head are all numbered. Fear ye not therefore, ye are of more value than many sparrows.","DRC":"Are not two sparrows sold for a farthing? and not one of them shall fall on the ground without your Father. But the very hairs of your head are all numbered. Fear not therefore: better are you than many sparrows.","CPDV":"Are not two sparrows sold for one small coin? And yet not one of them will fall to the ground without your Father. For even the hairs of your head have all been numbered. Therefore, do not be afraid. You are worth more than many sparrows.","ASV":"Are not two sparrows sold for a penny? and not one of them shall fall on the ground without your Father: but the very hairs of your head are all numbered. Fear not therefore: ye are of more value than many sparrows.","BSB":"Are not two sparrows sold for a penny? Yet not one of them will fall to the ground apart from the will of your Father. And even the very hairs of your head are all numbered. So do not be afraid; you are worth more than many sparrows.","BBE":"Are not sparrows two a farthing? and not one of them comes to an end without your Father: But the hairs of your head are all numbered. Then have no fear; you are of more value than a flock of sparrows.","Darby":"Are not two sparrows sold for a farthing? and one of them shall not fall to the ground without your Father; but of you even the hairs of the head are all numbered. Fear not therefore; ye are better than many sparrows.","Geneva1599":"Are not two sparrowes sold for a farthing, and one of them shall not fal on the ground without your Father? Yea, and all the heares of your head are nombred. Feare ye not therefore, yee are of more value then many sparowes.","Webster":"Are not two sparrows sold for a farthing? and not one of them shall fall on the ground without your Father. But the very hairs of your head are all numbered. Fear ye not therefore, ye are of more value than many sparrows.","YLT":"`Are not two sparrows sold for an assar? and one of them shall not fall on the ground without your Father; and of you--even the hairs of the head are all numbered; be not therefore afraid, than many sparrows ye are better.","NHEB":"\"Are not two sparrows sold for an assarion coin? Not one of them falls on the ground apart from your Father's will, but the very hairs of your head are all numbered. Therefore do not be afraid. You are of more value than many sparrows."}},{"r":"Ephesians 2:10","x":{"KJV":"For we are his workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them.","DRC":"For we are his workmanship, created in Christ Jesus in good works, which God hath prepared that we should walk in them.","CPDV":"For we are his handiwork, created in Christ Jesus for the good works which God has prepared and in which we should walk.","ASV":"For we are his workmanship, created in Christ Jesus for good works, which God afore prepared that we should walk in them.","BSB":"For we are God’s workmanship, created in Christ Jesus to do good works, which God prepared in advance as our way of life.","BBE":"For by his act we were given existence in Christ Jesus to do those good works which God before made ready for us so that we might do them.","Darby":"For we are his workmanship, having been created in Christ Jesus for good works, whichGod has before prepared that we should walk in them.","Geneva1599":"For we are his workemanship created in Christ Iesus vnto good workes, which God hath ordeined, that we should walke in them.","Webster":"For we are his workmanship, created in Christ Jesus to good works, which God hath before ordained that we should walk in them.","YLT":"for of Him we are workmanship, created in Christ Jesus to good works, which God did before prepare, that in them we may walk.","NHEB":"For we are his workmanship, created in Christ Jesus for good works, which God prepared before that we would walk in them."}}],"l":[{"r":"D&C 18:10","x":"Remember the worth of souls is great in the sight of God;"},{"r":"Moses 1:39","x":"For behold, this is my work and my glory—to bring to pass the immortality and eternal life of man."},{"r":"Moses 1:6","x":"And I have a work for thee, Moses, my son; and thou art in the similitude of mine Only Begotten; and mine Only Begotten is and shall be the Savior, for he is full of grace and truth; but there is no God beside me, and all things are present with me, for I know them all."}]},{"id":"feeling-unloved","t":"feeling unloved","g":"Identity and worth","p":["nobody loves me","unloved","unwanted","rejected"],"k":[],"v":[{"r":"Jeremiah 31:3","x":{"KJV":"The LORD hath appeared of old unto me, saying, Yea, I have loved thee with an everlasting love: therefore with lovingkindness have I drawn thee.","DRC":"The Lord hath appeared from afar to me. Yea I have loved thee with an everlasting love, therefore have I drawn thee, taking pity on thee.","CPDV":"The Lord appeared to me from a distance: “And I have loved you in perpetual charity. Therefore, showing pity, I have drawn you.","ASV":"Jehovah appeared of old unto me, saying, Yea, I have loved thee with an everlasting love: therefore with lovingkindness have I drawn thee.","BSB":"The LORD appeared to us in the past, saying: “I have loved you with an everlasting love; therefore I have drawn you with loving devotion.","BBE":"From far away he saw the Lord: my love for you is an eternal love: so with mercy I have made you come with me.","Darby":"Jehovah hath appeared from afar unto me, [saying,] Yea, I have loved thee with an everlasting love; therefore with loving-kindness have I drawn thee.","Geneva1599":"The Lord hath appeared vnto me of old, say they: Yea, I haue loued thee with an euerlasting loue, therefore with mercie I haue drawen thee.","Webster":"The LORD appeared of old to me, [saying], I have loved thee with an everlasting love: therefore with loving-kindness have I drawn thee.","YLT":"From afar Jehovah hath appeared to me, With love age-during I have loved thee, Therefore I have drawn thee with kindness.","NHEB":"The Lord appeared of old to me, saying, 'Yes, I have loved you with an everlasting love: therefore with loving kindness have I drawn you."}},{"r":"Romans 8:38-39","x":{"KJV":"For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord.","DRC":"For I am sure that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, nor might, Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God which is in Christ Jesus our Lord.","CPDV":"For I am certain that neither death, nor life, nor Angels, nor Principalities, nor Powers, nor the present things, nor the future things, nor strength, nor the heights, nor the depths, nor any other created thing, will be able to separate us from the love of God, which is in Christ Jesus our Lord.","ASV":"For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor powers, nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord.","BSB":"For I am convinced that neither death nor life, neither angels nor principalities, neither the present nor the future, nor any powers, neither height nor depth, nor anything else in all creation, will be able to separate us from the love of God that is in Christ Jesus our Lord.","BBE":"For I am certain that not death, or life, or angels, or rulers, or things present, or things to come, or powers, Or things on high, or things under the earth, or anything which is made, will be able to come between us and the love of God which is in Christ Jesus our Lord.","Darby":"For I am persuaded that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor powers, nor height, nor depth, nor any other creature, shall be able to separate us from the love ofGod, which [is] in Christ Jesus our Lord.","Geneva1599":"For I am perswaded that neither death, nor life, nor Angels, nor principalities, nor powers, nor things present, nor things to come, Nor height, nor depth, nor any other creature shalbe able to separate vs from the loue of God, which is in Christ Iesus our Lord.","Webster":"For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, Nor hight, nor depth, nor any other creature, will be able to separate us from the love of God which is in Christ Jesus our Lord.","YLT":"for I am persuaded that neither death, nor life, nor messengers, nor principalities, nor powers, nor things present, nor things about to be, nor height, nor depth, nor any other created thing, shall be able to separate us from the love of god, that is in Christ Jesus our Lord.","NHEB":"For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor powers, nor height, nor depth, nor any other created thing, will be able to separate us from the love of God, which is in Christ Jesus our Lord."}},{"r":"1 John 4:19","x":{"KJV":"We love him, because he first loved us.","DRC":"Let us therefore love God: because God first hath loved us.","CPDV":"Therefore, let us love God, for God first loved us.","ASV":"We love, because he first loved us.","BSB":"We love because He first loved us.","BBE":"We have the power of loving, because he first had love for us.","Darby":"We love because he has first loved us.","Geneva1599":"We loue him, because he loued vs first.","Webster":"We love him, because he first loved us.","YLT":"we--we love him, because He--He first loved us;","NHEB":"We love, because he first loved us."}}],"l":[{"r":"1 Nephi 11:22","x":"And I answered him, saying: Yea, it is the love of God, which sheddeth itself abroad in the hearts of the children of men; wherefore, it is the most desirable above all things."},{"r":"Moroni 7:47-48","x":"But charity is the pure love of Christ, and it endureth forever; and whoso is found possessed of it at the last day, it shall be well with him. Wherefore, my beloved brethren, pray unto the Father with all the energy of heart, that ye may be filled with this love, which he hath bestowed upon all who are true followers of his Son, Jesus Christ; that ye may become the sons of God; that when he shall appear we shall be like him, for we shall see him as he is; that we may have this hope; that we may be purified even as he is pure. Amen."},{"r":"D&C 18:10","x":"Remember the worth of souls is great in the sight of God;"}]},{"id":"gods-love-for-me","t":"God's love for me","g":"Identity and worth","p":["does God love me","God's love","loved by God","how much God loves me"],"k":[],"v":[{"r":"John 3:16","x":{"KJV":"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.","DRC":"For God so loved the world, as to give his only begotten Son: that whosoever believeth in him may not perish, but may have life everlasting.","CPDV":"For God so loved the world that he gave his only-begotten Son, so that all who believe in him may not perish, but may have eternal life.","ASV":"For God so loved the world, that he gave his only begotten Son, that whosoever believeth on him should not perish, but have eternal life.","BSB":"For God so loved the world that He gave His one and only Son, that everyone who believes in Him shall not perish but have eternal life.","BBE":"For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.","Darby":"ForGod so loved the world, that he gave his only-begotten Son, that whosoever believes on him may not perish, but have life eternal.","Geneva1599":"For God so loued the worlde, that hee hath giuen his onely begotten Sonne, that whosoeuer beleeueth in him, should not perish, but haue euerlasting life.","Webster":"For God so loved the world, that he gave his only-begotten Son, that whoever believeth in him, should not perish, but have everlasting life.","YLT":"for God did so love the world, that His Son--the only begotten--He gave, that every one who is believing in him may not perish, but may have life age-during.","NHEB":"For God so loved the world, that he gave his one and only Son, that whoever believes in him should not perish, but have eternal life."}},{"r":"Romans 5:8","x":{"KJV":"But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.","DRC":"But God commendeth his charity towards us: because when as yet we were sinners according to the time.","CPDV":"But God demonstrates his love for us in that, while we were yet sinners, at the proper time,","ASV":"But God commendeth his own love toward us, in that, while we were yet sinners, Christ died for us.","BSB":"But God proves His love for us in this: While we were still sinners, Christ died for us.","BBE":"But God has made clear his love to us, in that, when we were still sinners, Christ gave his life for us.","Darby":"butGod commends his love to us, in that, we being still sinners, Christ has died for us.","Geneva1599":"But God setteth out his loue towards vs, seeing that while we were yet sinners, Christ died for vs.","Webster":"But God commendeth his love towards us, in that while we were yet sinners, Christ died for us.","YLT":"and God doth commend His own love to us, that, in our being still sinners, Christ did die for us;","NHEB":"But God commends his own love toward us, in that while we were yet sinners, Christ died for us."}},{"r":"Zephaniah 3:17","x":{"KJV":"The LORD thy God in the midst of thee is mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing.","DRC":"The Lord thy God in the midst of thee is mighty, he will save: he will rejoice over thee with gladness, he will be silent in his love, he will be joyful over thee in praise.","CPDV":"The Lord your God is the strength in your midst; he will save. He will rejoice over you with gladness. In his love, he will be silent. He will exult over you with praise.","ASV":"Jehovah thy God is in the midst of thee, a mighty one who will save; he will rejoice over thee with joy; he will rest in his love; he will joy over thee with singing.","BSB":"The LORD your God is among you; He is mighty to save. He will rejoice over you with gladness; He will quiet you with His love; He will rejoice over you with singing.”","BBE":"The Lord your God is among you, as a strong saviour: he will be glad over you with joy, he will make his love new again, he will make a song of joy over you as in the time of a holy feast.","Darby":"Jehovah thyGod is in thy midst, a mighty one that will save: he will rejoice over thee with joy; he will rest in his love; he will exult over thee with singing.","Geneva1599":"The Lord thy God in the middes of thee is mightie: hee will saue, hee will reioyce ouer thee with ioye: he will quiet himselfe in his loue: he will reioyce ouer thee with ioy.","Webster":"The LORD thy God in the midst of thee [is] mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing.","YLT":"Jehovah thy God is in thy midst, A mighty one doth save, He rejoiceth over thee with joy, He doth work in His love, He joyeth over thee with singing.'","NHEB":"The Lord, your God, is in the midst of you, a mighty one who will save. He will rejoice over you with joy. He will calm you in his love. He will rejoice over you with singing."}}],"l":[{"r":"1 Nephi 11:22","x":"And I answered him, saying: Yea, it is the love of God, which sheddeth itself abroad in the hearts of the children of men; wherefore, it is the most desirable above all things."},{"r":"2 Nephi 26:24","x":"He doeth not anything save it be for the benefit of the world; for he loveth the world, even that he layeth down his own life that he may draw all men unto him. Wherefore, he commandeth none that they shall not partake of his salvation."},{"r":"D&C 34:3","x":"Who so loved the world that he gave his own life, that as many as would believe might become the sons of God. Wherefore you are my son;"}]},{"id":"purpose","t":"purpose","g":"Identity and worth","p":["what's my purpose","why am I here","meaning","my life has no meaning"],"k":[],"v":[{"r":"Jeremiah 29:11","x":{"KJV":"For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.","DRC":"For I know the thoughts that I think towards you, saith the Lord, thoughts of peace, and not of affliction, to give you an end and patience.","CPDV":"For I know the thoughts that I think over you, says the Lord: thoughts of peace and not of affliction, so that I may give you patience and an end.","ASV":"For I know the thoughts that I think toward you, saith Jehovah, thoughts of peace, and not of evil, to give you hope in your latter end.","BSB":"For I know the plans I have for you, declares the LORD, plans to prosper you and not to harm you, to give you a future and a hope.","BBE":"For I am conscious of my thoughts about you, says the Lord, thoughts of peace and not of evil, to give you hope at the end.","Darby":"For I know the thoughts that I think toward you, saith Jehovah, thoughts of peace, and not of evil, to give you in your latter end a hope.","Geneva1599":"For I knowe the thoughtes, that I haue thought towards you, saith the Lord, euen the thoughtes of peace, and not of trouble, to giue you an ende, and your hope.","Webster":"For I know the thoughts that I think towards you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.","YLT":"For I have known the thoughts that I am thinking towards you--an affirmation of Jehovah; thoughts of peace, and not of evil, to give to you posterity and hope.","NHEB":"For I know the plans that I have for you,' says the Lord, 'plans for your welfare, and not for calamity, to give you hope and a future."}},{"r":"Ephesians 2:10","x":{"KJV":"For we are his workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them.","DRC":"For we are his workmanship, created in Christ Jesus in good works, which God hath prepared that we should walk in them.","CPDV":"For we are his handiwork, created in Christ Jesus for the good works which God has prepared and in which we should walk.","ASV":"For we are his workmanship, created in Christ Jesus for good works, which God afore prepared that we should walk in them.","BSB":"For we are God’s workmanship, created in Christ Jesus to do good works, which God prepared in advance as our way of life.","BBE":"For by his act we were given existence in Christ Jesus to do those good works which God before made ready for us so that we might do them.","Darby":"For we are his workmanship, having been created in Christ Jesus for good works, whichGod has before prepared that we should walk in them.","Geneva1599":"For we are his workemanship created in Christ Iesus vnto good workes, which God hath ordeined, that we should walke in them.","Webster":"For we are his workmanship, created in Christ Jesus to good works, which God hath before ordained that we should walk in them.","YLT":"for of Him we are workmanship, created in Christ Jesus to good works, which God did before prepare, that in them we may walk.","NHEB":"For we are his workmanship, created in Christ Jesus for good works, which God prepared before that we would walk in them."}},{"r":"Micah 6:8","x":{"KJV":"He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","DRC":"I will shew thee, O man, what is good, and what the Lord requireth of thee: Verily to do judgment, and to love mercy, and to walk solicitous with thy God.","CPDV":"I will reveal to you, O man, what is good, and what the Lord requires from you, and how to act with judgment, and to love mercy, and to walk carefully with your God.","ASV":"He hath showed thee, O man, what is good; and what doth Jehovah require of thee, but to do justly, and to love kindness, and to walk humbly with thy God?","BSB":"He has shown you, O man, what is good. And what does the LORD require of you but to act justly, to love mercy, and to walk humbly with your God?","BBE":"He has made clear to you, O man, what is good; and what is desired from you by the Lord; only doing what is right, and loving mercy, and walking without pride before your God.","Darby":"He hath shewn thee, O man, what is good: and what doth Jehovah require of thee, but to do justly, and to love goodness, and to walk humbly with thyGod?","Geneva1599":"He hath shewed thee, O man, what is good, and what the Lord requireth of thee: surely to doe iustly, and to loue mercie, and to humble thy selfe, to walke with thy God.","Webster":"He hath shown thee, O man, what [is] good; and what the LORD doth require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","YLT":"He hath declared to thee, O man, what is good; Yea, what is Jehovah requiring of thee, Except--to do judgment, and love kindness, And lowly to walk with thy God?","NHEB":"He has shown you, O man, what is good. What does the Lord require of you, but to act justly, to love mercy, and to walk humbly with your God?"}}],"l":[{"r":"Moses 1:39","x":"For behold, this is my work and my glory—to bring to pass the immortality and eternal life of man."},{"r":"2 Nephi 2:25","x":"Adam fell that men might be; and men are, that they might have joy."},{"r":"Alma 34:32","x":"For behold, this life is the time for men to prepare to meet God; yea, behold the day of this life is the day for men to perform their labors."}]},{"id":"feeling-forgotten","t":"feeling forgotten","g":"Identity and worth","p":["forgotten","invisible","no one sees me","overlooked"],"k":[],"v":[{"r":"Isaiah 49:15-16","x":{"KJV":"Can a woman forget her sucking child, that she should not have compassion on the son of her womb? yea, they may forget, yet will I not forget thee. Behold, I have graven thee upon the palms of my hands; thy walls are continually before me.","DRC":"Can a woman forget her infant, so as not to have pity on the son of her womb? and if she should forget, yet will not I forget thee. Behold, I have graven thee in my hands: thy walls are always before my eyes.","CPDV":"Can a woman forget her infant, so as not to take pity on the child of her womb? But even if she would forget, still I shall never forget you. Behold, I have engraved you on my hands. Your walls are always before my eyes.","ASV":"Can a woman forget her sucking child, that she should not have compassion on the son of her womb? yea, these may forget, yet will not I forget thee. Behold, I have graven thee upon the palms of my hands; thy walls are continually before me.","BSB":"“Can a woman forget her nursing child, or lack compassion for the son of her womb? Even if she could forget, I will not forget you! Behold, I have inscribed you on the palms of My hands; your walls are ever before Me.","BBE":"Will a woman give up the child at her breast, will she be without pity for the fruit of her body? yes, these may, but I will not let you go out of my memory. See, your name is marked on my hands; your walls are ever before me.","Darby":"Can a woman forget her sucking child, that she should not have compassion on the son of her womb? Even these forget, but I will not forget thee. Lo, I have graven thee upon the palms of [my] hands; thy walls are continually before me.","Geneva1599":"Can a woman forget her childe, and not haue compassion on the sonne of her wombe? though they should forget, yet wil I not forget thee. Behold, I haue grauen thee vpon the palme of mine hands: thy walles are euer in my sight.","Webster":"Can a woman forget her sucking child, that she should not have compassion on the son of her womb? yes, they may forget, yet I will not forget thee. Behold, I have graven thee upon the palms of [my] hands; thy walls [are] continually before me.","YLT":"Forget doth a woman her suckling, The loved one--the son of her womb? Yea, these forget--but I--I forget not thee. Lo, on the palms of the hand I have graven thee, Thy walls are before Me continually.","NHEB":"\"Can a woman forget her nursing child, that she should not have compassion on the son of her womb? Yes, these may forget, yet I will not forget you! Behold, I have engraved you on the palms of my hands; your walls are continually before me."}},{"r":"Luke 12:6-7","x":{"KJV":"Are not five sparrows sold for two farthings, and not one of them is forgotten before God? But even the very hairs of your head are all numbered. Fear not therefore: ye are of more value than many sparrows.","DRC":"Are not five sparrows sold for two farthings, and not one of them is forgotten before God? Yea, the very hairs of your head are all numbered. Fear not therefore: you are of more value than many sparrows.","CPDV":"Are not five sparrows sold for two small coins? And yet not one of these is forgotten in the sight of God. But even the very hairs of your head have all been numbered. Therefore, do not be afraid. You are worth more than many sparrows.","ASV":"Are not five sparrows sold for two pence? and not one of them is forgotten in the sight of God. But the very hairs of your head are all numbered. Fear not: ye are of more value than many sparrows.","BSB":"Are not five sparrows sold for two pennies? Yet not one of them is forgotten by God. And even the very hairs of your head are all numbered. So do not be afraid; you are worth more than many sparrows.","BBE":"Are not five sparrows given in exchange for two farthings? and God has every one of them in mind. But even the hairs of your head are numbered. Have no fear: you are of more value than a flock of sparrows.","Darby":"Are not five sparrows sold for two assaria? and one of them is not forgotten beforeGod. But even the hairs of your head are all numbered. Fear not therefore, ye are better than many sparrows.","Geneva1599":"Are not fiue sparowes bought for two farthings, and yet not one of them is forgotten before God? Yea, and all the heares of your head are nombred: feare not therefore: yee are more of value then many sparowes.","Webster":"Are not five sparrows sold for two farthings, and not one of them is forgotten before God? But even the very hairs of your head are all numbered. Fear not therefore: ye are of more value than many sparrows.","YLT":"`Are not five sparrows sold for two assars? and one of them is not forgotten before God, but even the hairs of your head have been all numbered; therefore fear ye not, than many sparrows ye are of more value.","NHEB":"\"Are not five sparrows sold for two assaria coins? Not one of them is forgotten by God. But the very hairs of your head are all numbered. Therefore do not be afraid. You are of more value than many sparrows."}},{"r":"Genesis 16:13","x":{"KJV":"And she called the name of the LORD that spake unto her, Thou God seest me: for she said, Have I also here looked after him that seeth me?","DRC":"And she called the name of the Lord that spoke unto her: Thou the God who hast seen me. For she said: Verily, here have I seen the hinder parts of him that seeth me.","CPDV":"Then she called upon the name of the Lord who had spoken to her: “You are the God who has seen me.” For she said, “Certainly, here I have seen the back of the one who sees me.”","ASV":"And she called the name of Jehovah that spake unto her, Thou art a God that seeth: for she said, Have I even here looked after him that seeth me?","BSB":"So Hagar gave this name to the LORD who had spoken to her: “You are the God who sees me,” for she said, “Here I have seen the One who sees me!”","BBE":"And to the Lord who was talking with her she gave this name, You are a God who is seen; for she said, Have I not even here in the waste land had a vision of God and am still living?","Darby":"And she called the name of Jehovah who spoke to her, Thou art theGod who reveals himself, for she said, Also here have I seen after he has revealed himself.","Geneva1599":"Then she called the name of the Lord, that spake vnto her, Thou God lookest on me: for she said, Haue I not also here looked after him that seeth me?","Webster":"And she called the name of the LORD that spoke to her, Thou God seest me: for she said, Have I also here looked after him that seeth me?","YLT":"And she calleth the name of Jehovah who is speaking unto her, `Thou art, O God, my beholder;' for she said, `Even here have I looked behind my beholder?'","NHEB":"She called the name of the Lord who spoke to her, \"You are a God who sees,\" for she said, \"Have I even stayed alive after seeing him?\""}}],"l":[{"r":"1 Nephi 21:15-16","x":"For can a woman forget her sucking child, that she should not have compassion on the son of her womb? Yea, they may forget, yet will I not forget thee, O house of Israel. Behold, I have graven thee upon the palms of my hands; thy walls are continually before me."},{"r":"D&C 84:88","x":"And whoso receiveth you, there I will be also, for I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up."},{"r":"Alma 37:37","x":"Counsel with the Lord in all thy doings, and he will direct thee for good; yea, when thou liest down at night lie down unto the Lord, that he may watch over you in your sleep; and when thou risest in the morning let thy heart be full of thanks unto God; and if ye do these things, ye shall be lifted up at the last day."}]},{"id":"comparison","t":"comparison","g":"Identity and worth","p":["comparing myself","everyone else is
