 in straits, for Christ: for when I am weak, then I am powerful.","Geneva1599":"And he said vnto me, My grace is sufficient for thee: for my power is made perfect through weakenesse. Very gladly therefore will I reioyce rather in mine infirmities, that the power of Christ may dwell in me. Therefore I take pleasure in infirmities, in reproches, in necessities, in persecutions, in anguish for Christes sake: for when I am weake, then am I strong.","Webster":"And he said to me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me. Therefore I take pleasure in infirmities, in reproaches, in necessities, in persecutions, in distresses for Christ's sake: for when I am weak, then am I strong.","YLT":"and He said to me, `Sufficient for thee is My grace, for My power in infirmity is perfected;' most gladly, therefore, will I rather boast in my infirmities, that the power of the Christ may rest on me: wherefore I am well pleased in infirmities, in damages, in necessities, in persecutions, in distresses--for Christ; for whenever I am infirm, then I am powerful;","NHEB":"He has said to me, \"My grace is sufficient for you, for power is made perfect in weakness.\" Most gladly therefore I will rather glory in my weaknesses, that the power of Christ may rest on me. Therefore I take pleasure in weaknesses, in injuries, in necessities, in persecutions, in distresses, for Christ's sake. For when I am weak, then am I strong."}},{"r":"Isaiah 40:29","x":{"KJV":"He giveth power to the faint; and to them that have no might he increaseth strength.","DRC":"It is he that giveth strength to the weary, and increaseth force and might to them that are not.","CPDV":"It is he who gives strength to the weary, and it is he who increases fortitude and strength in those who are failing.","ASV":"He giveth power to the faint; and to him that hath no might he increaseth strength.","BSB":"He gives power to the faint and increases the strength of the weak.","BBE":"He gives power to the feeble, increasing the strength of him who has no force.","Darby":"He giveth power to the faint; and to him that hath no might he increaseth strength.","Geneva1599":"But he giueth strength vnto him that fainteth, and vnto him that hath no strength, he encreaseth power.","Webster":"He giveth power to the faint; and to [them that have] no might he increaseth strength.","YLT":"He is giving power to the weary, And to those not strong He increaseth might.","NHEB":"He gives power to the weak. He increases the strength of him who has no might."}},{"r":"Philippians 4:13","x":{"KJV":"I can do all things through Christ which strengtheneth me.","DRC":"I can do all things in him who strengtheneth me.","CPDV":"Everything is possible in him who has strengthened me.","ASV":"I can do all things in him that strengtheneth me.","BSB":"I can do all things through Christ who gives me strength.","BBE":"I am able to do all things through him who gives me strength.","Darby":"I have strength for all things in him that gives me power.","Geneva1599":"I am able to do al things through the helpe of Christ, which strengtheneth me.","Webster":"I can do all things through Christ who strengtheneth me.","YLT":"For all things I have strength, in Christ's strengthening me;","NHEB":"I can do all things through him who strengthens me."}}],"l":[{"r":"Ether 12:27","x":"And if men come unto me I will show unto them their weakness. I give unto men weakness that they may be humble; and my grace is sufficient for all men that humble themselves before me; for if they humble themselves before me, and have faith in me, then will I make weak things become strong unto them."},{"r":"Alma 26:12","x":"Yea, I know that I am nothing; as to my strength I am weak; therefore I will not boast of myself, but I will boast of my God, for in his strength I can do all things; yea, behold, many mighty miracles we have wrought in this land, for which we will praise his name forever."},{"r":"Moroni 10:32","x":"Yea, come unto Christ, and be perfected in him, and deny yourselves of all ungodliness; and if ye shall deny yourselves of all ungodliness, and love God with all your might, mind and strength, then is his grace sufficient for you, that by his grace ye may be perfect in Christ; and if by the grace of God ye are perfect in Christ, ye can in nowise deny the power of God."}]},{"id":"guilt","t":"guilt","g":"Sin and repentance","p":["I feel guilty","guilt is eating me","I did something wrong"],"k":[],"v":[{"r":"1 John 1:9","x":{"KJV":"If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.","DRC":"If we confess our sins, he is faithful and just, to forgive us our sins and to cleanse us from all iniquity.","CPDV":"If we confess our sins, then he is faithful and just, so as to forgive us our sins and to cleanse us from all iniquity.","ASV":"If we confess our sins, he is faithful and righteous to forgive us our sins, and to cleanse us from all unrighteousness.","BSB":"If we confess our sins, He is faithful and just to forgive us our sins and to cleanse us from all unrighteousness.","BBE":"If we say openly that we have done wrong, he is upright and true to his word, giving us forgiveness of sins and making us clean from all evil.","Darby":"If we confess our sins, he is faithful and righteous to forgive us [our] sins, and cleanse us from all unrighteousness.","Geneva1599":"If we acknowledge our sinnes, he is faithfull and iust, to forgiue vs our sinnes, and to clense vs from all vnrighteousnes.","Webster":"If we confess our sins, he is faithful and just to forgive us [our] sins, and to cleanse us from all unrighteousness.","YLT":"if we may confess our sins, stedfast He is and righteous that He may forgive us the sins, and may cleanse us from every unrighteousness;","NHEB":"If we confess our sins, he is faithful and righteous to forgive us the sins, and to cleanse us from all unrighteousness."}},{"r":"Psalms 32:5","x":{"KJV":"I acknowledged my sin unto thee, and mine iniquity have I not hid. I said, I will confess my transgressions unto the LORD; and thou forgavest the iniquity of my sin. Selah.","DRC":"I have acknowledged my sin to thee, and my injustice I have not concealed. I said I will confess against my self my injustice to the Lord: and thou hast forgiven the wickedness of my sin.","CPDV":"I have acknowledged my offense to you, and I have not concealed my injustice. I said, “I will confess against myself, my injustice to the Lord,” and you forgave the impiety of my sin.","ASV":"I acknowledged my sin unto thee, And mine iniquity did I not hide: I said, I will confess my transgressions unto Jehovah; And thou forgavest the iniquity of my sin. [Selah","BSB":"Then I acknowledged my sin to You and did not hide my iniquity. I said, “I will confess my transgressions to the LORD,” and You forgave the guilt of my sin. Selah","BBE":"I made my wrongdoing clear to you, and did not keep back my sin. I said, I will put it all before the Lord; and you took away my wrongdoing and my sin. (Selah.)","Darby":"I acknowledged my sin unto thee, and mine iniquity I covered not; I said, I will confess my transgressions unto Jehovah, and thou forgavest the iniquity of my sin. Selah.","Geneva1599":"Then I acknowledged my sinne vnto thee, neither hid I mine iniquitie: for I thought, I will confesse against my selfe my wickednesse vnto the Lord, and thou forgauest the punishment of my sinne. Selah.","Webster":"I acknowledged my sin to thee, and my iniquity have I not hid. I said, I will confess my transgressions to the LORD; and thou forgavest the iniquity of my sin. Selah.","YLT":"My sin I cause Thee to know, And mine iniquity I have not covered. I have said, `I confess concerning My transgressions to Jehovah,' And Thou--Thou hast taken away, The iniquity of my sin. Selah.","NHEB":"I acknowledged my sin to you. I did not hide my iniquity. I said, I will confess my transgressions to the Lord, and you forgave the iniquity of my sin. Selah."},"a":{"DRC":"Psalms 31:5","CPDV":"Psalms 31:5"}},{"r":"Romans 8:1","x":{"KJV":"There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit.","DRC":"There is now therefore no condemnation to them that are in Christ Jesus, who walk not according to the flesh.","CPDV":"Therefore, there is now no condemnation for those who are in Christ Jesus, who are not walking according to the flesh.","ASV":"There is therefore now no condemnation to them that are in Christ Jesus.","BSB":"Therefore, there is now no condemnation for those who are in Christ Jesus.","BBE":"For this cause those who are in Christ Jesus will not be judged as sinners.","Darby":"[There is] then now no condemnation to those in Christ Jesus.","Geneva1599":"Now then there is no condemnation to them that are in Christ Iesus, which walke not after the flesh, but after the Spirit.","Webster":"[There is] therefore now no condemnation to them who are in Christ Jesus, who walk not according to the flesh, but according to the Spirit.","YLT":"There is, then, now no condemnation to those in Christ Jesus, who walk not according to the flesh, but according to the Spirit;","NHEB":"There is therefore now no condemnation to those who are in Christ Jesus."}}],"l":[{"r":"Alma 36:19-20","x":"And now, behold, when I thought this, I could remember my pains no more; yea, I was harrowed up by the memory of my sins no more. And oh, what joy, and what marvelous light I did behold; yea, my soul was filled with joy as exceeding as was my pain!"},{"r":"Enos 1:5-6","x":"And there came a voice unto me, saying: Enos, thy sins are forgiven thee, and thou shalt be blessed. And I, Enos, knew that God could not lie; wherefore, my guilt was swept away."},{"r":"D&C 58:42","x":"Behold, he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more."}]},{"id":"shame","t":"shame","g":"Sin and repentance","p":["ashamed","I feel dirty","embarrassed of what I did","I'm a bad person"],"k":[],"v":[{"r":"Isaiah 54:4","x":{"KJV":"Fear not; for thou shalt not be ashamed: neither be thou confounded; for thou shalt not be put to shame: for thou shalt forget the shame of thy youth, and shalt not remember the reproach of thy widowhood any more.","DRC":"Fear not, for thou shalt not be confounded, nor blush: for thou shalt not be put to shame, because thou shalt forget the shame of thy youth, and shalt remember no more the reproach of thy widowhood.","CPDV":"Do not be afraid! For you will not be confounded, and you will not blush. And you will not be put to shame, because you shall forget the confusion of your youth, and you shall no longer remember the disgrace of your widowhood.","ASV":"Fear not; for thou shalt not be ashamed: neither be thou confounded; for thou shalt not be put to shame: for thou shalt forget the shame of thy youth; and the reproach of thy widowhood shalt thou remember no more.","BSB":"Do not be afraid, for you will not be put to shame; do not be intimidated, for you will not be humiliated. For you will forget the shame of your youth and will remember no more the reproach of your widowhood.","BBE":"Have no fear; for you will not be shamed or without hope: you will not be put to shame, for the shame of your earlier days will go out of your memory, and you will no longer keep in mind the sorrows of your widowed years.","Darby":"Fear not, for thou shalt not be ashamed; neither be thou confounded, for thou shalt not be put to shame: for thou shalt forget the shame of thy youth, and shalt not remember the reproach of thy widowhood any more.","Geneva1599":"Feare not: for thou shalt not be ashamed, neither shalt thou be confounded: for thou shalt not bee put to shame: yea, thou shalt forget the shame of thy youth, and shalt not remember the reproch of thy widdowhoode any more.","Webster":"Fear not; for thou shalt not be ashamed: neither be thou confounded; for thou shalt not be put to shame; for thou shalt forget the shame of thy youth, and shalt not remember the reproach of thy widowhood any more.","YLT":"And desolate cities they cause to be inhabited. Fear not, for thou art not ashamed, Nor blush, for thou art not confounded, For the shame of thy youth thou forgettest, And the reproach of thy widowhood Thou dost not remember any more.","NHEB":"\"Do not be afraid; for you shall not be ashamed: neither be confounded; for you shall not be disappointed: for you shall forget the shame of your youth; and the reproach of your widowhood you shall remember no more."}},{"r":"Romans 10:11","x":{"KJV":"For the scripture saith, Whosoever believeth on him shall not be ashamed.","DRC":"For the scripture saith: Whosoever believeth in him shall not be confounded.","CPDV":"For Scripture says: “All those who believe in him shall not be confounded.”","ASV":"For the scripture saith, Whosoever believeth on him shall not be put to shame.","BSB":"It is just as the Scripture says: “Anyone who believes in Him will never be put to shame.”","BBE":"Because it is said in the holy Writings, Whoever has faith in him will not be shamed.","Darby":"For the scripture says, No one believing on him shall be ashamed.","Geneva1599":"For the Scripture saith, Whosoeuer beleeueth in him, shall not be ashamed.","Webster":"For the scripture saith, whoever believeth on him shall not be ashamed.","YLT":"for the Writing saith, `Every one who is believing on him shall not be ashamed,'","NHEB":"For the Scripture says, \"Whoever believes in him will not be disappointed.\""}},{"r":"Psalms 34:5","x":{"KJV":"They looked unto him, and were lightened: and their faces were not ashamed.","DRC":"Come ye to him and be enlightened: and your faces shall not be confounded.","CPDV":"Approach him and be enlightened, and your faces will not be confounded.","ASV":"They looked unto him, and were radiant; And their faces shall never be confounded.","BSB":"Those who look to Him are radiant with joy; their faces shall never be ashamed.","BBE":"Let your eyes be turned to him and you will have light, and your faces will not be shamed.","Darby":"They looked unto him, and were enlightened, and their faces were not confounded.","Geneva1599":"They shall looke vnto him, and runne to him: and their faces shall not be ashamed, saying,","Webster":"They looked to him, and were lightened: and their faces were not ashamed.","YLT":"They looked expectingly unto Him, And they became bright, And their faces are not ashamed.","NHEB":"They looked to him, and were radiant. Their faces shall never be covered with shame."},"a":{"DRC":"Psalms 33:6","CPDV":"Psalms 33:6"}}],"l":[{"r":"Enos 1:6","x":"And I, Enos, knew that God could not lie; wherefore, my guilt was swept away."},{"r":"2 Nephi 4:28","x":"Awake, my soul! No longer droop in sin. Rejoice, O my heart, and give place no more for the enemy of my soul."},{"r":"Alma 36:20","x":"And oh, what joy, and what marvelous light I did behold; yea, my soul was filled with joy as exceeding as was my pain!"}]},{"id":"repentance","t":"repentance","g":"Sin and repentance","p":["how do I repent","I want to change","turn back to God","make it right"],"k":[],"v":[{"r":"Acts 3:19","x":{"KJV":"Repent ye therefore, and be converted, that your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord;","DRC":"That when the times of refreshment shall come from the presence of the Lord, and he shall send him who hath been preached unto you, Jesus Christ.","CPDV":"Therefore, repent and be converted, so that your sins may be wiped away.","ASV":"Repent ye therefore, and turn again, that your sins may be blotted out, that so there may come seasons of refreshing from the presence of the Lord;","BSB":"Repent, then, and turn back, so that your sins may be wiped away,","BBE":"So then, let your hearts be changed and be turned to God, so that your sins may be completely taken away, and times of blessing may come from the Lord;","Darby":"Repent therefore and be converted, for the blotting out of your sins, so that times of refreshing may come from [the] presence of the Lord,","Geneva1599":"Amend your liues therefore, and turne, that your sinnes may be put away, whe the time of refreshing shall come from the presence of the Lord.","Webster":"Repent ye therefore, and be converted, that your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord,","YLT":"reform ye, therefore, and turn back, for your sins being blotted out, that times of refreshing may come from the presence of the Lord,","NHEB":"\"Repent therefore, and turn again, that your sins may be blotted out, so that there may come times of refreshing from the presence of the Lord,"},"a":{"DRC":"Acts 3:20"}},{"r":"2 Chronicles 7:14","x":{"KJV":"If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land.","DRC":"And my people, upon whom my name is called, being converted, shall make supplication to me, and seek out my face, and do penance for their most wicked ways: then will I hear from heaven, and will forgive their sins and will heal their land.","CPDV":"and if my people, over whom my name has been invoked, being converted, will have petitioned me and sought my face, and will have done penance for their wicked ways, then I will heed them from heaven, and I will forgive their sins, and I will heal their land.","ASV":"if my people, who are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land.","BSB":"and if My people who are called by My name humble themselves and pray and seek My face and turn from their wicked ways, then I will hear from heaven, forgive their sin, and heal their land.","BBE":"If my people, on whom my name is named, make themselves low and come to me in prayer, searching for me and turning from their evil ways; then I will give ear from heaven, overlooking their sin, and will give life again to their land.","Darby":"and my people, who are called by my name, humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from the heavens, and forgive their sin, and heal their land.","Geneva1599":"If my people, among whome my Name is called vpon, doe humble them selues, and praye, and seeke my presence, and turne from their wicked wayes, then will I heare in heauen, and be mercifull to their sinne, and wil heale their land:","Webster":"If my people, who are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land.","YLT":"and My people on whom My name is called be humbled, and pray, and seek My face, and turn back from their evil ways, then I--I hear from the heavens, and forgive their sin, and heal their land.","NHEB":"if my people, who are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land."}},{"r":"Joel 2:13","x":{"KJV":"And rend your heart, and not your garments, and turn unto the LORD your God: for he is gracious and merciful, slow to anger, and of great kindness, and repenteth him of the evil.","DRC":"And rend your hearts, and not your garments and turn to the Lord your God: for he is gracious and merciful, patient and rich in mercy, and ready to repent of the evil.","CPDV":"And rend your hearts, and not your garments, and convert to the Lord your God. For he is gracious and merciful, patient and full of compassion, and steadfast despite ill will.","ASV":"and rend your heart, and not your garments, and turn unto Jehovah your God; for he is gracious and merciful, slow to anger, and abundant in lovingkindness, and repenteth him of the evil.","BSB":"So rend your hearts and not your garments, and return to the LORD your God. For He is gracious and compassionate, slow to anger, abounding in loving devotion. And He relents from sending disaster.","BBE":"Let your hearts be broken, and not your clothing, and come back to the Lord your God: for he is full of grace and pity, slow to be angry and great in mercy, ready to be turned from his purpose of punishment.","Darby":"and rend your heart, and not your garments, and turn unto Jehovah yourGod: for he is gracious and merciful, slow to anger, and of great loving-kindness, and repenteth him of the evil.","Geneva1599":"And rent your heart, and not your clothes: and turne vnto the Lord your God, for he is gratious, and mercifull, slowe to anger, and of great kindnes, and repenteth him of the euill.","Webster":"And rend your heart, and not your garments, and turn to the LORD your God: for he [is] gracious and merciful, slow to anger, and of great kindness, and repenteth of the evil.","YLT":"And rend your heart, and not your garments, And turn back unto Jehovah your God, For gracious and merciful is He, Slow to anger, and abundant in kindness, And He hath repented concerning the evil.","NHEB":"Tear your heart, and not your garments, and turn to the Lord, your God; for he is gracious and merciful, slow to anger, and abundant in loving kindness, and relents from sending calamity."}}],"l":[{"r":"D&C 58:42-43","x":"Behold, he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more. By this ye may know if a man repenteth of his sins—behold, he will confess them and forsake them."},{"r":"Alma 34:31","x":"Yea, I would that ye would come forth and harden not your hearts any longer; for behold, now is the time and the day of your salvation; and therefore, if ye will repent and harden not your hearts, immediately shall the great plan of redemption be brought about unto you."},{"r":"Mosiah 26:30","x":"Yea, and as often as my people repent will I forgive them their trespasses against me."}]},{"id":"gods-forgiveness","t":"God's forgiveness","g":"Sin and repentance","p":["can God forgive me","am I forgiven","too far gone","unforgivable"],"k":[],"v":[{"r":"Isaiah 1:18","x":{"KJV":"Come now, and let us reason together, saith the LORD: though your sins be as scarlet, they shall be as white as snow; though they be red like crimson, they shall be as wool.","DRC":"And then come, and accuse me, saith the Lord: if your sins be as scarlet, they shall be made as white as snow: and if they be red as crimson, they shall be white as wool.","CPDV":"And then approach and accuse me, says the Lord. Then, if your sins are like scarlet, they shall be made white like snow; and if they are red like vermillion, they shall become white like wool.","ASV":"Come now, and let us reason together, saith Jehovah: though your sins be as scarlet, they shall be as white as snow; though they be red like crimson, they shall be as wool.","BSB":"“Come now, let us reason together,” says the LORD. “Though your sins are like scarlet, they will be as white as snow; though they are as red as crimson, they will become like wool.","BBE":"Come now, and let us have an argument together, says the Lord: how may your sins which are red like blood be white as snow? how may their dark purple seem like wool?","Darby":"Come now, let us reason together, saith Jehovah: though your sins be as scarlet, they shall be as white as snow; though they be red like crimson, they shall be as wool.","Geneva1599":"Come nowe, and let vs reason together, sayth the Lord: though your sinnes were as crimsin, they shalbe made white as snowe: though they were red like skarlet, they shalbe as wooll.","Webster":"Come now, and let us reason together, saith the LORD: though your sins are as scarlet, they shall be white as snow, though they are red like crimson, they shall be as wool.","YLT":"Come, I pray you, and we reason, saith Jehovah, If your sins are as scarlet, as snow they shall be white, If they are red as crimson, as wool they shall be!","NHEB":"\"Come now, and let us reason together,\" says the Lord: \"Though your sins be as scarlet, they shall be as white as snow. Though they be red like crimson, they shall be as wool."}},{"r":"Psalms 103:12","x":{"KJV":"As far as the east is from the west, so far hath he removed our transgressions from us.","DRC":"As far as the east is from the west, so far hath he removed our iniquities from us.","CPDV":"As far as the east is from the west, so far has he removed our iniquities from us.","ASV":"As far as the east is from the west, So far hath he removed our transgressions from us.","BSB":"As far as the east is from the west, so far has He removed our transgressions from us.","BBE":"As far as the east is from the west, so far has he put our sins from us.","Darby":"As far as the east is from the west, so far hath he removed our transgressions from us.","Geneva1599":"As farre as the East is from the West: so farre hath he remooued our sinnes from vs.","Webster":"As far as the east is from the west, [so] far hath he removed our transgressions from us.","YLT":"As the distance of east from west He hath put far from us our transgressions.","NHEB":"As far as the east is from the west, so far has he removed our transgressions from us."},"a":{"DRC":"Psalms 102:12","CPDV":"Psalms 102:12"}},{"r":"1 John 1:9","x":{"KJV":"If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.","DRC":"If we confess our sins, he is faithful and just, to forgive us our sins and to cleanse us from all iniquity.","CPDV":"If we confess our sins, then he is faithful and just, so as to forgive us our sins and to cleanse us from all iniquity.","ASV":"If we confess our sins, he is faithful and righteous to forgive us our sins, and to cleanse us from all unrighteousness.","BSB":"If we confess our sins, He is faithful and just to forgive us our sins and to cleanse us from all unrighteousness.","BBE":"If we say openly that we have done wrong, he is upright and true to his word, giving us forgiveness of sins and making us clean from all evil.","Darby":"If we confess our sins, he is faithful and righteous to forgive us [our] sins, and cleanse us from all unrighteousness.","Geneva1599":"If we acknowledge our sinnes, he is faithfull and iust, to forgiue vs our sinnes, and to clense vs from all vnrighteousnes.","Webster":"If we confess our sins, he is faithful and just to forgive us [our] sins, and to cleanse us from all unrighteousness.","YLT":"if we may confess our sins, stedfast He is and righteous that He may forgive us the sins, and may cleanse us from every unrighteousness;","NHEB":"If we confess our sins, he is faithful and righteous to forgive us the sins, and to cleanse us from all unrighteousness."}}],"l":[{"r":"D&C 58:42","x":"Behold, he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more."},{"r":"Mosiah 26:30","x":"Yea, and as often as my people repent will I forgive them their trespasses against me."},{"r":"Enos 1:5-6","x":"And there came a voice unto me, saying: Enos, thy sins are forgiven thee, and thou shalt be blessed. And I, Enos, knew that God could not lie; wherefore, my guilt was swept away."}]},{"id":"temptation","t":"temptation","g":"Sin and repentance","p":["I'm tempted","resist temptation","I keep wanting to","struggling not to"],"k":["tempted"],"v":[{"r":"1 Corinthians 10:13","x":{"KJV":"There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it.","DRC":"Let no temptation take hold on you, but such as is human. And God is faithful, who will not suffer you to be tempted above that which you are able: but will make also with temptation issue, that you may be able to bear it.","CPDV":"Temptation should not take hold of you, except what is human. For God is faithful, and he will not permit you to be tempted beyond your ability. Instead, he will effect his Providence, even during temptation, so that you may be able to bear it.","ASV":"There hath no temptation taken you but such as man can bear: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation make also the way of escape, that ye may be able to endure it.","BSB":"No temptation has seized you except what is common to man. And God is faithful; He will not let you be tempted beyond what you can bear. But when you are tempted, He will also provide an escape, so that you can stand up under it.","BBE":"You have been put to no test but such as is common to man: and God is true, who will not let any test come on you which you are not able to undergo; but he will make with the test a way out of it, so that you may be able to go through it.","Darby":"No temptation has taken you but such as is according to man's nature; andGod is faithful, who will not suffer you to be tempted above what ye are able [to bear], but will with the temptation make the issue also, so that [ye] should be able to bear [it].","Geneva1599":"There hath no tentation taken you, but such as appertaine to man: and God is faithfull, which will not suffer you to be tempted aboue that you be able, but wil euen giue the issue with the tentation, that ye may be able to beare it.","Webster":"There hath no temptation taken you but such as is common to man: but God [is] faithful, who will not suffer you to be tempted above what ye are able; but will with the temptation also make a way to escape, that ye may be able to bear [it].","YLT":"No temptation hath taken you--except human; and God is faithful, who will not suffer you to be tempted above what ye are able, but He will make, with the temptation, also the outlet, for your being able to bear it.","NHEB":"No temptation has taken you except what is common to man. God is faithful, who will not allow you to be tempted above what you are able, but will with the temptation also make the way of escape, that you may be able to endure it."}},{"r":"James 4:7","x":{"KJV":"Submit yourselves therefore to God. Resist the devil, and he will flee from you.","DRC":"Be subject therefore to God. But resist the devil: and he will fly from you.","CPDV":"Therefore, be subject to God. But resist the devil, and he will flee from you.","ASV":"Be subject therefore unto God; but resist the devil, and he will flee from you.","BSB":"Submit yourselves, then, to God. Resist the devil, and he will flee from you.","BBE":"For this cause be ruled by God; but make war on the Evil One and he will be put to flight before you.","Darby":"Subject yourselves therefore toGod. Resist the devil, and he will flee from you.","Geneva1599":"Submit your selues to God: resist the deuill, and he will flee from you.","Webster":"Submit yourselves therefore to God. Resist the devil, and he will flee from you.","YLT":"be subject, then, to God; stand up against the devil, and he will flee from you;","NHEB":"Be subject therefore to God. But resist the devil, and he will flee from you."}},{"r":"Matthew 26:41","x":{"KJV":"Watch and pray, that ye enter not into temptation: the spirit indeed is willing, but the flesh is weak.","DRC":"Watch ye: and pray that ye enter not into temptation. The spirit indeed is willing, but the flesh is weak.","CPDV":"Be vigilant and pray, so that you may not enter into temptation. Indeed, the spirit is willing, but the flesh is weak.”","ASV":"Watch and pray, that ye enter not into temptation: the spirit indeed is willing, but the flesh is weak.","BSB":"“Watch and pray so that you will not enter into temptation. For the spirit is willing, but the body is weak.”","BBE":"Keep watch with prayer, so that you may not be put to the test: the spirit truly is ready, but the flesh is feeble.","Darby":"Watch and pray, that ye enter not into temptation: the spirit indeed [is] ready, but the flesh weak.","Geneva1599":"Watch, and praie, that yee enter not into tentation: the spirit in deede is readie, but the flesh is weake.","Webster":"Watch and pray, that ye enter not into temptation: the spirit indeed [is] willing, but the flesh [is] weak.","YLT":"watch, and pray, that ye may not enter into temptation: the spirit indeed is forward, but the flesh weak.'","NHEB":"Watch and pray, that you do not enter into temptation. The spirit indeed is willing, but the flesh is weak.\""}}],"l":[{"r":"Alma 13:28","x":"But that ye would humble yourselves before the Lord, and call on his holy name, and watch and pray continually, that ye may not be tempted above that which ye can bear, and thus be led by the Holy Spirit, becoming humble, meek, submissive, patient, full of love and all long-suffering;"},{"r":"3 Nephi 18:18","x":"Behold, verily, verily, I say unto you, ye must watch and pray always lest ye enter into temptation; for Satan desireth to have you, that he may sift you as wheat."},{"r":"Helaman 5:12","x":"And now, my sons, remember, remember that it is upon the rock of our Redeemer, who is Christ, the Son of God, that ye must build your foundation; that when the devil shall send forth his mighty winds, yea, his shafts in the whirlwind, yea, when all his hail and his mighty storm shall beat upon you, it shall have no power over you to drag you down to the gulf of misery and endless wo, because of the rock upon which ye are built, which is a sure foundation, a foundation whereon if men build they cannot fall."}]},{"id":"addiction","t":"addiction","g":"Sin and repentance","p":["addicted","can't stop drinking","pornography","drugs","relapse"],"k":["addicted","drinking"],"v":[{"r":"1 Corinthians 10:13","x":{"KJV":"There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it.","DRC":"Let no temptation take hold on you, but such as is human. And God is faithful, who will not suffer you to be tempted above that which you are able: but will make also with temptation issue, that you may be able to bear it.","CPDV":"Temptation should not take hold of you, except what is human. For God is faithful, and he will not permit you to be tempted beyond your ability. Instead, he will effect his Providence, even during temptation, so that you may be able to bear it.","ASV":"There hath no temptation taken you but such as man can bear: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation make also the way of escape, that ye may be able to endure it.","BSB":"No temptation has seized you except what is common to man. And God is faithful; He will not let you be tempted beyond what you can bear. But when you are tempted, He will also provide an escape, so that you can stand up under it.","BBE":"You have been put to no test but such as is common to man: and God is true, who will not let any test come on you which you are not able to undergo; but he will make with the test a way out of it, so that you may be able to go through it.","Darby":"No temptation has taken you but such as is according to man's nature; andGod is faithful, who will not suffer you to be tempted above what ye are able [to bear], but will with the temptation make the issue also, so that [ye] should be able to bear [it].","Geneva1599":"There hath no tentation taken you, but such as appertaine to man: and God is faithfull, which will not suffer you to be tempted aboue that you be able, but wil euen giue the issue with the tentation, that ye may be able to beare it.","Webster":"There hath no temptation taken you but such as is common to man: but God [is] faithful, who will not suffer you to be tempted above what ye are able; but will with the temptation also make a way to escape, that ye may be able to bear [it].","YLT":"No temptation hath taken you--except human; and God is faithful, who will not suffer you to be tempted above what ye are able, but He will make, with the temptation, also the outlet, for your being able to bear it.","NHEB":"No temptation has taken you except what is common to man. God is faithful, who will not allow you to be tempted above what you are able, but will with the temptation also make the way of escape, that you may be able to endure it."}},{"r":"John 8:36","x":{"KJV":"If the Son therefore shall make you free, ye shall be free indeed.","DRC":"If therefore the son shall make you free, you shall be free indeed.","CPDV":"Therefore, if the Son has set you free, then you will truly be free.","ASV":"If therefore the Son shall make you free, ye shall be free indeed.","BSB":"So if the Son sets you free, you will be free indeed.","BBE":"If then the son makes you free, you will be truly free.","Darby":"If therefore the Son shall set you free, ye shall be really free.","Geneva1599":"If that Sonne therefore shall make you free, ye shalbe free in deede.","Webster":"If the Son therefore shall make you free, ye shall be free indeed.","YLT":"if then the son may make you free, in reality ye shall be free.","NHEB":"If therefore the Son makes you free, you will be free indeed."}},{"r":"Romans 6:14","x":{"KJV":"For sin shall not have dominion over you: for ye are not under the law, but under grace.","DRC":"For sin shall not have dominion over you: for you are not under the law, but under grace.","CPDV":"For sin should not have dominion over you. For you are not under the law, but under grace.","ASV":"For sin shall not have dominion over you: for ye are not under law, but under grace.","BSB":"For sin shall not be your master, because you are not under law, but under grace.","BBE":"For sin may not have rule over you: because you are not under law, but under grace.","Darby":"For sin shall not have dominion over you, for ye are not under law but under grace.","Geneva1599":"For sinne shall not haue dominion ouer you: for ye are not vnder ye Lawe, but vnder grace.","Webster":"For sin shall not have dominion over you: for ye are not under the law, but under grace.","YLT":"for sin over you shall not have lordship, for ye are not under law, but under grace.","NHEB":"For sin will not have dominion over you. For you are not under law, but under grace."}}],"l":[{"r":"Helaman 5:12","x":"And now, my sons, remember, remember that it is upon the rock of our Redeemer, who is Christ, the Son of God, that ye must build your foundation; that when the devil shall send forth his mighty winds, yea, his shafts in the whirlwind, yea, when all his hail and his mighty storm shall beat upon you, it shall have no power over you to drag you down to the gulf of misery and endless wo, because of the rock upon which ye are built, which is a sure foundation, a foundation whereon if men build they cannot fall."},{"r":"Alma 13:28","x":"But that ye would humble yourselves before the Lord, and call on his holy name, and watch and pray continually, that ye may not be tempted above that which ye can bear, and thus be led by the Holy Spirit, becoming humble, meek, submissive, patient, full of love and all long-suffering;"},{"r":"Ether 12:27","x":"And if men come unto me I will show unto them their weakness. I give unto men weakness that they may be humble; and my grace is sufficient for all men that humble themselves before me; for if they humble themselves before me, and have faith in me, then will I make weak things become strong unto them."}]},{"id":"starting-over","t":"starting over","g":"Sin and repentance","p":["fresh start","start again","second chance","begin again"],"k":[],"v":[{"r":"Lamentations 3:22-23","x":{"KJV":"It is of the LORD's mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness.","DRC":"Heth. The mercies of the Lord that we are not consumed: because his commiserations have not failed. Heth. They are new every morning, great is thy faithfulness.","CPDV":"HETH. By the mercies of the Lord, we are not consumed. For his compassion has not passed away. HETH. I know it at first light; great is your faithfulness.","ASV":"It is of Jehovah’s lovingkindnesses that we are not consumed, because his compassions fail not. They are new every morning; great is thy faithfulness.","BSB":"Because of the loving devotion of the LORD we are not consumed, for His mercies never fail. They are new every morning; great is Your faithfulness!","BBE":"It is through the Lord's love that we have not come to destruction, because his mercies have no limit. They are new every morning; great is your good faith.","Darby":"It is of Jehovah's loving-kindness we are not consumed, because his compassions fail not; they are new every morning: great is thy faithfulness.","Geneva1599":"It is the Lordes mercies that wee are not consumed, because his compassions faile not. They are renued euery morning: great is thy faithfulnesse.","Webster":"[It is of] the LORD'S mercies that we are not consumed, because his compassions fail not. [They are] new every morning: great [is] thy faithfulness.","YLT":"The kindnesses of Jehovah! For we have not been consumed, For not ended have His mercies. New every morning, abundant is thy faithfulness.","NHEB":"The Lord 's faithful love does not cease; his compassion does not fail. They are new every morning; great is your faithfulness."}},{"r":"2 Corinthians 5:17","x":{"KJV":"Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.","DRC":"If then any be in Christ a new creature, the old things are passed away. Behold all things are made new.","CPDV":"So if anyone is a new creature in Christ, what is old has passed away. Behold, all things have been made new.","ASV":"Wherefore if any man is in Christ, he is a new creature: the old things are passed away; behold, they are become new.","BSB":"Therefore if anyone is in Christ, he is a new creation. The old has passed away. Behold, the new has come!","BBE":"So if any man is in Christ, he is in a new world: the old things have come to an end; they have truly become new.","Darby":"So if any one [be] in Christ, [there is] a new creation; the old things have passed away; behold all things have become new:","Geneva1599":"Therefore if any man be in Christ, let him be a newe creature. Olde things are passed away: beholde, all things are become newe.","Webster":"Therefore, if any man [is] in Christ, [he is] a new creature: old things have passed away; behold, all things have become new.","YLT":"so that if any one is in Christ-- he is a new creature; the old things did pass away, lo, become new have the all things.","NHEB":"Therefore if anyone is in Christ, he is a new creation. The old things have passed away. Behold, new things have come."}},{"r":"Isaiah 43:18-19","x":{"KJV":"Remember ye not the former things, neither consider the things of old. Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert.","DRC":"Remember not former things, and look not on things of old. Behold I do new things, and now they shall spring forth, verily you shall know them: I will make a way in the wilderness, and rivers in the desert.","CPDV":"You need not call to mind the past, nor consider the things of antiquity. Behold, I am accomplishing new things. And presently, they will spring forth. With certainty, you will know them. I will make a way in the desert, and rivers in an impassible place.","ASV":"Remember ye not the former things, neither consider the things of old. Behold, I will do a new thing; now shall it spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert.","BSB":"“Do not call to mind the former things; pay no attention to the things of old. Behold, I am about to do something new; even now it is coming. Do you not see it? Indeed, I will make a way in the wilderness and streams in the desert.","BBE":"Give no thought to the things which are past; let the early times go out of your minds. See, I am doing a new thing; now it is starting; will you not take note of it? I will even make a way in the waste land, and rivers in the dry country.","Darby":"— Remember not the former things, neither consider the ancient things: behold, I do a new thing; now it shall spring forth: shall ye not know it? I will even make a way in the wilderness, rivers in the waste.","Geneva1599":"Remember yee not the former things, neither regard the things of olde. Behold, I do a new thing: now shall it come foorth: shall you not knowe it? I wil euen make a way in the desert, and floods in the wildernesse.","Webster":"Remember ye not the former things, neither consider the things of old. Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, [and] rivers in the desert.","YLT":"Remember not former things, And ancient things consider not. Lo, I am doing a new thing, now it springeth up, Do ye not know it? Yea, I put in a wilderness a way, In a desolate place--floods.","NHEB":"\"Do not remember the former things, and do not consider the things of old. Behold, I will do a new thing. It springs forth now. Do you not know it? I will even make a way in the wilderness, and rivers in the desert."}}],"l":[{"r":"Alma 34:31","x":"Yea, I would that ye would come forth and harden not your hearts any longer; for behold, now is the time and the day of your salvation; and therefore, if ye will repent and harden not your hearts, immediately shall the great plan of redemption be brought about unto you."},{"r":"Mosiah 5:2","x":"And they all cried with one voice, saying: Yea, we believe all the words which thou hast spoken unto us; and also, we know of their surety and truth, because of the Spirit of the Lord Omnipotent, which has wrought a mighty change in us, or in our hearts, that we have no more disposition to do evil, but to do good continually."},{"r":"D&C 58:42","x":"Behold, he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more."}]},{"id":"regret","t":"regret","g":"Sin and repentance","p":["I regret","I wish I hadn't","if only","mistakes I made"],"k":[],"v":[{"r":"Philippians 3:13-14","x":{"KJV":"Brethren, I count not myself to have apprehended: but this one thing I do, forgetting those things which are behind, and reaching forth unto those things which are before, I press toward the mark for the prize of the high calling of God in Christ Jesus.","DRC":"Brethren, I do not count myself to have apprehended. But one thing I do: Forgetting the things that are behind and stretching forth myself to those that are before, I press towards the mark, to the prize of the supernal vocation of God in Christ Jesus.","CPDV":"Brothers, I do not consider that I have already attained this. Instead, I do one thing: forgetting those things that are behind, and extending myself toward those things that are ahead, I pursue the destination, the prize of the heavenly calling of God in Christ Jesus.","ASV":"Brethren, I count not myself yet to have laid hold: but one thing I do, forgetting the things which are behind, and stretching forward to the things which are before, I press on toward the goal unto the prize of the high calling of God in Christ Jesus.","BSB":"Brothers, I do not consider myself yet to have taken hold of it. But one thing I do: Forgetting what is behind and straining toward what is ahead, I press on toward the goal to win the prize of God’s heavenly calling in Christ Jesus.","BBE":"Brothers, it is clear to me that I have not come to that knowledge; but one thing I do, letting go those things which are past, and stretching out to the things which are before, I go forward to the mark, even the reward of the high purpose of God in Christ Jesus.","Darby":"Brethren, I do not count to have got possession myself; but one thing — forgetting the things behind, and stretching out to the things before, I pursue, [looking] towards [the] goal, for the prize of the calling on high ofGod in Christ Jesus.","Geneva1599":"Brethren, I count not my selfe, that I haue attained to it, but one thing I doe: I forget that which is behinde, and endeuour my selfe vnto that which is before, And follow hard toward the marke, for the prise of the hie calling of God in Christ Iesus.","Webster":"Brethren, I count not myself to have apprehended: but [this] one thing [I do], forgetting those things which are behind, and reaching forward to those things which are before, I press towards the mark for the prize of the high calling of God in Christ Jesus.","YLT":"brethren, I do not reckon myself to have laid hold; and one thing--the things behind indeed forgetting, and to the things before stretching forth-- to the mark I pursue for the prize of the high calling of God in Christ Jesus.","NHEB":"Brothers, I do not regard myself as yet having taken hold, but one thing I do. Forgetting the things which are behind, and reaching forward to the things which are ahead, I press on toward the goal for the prize of the high calling of God in Christ Jesus."}},{"r":"Isaiah 43:25","x":{"KJV":"I, even I, am he that blotteth out thy transgressions for mine own sake, and will not remember thy sins.","DRC":"I am, I am he that blot out thy iniquities for my own sake, and I will not remember thy sins.","CPDV":"I am. I am the very One who wipes away your iniquities for my own sake. And I will not remember your sins.","ASV":"I, even I, am he that blotteth out thy transgressions for mine own sake; and I will not remember thy sins.","BSB":"I, yes I, am He who blots out your transgressions for My own sake and remembers your sins no more.","BBE":"I, even I, am he who takes away your sins; and I will no longer keep your evil doings in mind.","Darby":"— I, I [am] He that blotteth out thy transgressions for mine own sake, and I will not remember thy sins.","Geneva1599":"I, euen I am he that putteth away thine iniquities for mine owne sake, and will not remember thy sinnes.","Webster":"I, [even] I, [am] he that blotteth out thy transgressions for my own sake, and will not remember thy sins.","YLT":"I--I am He who is blotting out Thy transgressions for Mine own sake, And thy sins I do not remember.","NHEB":"I, even I, am he who blots out your transgressions for my own sake; and I will not remember your sins."}},{"r":"Joel 2:25","x":{"KJV":"And I will restore to you the years that the locust hath eaten, the cankerworm, and the caterpiller, and the palmerworm, my great army which I sent among you.","DRC":"And I will restore to you the years which the locust, and the bruchus, and the mildew, and the palmerworm hath eaten; my great host which I sent upon you.","CPDV":"And I will repay you for the years which the locust, and the beetle, and the mildew, and the caterpillar consumed: my great strength which I sent upon you.","ASV":"And I will restore to you the years that the locust hath eaten, the canker-worm, and the caterpillar, and the palmer-worm, my great army which I sent among you.","BSB":"I will repay you for the years eaten by locusts— the swarming locust, the young locust, the destroying locust, and the devouring locust— My great army that I sent against you.","BBE":"I will give back to you the years which were food for the locust, the plant-worm, the field-fly, and the worm, my great army which I sent among you.","Darby":"And I will restore to you the years that the locust hath eaten, the cankerworm, and the caterpillar, and the palmer-worm, my great army which I sent among you.","Geneva1599":"And I will render you the yeeres that the grashopper hath eaten, the canker worme and the caterpiller and the palmer worme, my great hoste which I sent among you.","Webster":"And I will restore to you the years that the locust hath eaten, the canker-worm, and the caterpillar, and the palmer-worm, my great army which I sent among you.","YLT":"And I have recompensed to you the years That consume did the locust, the cankerworm, And the caterpillar, and the palmer-worm, My great force that I did send against you.","NHEB":"I will restore to you the years that the swarming locust has eaten, the great locust, the grasshopper, and the caterpillar, my great army, which I sent among you."}}],"l":[{"r":"Alma 36:19-20","x":"And now, behold, when I thought this, I could remember my pains no more; yea, I was harrowed up by the memory of my sins no more. And oh, what joy, and what marvelous light I did behold; yea, my soul was filled with joy as exceeding as was my pain!"},{"r":"D&C 58:42","x":"Behold, he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more."},{"r":"Alma 42:29","x":"And now, my son, I desire that ye should let these things trouble you no more, and only let your sins trouble you, with that trouble which shall bring you down unto repentance."}]},{"id":"pride","t":"pride","g":"Sin and repentance","p":["I'm too proud","arrogant","my ego","I think I'm better"],"k":[],"v":[{"r":"Proverbs 16:18","x":{"KJV":"Pride goeth before destruction, and an haughty spirit before a fall.","DRC":"Pride goeth before destruction: and the spirit is lifted up before a fall.","CPDV":"Arrogance precedes destruction. And the spirit is exalted before a fall.","ASV":"Pride goeth before destruction, And a haughty spirit before a fall.","BSB":"Pride goes before destruction, and a haughty spirit before a fall.","BBE":"Pride goes before destruction, and a stiff spirit before a fall.","Darby":"Pride [goeth] before destruction, and a haughty spirit before a fall.","Geneva1599":"Pride goeth before destruction, and an high minde before the fall.","Webster":"Pride [goeth] before destruction, and a haughty spirit before a fall.","YLT":"Before destruction is pride, And before stumbling--a haughty spirit.'","NHEB":"Pride goes before destruction, and a haughty spirit before a fall."}},{"r":"James 4:6","x":{"KJV":"But he giveth more grace. Wherefore he saith, God resisteth the proud, but giveth grace unto the humble.","DRC":"But he giveth greater grace. Wherefore he saith: God resisteth the proud and giveth grace to the humble.","CPDV":"But he gives a greater grace. Therefore he says: “God resists the arrogant, but he gives grace to the humble.”","ASV":"But he giveth more grace. Wherefore the scripture saith, God resisteth the proud, but giveth grace to the humble.","BSB":"But He gives us more grace. This is why it says: “God opposes the proud, but gives grace to the humble.”","BBE":"But he gives more grace. So that the Writings say, God is against the men of pride, but he gives grace to those who make themselves low before him.","Darby":"But he gives more grace. Wherefore he says,God sets himself against [the] proud, but gives grace to [the] lowly.","Geneva1599":"But the Scripture offereth more grace, and therefore sayth, God resisteth the proude, and giueth grace to the humble.","Webster":"But he giveth more grace. Wherefore he saith, God resisteth the proud, but giveth grace to the humble.","YLT":"and greater grace he doth give, wherefore he saith, `God against proud ones doth set Himself up, and to lowly ones He doth give grace?'","NHEB":"But He gives more grace. Therefore it says, \"God resists the proud, but gives grace to the humble.\""}},{"r":"Micah 6:8","x":{"KJV":"He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","DRC":"I will shew thee, O man, what is good, and what the Lord requireth of thee: Verily to do judgment, and to love mercy, and to walk solicitous with thy God.","CPDV":"I will reveal to you, O man, what is good, and what the Lord requires from you, and how to act with judgment, and to love mercy, and to walk carefully with your God.","ASV":"He hath showed thee, O man, what is good; and what doth Jehovah require of thee, but to do justly, and to love kindness, and to walk humbly with thy God?","BSB":"He has shown you, O man, what is good. And what does the LORD require of you but to act justly, to love mercy, and to walk humbly with your God?","BBE":"He has made clear to you, O man, what is good; and what is desired from you by the Lord; only doing what is right, and loving mercy, and walking without pride before your God.","Darby":"He hath shewn thee, O man, what is good: and what doth Jehovah require of thee, but to do justly, and to love goodness, and to walk humbly with thyGod?","Geneva1599":"He hath shewed thee, O man, what is good, and what the Lord requireth of thee: surely to doe iustly, and to loue mercie, and to humble thy selfe, to walke with thy God.","Webster":"He hath shown thee, O man, what [is] good; and what the LORD doth require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","YLT":"He hath declared to thee, O man, what is good; Yea, what is Jehovah requiring of thee, Except--to do judgment, and love kindness, And lowly to walk with thy God?","NHEB":"He has shown you, O man, what is good. What does the Lord require of you, but to act justly, to love mercy, and to walk humbly with your God?"}}],"l":[{"r":"Alma 5:28","x":"Behold, are ye stripped of pride? I say unto you, if ye are not ye are not prepared to meet God. Behold ye must prepare quickly; for the kingdom of heaven is soon at hand, and such an one hath not eternal life."},{"r":"Helaman 12:4-5","x":"O how foolish, and how vain, and how evil, and devilish, and how quick to do iniquity, and how slow to do good, are the children of men; yea, how quick to hearken unto the words of the evil one, and to set their hearts upon the vain things of the world! Yea, how quick to be lifted up in pride; yea, how quick to boast, and do all manner of that which is iniquity; and how slow are they to remember the Lord their God, and to give ear unto his counsels, yea, how slow to walk in wisdom's paths!"},{"r":"Alma 38:11","x":"See that ye are not lifted up unto pride; yea, see that ye do not boast in your own wisdom, nor of your much strength."}]},{"id":"humility","t":"humility","g":"Sin and repentance","p":["be humble","humble myself","meekness","lowly"],"k":[],"v":[{"r":"Micah 6:8","x":{"KJV":"He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","DRC":"I will shew thee, O man, what is good, and what the Lord requireth of thee: Verily to do judgment, and to love mercy, and to walk solicitous with thy God.","CPDV":"I will reveal to you, O man, what is good, and what the Lord requires from you, and how to act with judgment, and to love mercy, and to walk carefully with your God.","ASV":"He hath showed thee, O man, what is good; and what doth Jehovah require of thee, but to do justly, and to love kindness, and to walk humbly with thy God?","BSB":"He has shown you, O man, what is good. And what does the LORD require of you but to act justly, to love mercy, and to walk humbly with your God?","BBE":"He has made clear to you, O man, what is good; and what is desired from you by the Lord; only doing what is right, and loving mercy, and walking without pride before your God.","Darby":"He hath shewn thee, O man, what is good: and what doth Jehovah require of thee, but to do justly, and to love goodness, and to walk humbly with thyGod?","Geneva1599":"He hath shewed thee, O man, what is good, and what the Lord requireth of thee: surely to doe iustly, and to loue mercie, and to humble thy selfe, to walke with thy God.","Webster":"He hath shown thee, O man, what [is] good; and what the LORD doth require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","YLT":"He hath declared to thee, O man, what is good; Yea, what is Jehovah requiring of thee, Except--to do judgment, and love kindness, And lowly to walk with thy God?","NHEB":"He has shown you, O man, what is good. What does the Lord require of you, but to act justly, to love mercy, and to walk humbly with your God?"}},{"r":"1 Peter 5:6","x":{"KJV":"Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time:","DRC":"Be you humbled therefore under the mighty hand of God, that he may exalt you in the time of visitation:","CPDV":"And so, be humbled under the powerful hand of God, so that he may exalt you in the time of visitation.","ASV":"Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time;","BSB":"Humble yourselves, therefore, under God’s mighty hand, so that in due time He may exalt you.","BBE":"For this cause make yourselves low under the strong hand of God, so that when the time comes you may be lifted up;","Darby":"Humble yourselves therefore under the mighty hand ofGod, that he may exalt you in [the due] time;","Geneva1599":"Humble your selues therefore vnder the mightie hand of God, that he may exalt you in due time.","Webster":"Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time:","YLT":"be humbled, then, under the powerful hand of God, that you He may exalt in good time,","NHEB":"Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time;"}},{"r":"Philippians 2:3","x":{"KJV":"Let nothing be done through strife or vainglory; but in lowliness of mind let each esteem other better than themselves.","DRC":"Let nothing be done through contention: neither by vain glory. But in humility, let each esteem others better than themselves:","CPDV":"Let nothing be done by contention, nor in vain glory. Instead, in humility, let each of you esteem others to be better than himself.","ASV":"doing nothing through faction or through vainglory, but in lowliness of mind each counting other better than himself;","BSB":"Do nothing out of selfish ambition or empty pride, but in humility consider others more important than yourselves.","BBE":"Doing nothing through envy or through pride, but with low thoughts of self let everyone take others to be better than himself;","Darby":"[let] nothing [be] in the spirit of strife or vain glory, but, in lowliness of mind, each esteeming the other as more excellent than themselves;","Geneva1599":"That nothing be done through contention or vaine glory, but that in meekenesse of minde euery man esteeme other better then himselfe.","Webster":"[Let] nothing [be done] through strife or vain glory; but in lowliness of mind let each esteem other better than themselves.","YLT":"nothing in rivalry or vain-glory, but in humility of mind one another counting more excellent than yourselves--","NHEB":"doing nothing through rivalry or through conceit, but in humility, each counting others better than himself;"}}],"l":[{"r":"D&C 112:10","x":"Be thou humble; and the Lord thy God shall lead thee by the hand, and give thee answer to thy prayers."},{"r":"Mosiah 4:11","x":"And again I say unto you as I have said before, that as ye have come to the knowledge of the glory of God, or if ye have known of his goodness and have tasted of his love, and have received a remission of your sins, which causeth such exceedingly great joy in your souls, even so I would that ye should remember, and always retain in remembrance, the greatness of God, and your own nothingness, and his goodness and long-suffering towards you, unworthy creatures, and humble yourselves even in the depths of humility, calling on the name of the Lord daily, and standing steadfastly in the faith of that which is to come, which was spoken by the mouth of the angel."},{"r":"Ether 12:27","x":"And if men come unto me I will show unto them their weakness. I give unto men weakness that they may be humble; and my grace is sufficient for all men that humble themselves before me; for if they humble themselves before me, and have faith in me, then will I make weak things become strong unto them."}]},{"id":"marriage","t":"marriage","g":"Relationships","p":["my marriage","husband and wife","being a good spouse","married life"],"k":["husband","wife","spouse"],"v":[{"r":"Ephesians 5:25","x":{"KJV":"Husbands, love your wives, even as Christ also loved the church, and gave himself for it;","DRC":"Husbands, love your wives, as Christ also loved the church and delivered himself up for it:","CPDV":"Husbands, love your wives, just as Christ also loved the Church and handed himself over for her,","ASV":"Husbands, love your wives, even as Christ also loved the church, and gave himself up for it;","BSB":"Husbands, love your wives, just as Christ loved the church and gave Himself up for her","BBE":"Husbands, have love for your wives, even as Christ had love for the church, and gave himself for it;","Darby":"Husbands, love your own wives, even as the Christ also loved the assembly, and has delivered himself up for it,","Geneva1599":"Husbands, loue your wiues, euen as Christ loued the Church, and gaue himselfe for it,","Webster":"Husbands, love your wives, even as Christ also loved the church, and gave himself for it;","YLT":"The husbands! love your own wives, as also the Christ did love the assembly, and did give himself for it,","NHEB":"Husbands, love your wives, even as Christ also loved the church, and gave himself up for it;"}},{"r":"Ecclesiastes 4:9-12","x":{"KJV":"Two are better than one; because they have a good reward for their labour. For if they fall, the one will lift up his fellow: but woe to him that is alone when he falleth; for he hath not another to help him up. Again, if two lie together, then they have heat: but how can one be warm alone? And if one prevail against him, two shall withstand him; and a threefold cord is not quickly broken.","DRC":"It is better therefore that two should be together, than one: for they have the advantage of their society: If one fall he shall be supported by the other: woe to him that is alone, for when he falleth, he hath none to lift him up. And if two lie together, they shall warm one another: how shall one alone be warmed? And if a man prevail against one, two shall withstand him: a threefold cord is not easily broken.","CPDV":"Therefore, it is better for two to be together, than for one to be alone. For they have the advantage of their companionship. If one falls, he shall be supported by the other. Woe to one who is alone. For when he falls, he has no one to lift him up. And if two are sleeping, they warm one another. How can one person alone be warmed? And if a man can prevail against one, two may withstand him, and a threefold cord is broken with difficulty.","ASV":"Two are better than one, because they have a good reward for their labor. For if they fall, the one will lift up his fellow; but woe to him that is alone when he falleth, and hath not another to lift him up. Again, if two lie together, then they have warmth; but how can one be warm alone? And if a man prevail against him that is alone, two shall withstand him; and a threefold cord is not quickly broken.","BSB":"Two are better than one, because they have a good return for their labor. For if one falls down, his companion can lift him up; but pity the one who falls without another to help him up! Again, if two lie down together, they will keep warm; but how can one keep warm alone? And though one may be overpowered, two can resist. Moreover, a cord of three strands is not quickly broken.","BBE":"Two are better than one, because they have a good reward for their work. And if one has a fall, the other will give him a hand; but unhappy is the man who is by himself, because he has no helper. So again, if two are sleeping together they are warm, but how may one be warm by himself? And two attacked by one would be safe, and three cords twisted together are not quickly broken.","Darby":"Two are better than one; because they have a good reward for their labour. For if they fall, the one will lift up his fellow; but woe to him that is alone when he falleth, and who hath not another to lift him up! Again, if two lie together, then they have warmth; but how can one alone be warm? And if a [man] overpower the one, the two shall withstand him; and a threefold cord is not quickly broken.","Geneva1599":"Two are better then one: for they haue better wages for their labour. For if they fal, the one wil lift vp his felow: but wo vnto him that is alone: for he falleth, and there is not a second to lift him vp. Also if two sleepe together, then shall they haue heate: but to one how should there be heate? And if one ouercome him, two shall stand against him: and a threefolde coard is not easily broken.","Webster":"Two [are] better than one; because they have a good reward for their labor. For if they fall, the one will lift up his fellow: but woe to him [that is] alone when he falleth; for [he hath] not another to help him to rise. Again, if two lie together, then they have heat: but how can one be warm [alone]? And if one prevaileth against him, two shall withstand him; and a three-fold cord is not quickly broken.","YLT":"The two are better than the one, in that they have a good reward by their labour. For if they fall, the one raiseth up his companion, but woe to the one who falleth and there is not a second to raise him up! Also, if two lie down, then they have heat, but how hath one heat? And if the one strengthen himself, the two stand against him; and the threefold cord is not hastily broken.","NHEB":"Two are better than one, because they have a good reward for their labor. For if they fall, the one will lift up his fellow; but woe to him who is alone when he falls, and doesn't have another to lift him up. Again, if two lie together, then they have warmth; but how can one keep warm alone? If a man prevails against one who is alone, two shall withstand him; and a threefold cord is not quickly broken."}},{"r":"Genesis 2:24","x":{"KJV":"Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh.","DRC":"Wherefore a man shall leave father and mother, and shall cleave to his wife: and they shall be two in one flesh.","CPDV":"For this reason, a man shall leave behind his father and mother, and he shall cling to his wife; and the two shall be as one flesh.","ASV":"Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh.","BSB":"For this reason a man will leave his father and mother and be united to his wife, and they will become one flesh.","BBE":"For this cause will a man go away from his father and his mother and be joined to his wife; and they will be one flesh.","Darby":"Therefore shall a man leave his father and his mother, and cleave to his wife; and they shall become one flesh.","Geneva1599":"Therefore shall man leaue his father and his mother, and shall cleaue to his wife, and they shall be one flesh.","Webster":"Therefore shall a man leave his father and his mother, and shall cleave to his wife: and they shall be one flesh.","YLT":"therefore doth a man leave his father and his mother, and hath cleaved unto his wife, and they have become one flesh.","NHEB":"Therefore a man will leave his father and his mother, and will join with his wife, and they will be one flesh."}}],"l":[{"r":"D&C 42:22","x":"Thou shalt love thy wife with all thy heart, and shalt cleave unto her and none else."},{"r":"D&C 49:15","x":"And again, verily I say unto you, that whoso forbiddeth to marry is not ordained of God, for marriage is ordained of God unto man."},{"r":"Moses 3:24","x":"Therefore shall a man leave his father and his mother, and shall cleave unto his wife; and they shall be one flesh."}]},{"id":"a-struggling-marriage","t":"a struggling marriage","g":"Relationships","p":["my marriage is falling apart","we fight all the time","my spouse and I","marriage problems"],"k":["husband","wife","fighting"],"v":[{"r":"1 Corinthians 13:4-7","x":{"KJV":"Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up, Doth not behave itself unseemly, seeketh not her own, is not easily provoked, thinketh no evil; Rejoiceth not in iniquity, but rejoiceth in the truth; Beareth all things, believeth all things, hopeth all things, endureth all things.","DRC":"Charity is patient, is kind: charity envieth not, dealeth not perversely, is not puffed up, Is not ambitious, seeketh not her own, is not provoked to anger, thinketh no evil: Rejoiceth not in iniquity, but rejoiceth with the truth: Beareth all things, believeth all things, hopeth all things, endureth all things.","CPDV":"And if I distribute all my goods in order to feed the poor, and if I hand over my body to be burned, yet not have charity, it offers me nothing. Charity is patient, is kind. Charity does not envy, does not act wrongly, is not inflated. Charity is not ambitious, does not seek for itself, is not provoked to anger, devises no evil. Charity does not rejoice over iniquity, but rejoices in truth.","ASV":"Love suffereth long, and is kind; love envieth not; love vaunteth not itself, is not puffed up, doth not behave itself unseemly, seeketh not its own, is not provoked, taketh not account of evil; rejoiceth not in unrighteousness, but rejoiceth with the truth; beareth all things, believeth all things, hopeth all things, endureth all things.","BSB":"Love is patient, love is kind. It does not envy, it does not boast, it is not proud. It is not rude, it is not self-seeking, it is not easily angered, it keeps no account of wrongs. Love takes no pleasure in evil, but rejoices in the truth. It bears all things, believes all things, hopes all things, endures all things.","BBE":"Love is never tired of waiting; love is kind; love has no envy; love has no high opinion of itself, love has no pride; Love's ways are ever fair, it takes no thought for itself; it is not quickly made angry, it takes no account of evil; It takes no pleasure in wrongdoing, but has joy in what is true; Love has the power of undergoing all things, having faith in all things, hoping all things.","Darby":"Love has long patience, is kind; love is not emulous [of others]; love is not insolent and rash, is not puffed up, does not behave in an unseemly manner, does not seek what is its own, is not quickly provoked, does not impute evil, does not rejoice at iniquity but rejoices with the truth, bears all things, believes all things, hopes all things, endures all things.","Geneva1599":"Loue suffreth long: it is bountifull: loue enuieth not: loue doeth not boast it selfe: it is not puffed vp: It doeth no vncomely thing: it seeketh not her owne things: it is not prouoked to anger: it thinketh not euill: It reioyceth not in iniquitie, but reioyceth in the trueth: It suffreth all things: it beleeueth all things: it hopeth all things: it endureth all things.","Webster":"Charity suffereth long, [and] is kind; charity envieth not; charity vaunteth not itself, is not puffed up, Doth not behave itself unseemly, seeketh not its own, is not easily provoked, thinketh no evil; Rejoiceth not in iniquity, but rejoiceth in the truth; Beareth all things, believeth all things, hopeth all things, endureth all things.","YLT":"The love is long-suffering, it is kind, the love doth not envy, the love doth not vaunt itself, is not puffed up, doth not act unseemly, doth not seek its own things, is not provoked, doth not impute evil, rejoiceth not over the unrighteousness, and rejoiceth with the truth; all things it beareth, all it believeth, all it hopeth, all it endureth.","NHEB":"Love is patient and is kind; love does not envy. Love does not brag, is not proud, doesn't behave itself inappropriately, does not seek its own way, is not provoked, takes no account of evil; doesn't rejoice in unrighteousness, but rejoices with the truth; bears all things, believes all things, hopes all things, endures all things."},"a":{"CPDV":"1 Corinthians 13:3-6"}},{"r":"Colossians 3:13-14","x":{"KJV":"Forbearing one another, and forgiving one another, if any man have a quarrel against any: even as Christ forgave you, so also do ye. And above all these things put on charity, which is the bond of perfectness.","DRC":"Bearing with one another and forgiving one another, if any have a complaint against another. Even as the Lord hath forgiven you, so do you also. But above all these things have charity, which is the bond of perfection.","CPDV":"Support one another, and, if anyone has a complaint against another, forgive one another. For just as the Lord has forgiven you, so also must you do. And above all these things have charity, which is the bond of perfection.","ASV":"forbearing one another, and forgiving each other, if any man have a complaint against any; even as the Lord forgave you, so also do ye: and above all these things put on love, which is the bond of perfectness.","BSB":"Bear with one another and forgive any complaint you may have against someone else. Forgive as the Lord forgave you. And over all these virtues put on love, which is the bond of perfect unity.","BBE":"Being gentle to one another and having forgiveness for one another, if anyone has done wrong to his brother, even as the Lord had forgiveness for you: And more than all, have love; the only way in which you may be completely joined together.","Darby":"forbearing one another, and forgiving one another, if any should have a complaint against any; even as the Christ has forgiven you, so also [do] ye. And to all these [add] love, which is the bond of perfectness.","Geneva1599":"Forbearing one another, and forgiuing one another, if any man haue a quarel to another: euen as Christ forgaue, euen so doe ye. And aboue all these thinges put on loue, which is the bond of perfectnes.","Webster":"Forbearing one another, and forgiving one another, if any man hath a quarrel against any: even as Christ forgave you, so also [do] ye. And above all these things [put on] charity, which is the bond of perfectness.","YLT":"forbearing one another, and forgiving each other, if any one with any one may have a quarrel, as also the Christ did forgive you--so also ye; and above all these things, have love, which is a bond of the perfection,","NHEB":"bearing with one another, and forgiving each other, if anyone has a complaint against another; even as the Lord forgave you, so you also do. Above all these things, walk in love, which is the bond of perfection."}},{"r":"Ephesians 4:2-3","x":{"KJV":"With all lowliness and meekness, with longsuffering, forbearing one another in love; Endeavouring to keep the unity of the Spirit in the bond of peace.","DRC":"With all humility and mildness, with patience, supporting one another in charity. Careful to keep the unity of the Spirit in the bond of peace.","CPDV":"with all humility and meekness, with patience, supporting one another in charity. Be anxious to preserve the unity of the Spirit within the bonds of peace.","ASV":"with all lowliness and meekness, with longsuffering, forbearing one another in love; giving diligence to keep the unity of the Spirit in the bond of peace.","BSB":"with all humility and gentleness, with patience, bearing with one another in love, and with diligence to preserve the unity of the Spirit through the bond of peace.","BBE":"With all gentle and quiet behaviour, taking whatever comes, putting up with one another in love; Taking care to keep the harmony of the Spirit in the yoke of peace.","Darby":"with all lowliness and meekness, with long-suffering, bearing with one another in love; using diligence to keep the unity of the Spirit in the uniting bond of peace.","Geneva1599":"With all humblenesse of minde, and meekenesse, with long suffering, supporting one an other through loue, Endeuouring to kee
