html{scroll-padding-top:env(safe-area-inset-top,0px)}

dversities found most surely.","NHEB":"For the Chief Musician. By the sons of Korah. According to Alamoth. God is our refuge and strength, a very present help in trouble."},"a":{"DRC":"Psalms 45:2","CPDV":"Psalms 45:2"}},{"r":"Isaiah 26:3","x":{"KJV":"Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.","DRC":"The old error is passed away: thou wilt keep peace: peace, because we have hoped in thee.","CPDV":"The old error has gone away. You will serve peace: peace, for we have hoped in you.","ASV":"Thou wilt keep him in perfect peace, whose mind is stayed on thee; because he trusteth in thee.","BSB":"You will keep in perfect peace the steadfast of mind, because he trusts in You.","BBE":"The man whose heart is unmoved you will keep in peace, because his hope is in you.","Darby":"Thou wilt keep in perfect peace the mind stayed [on thee], for he confideth in thee.","Geneva1599":"By an assured purpose wilt thou preserue perfite peace, because they trusted in thee.","Webster":"Thou wilt keep [him] in perfect peace, [whose] mind [is] stayed [on thee]: because he trusteth in thee.","YLT":"An imagination supported Thou fortifiest peace--peace! For in Thee it is confident.","NHEB":"You will keep whoever's mind is steadfast in perfect peace, because he trusts in you."}},{"r":"John 14:27","x":{"KJV":"Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.","DRC":"Peace I leave with you: my peace I give unto you: not as the world giveth, do I give unto you. Let not your heart be troubled: nor let it be afraid.","CPDV":"Peace I leave for you; my Peace I give to you. Not in the way that the world gives, do I give to you. Do not let your heart be troubled, and let it not fear.","ASV":"Peace I leave with you; my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be fearful.","BSB":"Peace I leave with you; My peace I give to you. I do not give to you as the world gives. Do not let your hearts be troubled; do not be afraid.","BBE":"May peace be with you; my peace I give to you: I give it not as the world gives. Let not your heart be troubled; let it be without fear.","Darby":"I leave peace with you; I give my peace to you: not as the world gives do I give to you. Let not your heart be troubled, neither let it fear.","Geneva1599":"Peace I leaue with you: my peace I giue vnto you: not as the worlde giueth, giue I vnto you. Let not your heart be troubled, nor feare.","Webster":"Peace I leave with you, my peace I give to you: not as the world giveth, give I to you. Let not your heart be troubled, neither let it be afraid.","YLT":"`Peace I leave to you; my peace I give to you, not according as the world doth give do I give to you; let not your heart be troubled, nor let it be afraid;","NHEB":"Peace I leave with you. My peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled, neither let it be afraid."}}],"l":[{"r":"D&C 101:16","x":"Therefore, let your hearts be comforted concerning Zion; for all flesh is in mine hands; be still and know that I am God."},{"r":"Alma 38:5","x":"And now my son, Shiblon, I would that ye should remember, that as much as ye shall put your trust in God even so much ye shall be delivered out of your trials, and your troubles, and your afflictions, and ye shall be lifted up at the last day."},{"r":"D&C 121:7","x":"My son, peace be unto thy soul; thine adversity and thine afflictions shall be but a small moment;"}]},{"id":"feeling-overwhelmed","t":"feeling overwhelmed","g":"Fear and anxiety","p":["too much on my plate","I can't handle it all","drowning","everything at once","stressed out"],"k":[],"v":[{"r":"Psalms 61:2","x":{"KJV":"From the end of the earth will I cry unto thee, when my heart is overwhelmed: lead me to the rock that is higher than I.","DRC":"To thee have I cried from the ends ths.","BSB":"Trust in the LORD with all your heart, and lean not on your own understanding; in all your ways acknowledge Him, and He will make your paths straight.","BBE":"Put all your hope in God, not looking to your reason for support. In all your ways give ear to him, and he will make straight your footsteps.","Darby":"Confide in Jehovah with all thy heart, and lean not unto thine own intelligence; in all thy ways acknowledge him, and he will make plain thy paths.","Geneva1599":"Trust in the Lord with all thine heart, and leane not vnto thine owne wisdome. In all thy wayes acknowledge him, and he shall direct thy wayes.","Webster":"Trust in the LORD with all thy heart; and lean not to thy own understanding. In all thy ways acknowledge him, and he will direct thy paths.","YLT":"Trust unto Jehovah with all thy heart, And unto thine own understanding lean not. In all thy ways know thou Him, And He doth make straight thy paths.","NHEB":"Trust in the Lord with all your heart, and do not lean on your own understanding. In all your ways acknowledge him, and he will make your paths straight."}},{"r":"Isaiah 55:8-9","x":{"KJV":"For my thoughts are not your thoughts, neither are your ways my ways, saith the LORD. For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","DRC":"For my thoughts are not your thoughts: nor your ways my ways, saith the Lord. For as the heavens are exalted above the earth, so are my ways exalted above your ways, and my thoughts above your thoughts.","CPDV":"For my thoughts are not your thoughts, and your ways are not my ways, says the Lord. For just as the heavens are exalted above the earth, so also are my ways exalted above your ways, and my thoughts above your thoughts.","ASV":"For my thoughts are not your thoughts, neither are your ways my ways, saith Jehovah. For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.", iven me consolation.","ASV":"Yea, though I walk through the valley of the shadow of death, I will fear no evil; for thou art with me; Thy rod and thy staff, they comfort me.","BSB":"Even though I walk through the valley of the shadow of death, I will fear no evil, for You are with me; Your rod and Your staff, they comfort me.","BBE":"Yes, though I go through the valley of deep shade, I will have no fear of evil; for you are with me, your rod and your support are my comfort.","Darby":"Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff, they comfort me.","Geneva1599":"Yea, though I should walke through the valley of the shadowe of death, I will feare no euill: for thou art with me: thy rod and thy staffe, they comfort me.","Webster":"Yes, though I walk through the valley of the shades of death, I will fear no evil: for thou [art] with me; thy rod and thy staff they comfort me.","YLT":"Also--when I walk in a valley of death-shade, I fear no evil, for Thou art with me, Thy rod and Thy staff--they comfort me.","NHEB":"Even though I walk through the valley of the shadow of death, I will fear no evil, for you are with me. Your rod and your staff, they comfort me."},"a":{"DRC":"Psalms 22:4","CPDV":"Psalms 22:4"}},{"r":"John 11:25-26","x":{"KJV":"Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live: And whosoever liveth and believeth in me shall never die. Believest thou this?","DRC":"Jesus said to her: I am the resurrection and the life: he that believeth in me, although he be dead, shall live: And every one that liveth and believeth in me shall not die for ever. Believest thou this?","CPDV":"Jesus said to her: “I am the Resurrection and the Life. Whoever believes in me, even though he has died, he shall live. And everyone who lives and believes in me shall not die for eternity. Do you believe this?”","ASV":"Jesus said unto her, I am the resurrection, and the life: he that believeth on me, though he die, yet shall he live; and whosoever liveth and believeth on me shall never die. Believest thou this?","BSB":"Jesus said to her, “I am the resurrection and the life. Whoever believes in Me will live, even though he dies. And everyone who lives and believes in Me will never die. Do you believe this?”","BBE":"Jesus said to her, I am myself that day and that life; he who has faith in me will have life even if he is dead; And no one who is living and has faith in me will ever see death. Is this your faith?","Darby":"Jesus said to her, I am the resurrection and the life: he that believes on me, though he have died, shall live; and every one who lives and believes on me shall never die. Believest thou this?","Geneva1599":"Iesus saide vnto her, I am the resurrection and the life: he that beleeueth in me, though he were dead, yet shall he liue. And whosoeuer liueth, and beleeueth in me, shall neuer die: Beleeuest thou this?","Webster":"Jesus said to her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live: And whoever liveth, and believeth in me, shall never die. Believest thou this?","YLT":"Jesus said to her, `I am the rising again, and the life; he who is believing in me, even if he may die, shall live; and every one who is living and believing in me shall not die--to the age;","NHEB":"Jesus said to her, \"I am the resurrection and the life. He who believes in me will still live, even if he dies. Whoever lives and believes in me will never die. Do you believe this?\""}},{"r":"1 Corinthians 15:55","x":{"KJV":"O death, where is thy sting? O grave, where is thy victory?","DRC":"O death, where is thy victory? O death, where is thy sting?","CPDV":"“O death, where is your victory? O death, where is your sting?”","ASV":"O death, where is thy victory? O death, where is thy sting?","BSB":"“Where, O Death, is your victory? Where, O Death, is your sting?”","BBE":"O death, where is your power? O death, where are your pains?","Darby":"Where, O death, [is] thy sting? where, O death, thy victory?","Geneva1599":"O death where is thy sting? O graue where is thy victorie?","Webster":"O death, where [is] thy sting? O grave, where [is] thy victory?","YLT":"where, O Death, thy sting? where, O Hades, thy victory?'","NHEB":"\"Death, where is your victory? Death, where is your sting?\""}}],"l":[{"r":"D&C 42:46","x":"And it shall come to pass that those that die in me shall not taste of death, for it shall be sweet unto them;"},{"r":"Alma 40:12","x":"And then shall it come to pass, that the spirits of those who are righteous are received into a state of happiness, which is called paradise, a state of rest, a state of peace, where they shall rest from all their troubles and from all care, and sorrow."},{"r":"Mosiah 16:8","x":"But there is a resurrection, therefore the grave hath no victory, and the sting of death is swallowed up in Christ."}]},{"id":"courage","t":"courage","g":"Fear and anxiety","p":["I need courage","give me strength","be brave","I need to be bold"],"k":[],"v":[{"r":"Joshua 1:9","x":{"KJV":"Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.","DRC":"Behold I command thee, take courage, and be strong. Fear not, and be not dismayed: because the Lord thy God is with thee in all things whatsoever thou shalt go to.","CPDV":"Behold, I am instructing you. Be strengthened, and be steadfast. Do not dread, and do not fear. For the Lord your God is with you in all things, wherever you may go.”","ASV":"Have not I commanded thee? Be strong and of good courage; be not affrighted, neither be thou dismayed: for Jehovah thy God is with thee whithersoever thou goest.","BSB":"Have I not commanded you to be strong and courageous? Do not be afraid; do not be discouraged, for the LORD your God is with you wherever you go.”","BBE":"Have I not given you your orders? Take heart and be strong; have no fear and do not be troubled; for the Lord your God is with you wherever you go,","Darby":"Have I not commanded thee: Be strong and courageous? Be not afraid, neither be dismayed; for Jehovah thyGod is with thee whithersoever thou goest.","Geneva1599":"Haue not I commanded thee, saying, Be strong and of a good courage, feare not, nor be discouraged? for I the Lord thy God will be with thee, whithersoeuer thou goest.","Webster":"Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God [is] with thee whithersoever thou goest.","YLT":"`Have not I commanded thee? be strong and courageous; be not terrified nor affrighted, for with thee is Jehovah thy God in every place whither thou goest.'","NHEB":"Haven't I commanded you? Be strong and of good courage. Do not be afraid, neither be dismayed: for the Lord your God is with you wherever you go."}},{"r":"Deuteronomy 31:6","x":{"KJV":"Be strong and of a good courage, fear not, nor be afraid of them: for the LORD thy God, he it is that doth go with thee; he will not fail thee, nor forsake thee.","DRC":"Do manfully and be of good heart: fear not, nor be ye dismayed at their sight: for the Lord thy God he himself is thy leader, and will not leave thee nor forsake thee.","CPDV":"Act manfully and be strengthened. Do not be afraid, and do not dread at the sight of them. For the Lord your God himself is your commander, and he will neither dismiss nor abandon you.”","ASV":"Be strong and of good courage, fear not, nor be affrighted at them: for Jehovah thy God, he it is that doth go with thee; he will not fail thee, nor forsake thee.","BSB":"Be strong and courageous; do not be afraid or terrified of them, for it is the LORD your God who goes with you; He will never leave you nor forsake you.”","BBE":"Be strong and take heart, and have no fear of them: for it is the Lord your God who is going with you; he will not take away his help from you.","Darby":"Be strong and courageous, fear them not, neither be afraid of them; for Jehovah thyGod, he it is that goeth with thee; he will not leave thee, nor forsake thee.","Geneva1599":"Plucke vp your hearts therefore, and be strong: dread not, nor be afraid of them: for the Lord thy God him selfe doeth goe with thee: he will not faile thee, nor forsake thee.","Webster":"Be strong and of a good courage, fear not, nor be afraid of them: for the LORD thy God, he [it is] that doth go with thee, he will not fail thee, nor forsake thee.","YLT":"be strong and courageous, fear not, nor be terrified because of them, for Jehovah thy God is He who is going with thee; He doth not fail thee nor forsake thee.'","NHEB":"Be strong and courageous, do not be afraid, nor be scared of them: for the Lord your God, he it is who does go with you; he will not fail you, nor forsake you.\""}},{"r":"Psalms 27:1","x":{"KJV":"The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?","DRC":"The psalm of David before he was anointed. The Lord is my light and my salvation, whom shall I fear? The Lord is the protector of my life: of whom shall I be afraid?","CPDV":"A Psalm of David, before he was sealed. The Lord is my light and my salvation, whom shall I fear? The Lord is the protector of my life, of whom shall I be afraid?","ASV":"A Psalm of David. Jehovah is my light and my salvation; Whom shall I fear? Jehovah is the strength of my life; Of whom shall I be afraid?","BSB":"Of David. The LORD is my light and my salvation— whom shall I fear? The LORD is the stronghold of my life— whom shall I dread?","BBE":"The Lord is my light and my salvation; who is then a cause of fear to me? the Lord is the strength of my life; who is a danger to me?","Darby":"[A Psalm] of David. Jehovah is my light and my salvation; whom shall I fear? Jehovah is the strength of my life; of whom shall I be afraid?","Geneva1599":"A Psalme of David. The Lord is my light and my saluation, whom shall I feare? the Lord is the strength of my life, of whome shall I be afraide?","Webster":"[A Psalm] of David. The LORD [is] my light and my salvation; whom shall I fear? the LORD [is] the strength of my life; of whom shall I be afraid?","YLT":"By David. Jehovah is my light and my salvation, Whom do I fear? Jehovah is the strength of my life, Of whom am I afraid?","NHEB":"By David. The Lord is my light and my salvation. Whom shall I fear? The Lord is the strength of my life. Of whom shall I be afraid?"},"a":{"DRC":"Psalms 26:1","CPDV":"Psalms 26:1"}}],"l":[{"r":"D&C 68:6","x":"Wherefore, be of good cheer, and do not fear, for I the Lord am with you, and will stand by you; and ye shall bear record of me, even Jesus Christ, that I am the Son of the living God, that I was, that I am, and that I am to come."},{"r":"Alma 26:12","x":"Yea, I know that I am nothing; as to my strength I am weak; therefore I will not boast of myself, but I will boast of my God, for in his strength I can do all things; yea, behold, many mighty miracles we have wrought in this land, for which we will praise his name forever."},{"r":"D&C 6:34","x":"Therefore, fear not, little flock; do good; let earth and hell combine against you, for if ye are built upon my rock, they cannot prevail."}]},{"id":"facing-the-unknown","t":"facing the unknown","g":"Fear and anxiety","p":["new and unknown","stepping into the unknown","I don't know what's ahead"],"k":[],"v":[{"r":"Isaiah 43:2","x":{"KJV":"When thou passest through the waters, I will be with thee; and through the rivers, they shall not overflow thee: when thou walkest through the fire, thou shalt not be burned; neither shall the flame kindle upon thee.","DRC":"When thou shalt pass through the waters, I will be with thee, and the rivers shall not cover thee: when thou shalt walk in the fire, thou shalt not be burnt, and the flames shall not burn in thee:","CPDV":"When you pass through the waters, I will be with you, and the rivers will not cover you. When you walk through fire, you will not be burned, and the flames will not scorch you.","ASV":"When thou passest through the waters, I will be with thee; and through the rivers, they shall not overflow thee: when thou walkest through the fire, thou shalt not be burned, neither shall the flame kindle upon thee.","BSB":"When you pass through the waters, I will be with you; and when you go through the rivers, they will not overwhelm you. When you walk through the fire, you will not be scorched; the flames will not set you ablaze.","BBE":"When you go through the waters, I will be with you; and through the rivers, they will not go over you: when you go through the fire, you will not be burned; and the flame will have no power over you.","Darby":"When thou passest through the waters, I [will be] with thee; and through the rivers, they shall not overflow thee; when thou walkest through the fire, thou shalt not be burned, neither shall the flame kindle upon thee.","Geneva1599":"When thou passest through the waters, I wil be with thee, and through the floods, that they doe not ouerflowe thee. When thou walkest through the very fire, thou shalt not be burnt, neither shall the flame kindle vpon thee.","Webster":"When thou passest through the waters, I [will be] with thee; and through the rivers, they shall not overflow thee: when thou walkest through the fire, thou shalt not be burned; neither shall the flame kindle upon thee.","YLT":"When thou passest into waters, I am with thee, And into floods, they do not overflow thee, When thou goest into fire, thou art not burnt, And a flame doth not burn against thee.","NHEB":"When you pass through the waters, I will be with you; and through the rivers, they will not overflow you. When you walk through the fire, you will not be burned, and flame will not scorch you."}},{"r":"Hebrews 11:8","x":{"KJV":"By faith Abraham, when he was called to go out into a place which he should after receive for an inheritance, obeyed; and he went out, not knowing whither he went.","DRC":"By faith he that is called Abraham obeyed to go out into a place which he was to receive for an inheritance. And he went out, not knowing whither he went.","CPDV":"By faith, the one called Abraham obeyed, going out to the place that he was to receive as an inheritance. And he went out, not knowing where he was going.","ASV":"By faith Abraham, when he was called, obeyed to go out unto a place which he was to receive for an inheritance; and he went out, not knowing whither he went.","BSB":"By faith Abraham, when called to go to a place he would later receive as his inheritance, obeyed and went, without knowing where he was going.","BBE":"By faith Abraham did as God said when he was ordered to go out into a place which was to be given to him as a heritage, and went out without knowledge of where he was going.","Darby":"By faith Abraham, being called, obeyed to go out into the place which he was to receive for an inheritance, and went out, not knowing where he was going.","Geneva1599":"By faith Abraham, when he was called, obeyed God, to goe out into a place, which hee should afterward receiue for inheritance, and he went out, not knowing whither he went.","Webster":"By faith Abraham, when he was called to remove into a place which he should afterwards receive for an inheritance, obeyed; and he went out not knowing whither he was going.","YLT":"By faith Abraham, being called, did obey, to go forth to the place that he was about to receive for an inheritance, and he went forth, not knowing whither he doth go;","NHEB":"By faith, Abraham, when he was called, obeyed to go out to a place which he was to receive for an inheritance. He went out, not knowing where he went."}},{"r":"Psalms 32:8","x":{"KJV":"I will instruct thee and teach thee in the way which thou shalt go: I will guide thee with mine eye.","DRC":"I will give thee understanding, and I will instruct thee in this way, in which thou shalt go: I will fix my eyes upon thee.","CPDV":"I will give you understanding, and I will instruct you in this way, in which you will walk. I will fix my eyes upon you.","ASV":"I will instruct thee and teach thee in the way which thou shalt go: I will counsel thee with mine eye upon thee.","BSB":"I will instruct you and teach you the way you should go; I will give you counsel and watch over you.","BBE":"I will give you knowledge, teaching you the way to go; my eye will be your guide.","Darby":"I will instruct thee and teach thee the way in which thou shalt go; I will counsel [thee] with mine eye upon thee.","Geneva1599":"I will instruct thee, and teache thee in the way that thou shalt goe, and I will guide thee with mine eye.","Webster":"I will instruct thee, and teach thee in the way which thou shalt go: I will guide thee with my eye.","YLT":"I cause thee to act wisely, And direct thee in the way that thou goest, I cause mine eye to take counsel concerning thee.","NHEB":"I will instruct you and teach you in the way which you shall go. I will counsel you with my eye on you."},"a":{"DRC":"Psalms 31:8","CPDV":"Psalms 31:8"}}],"l":[{"r":"1 Nephi 4:6","x":"And I was led by the Spirit, not knowing beforehand the things which I should do."},{"r":"D&C 84:88","x":"And whoso receiveth you, there I will be also, for I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up."},{"r":"D&C 78:18","x":"And ye cannot bear all things now; nevertheless, be of good cheer, for I will lead you along. The kingdom is yours and the blessings thereof are yours, and the riches of eternity are yours."}]},{"id":"sleeplessness","t":"sleeplessness","g":"Fear and anxiety","p":["I can't sleep","awake at night","insomnia","lying awake"],"k":[],"v":[{"r":"Psalms 4:8","x":{"KJV":"I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety.","DRC":"In peace in the self same I will sleep, and I will rest:","CPDV":"In peace itself, I will sleep and I will rest.","ASV":"In peace will I both lay me down and sleep; For thou, Jehovah, alone makest me dwell in safety.","BSB":"I will lie down and sleep in peace, for You alone, O LORD, make me dwell in safety.","BBE":"I will take my rest on my bed in peace, because you only, Lord, keep me safe.","Darby":"In peace will I both lay me down and sleep; for thou, Jehovah, alone makest me to dwell in safety.","Geneva1599":"I will lay mee downe, and also sleepe in peace: for thou, Lord, onely makest me dwell in safetie.","Webster":"I will both lay me down in peace, and sleep; for thou only, LORD, makest me dwell in safety.","YLT":"In peace together I lie down and sleep, For Thou, O Jehovah, alone, In confidence dost cause me to dwell!","NHEB":"In peace I will both lay myself down and sleep, for you, the Lord alone, make me live in safety."},"a":{"DRC":"Psalms 4:9","CPDV":"Psalms 4:9"}},{"r":"Psalms 127:2","x":{"KJV":"It is vain for you to rise up early, to sit up late, to eat the bread of sorrows: for so he giveth his beloved sleep.","DRC":"It is vain for you to rise before light, rise ye after you have sitten, you that eat the bread of sorrow. When he shall give sleep to his beloved,","CPDV":"It is in vain that you rise before daylight, that you rise up after you have sat down, you who chew the bread of sorrow. Whereas, to his beloved, he will give sleep.","ASV":"It is vain for you to rise up early, To take rest late, To eat the bread of toil; For so he giveth unto his beloved sleep.","BSB":"In vain you rise early and stay up late, toiling for bread to eat— for He gives sleep to His beloved.","BBE":"It is of no use for you to get up early, and to go late to your rest, with the bread of sorrow for your food; for the Lord gives to his loved ones in sleep.","Darby":"It is vain for you to rise up early, to lie down late, to eat the bread of sorrows: so to his beloved one he giveth sleep.","Geneva1599":"It is in vaine for you to rise earely, and to lie downe late, and eate the bread of sorow: but he wil surely giue rest to his beloued.","Webster":"[It is] vain for you to rise early, to sit up late, to eat the bread of sorrows: [for] so he giveth his beloved sleep.","YLT":"Vain for you who are rising early, Who delay sitting, eating the bread of griefs, So He giveth to His beloved one sleep.","NHEB":"It is vain for you to rise up early, to stay up late, eating the bread of toil; for he gives sleep to his loved ones."},"a":{"DRC":"Psalms 126:2","CPDV":"Psalms 126:2"}},{"r":"Proverbs 3:24","x":{"KJV":"When thou liest down, thou shalt not be afraid: yea, thou shalt lie down, and thy sleep shall be sweet.","DRC":"If thou sleep, thou shalt not fear: thou shalt rest, and thy sleep shall be sweet.","CPDV":"When you slumber, you shall not fear. When you rest, your sleep also will be sweet.","ASV":"When thou liest down, thou shalt not be afraid: Yea, thou shalt lie down, and thy sleep shall be sweet.","BSB":"When you lie down, you will not be afraid; when you rest, your sleep will be sweet.","BBE":"When you take your rest you will have no fear, and on your bed sleep will be sweet to you.","Darby":"when thou liest down, thou shalt not be afraid, but thou shalt lie down and thy sleep shall be sweet.","Geneva1599":"If thou sleepest, thou shalt not bee afraide, and when thou sleepest, thy sleepe shalbe sweete.","Webster":"When thou liest down, thou shalt not be afraid: but thou shalt lie down, and thy sleep shall be sweet.","YLT":"If thou liest down, thou art not afraid, Yea, thou hast lain down, And sweet hath been thy sleep.","NHEB":"When you lie down, you will not be afraid. Yes, you will lie down, and your sleep will be sweet."}}],"l":[{"r":"D&C 88:124","x":"Cease to be idle; cease to be unclean; cease to find fault one with another; cease to sleep longer than is needful; retire to thy bed early, that ye may not be weary; arise early, that your bodies and your minds may be invigorated."},{"r":"Alma 37:37","x":"Counsel with the Lord in all thy doings, and he will direct thee for good; yea, when thou liest down at night lie down unto the Lord, that he may watch over you in your sleep; and when thou risest in the morning let thy heart be full of thanks unto God; and if ye do these things, ye shall be lifted up at the last day."},{"r":"D&C 19:23","x":"Learn of me, and listen to my words; walk in the meekness of my Spirit, and you shall have peace in me."}]},{"id":"grief","t":"grief","g":"Grief and loss","p":["grieving","heartbroken","my heart hurts","the pain of loss"],"k":["grieve","grieving"],"v":[{"r":"Psalms 34:18","x":{"KJV":"The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.","DRC":"The Lord is nigh unto them that are of a contrite heart: and he will save the humble of spirit.","CPDV":"The Lord is near to those who are troubled in heart, and he will save the humble in spirit.","ASV":"Jehovah is nigh unto them that are of a broken heart, And saveth such as are of a contrite spirit.","BSB":"The LORD is near to the brokenhearted; He saves the contrite in spirit.","BBE":"The Lord is near the broken-hearted; he is the saviour of those whose spirits are crushed down.","Darby":"Jehovah is nigh to those that are of a broken heart, and saveth them that are of a contrite spirit.","Geneva1599":"The Lord is neere vnto them that are of a contrite heart, and will saue such as be afflicted in Spirite.","Webster":"The LORD [is] nigh to them that are of a broken heart; and saveth such as are of a contrite spirit.","YLT":"Near is Jehovah to the broken of heart, And the bruised of spirit He saveth.","NHEB":"The Lord is near to those who have a broken heart, and saves those who have a crushed spirit."},"a":{"DRC":"Psalms 33:19","CPDV":"Psalms 33:19"}},{"r":"Matthew 5:4","x":{"KJV":"Blessed are they that mourn: for they shall be comforted.","DRC":"Blessed are they that mourn: for they shall be comforted.","CPDV":"Blessed are those who mourn, for they shall be consoled.","ASV":"Blessed are they that mourn: for they shall be comforted.","BSB":"Blessed are those who mourn, for they will be comforted.","BBE":"Happy are those who are sad: for they will be comforted.","Darby":"Blessed they that mourn, for they shall be comforted.","Geneva1599":"Blessed are they that mourne: for they shall be comforted.","Webster":"Blessed [are] they that mourn: for they shall be comforted.","YLT":"`Happy the mourning--because they shall be comforted.","NHEB":"Blessed are those who mourn, for they shall be comforted."},"a":{"DRC":"Matthew 5:5","CPDV":"Matthew 5:5"}},{"r":"Revelation 21:4","x":{"KJV":"And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.","DRC":"And God shall wipe away all tears from their eyes: and death shall be no more. Nor mourning, nor crying, nor sorrow shall be any more, for the former things are passed away.","CPDV":"And God will wipe away every tear from their eyes. And death shall be no more. And neither mourning, nor crying out, nor grief shall be anymore. For the first things have passed away.”","ASV":"and he shall wipe away every tear from their eyes; and death shall be no more; neither shall there be mourning, nor crying, nor pain, any more: the first things are passed away.","BSB":"‘He will wipe away every tear from their eyes,’ and there will be no more death or mourning or crying or pain, for the former things have passed away.”","BBE":"And he will put an end to all their weeping; and there will be no more death, or sorrow, or crying, or pain; for the first things have come to an end.","Darby":"And he shall wipe away every tear from their eyes; and death shall not exist any more, nor grief, nor cry, nor distress shall exist any more, for the former things have passed away.","Geneva1599":"And God shall wipe away all teares from their eyes: and there shalbe no more death, neither sorow, neither crying, neither shall there be any more paine: for the first things are passed.","Webster":"And God will wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things have passed away.","YLT":"and God shall wipe away every tear from their eyes, and the death shall not be any more, nor sorrow, nor crying, nor shall there be any more pain, because the first things did go away.'","NHEB":"He will wipe away from them every tear from their eyes. Death will be no more; neither will there be mourning, nor crying, nor pain, any more. The first things have passed away.\""}}],"l":[{"r":"Mosiah 18:9","x":"Yea, and are willing to mourn with those that mourn; yea, and comfort those that stand in need of comfort, and to stand as witnesses of God at all times and in all things, and in all places that ye may be in, even until death, that ye may be redeemed of God, and be numbered with those of the first resurrection, that ye may have eternal life—"},{"r":"Alma 7:11-12","x":"And he shall go forth, suffering pains and afflictions and temptations of every kind; and this that the word might be fulfilled which saith he will take upon him the pains and the sicknesses of his people. And he will take upon him death, that he may loose the bands of death which bind his people; and he will take upon him their infirmities, that his bowels may be filled with mercy, according to the flesh, that he may know according to the flesh how to succor his people according to their infirmities."},{"r":"D&C 42:45","x":"Thou shalt live together in love, insomuch that thou shalt weep for the loss of them that die, and more especially for those that have not hope of a glorious resurrection."}]},{"id":"death-of-a-loved-one","t":"death of a loved one","g":"Grief and loss","p":["someone I love died","passed away","lost someone","death in the family"],"k":["died","passed","funeral"],"v":[{"r":"John 11:25-26","x":{"KJV":"Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live: And whosoever liveth and believeth in me shall never die. Believest thou this?","DRC":"Jesus said to her: I am the resurrection and the life: he that believeth in me, although he be dead, shall live: And every one that liveth and believeth in me shall not die for ever. Believest thou this?","CPDV":"Jesus said to her: “I am the Resurrection and the Life. Whoever believes in me, even though he has died, he shall live. And everyone who lives and believes in me shall not die for eternity. Do you believe this?”","ASV":"Jesus said unto her, I am the resurrection, and the life: he that believeth on me, though he die, yet shall he live; and whosoever liveth and believeth on me shall never die. Believest thou this?","BSB":"Jesus said to her, “I am the resurrection and the life. Whoever believes in Me will live, even though he dies. And everyone who lives and believes in Me will never die. Do you believe this?”","BBE":"Jesus said to her, I am myself that day and that life; he who has faith in me will have life even if he is dead; And no one who is living and has faith in me will ever see death. Is this your faith?","Darby":"Jesus said to her, I am the resurrection and the life: he that believes on me, though he have died, shall live; and every one who lives and believes on me shall never die. Believest thou this?","Geneva1599":"Iesus saide vnto her, I am the resurrection and the life: he that beleeueth in me, though he were dead, yet shall he liue. And whosoeuer liueth, and beleeueth in me, shall neuer die: Beleeuest thou this?","Webster":"Jesus said to her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live: And whoever liveth, and believeth in me, shall never die. Believest thou this?","YLT":"Jesus said to her, `I am the rising again, and the life; he who is believing in me, even if he may die, shall live; and every one who is living and believing in me shall not die--to the age;","NHEB":"Jesus said to her, \"I am the resurrection and the life. He who believes in me will still live, even if he dies. Whoever lives and believes in me will never die. Do you believe this?\""}},{"r":"1 Thessalonians 4:13-14","x":{"KJV":"But I would not have you to be ignorant, brethren, concerning them which are asleep, that ye sorrow not, even as others which have no hope. For if we believe that Jesus died and rose again, even so them also which sleep in Jesus will God bring with him.","DRC":"And we will not have you ignorant brethren, concerning them that are asleep, that you be not sorrowful, even as others who have no hope. For if we believe that Jesus died and rose again: even so them who have slept through Jesus, will God bring with him.","CPDV":"And we do not want you to be ignorant, brothers, concerning those who are sleeping, so as not to be sorrowful, like these others who do not have hope. For if we believe that Jesus has died and risen again, so also will God bring back with Jesus those who sleep in him.","ASV":"But we would not have you ignorant, brethren, concerning them that fall asleep; that ye sorrow not, even as the rest, who have no hope. For if we believe that Jesus died and rose again, even so them also that are fallen asleep in Jesus will God bring with him.","BSB":"Brothers, we do not want you to be uninformed about those who sleep in death, so that you will not grieve like the rest, who are without hope. For since we believe that Jesus died and rose again, we also believe that God will bring with Jesus those who have fallen asleep in Him.","BBE":"But it is our desire, brothers, that you may be certain about those who are sleeping; so that you may have no need for sorrow, as others have who are without hope. For if we have faith that Jesus underwent death and came back again, even so those who are sleeping will come again with him by God's power.","Darby":"But we do not wish you to be ignorant, brethren, concerning them that are fallen asleep, to the end that ye be not grieved even as also the rest who have no hope. For if we believe that Jesus has died and has risen again, so alsoGod will bring with him those who have fallen asleep through Jesus.","Geneva1599":"I would not, brethren, haue you ignorant concerning them which are a sleepe, that ye sorow not euen as other which haue no hope. For if we beleeue that Iesus is dead, and is risen, euen so them which sleepe in Iesus, will God bring with him.","Webster":"But I would not have you to be ignorant, brethren, concerning them who are asleep, that ye sorrow not, even as others who have no hope. For if we believe that Jesus died and rose again, even so them also who sleep in Jesus will God bring with him.","YLT":"And I do not wish you to be ignorant, brethren, concerning those who have fallen asleep, that ye may not sorrow, as also the rest who have not hope, for if we believe that Jesus died and rose again, so also God those asleep through Jesus he will bring with him,","NHEB":"But we do not want you to be ignorant, brothers, concerning those who have fallen asleep, so that you do not grieve like the rest, who have no hope. For if we believe that Jesus died and rose again, even so God will bring with him those who have fallen asleep in Jesus."},"a":{"DRC":"1 Thessalonians 4:12-13"}},{"r":"Revelation 21:4","x":{"KJV":"And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.","DRC":"And God shall wipe away all tears from their eyes: and death shall be no more. Nor mourning, nor crying, nor sorrow shall be any more, for the former things are passed away.","CPDV":"And God will wipe away every tear from their eyes. And death shall be no more. And neither mourning, nor crying out, nor grief shall be anymore. For the first things have passed away.”","ASV":"and he shall wipe away every tear from their eyes; and death shall be no more; neither shall there be mourning, nor crying, nor pain, any more: the first things are passed away.","BSB":"‘He will wipe away every tear from their eyes,’ and there will be no more death or mourning or crying or pain, for the former things have passed away.”","BBE":"And he will put an end to all their weeping; and there will be no more death, or sorrow, or crying, or pain; for the first things have come to an end.","Darby":"And he shall wipe away every tear from their eyes; and death shall not exist any more, nor grief, nor cry, nor distress shall exist any more, for the former things have passed away.","Geneva1599":"And God shall wipe away all teares from their eyes: and there shalbe no more death, neither sorow, neither crying, neither shall there be any more paine: for the first things are passed.","Webster":"And God will wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things have passed away.","YLT":"and God shall wipe away every tear from their eyes, and the death shall not be any more, nor sorrow, nor crying, nor shall there be any more pain, because the first things did go away.'","NHEB":"He will wipe away from them every tear from their eyes. Death will be no more; neither will there be mourning, nor crying, nor pain, any more. The first things have passed away.\""}}],"l":[{"r":"D&C 42:45-46","x":"Thou shalt live together in love, insomuch that thou shalt weep for the loss of them that die, and more especially for those that have not hope of a glorious resurrection. And it shall come to pass that those that die in me shall not taste of death, for it shall be sweet unto them;"},{"r":"Alma 40:12","x":"And then shall it come to pass, that the spirits of those who are righteous are received into a state of happiness, which is called paradise, a state of rest, a state of peace, where they shall rest from all their troubles and from all care, and sorrow."},{"r":"Alma 11:43","x":"The spirit and the body shall be reunited again in its perfect form; both limb and joint shall be restored to its proper frame, even as we now are at this time; and we shall be brought to stand before God, knowing even as we know now, and have a bright recollection of all our guilt."}]},{"id":"losing-a-child","t":"losing a child","g":"Grief and loss","p":["my child died","lost my son","lost my daughter","my baby died"],"k":[],"v":[{"r":"2 Samuel 12:23","x":{"KJV":"But now he is dead, wherefore should I fast? can I bring him back again? I shall go to him, but he shall not return to me.","DRC":"But now that he is dead, why should I fast? Shall I be able to bring him back any more? I shall go to him rather: but he shall not return to me.","CPDV":"But now that he is dead, why should I fast? Would I be able to bring him back anymore? Instead, I will go to him. Yet truly, he will not return to me.”","ASV":"But now he is dead, wherefore should I fast? can I bring him back again? I shall go to him, but he will not return to me.","BSB":"But now that he is dead, why should I fast? Can I bring him back again? I will go to him, but he will not return to me.”","BBE":"But now that the child is dead there is no reason for me to go without food; am I able to make him come back to life? I will go to him, but he will never come back to me.","Darby":"But now he is dead, why should I fast? can I bring him back again? I shall go to him, but he will not return to me.","Geneva1599":"But now being dead, wherefore shoulde I now fast? Can I bring him againe any more? I shall goe to him, but he shall not returne to me.","Webster":"But now he is dead, Why should I fast? can I bring him back again? I shall go to him, but he will not return to me.","YLT":"and now, he hath died, why is this--I fast? am I able to bring him back again? I am going unto him, and he doth not turn back unto me.'","NHEB":"But now he is dead, why should I fast? Can I bring him back again? I shall go to him, but he will not return to me.\""}},{"r":"Isaiah 40:11","x":{"KJV":"He shall feed his flock like a shepherd: he shall gather the lambs with his arm, and carry them in his bosom, and shall gently lead those that are with young.","DRC":"He shall feed his flock like a shepherd: he shall gather together the lambs with his arm, and shall take them up in his bosom, and he himself shall carry them that are with young.","CPDV":"He will pasture his flock like a shepherd. He will gather together the lambs with his arm, and he will lift them up to his bosom, and he himself will carry the very young.","ASV":"He will feed his flock like a shepherd, he will gather the lambs in his arm, and carry them in his bosom, and will gently lead those that have their young.","BSB":"He tends His flock like a shepherd; He gathers the lambs in His arms and carries them close to His heart. He gently leads the nursing ewes.","BBE":"He will give food to his flock like a keeper of sheep; with his arm he will get it together, and will take up the lambs on his breast, gently guiding those which are with young.","Darby":"He will feed his flock like a shepherd: he will gather the lambs with his arm, and carry them in his bosom; he will gently lead those that give suck.","Geneva1599":"He shall feede his flocke like a shepheard: he shall gather the lambes with his arme, and cary them in his bosome, and shall guide them with young.","Webster":"He will feed his flock like a shepherd: he will gather the lambs with his arm, and carry [them] in his bosom, [and] will gently lead those that are with young.","YLT":"As a shepherd His flock He feedeth, With His arm He gathereth lambs, And in His bosom He carrieth them: Suckling ones He leadeth.","NHEB":"He will feed his flock like a shepherd. He will gather the lambs in his arm, and carry them in his bosom. He will gently lead those who have their young."}},{"r":"Matthew 19:14","x":{"KJV":"But Jesus said, Suffer little children, and forbid them not, to come unto me: for of such is the kingdom of heaven.","DRC":"But Jesus said to them: Suffer the little children, and forbid them not to come to me: for the kingdom of heaven is for such.","CPDV":"Yet truly, Jesus said to them: “Allow the little children to come to me, and do not choose to prohibit them. For the kingdom of heaven is among such as these.”","ASV":"But Jesus said, Suffer the little children, and forbid them not, to come unto me: for to such belongeth the kingdom of heaven.","BSB":"But Jesus said, “Let the little children come to Me, and do not hinder them! For the kingdom of heaven belongs to such as these.”","BBE":"But Jesus said, Let the little ones come to me, and do not keep them away: for of such is the kingdom of heaven.","Darby":"But Jesus said, Suffer little children, and do not hinder them from coming to me; for the kingdom of the heavens is of such:","Geneva1599":"But Iesus sayd, Suffer the litle children, and forbid them not to come to me: for of such is the kingdome of heauen.","Webster":"But Jesus said, Suffer little children, and forbid them not to come to me: for of such is the kingdom of heaven.","YLT":"But Jesus said, `Suffer the children, and forbid them not, to come unto me, for of such is the reign of the heavens;'","NHEB":"But Jesus said, \"Allow the little children, and do not forbid them to come to me; for the Kingdom of Heaven belongs to ones like these.\""}}],"l":[{"r":"Moroni 8:12","x":"But little children are alive in Christ, even from the foundation of the world; if not so, God is a partial God, and also a changeable God, and a respecter to persons; for how many little children have died without baptism!"},{"r":"Mosiah 3:16","x":"And even if it were possible that little children could sin they could not be saved; but I say unto you they are blessed; for behold, as in Adam, or by nature, they fall, even so the blood of Christ atoneth for their sins."},{"r":"D&C 137:10","x":"And I also beheld that all children who die before they arrive at the years of accountability are saved in the celestial kingdom of heaven."}]},{"id":"losing-a-parent","t":"losing a parent","g":"Grief and loss","p":["my mom died","my dad died","lost my mother","lost my father"],"k":["mom","dad","mother","father"],"v":[{"r":"Psalms 27:10","x":{"KJV":"When my father and my mother forsake me, then the LORD will take me up.","DRC":"For my father and my mother have left me: but the Lord hath taken me up.","CPDV":"For my father and my mother have left me behind, but the Lord has taken me up.","ASV":"When my father and my mother forsake me, Then Jehovah will take me up.","BSB":"Though my father and mother forsake me, the LORD will receive me.","BBE":"When my father and my mother are turned away from me, then the Lord will be my support.","Darby":"For had my father and my mother forsaken me, then had Jehovah taken me up.","Geneva1599":"Though my father and my mother shoulde forsake me, yet the Lord will gather me vp.","Webster":"When my father and my mother forsake me, then the LORD will take me up.","YLT":"When my father and my mother Have forsaken me, then doth Jehovah gather me.","NHEB":"When my father and my mother forsake me, then the Lord will take me up."},"a":{"DRC":"Psalms 26:10","CPDV":"Psalms 26:10"}},{"r":"John 14:18","x":{"KJV":"I will not leave you comfortless: I will come to you.","DRC":"I will not leave you orphans: I will come to you.","CPDV":"I will not leave you orphans. I will return to you.","ASV":"I will not leave you desolate: I come unto you.","BSB":"I will not leave you as orphans; I will come to you.","BBE":"I will not let you be without a friend: I am coming to you.","Darby":"I will not leave you orphans, I am coming to you.","Geneva1599":"I will not leaue you fatherles: but I will come to you.","Webster":"I will not leave you comfortless; I will come to you.","YLT":"`I will not leave you bereaved, I come unto you;","NHEB":"I will not leave you orphans. I will come to you."}},{"r":"Psalms 116:15","x":{"KJV":"Precious in the sight of the LORD is the death of his saints.","DRC":"The voice of rejoicing and of salvation is in the tabernacles of the just.","CPDV":"A voice of exultation and salvation is in the tabernacles of the just.","ASV":"Precious in the sight of Jehovah Is the death of his saints.","BSB":"Precious in the sight of the LORD is the death of His saints.","BBE":"Dear in the eyes of the Lord is the death of his saints.","Darby":"Precious in the sight of Jehovah is the death of his saints.","Geneva1599":"Precious in the sight of the Lord is the death of his Saintes.","Webster":"Precious in the sight of the LORD [is] the death of his saints.","YLT":"Precious in the eyes of Jehovah is the death for His saints.","NHEB":"Precious in the sight of the Lord is the death of his holy ones."},"a":{"DRC":"Psalms 117:15","CPDV":"Psalms 117:15"}}],"l":[{"r":"D&C 42:45","x":"Thou shalt live together in love, insomuch that thou shalt weep for the loss of them that die, and more especially for those that have not hope of a glorious resurrection."},{"r":"D&C 130:2","x":"And that same sociality which exists among us here will exist among us there, only it will be coupled with eternal glory, which glory we do not now enjoy."},{"r":"Alma 40:12","x":"And then shall it come to pass, that the spirits of those who are righteous are received into a state of happiness, which is called paradise, a state of rest, a state of peace, where they shall rest from all their troubles and from all care, and sorrow."}]},{"id":"losing-a-spouse","t":"losing a spouse","g":"Grief and loss","p":["my husband died","my wife died","widow","widower"],"k":[],"v":[{"r":"Psalms 68:5","x":{"KJV":"A father of the fatherless, and a judge of the widows, is God in his holy habitation.","DRC":"Who is the father of orphans, and the judge of widows. God in his holy place:","CPDV":"the father of orphans and the judge of widows. God is in his holy place.","ASV":"A father of the fatherless, and a judge of the widows, Is God in his holy habitation.","BSB":"A father of the fatherless, and a defender of the widows, is God in His holy habitation.","BBE":"A father to those who have no father, a judge of the widows, is God in his holy place.","Darby":"A father of the fatherless, and a judge of the widows, isGod in his holy habitation.","Geneva1599":"He is a Father of the fatherlesse, and a Iudge of the widowes, euen God in his holy habitation.","Webster":"A father of the fatherless, and a judge of the widows, [is] God in his holy habitation.","YLT":"Father of the fatherless, and judge of the widows, Is God in His holy habitation.","NHEB":"A father of the fatherless, and a defender of the widows, is God in his holy habitation."},"a":{"DRC":"Psalms 67:6","CPDV":"Psalms 67:6"}},{"r":"Isaiah 54:5","x":{"KJV":"For thy Maker is thine husband; the LORD of hosts is his name; and thy Redeemer the Holy One of Israel; The God of the whole earth shall he be called.","DRC":"For he that made thee shall rule over thee, the Lord of hosts is his name: and thy Redeemer, the Holy One of Israel, shall be called the God of all the earth.","CPDV":"For the One who made you will rule over you. The Lord of hosts is his name. And your Redeemer, the Holy One of Israel, will be called the God of all the earth.","ASV":"For thy Maker is thy husband; Jehovah of hosts is his name: and the Holy One of Israel is thy Redeemer; the God of the whole earth shall he be called.","BSB":"For your husband is your Maker— the LORD of Hosts is His name— the Holy One of Israel is your Redeemer; He is called the God of all the earth.","BBE":"For your Maker is your husband; the Lord of armies is his name: and the Holy One of Israel is he who takes up your cause; he will be named the God of all the earth.","Darby":"For thy Maker is thy husband: Jehovah of hosts is his name, and thy Redeemer, the Holy One of Israel: theGod of the whole earth shall he be called.","Geneva1599":"For hee that made thee, is thine husband (whose Name is the Lord of hostes) and thy redeemer the Holy one of Israel, shall be called the God of the whole world.","Webster":"For thy maker [is] thy husband; the LORD of hosts [is] his name; and thy Redeemer the Holy One of Israel; The God of the whole earth shall he be called.","YLT":"For thy Maker is thy husband, Jehovah of Hosts is His name, And thy Redeemer is the Holy One of Israel, `God of all the earth,' He is called.","NHEB":"For your Maker is your husband; the Lord of hosts is his name: and the Holy One of Israel is your Redeemer; the God of the whole earth shall he be called."}},{"r":"Psalms 147:3","x":{"KJV":"He healeth the broken in heart, and bindeth up their wounds.","DRC":"Who healeth the broken of heart, and bindeth up their bruises.","CPDV":"He heals the contrite of heart, and he binds up their sorrows.","ASV":"He healeth the broken in heart, And bindeth up their wounds.","BSB":"He heals the brokenhearted and binds up their wounds.","BBE":"He makes the broken-hearted well, and puts oil on their wounds.","Darby":"He healeth the broken in heart, and bindeth up their wounds.","Geneva1599":"He healeth those that are broken in heart, and bindeth vp their sores.","Webster":"He healeth the broken in heart, and bindeth up their wounds.","YLT":"Who is giving healing to the broken of heart, And is binding up their griefs.","NHEB":"He heals the broken in heart, and binds up their wounds."},"a":{"DRC":"Psalms 146:3","CPDV":"Psalms 146:3"}}],"l":[{"r":"D&C 42:45","x":"Thou shalt live together in love, insomuch that thou shalt weep for the loss of them that die, and more especially for those that have not hope of a glorious resurrection."},{"r":"D&C 130:2","x":"And that same sociality which exists among us here will exist among us there, only it will be coupled with eternal glory, which glory we do not now enjoy."},{"r":"Mosiah 18:9","x":"Yea, and are willing to mourn with those that mourn; yea, and comfort those that stand in need of comfort, and to stand as witnesses of God at all times and in all things, and in all places that ye may be in, even until death, that ye may be redeemed of God, and be numbered with those of the first resurrection, that ye may have eternal life—"}]},{"id":"miscarriage","t":"miscarriage","g":"Grief and loss","p":["lost the baby","miscarried","stillborn","pregnancy loss"],"k":[],"v":[{"r":"Psalms 139:13-16","x":{"KJV":"For thou hast possessed my reins: thou hast covered me in my mother's womb. I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well. My substance was not hid from thee, when I was made in secret, and curiously wrought in the lowest parts of the earth. Thine eyes did see my substance, yet being unperfect; and in thy book all my members were written, which in continuance were fashioned, when as yet there was none of them.","DRC":"For thou hast possessed my reins: thou hast protected me from my mother's womb. I will praise thee, for thou art fearfully magnified: wonderful are thy works, and my soul knoweth right well. My bone is not hidden from thee, which thou hast made in secret: and my substance in the lower parts of the earth. Thy eyes did see my imperfect being, and in thy book all shall be written: days shall be formed, and no one in them.","CPDV":"For you have possessed my temperament. You have supported me from the womb of my mother. I will confess to you, for you have been magnified terribly. Your works are miraculous, as my soul knows exceedingly well. My bone, which you have made in secret, has not been hidden from you, and my substance is in accord with the lower parts of the earth. Your eyes saw my imperfection, and all this shall be written in your book. Days will be formed, and no one shall be in them.","ASV":"For thou didst form my inward parts: Thou didst cover me in my mother’s womb. I will give thanks unto thee; for I am fearfully and wonderfully made: Wonderful are thy works; And that my soul knoweth right well. My frame was not hidden from thee, When I was made in secret, And curiously wrought in the lowest parts of the earth. Thine eyes did see mine unformed substance; And in thy book they were all written, Even the days that were ordained for me, When as yet there was none of them.","BSB":"For You formed my inmost being; You knit me together in my mother’s womb. I praise You, for I am fearfully and wonderfully made. Marvelous are Your works, and I know this very well. My frame was not hidden from You when I was made in secret, when I was woven together in the depths of the earth. Your eyes saw my unformed body; all my days were written in Your book and ordained for me before one of them came to be.","BBE":"My flesh was made by you, and my parts joined together in my mother's body. I will give you praise, for I am strangely and delicately formed; your works are great wonders, and of this my soul is fully conscious. My frame was not unseen by you when I was made secretly, and strangely formed in the lowest parts of the earth. Your eyes saw my unformed substance; in your book all my days were recorded, even those which were purposed before they had come into being.","Darby":"For thou hast possessed my reins; thou didst cover me in my mother's womb. I will praise thee, for I am fearfully, wonderfully made. Marvellous are thy works; and [that] my soul knoweth right well. My bones were not hidden from thee when I was made in secret, curiously wrought in the lower parts of the earth. Thine eyes did see my unformed substance, and in thy book all [my members] were written; [during many] days were they fashioned, when [as yet] there was none of them.","Geneva1599":"For thou hast possessed my reines: thou hast couered me in my mothers wombe. I will praise thee, for I am fearefully and wonderously made: marueilous are thy workes, and my soule knoweth it well. My bones are not hid from thee, though I was made in a secret place, and facioned beneath in the earth. Thine eyes did see me, when I was without forme: for in thy booke were all things written, which in continuance were facioned, when there was none of them before.","Webster":"For thou hast possessed my reins: thou hast covered me in my mother's womb. I will praise thee: for I am fearfully [and] wonderfully made: wonderful [are] thy works; and [that] my soul well knoweth. My substance was not hid from thee when I was made in secret, [and] curiously formed in the lowest parts of the earth. Thy eyes saw my substance, yet being imperfect; and in thy book all [my members] were written, [which] in continuance were fashioned, when [as yet there was] none of them.","YLT":"For Thou--Thou hast possessed my reins, Thou dost cover me in my mother's belly. I confess Thee, because that with wonders I have been distinguished. Wonderful are Thy works, And my soul is knowing it well. My substance was not hid from Thee, When I was made in secret, Curiously wrought in the lower part of earth. Mine unformed substance Thine eyes saw, And on Thy book all of them are written, The days they were formed--And not one among them.","NHEB":"For you formed my inmost being. You knit me together in my mother's womb. I will give thanks to you, for I am fearfully and wonderfully made. Your works are wonderful. My soul knows that very well. My frame wasn't hidden from you, when I was made in secret, woven together in the depths of the earth. Your eyes saw my body. In your book they were all written, the days that were ordained for me, when as yet there were none of them."},"a":{"DRC":"Psalms 138:13-16","CPDV":"Psalms 138:13-16"}},{"r":"Jeremiah 1:5","x":{"KJV":"Before I formed thee in the belly I knew thee; and before thou camest forth out of the womb I sanctified thee, and I ordained thee a prophet unto the nations.","DRC":"Before I formed thee in the bowels of thy mother, I knew thee: and before thou camest forth out of the womb, I sanctified thee, and made thee a prophet unto the nations.","CPDV":"“Before I formed you in the womb, I knew you. And before you went forth from the womb, I sanctified you. And I made you a prophet to the nations.”","ASV":"Before I formed thee in the belly I knew thee, and before thou camest forth out of the womb I sanctified thee; I have appointed thee a prophet unto the nations.","BSB":"“Before I formed you in the womb I knew you, and before you were born I set you apart and appointed you as a prophet to the nations.”","BBE":"Before you were formed in the body of your mother I had knowledge of you, and before your birth I made you holy; I have given you the work of being a prophet to the nations.","Darby":"Before I formed thee in the belly I knew thee; and before thou camest forth out of the womb I hallowed thee, I appointed thee a prophet unto the nations.","Geneva1599":"Before I formed thee in the wombe, I knewe thee, and before thou camest out of the wombe, I sanctified thee, and ordeined thee to be a Prophet vnto the nations.","Webster":"Before I formed thee in embryo I knew thee; and before thou wast born I sanctified thee, [and] I ordained thee a prophet to the nations.","YLT":"`Before I form thee in the belly, I have known thee; and before thou comest forth from the womb I have separated thee, a prophet to nations I have made thee.'","NHEB":"\"Before I formed you in the belly, I knew you. Before you came forth out of the womb, I sanctified you. I have appointed you a prophet to the nations.\""}},{"r":"Psalms 34:18","x":{"KJV":"The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.","DRC":"The Lord is nigh unto them that are of a contrite heart: and he will save the humble of spirit.","CPDV":"The Lord is near to those who are troubled in heart, and he will save the humble in spirit.","ASV":"Jehovah is nigh unto them that are of a broken heart, And saveth such as are of a contrite spirit.","BSB":"The LORD is near to the brokenhearted; He saves the contrite in spirit.","BBE":"The Lord is near the broken-hearted; he is the saviour of those whose spirits are crushed down.","Darby":"Jehovah is nigh to those that are of a broken heart, and saveth them that are of a contrite spirit.","Geneva1599":"The Lord is neere vnto them that are of a contrite heart, and will saue such as be afflicted in Spirite.","Webster":"The LORD [is] nigh to them that are of a broken heart; and saveth such as are of a contrite spirit.","YLT":"Near is Jehovah to the broken of heart, And the bruised of spirit He saveth.","NHEB":"The Lord is near to those who have a broken heart, and saves those who have a crushed spirit."},"a":{"DRC":"Psalms 33:19","CPDV":"Psalms 33:19"}}],"l":[{"r":"Moroni 8:12","x":"But little children are alive in Christ, even from the foundation of the world; if not so, God is a partial God, and also a changeable God, and a respecter to persons; for how many little children have died without baptism!"},{"r":"D&C 137:10","x":"And I also beheld that all children who die before they arrive at the years of accountability are saved in the celestial kingdom of heaven."},{"r":"Mosiah 3:16","x":"And even if it were possible that little children could sin they could not be saved; but I say unto you they are blessed; for behold, as in Adam, or by nature, they fall, even so the blood of Christ atoneth for their sins."}]},{"id":"heaven-and-resurrection","t":"heaven and resurrection","g":"Grief and loss","p":["will I see them again","is there life after death","where are they now","heaven"],"k":[],"v":[{"r":"John 14:2-3","x":{"KJV":"In my Father's house are many mansions: if it were not so, I would have told you. I go to prepare a place for you. And if I go and prepare a place for you, I will come again, and receive you unto myself; that where I am, there ye may be also.","DRC":"In my Father's house there are many mansions. If not, I would have told you: because I go to prepare a place for you. And if I shall go and prepare a place for you, I will come again and will take you to myself: that where I am, you also may be.","CPDV":"In my Father’s house, there are many dwelling places. If there were not, I would have told you. For I go to prepare a place for you. And if I go and prepare a place for you, I will return again, and then I will take you to myself, so that where I am, you also may be.","ASV":"In my Father’s house are many mansions; if it were not so, I would have told you; for I go to prepare a place for you. And if I go and prepare a place for you, I come again, and will receive you unto myself; that where I am, there ye may be also.","BSB":"In My Father’s house are many rooms. If it were not so, would I have told you that I am going there to prepare a place for you? And if I go and prepare a place for you, I will come back and welcome you into My presence, so that you also may be where I am.","BBE":"In my Father's house are rooms enough; if it was not so, would I have said that I am going to make ready a place for you? And if I go and make ready a place for you, I will come back again and will take you to be with me, so that you may be where I am.","Darby":"In my Father's house there are many abodes; were it not so, I had told you: for I go to prepare you a place; and if I go and shall prepare you a place, I am coming again and shall receive you to myself, that where I am ye also may be.","Geneva1599":"In my Fathers house are many dwelling places: if it were not so, I would haue tolde you: I go to prepare a place for you. And if I go to prepare a place for you, I wil come againe, and receiue you vnto my selfe, that where I am, there may ye be also.","Webster":"In my Father's house are many mansions: if [it were] not [so], I would have told you. I go to prepare a place for you. And if I go and prepare a place for you, I will come again and receive you to myself; that where I am, [there] ye may be also.","YLT":"in the house of my Father are many mansions; and if not, I would have told you; I go on to prepare a place for you; and if I go on and prepare for you a place, again do I come, and will receive you unto myself, that where I am ye also may be;","NHEB":"In my Father's house are many dwelling places. If it weren't so, I would have told you; for I go to prepare a place for you. And if I go and prepare a place for you, I will come again, and will receive you to myself; that where I am, you may be there also."}},{"r":"1 Corinthians 15:20-22","x":{"KJV":"But now is Christ risen from the dead, and become the firstfruits of them that slept. For since by man came death, by man came also the resurrection of the dead. For as in Adam all die, even so in Christ shall all be made alive.","DRC":"But now Christ is risen from the dead, the firstfruits of them that sleep: For by a man came death: and by a man the resurrection of the dead. And as in Adam all die, so also in Christ all shall be made alive.","CPDV":"But now Christ has risen again from the dead, as the first-fruits of those who sleep. For certainly, death came through a man. And so, the resurrection of the dead came through a man And just as in Adam all die, so also in Christ all will be brought to life,","ASV":"But now hath Christ been raised from the dead, the firstfruits of them that are asleep. For since by man came death, by man came also the resurrection of the dead. For as in Adam all die, so also in Christ shall all be made alive.","BSB":"But Christ has indeed been raised from the dead, the firstfruits of those who have fallen asleep. For since death came through a man, the resurrection of the dead comes also through a man. For as in Adam all die, so in Christ all will be made alive.","BBE":"But now Christ has truly come back from the dead, the first-fruits of those who are sleeping. For as by man came death, so by man there is a coming back from the dead. For as in Adam death comes to all, so in Christ will all come back to life.","Darby":"(But now Christ is raised from among [the] dead, first-fruits of those fallen asleep. For since by man [came] death, by man also resurrection of [those that are] dead. For as in the Adam all die, thus also in the Christ all shall be made alive.","Geneva1599":"But nowe is Christ risen from the dead, and was made the first fruites of them that slept. For since by man came death, by man came also the resurrection of the dead. For as in Adam all die, euen so in Christ shall all be made aliue,","Webster":"But now is Christ raised from the dead, [and] become the first-fruits of them that slept. For since by man [came] death, by man [came] also the resurrection of the dead. For as in Adam all die, even so in Christ shall all be made alive.","YLT":"And now, Christ hath risen out of the dead--the first-fruits of those sleeping he became, for since through man is the death, also through man is a rising again of the dead, for even as in Adam all die, so also in the Christ all shall be made alive,","NHEB":"But now Christ has been raised from the dead, the first fruits of those who are asleep. For since death came by man, the resurrection of the dead also came by man. For as in Adam all die, so also in Christ all will be made alive."}},{"r":"Revelation 21:4","x":{"KJV":"And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.","DRC":"And God shall wipe away all tears from their eyes: and death shall be no more. Nor mourning, nor crying, nor sorrow shall be any more, for the former things are passed away.","CPDV":"And God will wipe away every tear from their eyes. And death shall be no more. And neither mourning, nor crying out, nor grief shall be anymore. For the first things have passed away.”","ASV":"and he shall wipe away every tear from their eyes; and death shall be no more; neither shall there be mourning, nor crying, nor pain, any more: the first things are passed away.","BSB":"‘He will wipe away every tear from their eyes,’ and there will be no more death or mourning or crying or pain, for the former things have passed away.”","BBE":"And he will put an end to all their weeping; and there will be no more death, or sorrow, or crying, or pain; for the first things have come to an end.","Darby":"And he shall wipe away every tear from their eyes; and death shall not exist any more, nor grief, nor cry, nor distress shall exist any more, for the former things have passed away.","Geneva1599":"And God shall wipe away all teares from their eyes: and there shalbe no more death, neither sorow, neither crying, neither shall there be any more paine: for the first things are passed.","Webster":"And God will wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things have passed away.","YLT":"and God shall wipe away every tear from their eyes, and the death shall not be any more, nor sorrow, nor crying, nor shall there be any more pain, because the first things did go away.'","NHEB":"He will wipe away from them every tear from their eyes. Death will be no more; neither will there be mourning, nor crying, nor pain, any more. The first things have passed away.\""}}],"l":[{"r":"Alma 11:43-44","x":"The spirit and the body shall be reunited again in its perfect form; both limb and joint shall be restored to its proper frame, even as we now are at this time; and we shall be brought to stand before God, knowing even as we know now, and have a bright recollection of all our guilt. Now, this restoration shall come to all, both old and young, both bond and free, both male and female, both the wicked and the righteous; and even there shall not so much as a hair of their heads be lost; but every thing shall be restored to its perfect frame, as it is now, or in the body, and shall be brought and be arraigned before the bar of Christ the Son, and God the Father, and the Holy Spirit, which is one Eternal God, to be judged according to their works, whether they be good or whether they be evil."},{"r":"Alma 40:23","x":"The soul shall be restored to the body, and the body to the soul; yea, and every limb and joint shall be restored to its body; yea, even a hair of the head shall not be lost; but all things shall be restored to their proper and perfect frame."},{"r":"D&C 76:62","x":"These shall dwell in the presence of God and his Christ forever and ever."}]},{"id":"missing-someone","t":"missing someone","g":"Grief and loss","p":["I miss them","I miss her","I miss him","they're gone"],"k":[],"v":[{"r":"1 Thessalonians 4:13-14","x":{"KJV":"But I would not have you to be ignorant, brethren, concerning them which are asleep, that ye sorrow not, even as others which have no hope. For if we believe that Jesus died and rose again, even so them also which sleep in Jesus will God bring with him.","DRC":"And we will not have you ignorant brethren, concerning them that are asleep, that you be not sorrowful, even as others who have no hope. For if we believe that Jesus died and rose again: even so them who have slept through Jesus, will God bring with him.","CPDV":"And we do not want you to be ignorant, brothers, concerning those who are sleeping, so as not to be sorrowful, like these others who do not have hope. For if we believe that Jesus has died and risen again, so also will God bring back with Jesus those who sleep in him.","ASV":"But we would not have you ignorant, brethren, concerning them that fall asleep; that ye sorrow not, even as the rest, who have no hope. For if we believe that Jesus died and rose again, even so them also that are fallen asleep in Jesus will God bring with him.","BSB":"Brothers, we do not want you to be uninformed about those who sleep in death, so that you will not grieve like the rest, who are without hope. For since we believe that Jesus died and rose again, we also believe that God will bring with Jesus those who have fallen asleep in Him.","BBE":"But it is our desire, brothers, that you may be certain about those who are sleeping; so that you may have no need for sorrow, as others have who are without hope. For if we have faith that Jesus underwent death and came back again, even so those who are sleeping will come again with him by God's power.","Darby":"But we do not wish you to be ignorant, brethren, concerning them that are fallen asleep, to the end that ye be not grieved even as also the rest who have no hope. For if we believe that Jesus has died and has risen again, so alsoGod will bring with him those who have fallen asleep through Jesus.","Geneva1599":"I would not, brethren, haue you ignorant concerning them which are a sleepe, that ye sorow not euen as other which haue no hope. For if we beleeue that Iesus is dead, and is risen, euen so them which sleepe in Iesus, will God bring with him.","Webster":"But I would not have you to be ignorant, brethren, concerning them who are asleep, that ye sorrow not, even as others who have no hope. For if we believe that Jesus died and rose again, even so them also who sleep in Jesus will God bring with him.","YLT":"And I do not wish you to be ignorant, brethren, concerning those who have fallen asleep, that ye may not sorrow, as also the rest who have not hope, for if we believe that Jesus died and rose again, so also God those asleep through Jesus he will bring with him,","NHEB":"But we do not want you to be ignorant, brothers, concerning those who have fallen asleep, so that you do not grieve like the rest, who have no hope. For if we believe that Jesus died and rose again, even so God will bring with him those who have fallen asleep in Jesus."},"a":{"DRC":"1 Thessalonians 4:12-13"}},{"r":"Psalms 30:5","x":{"KJV":"For his anger endureth but a moment; in his favour is life: weeping may endure for a night, but jo
