y thy soul in drouth, and make fat thy bones: and thou shalt be like a watered garden, and like a spring of water, whose waters fail not.","YLT":"And Jehovah doth lead thee continually, And hath satisfied in drought thy soul, And thy bones He armeth, And thou hast been as a watered garden, And as an outlet of waters, whose waters lie not.","NHEB":"and the Lord will guide you continually, and satisfy your soul in dry places, and make strong your bones; and you shall be like a watered garden, and like a spring of water, whose waters do not fail."}}],"l":[{"r":"Alma 5:26","x":"And now behold, I say unto you, my brethren, if ye have experienced a change of heart, and if ye have felt to sing the song of redeeming love, I would ask, can ye feel so now?"},{"r":"Alma 32:41","x":"But if ye will nourish the word, yea, nourish the tree as it beginneth to grow, by your faith with great diligence, and with patience, looking forward to the fruit thereof, it shall take root; and behold it shall be a tree springing up unto everlasting life."},{"r":"2 Nephi 32:3","x":"Angels speak by the power of the Holy Ghost; wherefore, they speak the words of Christ. Wherefore, I said unto you, feast upon the words of Christ; for behold, the words of Christ will tell you all things what ye should do."}]},{"id":"questions-about-god","t":"questions about God","g":"Faith and doubt","p":["who is God","is God real","what is God like","nature of God"],"k":[],"v":[{"r":"1 John 4:8","x":{"KJV":"He that loveth not knoweth not God; for God is love.","DRC":"He that loveth not knoweth not God: for God is charity.","CPDV":"Whoever does not love, does not know God. For God is love.","ASV":"He that loveth not knoweth not God; for God is love.","BSB":"Whoever does not love does not know God, because God is love.","BBE":"He who has no love has no knowledge of God, because God is love.","Darby":"He that loves not has not knownGod; forGod is love.","Geneva1599":"Hee that loueth not, knoweth not God: for God is loue.","Webster":"He that loveth not, knoweth not God; for God is love.","YLT":"he who is not loving did not know God, because God is love.","NHEB":"He who does not love does not know God, for God is love."}},{"r":"Exodus 34:6","x":{"KJV":"And the LORD passed by before him, and proclaimed, The LORD, The LORD God, merciful and gracious, longsuffering, and abundant in goodness and truth,","DRC":"And when he passed before him, he said: O the Lord, the Lord God, merciful and gracious, patient and of much compassion, and true,","CPDV":"And as he was crossing before him, he said: “The Ruler, the Lord God, merciful and lenient, patient and full of compassion and also truthful,","ASV":"And Jehovah passed by before him, and proclaimed, Jehovah, Jehovah, a God merciful and gracious, slow to anger, and abundant in lovingkindness and truth;","BSB":"Then the LORD passed in front of Moses and called out: “The LORD, the LORD God, is compassionate and gracious, slow to anger, abounding in loving devotion and faithfulness,","BBE":"And the Lord went past before his eyes, saying, The Lord, the Lord, a God full of pity and grace, slow to wrath and great in mercy and faith;","Darby":"And Jehovah passed by before his face, and proclaimed, Jehovah, JehovahGod merciful and gracious, slow to anger, and abundant in goodness and truth,","Geneva1599":"So the Lord passed before his face, and cried, The Lord, the Lord, strong, mercifull, and gracious, slowe to anger, and abundant in goodnesse and trueth,","Webster":"And the LORD passed by before him, and proclaimed, The LORD, The LORD God, merciful and gracious, long-suffering, and abundant in goodness and truth.","YLT":"and Jehovah passeth over before his face, and calleth: `Jehovah, Jehovah God, merciful and gracious, slow to anger, and abundant in kindness and truth,","NHEB":"The Lord passed by before him, and proclaimed, \"The Lord, the Lord, a merciful and gracious God, slow to anger, and abundant in loving kindness and truth,"}},{"r":"Isaiah 55:8-9","x":{"KJV":"For my thoughts are not your thoughts, neither are your ways my ways, saith the LORD. For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","DRC":"For my thoughts are not your thoughts: nor your ways my ways, saith the Lord. For as the heavens are exalted above the earth, so are my ways exalted above your ways, and my thoughts above your thoughts.","CPDV":"For my thoughts are not your thoughts, and your ways are not my ways, says the Lord. For just as the heavens are exalted above the earth, so also are my ways exalted above your ways, and my thoughts above your thoughts.","ASV":"For my thoughts are not your thoughts, neither are your ways my ways, saith Jehovah. For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","BSB":"“For My thoughts are not your thoughts, neither are your ways My ways,” declares the LORD. “For as the heavens are higher than the earth, so My ways are higher than your ways and My thoughts than your thoughts.","BBE":"For my thoughts are not your thoughts, or your ways my ways, says the Lord. For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","Darby":"For my thoughts are not your thoughts, neither are your ways my ways, saith Jehovah. For [as] the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","Geneva1599":"For my thoughtes are not your thoughts, neither are your wayes my wayes, sayth the Lord. For as ye heauens are higher then the earth, so are my wayes higher then your wayes, and my thoughtes aboue your thoughts.","Webster":"For my thoughts [are] not your thoughts, neither [are] your ways my ways, saith the LORD. For [as] the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","YLT":"For not My thoughts are your thoughts, Nor your ways My ways, --an affirmation of Jehovah, For high have the heavens been above the earth, So high have been My ways above your ways, And My thoughts above your thoughts.","NHEB":"\"For my thoughts are not your thoughts, neither are your ways my ways,\" says the Lord. \"For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts."}}],"l":[{"r":"Moroni 10:4-5","x":"And when ye shall receive these things, I would exhort you that ye would ask God, the Eternal Father, in the name of Christ, if these things are not true; and if ye shall ask with a sincere heart, with real intent, having faith in Christ, he will manifest the truth of it unto you, by the power of the Holy Ghost. And by the power of the Holy Ghost ye may know the truth of all things."},{"r":"D&C 130:22","x":"The Father has a body of flesh and bones as tangible as man's; the Son also; but the Holy Ghost has not a body of flesh and bones, but is a personage of Spirit. Were it not so, the Holy Ghost could not dwell in us."},{"r":"Moses 1:39","x":"For behold, this is my work and my glory—to bring to pass the immortality and eternal life of man."}]},{"id":"feeling-far-from-god","t":"feeling far from God","g":"Faith and doubt","p":["far from God","God feels distant","where is God","abandoned by God"],"k":[],"v":[{"r":"James 4:8","x":{"KJV":"Draw nigh to God, and he will draw nigh to you. Cleanse your hands, ye sinners; and purify your hearts, ye double minded.","DRC":"Draw nigh to God: and he will draw nigh to you. Cleanse your hands, ye sinners, and purify your hearts, ye double minded.","CPDV":"Draw near to God, and he will draw near to you. Cleanse your hands, you sinners! And purify your hearts, you duplicitous souls!","ASV":"Draw nigh to God, and he will draw nigh to you. Cleanse your hands, ye sinners; and purify your hearts, ye doubleminded.","BSB":"Draw near to God, and He will draw near to you. Cleanse your hands, you sinners, and purify your hearts, you double-minded.","BBE":"Come near to God and he will come near to you. Make your hands clean, you evil-doers; put away deceit from your hearts, you false in mind.","Darby":"Draw near toGod, and he will draw near to you. Cleanse [your] hands, sinners, and purify [your] hearts, ye double-minded.","Geneva1599":"Drawe neere to God, and he will drawe neere to you. Clense your handes, ye sinners, and purge your hearts, ye double minded.","Webster":"Draw nigh to God, and he will draw nigh to you. Cleanse [your] hands, [ye] sinners, and purify [your] hearts, [ye] double-minded.","YLT":"draw nigh to God, and He will draw nigh to you; cleanse hands, ye sinners! and purify hearts, ye two-souled!","NHEB":"Draw near to God, and he will draw near to you. Cleanse your hands, you sinners; and purify your hearts, you double-minded."}},{"r":"Psalms 139:7-10","x":{"KJV":"Whither shall I go from thy spirit? or whither shall I flee from thy presence? If I ascend up into heaven, thou art there: if I make my bed in hell, behold, thou art there. If I take the wings of the morning, and dwell in the uttermost parts of the sea; Even there shall thy hand lead me, and thy right hand shall hold me.","DRC":"Whither shall I go from thy spirit? or whither shall I flee from thy face? If I ascend into heaven, thou art there: if I descend into hell, thou art present. If I take my wings early in the morning, and dwell in the uttermost parts of the sea: Even there also shall thy hand lead me: and thy right hand shall hold me.","CPDV":"Where will I go from your Spirit? And where will I flee from your face? If I ascend into heaven, you are there. If I descend into Hell, you are near. If I assume my feathers in early morning, and dwell in the utmost parts of the sea, even there, your hand will lead me forth, and your right hand will hold me.","ASV":"Whither shall I go from thy Spirit? Or whither shall I flee from thy presence? If I ascend up into heaven, thou art there: If I make my bed in Sheol, behold, thou art there. If I take the wings of the morning, And dwell in the uttermost parts of the sea; Even there shall thy hand lead me, And thy right hand shall hold me.","BSB":"Where can I go to escape Your Spirit? Where can I flee from Your presence? If I ascend to the heavens, You are there; if I make my bed in Sheol, You are there. If I rise on the wings of the dawn, if I settle by the farthest sea, even there Your hand will guide me; Your right hand will hold me fast.","BBE":"Where may I go from your spirit? how may I go in flight from you? If I go up to heaven, you are there: or if I make my bed in the underworld, you are there. If I take the wings of the morning, and go to the farthest parts of the sea; Even there will I be guided by your hand, and your right hand will keep me.","Darby":"Whither shall I go from thy Spirit? and whither flee from thy presence? If I ascend up into the heavens thou art there; or if I make my bed in Sheol, behold, thou [art there]; [If] I take the wings of the dawn [and] dwell in the uttermost parts of the sea, Even there shall thy hand lead me, and thy right hand shall hold me.","Geneva1599":"Whither shall I goe from thy Spirite? or whither shall I flee from thy presence? If I ascende into heauen, thou art there: if I lye downe in hell, thou art there. Let mee take the winges of the morning, and dwell in the vttermost parts of the sea: Yet thither shall thine hand leade me, and thy right hand holde me.","Webster":"Whither shall I go from thy spirit? or whither shall I flee from thy presence? If I ascend into heaven, thou [art] there: if I make my bed in hell, behold, thou [art there]. [If] I take the wings of the morning, [and] dwell in the uttermost parts of the sea; Even there shall thy hand lead me, and thy right hand shall hold me.","YLT":"Whither do I go from Thy Spirit? And whither from Thy face do I flee? If I ascend the heavens--there Thou art, And spread out a couch in Sheol, lo, Thee! I take the wings of morning, I dwell in the uttermost part of the sea, Also there Thy hand doth lead me, And Thy right hand doth hold me.","NHEB":"Where could I go from your Spirit? Or where could I flee from your presence? If I ascend up into heaven, you are there. If I make my bed in Sheol, behold, you are there! If I take the wings of the dawn, and settle in the uttermost parts of the sea; Even there your hand will lead me, and your right hand will hold me."},"a":{"DRC":"Psalms 138:7-10","CPDV":"Psalms 138:7-10"}},{"r":"Acts 17:27","x":{"KJV":"That they should seek the Lord, if haply they might feel after him, and find him, though he be not far from every one of us:","DRC":"That they should seek God, if haply they may feel after him or find him, although he be not far from every one of us.","CPDV":"so as to seek God, if perhaps they may consider him or find him, though he is not far from each one of us.","ASV":"that they should seek God, if haply they might feel after him and find him, though he is not far from each one of us:","BSB":"God intended that they would seek Him and perhaps reach out for Him and find Him, though He is not far from each one of us.","BBE":"So that they might make search for God, in order, if possible, to get knowledge of him and make discovery of him, though he is not far from every one of us:","Darby":"that they may seekGod; if indeed they might feel after him and find him, although he is not far from each one of us:","Geneva1599":"That they shoulde seeke the Lord, if so be they might haue groped after him, and founde him though doubtlesse he be not farre from euery one of vs.","Webster":"That they should seek the Lord, if haply they might feel after him, and find him, though he is not far from every one of us:","YLT":"to seek the Lord, if perhaps they did feel after Him and find, --though, indeed, He is not far from each one of us,","NHEB":"that they should seek God, if perhaps they might reach out for him and find him, though he is not far f e eat: or what shall we drink, or wherewith shall we be clothed? For after all these things do the heathens seek. For your Father knoweth that you have need of all these things. Seek ye therefore first the kingdom of God, and his justice, and all these things shall be added unto you.","CPDV":"Therefore, do not choose to be anxious, saying: ‘What shall we eat, and what shall we drink, and with what shall we be clothed?’ For the Gentiles seek all these things. Yet your Father knows that you need all these things. Therefore, seek first the kingdom of God and his justice, and all these things shall be added to you as well.","ASV":"Be not therefore anxious, saying, What shall we eat? or, What shall we drink? or, Wherewithal shall we be clothed? For after all these things do the Gentiles seek; for your heavenly Father knoweth that ye have need of all these things. But seek ye first his kingdom, and his righteousness; and all these things shall be added unto you.","BSB":"Therefore do not worry, saying, ‘What shall we eat?’ or ‘What shall we drink?’ or ‘What shall we wear?’ For the Gentiles strive after all these things, and your heavenly Father knows that you need them. But seek first the kingdom of God and His righteousness, and all these things will be added unto you.","BBE":"Then do not be full of care, saying, What are we to have for food or drink? or, With what may we be clothed? Because the Gentiles go in search of all these things: for your Father in heaven has knowledge that you have need of all these things: But let your first care be for his kingdom and his righteousness; and all these other things will be given to you in addition.","Darby":"Be not therefore careful, saying, What shall we eat? or What shall we drink? or What shall we put on? for all these things the nations seek after; for your heavenly Father knows that ye have need of all these things. But seek ye first the kingdom ofGod and his righteousness, and all these things shall be added unto you.","Geneva1599":"Therefore take no thought, saying, What shall we eate? or what shall we drinke? or where with shall we be clothed? (For after all these things seeke the Gentiles) for your heauenly Father knoweth, that ye haue neede of all these things. But seeke ye first the kingdome of God, and his righteousnesse, and all these things shall be ministred vnto you.","Webster":"Therefore be not anxious, saying, What shall we eat? or what shall we drink? or, with what shall we be clothed? (For after all these things do the Gentiles seek) for your heavenly Father knoweth that ye have need of all these things. But seek ye first the kingdom of God, and his righteousness, and all these things shall be added to you.","YLT":"therefore ye may not be anxious, saying, What may we eat? or, What may we drink? or, What may we put round? for all these do the nations seek for, for your heavenly Father doth know that ye have need of all these; but seek ye first the reign of God and His righteousness, and all these shall be added to you.","NHEB":"\"Therefore do not be anxious, saying, 'What will we eat?', 'What will we drink?' or, 'With what will we be clothed?' For the Gentiles seek after all these things, for your heavenly Father knows that you need all these things. But seek first his Kingdom, and his righteousness; and all these things will be given to you as well."}}],"l":[{"r":"3 Nephi 13:33","x":"But seek ye first the kingdom of God and his righteousness, and all these things shall be added unto you."},{"r":"D&C 90:24","x":"Search diligently, pray always, and be believing, and all things shall work together for your good, if ye walk uprightly and remember the covenant wherewith ye have covenanted one with another."},{"r":"Alma 36:3","x":"And now, O my son Helaman, behold, thou art in thy youth, and therefore, I beseech of thee that thou wilt hear my words and learn of me; for I do know that whosoever shall put their trust in God shall be supported in their trials, and their troubles, s servant to the lender."}},{"r":"Psalms 37:21","x":{"KJV":"The wicked borroweth, and payeth not again: but the righteous sheweth mercy, and giveth.","DRC":"The sinner shall borrow, and not pay again; but the just sheweth mercy and shall give.","CPDV":"The sinner will lend and not release, but the just one shows compassion and donates.","ASV":"The wicked borroweth, and payeth not again; But the righteous dealeth graciously, and giveth.","BSB":"The wicked borrow and do not repay, but the righteous are gracious and giving.","BBE":"The sinner takes money and does not give it back; but the upright man has mercy, and gives to others.","Darby":"The wicked borroweth, and payeth not again; but the righteous is gracious and giveth:","Geneva1599":"The wicked boroweth and payeth not againe. but the righteous is mercifull, and giueth.","Webster":"The wicked borroweth, and payeth not again: but the righteous showeth mercy, and giveth.","YLT":"The wicked is borrowing and repayeth not, And the righteous is gracious and giving.","NHEB":"The wicked borrow, and do not pay back, but the righteous give generously."},"a":{"DRC":"Psalms 36:21","CPDV":"Psalms 36:21"}}],"l":[{"r":"D&C 19:35","x":"Pay the debt thou hast contracted with the printer. Release thyself from bondage."},{"r":"D&C 104:78","x":"And again, verily I say unto you, concerning your debts—behold it is my will that you shall pay all your debts."},{"r":"Mosiah 4:28","x":"And I would that ye should remember, that whosoever among you borroweth of his neighbor should return the thing that he borroweth, according as he doth agree, or else thou shalt commit sin; and perhaps thou shalt cause thy neighbor to commit sin also."}]},{"id":"generosity","t":"generosity","g":"Work and money","p":["give","generous","tithing","donate","share what I have"],"k":[],"v":[{"r":"2 Corinthians 9:7","x":{"KJV":"Every man according as he purposeth in his heart, so let him give; not grudgingly, or of necessity: for God loveth a cheerful giver.","DRC":"Every one as he hath determined in his heart, not with sadness or of necessity: for God loveth a cheerful giver.","CPDV":"each one giving, just as he has determined in his heart, neither out of sadness, nor out of obligation. For God loves a cheerful giver.","ASV":"Let each man do according as he hath purposed in his heart: not grudgingly, or of necessity: for God loveth a cheerful giver.","BSB":"Each one should give what he has decided in his heart to give, not out of regret or compulsion. For God loves a cheerful giver.","BBE":"Let every man do after the purpose of his heart; not giving with grief, or by force: for God takes pleasure in a ready giver.","Darby":"each according as he is purposed in his heart; not grievingly, or of necessity; forGod loves a cheerful giver.","Geneva1599":"As euery man wisheth in his heart, so let him giue, not grudgingly, or of necessitie: for God loueth a cheerefull giuer.","Webster":"Every man according as he purposeth in his heart, [so let him give]; not grudgingly, or by constraint: for God loveth a cheerful giver.","YLT":"each one, according as he doth purpose in heart, not out of sorrow or out of necessity, for a cheerful giver doth God love,","NHEB":"Let each man give according as he has determined in his heart; not grudgingly, or under compulsion; for God loves a cheerful giver."}},{"r":"Acts 20:35","x":{"KJV":"I have shewed you all things, how that so labouring ye ought to support the weak, and to remember the words of the Lord Jesus, how he said, It is more blessed to give than to receive.","DRC":"I have shewed you all things, how that so labouring you ought to support the weak and to remember the word of the Lord Jesus, how he said: It is a more blessed thing to give, rather than to receive.","CPDV":"I have revealed all things to you, because by laboring in this way, it is necessary to support the weak and to remember the words of the Lord Jesus, how he said, ‘It is more blessed to give than to receive.’”","ASV":"In all things I gave you an example, that so laboring ye ought to help the weak, and to remember the words of the Lord Jesus, that he himself said, It is more blessed to give than to receive.","BSB":"In everything, I showed you that by this kind of hard work we must help the weak, remembering the words of the Lord Jesus Himself: ‘It is more blessed to give than to receive.’”","BBE":"In all things I was an example to you of how, in your lives, you are to give help to the feeble, and keep in memory the words of the Lord Jesus, how he himself said, There is a greater blessing in giving than in getting.","Darby":"I have shewed you all things, that thus labouring [we] ought to come in aid of the weak, and to remember the words of the Lord Jesus, that he himself said, It is more blessed to give than to receive.","Geneva1599":"I haue shewed you all things, howe that so labouring, ye ought to support the weake, and to remember the wordes of the Lord Iesus, howe that hee saide, It is a blessed thing to giue, rather then to receiue.","Webster":"I have shown you all things, that so laboring ye ought to support the weak, and to remember the words of the Lord Jesus, that he said, It is more blessed to give than to receive.","YLT":"all things I did shew you, that, thus labouring, it behoveth us to partake with the ailing, to be mindful also of the words of the Lord Jesus, that he himself said, It is more blessed to give than to receive.'","NHEB":"In all things I gave you an example, that so laboring you ought to help the weak, and to remember the words of the Lord Jesus, that he himself said, 'It is more blessed to give than to receive.'\""}},{"r":"Luke 6:38","x":{"KJV":"Give, and it shall be given unto you; good measure, pressed down, and shaken together, and running over, shall men give into your bosom. For with the same measure that ye mete withal it shall be measured to you again.","DRC":"Give: and it shall be given to you: good measure and pressed down and shaken together and running over shall they give into your bosom. For with the same measure that you shall mete withal, it shall be measured to you again.","CPDV":"Give, and it will be given to you: a good measure, pressed down and shaken together and overflowing, they will place upon your lap. Certainly, the same measure that you use to measure out, will be used to measure back to you again.”","ASV":"give, and it shall be given unto you; good measure, pressed down, shaken together, running over, shall they give into your bosom. For with what measure ye mete it shall be measured to you again.","BSB":"Give, and it will be given to you. A good measure, pressed down, shaken together, and running over will be poured into your lap. For with the measure you use, it will be measured back to you.”","BBE":"Give, and it will be given to you; good measure, crushed down, full and running over, they will give to you. For in the same measure as you give, it will be given to you again.","Darby":"Give, and it shall be given to you; good measure, pressed down, and shaken together, and running over, shall be given into your bosom: for with the same measure with which ye mete it shall be measured to you again.","Geneva1599":"Giue, and it shalbe giuen vnto you: a good measure, pressed downe, shaken together and running ouer shall men giue into your bosome: for with what measure ye mete, with the same shall men mete to you againe.","Webster":"Give, and it shall be given to you; good measure, pressed down, and shaken together, and running over, shall men give into your bosom. For with the same measure that ye give [to others], it shall be measured to you again.","YLT":"`Give, and it shall be given to you; good measure, pressed, and shaken, and running over, they shall give into your bosom; for with that measure with which ye measure, it shall be measured to you again.'","NHEB":"\"Give, and it will be given to you: good measure, pressed down, shaken together, and running over, will be given to you. For with the same measure you measure it will be measured back to you.\""}}],"l":[{"r":"Mosiah 4:21","x":"And now, if God, who has created you, on whom you are dependent for your lives and for all that ye have and are, doth grant unto you whatsoever ye ask that is right, in faith, believing that ye shall receive, O then, how ye ought to impart of the substance that ye have one to another."},{"r":"Mosiah 4:26","x":"And now, for the sake of these things which I have spoken unto you—that is, for the sake of retaining a remission of your sins from day to day, that ye may walk guiltless before God—I would that ye should impart of your substance to the poor, every man according to that which he hath, such as feeding the hungry, clothing the naked, visiting the sick and administering to their relief, both spiritually and temporally, according to their wants."},{"r":"Jacob 2:17","x":"Think of your brethren like unto yourselves, and be familiar with all and free with your substance, that they may be rich like unto you."}]},{"id":"greed","t":"greed","g":"Work and money","p":["greedy","love of money","want more money","materialism"],"k":[],"v":[{"r":"Luke 12:15","x":{"KJV":"And he said unto them, Take heed, and beware of covetousness: for a man's life consisteth not in the abundance of the things which he possesseth.","DRC":"And he said to them: Take heed and beware of all covetousness: for a man's life doth not consist in the abundance of things which he possesseth.","CPDV":"So he said to them: “Be cautious and wary of all avarice. For a person’s life is not found in the abundance of the things that he possesses.”","ASV":"And he said unto them, Take heed, and keep yourselves from all covetousness: for a man’s life consisteth not in the abundance of the things which he possesseth.","BSB":"And He said to them, “Watch out! Guard yourselves against every form of greed, for one’s life does not consist in the abundance of his possessions.”","BBE":"And he said to them, Take care to keep yourselves free from the desire for property; for a man's life is not made up of the number of things which he has.","Darby":"And he said to them, Take heed and keep yourselves from all covetousness, for [it is] not because a man is in abundance [that] his life is in his possessions.","Geneva1599":"Wherefore he said vnto them, Take heede, and beware of couetousnesse: for though a man haue abundance, yet his life standeth not in his riches.","Webster":"And he said to them, Take heed, and beware of covetousness: for a man's life consisteth not in the abundance of the things which he possesseth.","YLT":"And he said unto them, `Observe, and beware of the covetousness, because not in the abundance of one's goods is his life.'","NHEB":"He said to them, \"Beware! Keep yourselves from all covetousness, for a man's life does not consist of the abundance of the things which he possesses.\""}},{"r":"1 Timothy 6:10","x":{"KJV":"For the love of money is the root of all evil: which while some coveted after, they have erred from the faith, and pierced themselves through with many sorrows.","DRC":"For the desire of money is the root of all evils; which some coveting have erred from the faith and have entangled themselves in many sorrows.","CPDV":"For desire is the root of all evils. Some persons, hungering in this way, have strayed from the faith and have entangled themselves in many sorrows.","ASV":"For the love of money is a root of all kinds of evil: which some reaching after have been led astray from the faith, and have pierced themselves through with many sorrows.","BSB":"For the love of money is the root of all kinds of evil. By craving it, some have wandered away from the faith and pierced themselves with many sorrows.","BBE":"For the love of money is a root of all evil: and some whose hearts were fixed on it have been turned away from the faith, and been wounded with unnumbered sorrows.","Darby":"For the love of money is [the] root of every evil; which some having aspired after, have wandered from the faith, and pierced themselves with many sorrows.","Geneva1599":"For the desire of money is the roote of all euill, which while some lusted after, they erred from the faith, and pearced themselues through with many sorowes.","Webster":"For the love of money is the root of all evil: which while some have coveted, they have erred from the faith, and pierced themselves through with many sorrows.","YLT":"for a root of all the evils is the love of money, which certain longing for did go astray from the faith, and themselves did pierce through with many sorrows;","NHEB":"For the love of money is a root of all kinds of evil. Some have been led astray from the faith in their greed, and have pierced themselves through with many sorrows."}},{"r":"Matthew 6:19-21","x":{"KJV":"Lay not up for yourselves treasures upon earth, where moth and rust doth corrupt, and where thieves break through and steal: But lay up for yourselves treasures in heaven, where neither moth nor rust doth corrupt, and where thieves do not break through nor steal: For where your treasure is, there will your heart be also.","DRC":"Lay not up to yourselves treasures on earth: where the rust, and moth consume, and where thieves break through, and steal. But lay up to yourselves treasures in heaven: where neither the rust nor moth doth consume, and where thieves do not break through, nor steal. For where thy treasure is, there is thy heart also.","CPDV":"Instead, store up for yourselves treasures in heaven: where neither rust nor moth consumes, and where thieves do not break in and steal. For where your treasure is, there also is your heart. The lamp of your body is your eye. If your eye is wholesome, your entire body will be filled with light.","ASV":"Lay not up for yourselves treasures upon the earth, where moth and rust consume, and where thieves break through and steal: but lay up for yourselves treasures in heaven, where neither moth nor rust doth consume, and where thieves do not break through nor steal: for where thy treasure is, there will thy heart be also.","BSB":"Do not store up for yourselves treasures on earth, where moth and rust destroy, and where thieves break in and steal. But store up for yourselves treasures in heaven, where moth and rust do not destroy, and where thieves do not break in and steal. For where your treasure is, there your heart will be also.","BBE":"Make no store of wealth for yourselves on earth, where it may be turned to dust by worms and weather, and where thieves may come in by force and take it away. But make a store for yourselves in heaven, where it will not be turned to dust and where thieves do not come in to take it away: For where your wealth is, there will your heart be.","Darby":"Lay not up for yourselves treasures upon the earth, where moth and rust spoils, and where thieves dig through and steal; but lay up for yourselves treasures in heaven, where neither moth nor rust spoils, and where thieves do not dig through nor steal; for where thy treasure is, there will be also thy heart.","Geneva1599":"Lay not vp treasures for your selues vpon the earth, where the mothe and canker corrupt, and where theeues digge through and steale. But lay vp treasures for your selues in heauen, where neither the mothe nor canker corrupteth, and where theeues neither digge through, nor steale. For where your treasure is, there will your heart be also.","Webster":"Lay not up for yourselves treasures upon earth, where moth and rust doth corrupt, and where thieves break through and steal: But lay up for yourselves treasures in heaven, where neither moth nor rust doth corrupt, and where thieves do not break through nor steal. For where your treasure is, there will your heart be also.","YLT":"`Treasure not up to yourselves treasures on the earth, where moth and rust disfigure, and where thieves break through and steal, but treasure up to yourselves treasures in heaven, where neither moth nor rust doth disfigure, and where thieves do not break through nor steal, for where your treasure is, there will be also your heart.","NHEB":"\"Do not lay up treasures for yourselves on the earth, where moth and rust consume, and where thieves break through and steal; but lay up for yourselves treasures in heaven, where neither moth nor rust consume, and where thieves do not break through and steal; for where your treasure is, there your heart will be also."},"a":{"CPDV":"Matthew 6:20-22"}}],"l":[{"r":"Jacob 2:18-19","x":"But before ye seek for riches, seek ye for the kingdom of God. And after ye have obtained a hope in Christ ye shall obtain riches, if ye seek them; and ye will seek them for the intent to do good—to clothe the naked, and to feed the hungry, and to liberate the captive, and administer relief to the sick and the afflicted."},{"r":"D&C 6:7","x":"Seek not for riches but for wisdom, and behold, the mysteries of God shall be unfolded unto you, and then shall you be made rich. Behold, he that hath eternal life is rich."},{"r":"2 Nephi 9:30","x":"But wo unto the rich, who are rich as to the things of the world. For because they are rich they despise the poor, and they persecute the meek, and their hearts are upon their treasures; wherefore, their treasure is their god. And behold, their treasure shall perish with them also."}]},{"id":"provision","t":"provision","g":"Work and money","p":["will God provide","daily bread","enough to eat","needs met"],"k":[],"v":[{"r":"Philippians 4:19","x":{"KJV":"But my God shall supply all your need according to his riches in glory by Christ Jesus.","DRC":"And may my God supply all your want, according to his riches in glory in Christ Jesus.","CPDV":"And may my God fulfill all your desires, according to his riches in glory in Christ Jesus.","ASV":"And my God shall supply every need of yours according to his riches in glory in Christ Jesus.","BSB":"And my God will supply all your needs according to His glorious riches in Christ Jesus.","BBE":"And my God will give you all you have need of from the wealth of his glory in Christ Jesus.","Darby":"But myGod shall abundantly supply all your need according to his riches in glory in Christ Jesus.","Geneva1599":"And my God shall fulfill all your necessities through his riches with glorie in Iesus Christ.","Webster":"But my God will supply all your need according to his riches in glory by Christ Jesus.","YLT":"and my God shall supply all your need, according to His riches in glory in Christ Jesus;","NHEB":"My God will supply every need of yours according to his riches in glory in Christ Jesus."}},{"r":"Matthew 6:26","x":{"KJV":"Behold the fowls of the air: for they sow not, neither do they reap, nor gather into barns; yet your heavenly Father feedeth them. Are ye not much better than they?","DRC":"Behold the birds of the air, for they neither sow, nor do they reap, nor gather into barns: and your heavenly Father feedeth them. Are not you of much more value than they?","CPDV":"Consider the birds of the air, how they neither sow, nor reap, nor gather into barns, and yet your heavenly Father feeds them. Are you not of much greater value than they are?","ASV":"Behold the birds of the heaven, that they sow not, neither do they reap, nor gather into barns; and your heavenly Father feedeth them. Are not ye of much more value than they?","BSB":"Look at the birds of the air: They do not sow or reap or gather into barns—and yet your heavenly Father feeds them. Are you not much more valuable than they?","BBE":"See the birds of heaven; they do not put seeds in the earth, they do not get in grain, or put it in store-houses; and your Father in heaven gives them food. Are you not of much more value than they?","Darby":"Look at the birds of the heaven, that they sow not, nor reap, nor gather into granaries, and your heavenly Father nourishes them. Are ye not much more excellent than they?","Geneva1599":"Behold the foules of the heauen: for they sowe not, neither reape, nor carie into the barnes: yet your heauenly Father feedeth them. Are ye not much better then they?","Webster":"Behold the fowls of the air: for they sow not, neither do they reap, nor gather into barns; yet your heavenly Father feedeth them. Are ye not much better than they?","YLT":"look to the fowls of the heaven, for they do not sow, nor reap, nor gather into storehouses, and your heavenly Father doth nourish them; are not ye much better than they?","NHEB":"See the birds of the sky, that they do not sow, neither do they reap, nor gather into barns. Your heavenly Father feeds them. Are you not of much more value than they?"}},{"r":"Psalms 23:1","x":{"KJV":"The LORD is my shepherd; I shall not want.","DRC":"A psalm for David. The Lord ruleth me: and I shall want nothing.","CPDV":"Unto the end. A Psalm of David. To you, Lord, I have lifted up my soul.","ASV":"A Psalm of David. Jehovah is my shepherd; I shall not want.","BSB":"A Psalm of David. The LORD is my shepherd; I shall not want.","BBE":"The Lord takes care of me as his sheep; I will not be without any good thing.","Darby":"A Psalm of David. Jehovah is my shepherd; I shall not want.","Geneva1599":"A Psalme of David. The Lord is my shepheard, I shall not want.","Webster":"A Psalm of David. The LORD [is] my shepherd; I shall not want.","YLT":"A Psalm of David. Jehovah is my shepherd, I do not lack,","NHEB":"A Psalm by David. The Lord is my shepherd: I shall lack nothing."},"a":{"DRC":"Psalms 22:1","CPDV":"Psalms 24:1"}}],"l":[{"r":"1 Nephi 17:3","x":"And thus we see that the commandments of God must be fulfilled. And if it so be that the children of men keep the commandments of God he doth nourish them, and strengthen them, and provide means whereby they can accomplish the thing which he has commanded them; wherefore, he did provide means for us while we did sojourn in the wilderness."},{"r":"D&C 104:17","x":"For the earth is full, and there is enough and to spare; yea, I prepared all things, and have given unto the children of men to be agents st. Take my yoke on you and become like me, for I am gentle and without pride, and you will have rest for your souls; For my yoke is good, and the weight I take up is not hard.","Darby":"Come to me, all ye who labour and are burdened, and I will give you rest. Take my yoke upon you, and learn from me; for I am meek and lowly in heart; and ye shall find rest to your souls; for my yoke is easy, and my burden is light.","Geneva1599":"Come vnto me, all ye that are wearie and laden, and I will ease you. Take my yoke on you, and learne of me that I am meeke and lowly in heart: and ye shall finde rest vnto your soules. For my yoke is easie, and my burden light.","Webster":"Come to me, all [ye] that labor, and are heavy laden, and I will give you rest. Take my yoke upon you, and learn from me: for I am meek and lowly in heart; and ye shall find rest to your souls. For my yoke [is] easy, and my burden is light.","YLT":"`Come unto me, all ye labouring and burdened ones, and I will give you rest, take up my yoke upon you, and learn from me, because I am meek and humble in heart, and ye shall find rest to your souls, for my yoke is easy, and my burden is light.'","NHEB":"\"Come to me, all you who labor and are heavily burdened, and I will give you rest. Take my yoke upon you, and learn from me, for I am gentle and lowly in heart; and you will find rest for your souls. For my yoke is easy, and my burden is light.\""}},{"r":"Psalms 23:2-3","x":{"KJV":"He maketh me to lie down in green pastures: he leadeth me beside the still waters. He restoreth my soul: he leadeth me in the paths of righteousness for his name's sake.","DRC":"He hath set me in a place of pasture. He hath brought me up, on the water of refreshment: He hath converted my soul. He hath led me on the paths of justice, for his own name's sake.","CPDV":"He has settled me here, in a place of pasture. He has led me out to the water of refreshment. He has converted my soul. He has led me away on the paths of justice, for t ou lacketh wisdom, let him ask of God, who giveth to all [men] liberally, and upbraideth not; and it shall be given to him.","YLT":"and if any of you do lack wisdom, let him ask from God, who is giving to all liberally, and not reproaching, and it shall be given to him;","NHEB":"But if any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach; and it will be given to him."}},{"r":"Proverbs 2:6","x":{"KJV":"For the LORD giveth wisdom: out of his mouth cometh knowledge and understanding.","DRC":"Because the Lord giveth wisdom: and out of his mouth cometh prudence and knowledge.","CPDV":"For the Lord bestows wisdom, and out of his mouth, prudence and knowledge.","ASV":"For Jehovah giveth wisdom; Out of his mouth cometh knowledge and understanding:","BSB":"For the LORD gives wisdom; from His mouth come knowledge and understanding.","BBE":"For the Lord gives wisdom; out of his mouth come knowledge and reason:","Darby":"For Jehovah giveth wisdom; out of his mouth [come] knowledge and understanding.","Geneva1599":"For the Lord giueth wisdome, out of his mouth commeth knowledge and vnderstanding.","Webster":"For the LORD giveth wisdom: out of his mouth [cometh] knowledge and understanding.","YLT":"For Jehovah giveth wisdom, From His mouth knowledge and understanding.","NHEB":"For the Lord gives wisdom. Out of his mouth comes knowledge and understanding."}},{"r":"Proverbs 9:10","x":{"KJV":"The fear of the LORD is the beginning of wisdom: and the knowledge of the holy is understanding.","DRC":"The fear of the Lord is the beginning of wisdom: and the knowledge of the holy is prudence.","CPDV":"The fear of the Lord is the beginning of wisdom, and knowledge of holiness is prudence.","ASV":"The fear of Jehovah is the beginning of wisdom; And the knowledge of the Holy One is understanding.","BSB":"The fear of the LORD is the beginning of wisdom, and knowledge of the Holy One is understanding.","BBE":"The fear of the Lord is the start of wisdom, and the knowledge of the Holy One gives a wise mind","Darby":"The fear of Jehovah is the beginning of wisdom; and the knowledge of the Holy is intelligence.","Geneva1599":"The beginning of wisedome is the feare of the Lord, and the knowledge of holy things, is vnderstanding.","Webster":"The fear of the LORD [is] the beginning of wisdom: and the knowledge of the holy [is] understanding.","YLT":"The commencement of wisdom is the fear of Jehovah, And a knowledge of the Holy Ones is understanding.","NHEB":"The fear of the Lord is the beginning of wisdom. The knowledge of the Holy One is understanding."}}],"l":[{"r":"Mosiah 2:17","x":"And behold, I tell you these things that ye may learn wisdom; that ye may learn that when ye are in the service of your fellow beings ye are only in the service of your God."},{"r":"Alma 37:35","x":"O, remember, my son, and learn wisdom in thy youth; yea, learn in thy youth to keep the commandments of God."},{"r":"D&C 88:118","x":"And as all have not faith, seek ye diligently and teach one another words of wisdom; yea, seek ye out of the best books words of wisdom; seek learning, even by study and also by faith."}]},{"id":"patience","t":"patience","g":"Decisions and direction","p":["be patient","impatient","patience","longsuffering"],"k":["patient","wait"],"v":[{"r":"Romans 12:12","x":{"KJV":"Rejoicing in hope; patient in tribulation; continuing instant in prayer;","DRC":"Rejoicing in hope. Patient in tribulation. Instant in prayer.","CPDV":"in hope, rejoicing; in tribulation, enduring; in prayer, ever-willing;","ASV":"rejoicing in hope; patient in tribulation; continuing stedfastly in prayer;","BSB":"Be joyful in hope, patient in affliction, persistent in prayer.","BBE":"Being glad in hope, quiet in trouble, at all times given to prayer,","Darby":"As regards hope, rejoicing: as regards tribulation, enduring: as regards prayer, persevering:","Geneva1599":"Reioycing in hope, pacient in tribulation, continuing in prayer,","Webster":"Rejoicing in hope; patient in tribulation; continuing earnest in prayer;","YLT":"in the hope rejoicing; in the tribulation enduring; in the prayer persevering;","NHEB":"rejoicing in hope; enduring in troubles; continuing steadfastly in prayer;"}},{"r":"James 5:7-8","x":{"KJV":"Be patient therefore, brethren, unto the coming of the Lord. Behold, the husbandman waiteth for the precious fruit of the earth, and hath long patience for it, until he receive the early and latter rain. Be ye also patient; stablish your hearts: for the coming of the Lord draweth nigh.","DRC":"Be patient therefore, brethren, until the coming of the Lord. Behold, the husbandman waiteth for the precious fruit of the earth: patiently bearing till he receive the early and latter rain. Be you therefore also patient and strengthen your hearts: for the coming of the Lord is at hand.","CPDV":"Therefore, be patient, brothers, until the advent of the Lord. Consider that the farmer anticipates the precious fruit of the earth, waiting patiently, until he receives the early and the late rains. Therefore, you too should be patient and should strengthen your hearts. For the advent of the Lord draws near.","ASV":"Be patient therefore, brethren, until the coming of the Lord. Behold, the husbandman waiteth for the precious fruit of the earth, being patient over it, until it receive the early and latter rain. Be ye also patient; establish your hearts: for the coming of the Lord is at hand.","BSB":"Be patient, then, brothers, until the Lord’s coming. See how the farmer awaits the precious fruit of the soil—how patient he is for the fall and spring rains. You, too, be patient and strengthen your hearts, because the Lord’s coming is near.","BBE":"Go on waiting calmly, my brothers, till the coming of the Lord, like the farmer waiting for the good fruit of the earth till the early and late rains have come. Be as calm in your waiting; let your hearts be strong: because the coming of the Lord is near.","Darby":"Have patience, therefore, brethren, till the coming of the Lord. Behold, the labourer awaits the precious fruit of the earth, having patience for it until it receive [the] early and [the] latter rain. Ye also have patience: stablish your hearts, for the coming of the Lord is drawn nigh.","Geneva1599":"Be patient therefore, brethren, vnto the comming of the Lord. Behold, the husbandman wayteth for the precious fruite of the earth, and hath long patience for it, vntill he receiue the former, and the latter rayne. Be ye also patient therefore and settle your hearts: for ye comming of the Lord draweth neere.","Webster":"Be patient, therefore, brethren, to the coming of the Lord. Behold, the husbandman waiteth for the precious fruit of the earth, and hath long patience for it, until he receiveth the early and the latter rain. Be ye also patient; establish your hearts; for the coming of the Lord draweth nigh.","YLT":"Be patient, then, brethren, till the presence of the Lord; lo, the husbandman doth expect the precious fruit of the earth, being patient for it, till he may receive rain--early and latter; be patient, ye also; establish your hearts, because the presence of the Lord hath drawn nigh;","NHEB":"Be patient therefore, brothers, until the coming of the Lord. Behold, the farmer waits for the precious fruit of the earth, being patient over it, until it receives the early and late rain. You also be patient. Establish your hearts, for the coming of the Lord is near."}},{"r":"Psalms 37:7","x":{"KJV":"Rest in the LORD, and wait patiently for him: fret not thyself because of him who prospereth in his way, because of the man who bringeth wicked devices to pass.","DRC":"Be subject to the Lord and pray to him. Envy not the man who prospereth in his way; the man who doth unjust things.","CPDV":"Be subject to the Lord and pray to him. Do not choose to compete with him who prospers in his way, with the man who does injustice.","ASV":"Rest in Jehovah, and wait patiently for him: Fret not thyself because of him who prospereth in his way, Because of the man who bringeth wicked devices to pass.","BSB":"Be still before the LORD and wait patiently for Him; do not fret when men prosper in their ways, when they carry out wicked schemes.","BBE":"Take your rest in the Lord, waiting quietly for him; do not be angry because of the man who does well in his evil ways, and gives effect to his bad designs.","Darby":"Rest in Jehovah, and wait patiently for him: fret not thyself because of him that prospereth in his way, because of the man that bringeth mischievous devices to pass.","Geneva1599":"Waite patiently vpon the Lord and hope in him: fret not thy selfe for him which prospereth in his way: nor for the man that bringeth his enterprises to passe.","Webster":"Rest in the LORD, and wait patiently for him: fret not thyself because of him who prospereth in his way, because of the man who bringeth wicked devices to pass.","YLT":"Be silent for Jehovah, and stay thyself for Him, Do not fret because of him Who is making prosperous his way, Because of a man doing wicked devices.","NHEB":"Rest in the Lord, and wait patiently for him. Do not fret because of him who prospers in his way, because of the man who makes wicked plots happen."},"a":{"DRC":"Psalms 36:7","CPDV":"Psalms 36:7"}}],"l":[{"r":"Mosiah 23:21","x":"Nevertheless the Lord seeth fit to chasten his people; yea, he trieth their patience and their faith."},{"r":"Alma 32:43","x":"Then, my brethren, ye shall reap the rewards of your faith, and your diligence, and patience, and long-suffering, waiting for the tree to bring forth fruit unto you."},{"r":"D&C 98:2","x":"Waiting patiently on the Lord, for your prayers have entered into the ears of the Lord of Sabaoth, and are recorded with this seal and testament—the Lord hath sworn and decreed that they shall be granted."}]},{"id":"new-beginnings","t":"new beginnings","g":"Decisions and direction","p":["new chapter","new start","beginning","fresh season"],"k":[],"v":[{"r":"Isaiah 43:18-19","x":{"KJV":"Remember ye not the former things, neither consider the things of old. Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert.","DRC":"Remember not former things, and look not on things of old. Behold I do new things, and now they shall spring forth, verily you shall know them: I will make a way in the wilderness, and rivers in the desert.","CPDV":"You need not call to mind the past, nor consider the things of antiquity. Behold, I am accomplishing new things. And presently, they will spring forth. With certainty, you will know them. I will make a way in the desert, and rivers in an impassible place.","ASV":"Remember ye not the former things, neither consider the things of old. Behold, I will do a new thing; now shall it spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert.","BSB":"“Do not call to mind the former things; pay no attention to the things of old. Behold, I am about to do something new; even now it is coming. Do you not see it? Indeed, I will make a way in the wilderness and streams in the desert.","BBE":"Give no thought to the things which are past; let the early times go out of your minds. See, I am doing a new thing; now it is starting; will you not take note of it? I will even make a way in the waste land, and rivers in the dry country.","Darby":"— Remember not the former things, neither consider the ancient things: behold, I do a new thing; now it shall spring forth: shall ye not know it? I will even make a way in the wilderness, rivers in the waste.","Geneva1599":"Remember yee not the former things, neither regard the things of olde. Behold, I do a new thing: now shall it come foorth: shall you not knowe it? I wil euen make a way in the desert, and floods in the wildernesse.","Webster":"Remember ye not the former things, neither consider the things of old. Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, [and] rivers in the desert.","YLT":"Remember not former things, And ancient things consider not. Lo, I am doing a new thing, now it springeth up, Do ye not know it? Yea, I put in a wilderness a way, In a desolate place--floods.","NHEB":"\"Do not remember the former things, and do not consider the things of old. Behold, I will do a new thing. It springs forth now. Do you not know it? I will even make a way in the wilderness, and rivers in the desert."}},{"r":"2 Corinthians 5:17","x":{"KJV":"Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.","DRC":"If then any be in Christ a new creature, the old things are passed away. Behold all things are made new.","CPDV":"So if anyone is a new creature in Christ, what is old has passed away. Behold, all things have been made new.","ASV":"Wherefore if any man is in Christ, he is a new creature: the old things are passed away; behold, they are become new.","BSB":"Therefore if anyone is in Christ, he is a new creation. The old has passed away. Behold, the new has come!","BBE":"So if any man is in Christ, he is in a new world: the old things have come to an end; they have truly become new.","Darby":"So if any one [be] in Christ, [there is] a new creation; the old things have passed away; behold all things have become new:","Geneva1599":"Therefore if any man be in Christ, let him be a newe creature. Olde things are passed away: beholde, all things are become newe.","Webster":"Therefore, if any man [is] in Christ, [he is] a new creature: old things have passed away; behold, all things have become new.","YLT":"so that if any one is in Christ-- he is a new creature; the old things did pass away, lo, become new have the all things.","NHEB":"Therefore if anyone is in Christ, he is a new creation. The old things have passed away. Behold, new things have come."}},{"r":"Lamentations 3:22-23","x":{"KJV":"It is of the LORD's mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness.","DRC":"Heth. The mercies of the Lord that we are not consumed: because his commiserations have not failed. Heth. They are new every morning, great is thy faithfulness.","CPDV":"HETH. By the mercies of the Lord, we are not consumed. For his compassion has not passed away. HETH. I know it at first light; great is your faithfulness.","ASV":"It is of Jehovah’s lovingkindnesses that we are not consumed, because his compassions fail not. They are new every morning; great is thy faithfulness.","BSB":"Because of the loving devotion of the LORD we are not consumed, for His mercies never fail. They are new every morning; great is Your faithfulness!","BBE":"It is through the Lord's love that we have not come to destruction, because his mercies have no limit. They are new every morning; great is your good faith.","Darby":"It is of Jehovah's loving-kindness we are not consumed, because his compassions fail not; they are new every morning: great is thy faithfulness.","Geneva1599":"It is the Lordes mercies that wee are not consumed, because his compassions faile not. They are renued euery morning: great is thy faithfulnesse.","Webster":"[It is of] the LORD'S mercies that we are not consumed, because his compassions fail not. [They are] new every morning: great [is] thy faithfulness.","YLT":"The kindnesses of Jehovah! For we have not been consumed, For not ended have His mercies. New every morning, abundant is thy faithfulness.","NHEB":"The Lord 's faithful love does not cease; his compassion does not fail. They are new every morning; great is your faithfulness."}}],"l":[{"r":"Mosiah 5:2","x":"And they all cried with one voice, saying: Yea, we believe all the words which thou hast spoken unto us; and also, we know of their surety and truth, because of the Spirit of the Lord Omnipotent, which has wrought a mighty change in us, or in our hearts, that we have no more disposition to do evil, but to do good continually."},{"r":"Alma 34:31","x":"Yea, I would that ye would come forth and harden not your hearts any longer; for behold, now is the time and the day of your salvation; and therefore, if ye will repent and harden not your hearts, immediately shall the great plan of redemption be brought about unto you."},{"r":"2 Nephi 31:20","x":"Wherefore, ye must press forward with a steadfastness in Christ, having a perfect brightness of hope, and a love of God and of all men. Wherefore, if ye shall press forward, feasting upon the word of Christ, and endure to the end, behold, thus saith the Father: Ye shall have eternal life."}]},{"id":"moving","t":"moving","g":"Decisions and direction","p":["moving to a new city","relocating","new home","leaving home"],"k":[],"v":[{"r":"Genesis 28:15","x":{"KJV":"And, behold, I am with thee, and will keep thee in all places whither thou goest, and will bring thee again into this land; for I will not leave thee, until I have done that which I have spoken to thee of.","DRC":"And I will be thy keeper whithersoever thou goest, and will bring thee back into this land: neither will I leave thee, till I shall have accomplished all that I have said.","CPDV":"And I will be your guardian wherever you will journey, and I will bring you back into this land. Neither will I dismiss you, until I have accomplished all that I have said.”","ASV":"And, behold, I am with thee, and will keep thee whithersoever thou goest, and will bring thee again into this land; for I will not leave thee, until I have done that which I have spoken to thee of.","BSB":"Look, I am with you, and I will watch over you wherever you go, and I will bring you back to this land. For I will not leave you until I have done what I have promised you.”","BBE":"And truly, I will be with you, and will keep you wherever you go, guiding you back again to this land; and I will not give you up till I have done what I have said to you.","Darby":"And behold, I am with thee, and will keep thee in all [places] to which thou goest, and will bring thee again into this land; for I will not leave thee until I have done what I have spoken to thee of.","Geneva1599":"And lo, I am with thee, and wil keepe thee whithersoeuer thou goest, and will bring thee againe into this lande: for I will not forsake thee vntill I haue performed that, that I haue promised thee.","Webster":"And behold, I [am] with thee, and will keep thee in all [places] whither thou goest, and will bring thee again into this land: for I will not leave thee, until I have done [that] which I have declared to thee.","YLT":"`And lo, I am with thee, and have kept thee whithersoever thou goest, and have caused thee to turn back unto this ground; for I leave thee not till that I have surely done that which I have spoken to thee.'","NHEB":"Behold, I am with you, and will keep you, wherever you go, and will bring you again into this land. For I will not leave you, until I have done that which I have spoken of to you.\""}},{"r":"Deuteronomy 31:8","x":{"KJV":"And the LORD, he it is that doth go before thee; he will be with thee, he will not fail thee, neither forsake thee: fear not, neither be dismayed.","DRC":"And the Lord who is your leader, he himself will be with thee: he will not leave thee, nor forsake thee: fear not, neither be dismayed.","CPDV":"And the Lord, who is your commander, will himself be with you. He will neither renounce nor abandon you. Do not be afraid, and do not dread.”","ASV":"And Jehovah, he it is that doth go before thee; he will be with thee, he will not fail thee, neither forsake thee: fear not, neither be dismayed.","BSB":"The LORD Himself goes before you; He will be with you. He will never leave you nor forsake you. Do not be afraid or discouraged.”","BBE":"It is the Lord who goes before you; he will be with you, he will not take away his help from you or give you up: so have no fear.","Darby":"And Jehovah, he it is that goeth before thee: he will be with thee; he will not leave thee, nor forsake thee; fear not, neither be dismayed.","Geneva1599":"And the Lord him selfe doeth go before thee: he will be with thee: he will not faile thee, neither forsake thee: feare not therefore, nor be discomforted.","Webster":"And the LORD, he [it is] that doth go before thee; he will be with thee, he will not fail thee, neither forsake thee: fear not, neither be dismayed.","YLT":"and Jehovah is He who is going before thee, He himself is with thee; He doth not fail thee nor forsake thee; fear not, nor be affrighted.'","NHEB":"The Lord, he it is who does go before you; he will be with you, he will not fail you, neither forsake you: do not be afraid, neither be dismayed.\""}},{"r":"Psalms 121:8","x":{"KJV":"The LORD shall preserve thy going out and thy coming in from this time forth, and even for evermore.","DRC":"May the Lord keep thy coming in and thy going out; from henceforth now and for ever.","CPDV":"May the Lord guard your entrance and your exit, from this time forward and even forever.","ASV":"Jehovah will keep thy going out and thy coming in From this time forth and for evermore.","BSB":"The LORD will watch over your coming and going, both now and forevermore.","BBE":"The Lord will keep watch over your going out and your coming in, from this time and for ever.","Darby":"Jehovah will keep thy going out and thy coming in, from henceforth and for evermore.","Geneva1599":"The Lord shall preserue thy going out, and thy comming in from henceforth and for euer.","Webster":"The LORD will preserve thy going out and thy coming in from this time forth, and even for ever.","YLT":"Jehovah preserveth thy going out and thy coming in, From henceforth even unto the age!","NHEB":"The Lord will keep your going out and your coming in, from this time forth, and forevermore."},"a":{"DRC":"Psalms 120:8","CPDV":"Psalms 120:8"}}],"l":[{"r":"1 Nephi 17:13","x":"And I will also be your light in the wilderness; and I will prepare the way before you, if it so be that ye shall keep my commandments; wherefore, inasmuch as ye shall keep my commandments ye shall be led towards the promised land; and ye shall know that it is by me that ye are led."},{"r":"D&C 84:88","x":"And whoso receiveth you, there I will be also, for I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up."},{"r":"D&C 78:18","x":"And ye cannot bear all things now; nevertheless, be of good cheer, for I will lead you along. The kingdom is yours and the blessings thereof are yours, and the riches of eternity are yours."}]},{"id":"change","t":"change","g":"Decisions and direction","p":["everything is changing","hard change","transition","season of change"],"k":[],"v":[{"r":"Ecclesiastes 3:1","x":{"KJV":"To every thing there is a season, and a time to every purpose under the heaven:","DRC":"A time to be born and a time to die. A time to plant, and a time to pluck up that which is planted.","CPDV":"All things have their time, and all things under heaven continue during their interval.","ASV":"For everything there is a season, and a time for every purpose under heaven:","BSB":"To everything there is a season, and a time for every purpose under heaven:","BBE":"For everything there is a fixed time, and a time for every business under the sun.","Darby":"To everything there is a season, and a time to every purpose under the heavens:","Geneva1599":"To all things there is an appointed time, and a time to euery purpose vnder the heauen.","Webster":"To every [thing there is] a season, and a time to every purpose under the heaven:","YLT":"To everything--a season, and a time to every delight under the heavens:","NHEB":"For everything there is a season, and a time for every purpose under heaven:"},"a":{"DRC":"Ecclesiastes 3:2"}},{"r":"Hebrews 13:8","x":{"KJV":"Jesus Christ the same yesterday, and to day, and for ever.","DRC":"Jesus Christ, yesterday, and today: and the same for ever.","CPDV":"Jesus Christ, yesterday and today; Jesus Christ forever.","ASV":"Jesus Christ is the same yesterday and to-day, yea and for ever.","BSB":"Jesus Christ is the same yesterday and today and forever.","BBE":"Jesus Christ is the same yesterday and today and for ever.","Darby":"Jesus Christ [is] the same yesterday, and to-day, and to the ages [to come].","Geneva1599":"Remember them which haue the ouersight of you, which haue declared vnto you the word of God: whose faith follow, considering what hath bene the ende of their conuersation. Iesus Christ yesterday, and to day, the same also is for euer.","Webster":"Jesus Christ the same yesterday, and to-day, and for ever.","YLT":"Jesus Christ yesterday and to-day the same, and to the ages;","NHEB":"Jesus Christ is the same yesterday, today, and forever."}},{"r":"Malachi 3:6","x":{"KJV":"For I am the LORD, I change not; therefore ye sons of Jacob are not consumed.","DRC":"For I am the Lord, and I change not: and you the sons of Jacob are not consumed.","CPDV":"For I am the Lord, and I do not change. And you, the sons of Jacob, have not been consumed.","ASV":"For I, Jehovah, change not; therefore ye, O sons of Jacob, are not consumed.","BSB":"“Because I, the LORD, do not change, you descendants of Jacob have not been destroyed.","BBE":"For I am the Lord, I am unchanged; and so you, O sons of Jacob, have not been cut off.","Darby":"For I Jehovah change not, and ye, sons of Jacob, are not consumed.","Geneva1599":"For I am the Lord: I change not, and ye sonnes of Iaakob are not consumed.","Webster":"For I [am] the LORD, I change not; therefore ye sons of Jacob are not consumed.","YLT":"For I am Jehovah, I have not changed, And ye, the sons of Jacob, Ye have not been consumed.","NHEB":"\"For I, the Lord, do not change; therefore you, sons of Jacob, are not consumed."}}],"l":[{"r":"Mosiah 5:2","x":"And they all cried with one voice, saying: Yea, we believe all the words which thou hast spoken unto us; and also, we know of their surety and truth, because of the Spirit of the Lord Omnipotent, which has wrought a mighty change in us, or in our hearts, that we have no more disposition to do evil, but to do good continually."},{"r":"Alma 5:14","x":"And now behold, I ask of you, my brethren of the church, have ye spiritually been born of God? Have ye received his image in your countenances? Have ye experienced this mighty change in your hearts?"},{"r":"Moroni 10:32","x":"Yea, come unto Christ, and be perfected in him, and deny yourselves of all ungodliness; and if ye shall deny yourselves of all ungodliness, and love God with all your might, mind and strength, then is his grace sufficient for you, that by his grace ye may be perfect in Christ; and if by the grace of God ye are perfect in Christ, ye can in nowise deny the power of God."}]},{"id":"calling","t":"calling","g":"Decisions and direction","p":["my calling","what God wants me to do","mission","ministry"],"k":[],"v":[{"r":"Ephesians 4:1","x":{"KJV":"I therefore, the prisoner of the Lord, beseech you that ye walk worthy of the vocation wherewith ye are called,","DRC":"I therefore, a prisoner in the Lord, beseech you that you walk worthy of the vocation in which you are called:","CPDV":"And so, as a prisoner in the Lord, I beg you to walk in a manner worthy of the vocation to which you have been called:","ASV":"I therefore, the prisoner in the Lord, beseech you to walk worthily of the calling wherewith ye were called,","BSB":"As a prisoner in the Lord, then, I urge you to walk in a manner worthy of the calling you have received:","BBE":"I then, the prisoner in the Lord, make this request from my heart, that you will see that your behaviour is a credit to the position which God's purpose has given you,","Darby":"I, the prisoner in [the] Lord, exhort you therefore to walk worthy of the calling wherewith ye have been called,","Geneva1599":"I therefore, being prisoner in the Lord, praie you that yee walke worthie of the vocation whereunto yee are called,","Webster":"I therefore, the prisoner of the Lord, beseech you that ye walk worthy of the vocation by which ye are called,","YLT":"Call upon you, then, do I--the prisoner of the Lord--to walk worthily of the calling with which ye were called,","NHEB":"I therefore, the prisoner in the Lord, beg you to walk worthily of the calling with which you were called,"}},{"r":"Isaiah 6:8","x":{"KJV":"Also I heard the voice of the Lord, saying, Whom shall I send, and who will go for us? Then said I, Here am I; send me.","DRC":"And I heard the voice of the Lord, saying: Whom shall I send? and who shall go for us? And I said: Lo, here am I, send me.","CPDV":"And I heard the voice of the Lord, saying: “Whom shall I send?” and, “Who will go for us?” And I said: “Here I am. Send me.”","ASV":"And I heard the voice of the Lord, saying, Whom shall I send, and who will go for us? Then I said, Here am I; send me.","BSB":"Then I heard the voice of the Lord saying: “Whom shall I send? Who will go for Us?” And I said: “Here am I. Send me!”","BBE":"And the voice of the Lord came to my ears, saying, Whom am I to send, and who will go for us? Then I said, Here am I, send me.","Darby":"And I heard the voice of the Lord saying, Whom shall I send, and who will go for us? And I said, Here am I; send me.","Geneva1599":"Also I heard the voyce of the Lord, saying, Whome shall I send? and who shall goe for vs? Then I sayd, Here am I, send me.","Webster":"Also I heard the voice of the Lord, saying, Whom shall I send, and who will go for us? Then said I, Here [am] I; send me.","YLT":"And I hear the voice of the Lord, saying: `Whom do I send? and who doth go for Us?' And I say, `Here am I, send me.'","NHEB":"I heard the Lord's voice, saying, \"Whom shall I send, and who will go for us?\" Then I said, \"Here I am. Send me!\""}},{"r":"Esther 4:14","x":{"KJV":"For if thou altogether holdest thy peace at this time, then shall there enlargement and deliverance arise to the Jews from another place; but thou and thy father's house shall be destroyed: and who knoweth whether thou art come to the kingdom for such a time as this?","DRC":"For if thou wilt now hold thy peace, the Jews shall be delivered by some other occasion: and thou, and thy father's house shall perish. And who knoweth whether thou art not therefore come to the kingdom, that thou mightest be ready in such a time as this?","CPDV":"For, if you remain silent now, the Jews will be delivered through some other opportunity, but you and your father’s house will perish. And who knows whether you have come to the kingdom for this reason, so that you would be prepared for such a time as this?”","ASV":"For if thou altogether holdest thy peace at this time, then will relief and deliverance arise to the Jews from another place, but thou and thy father’s house will perish: and who knoweth whether thou art not come to the kingdom for such a time as this?","BSB":"For if you remain silent at this time, relief and deliverance for the Jews will arise from another place, but you and your father’s house will perish. And who knows if perhaps you have come to the kingdom for such a time as this?”","BBE":"If at this time you say nothing, then help and salvation will come to the Jews from some other place, but you and your father's family will come to destruction: and who is to say that you have not come to the kingdom even for such a time as this?","Darby":"For if thou altogether holdest thy peace at this time, then shall there arise relief and deliverance to the Jews from another place; but thou and thy father's house shall perish. And who knows whether thou art [not] come to the kingdom for such a time as this?","Geneva1599":"For if thou holdest thy peace at this time, comfort and deliuerance shall appeare to the Iewes out of another place, but thou and thy fathers house shall perish: and who knoweth whether thou art come to the kingdome for such a time?","Webster":"For if thou shalt altogether hold thy peace at this time, [then] will there enlargement and deliverance arise to the Jews from another place; but thou and thy father's house will be destroyed: and who knoweth, whether thou hast come to the kingdom for [such] a time as this?","YLT":"but if thou keep entirely silent at this time, respite and deliverance remaineth to the Jews from another place, and thou and the house of thy fathers are destroyed; and who knoweth whether for a time like this thou hast come to the kingdom?'","NHEB":"For if you remain silent now, then relief and deliverance will come to the Jews from another place, but you and your father's house will perish. Who knows if you haven't come to the kingdom for such a time as this?\""}}],"l":[{"r":"D&C 4:2","x":"Therefore, O ye that embark in the service of God, see that ye serve him with all your heart, might, mind and strength, that ye may stand blameless before God at the last day."},{"r":"D&C 4:3","x":"Therefore, if ye have desires to serve God ye are called to the work;"},{"r":"Alma 29:9","x":"I know that which the Lord hath commanded me, and I glory in it. I do not glory of myself, but I glory in that which the Lord hath commanded me; yea, and this is my glory, that perhaps I may be an instrument in the hands of God to bring some soul to repentance; and this is my joy."}]},{"id":"goals","t":"goals","g":"Decisions and direction","p":["set goals","dreams","plans","vision for my life"],"k":[],"v":[{"r":"Proverbs 16:3","x":{"KJV":"Commit thy works unto the LORD, and thy thoughts shall be established.","DRC":"Lay open thy works to the Lord: and thy thoughts shall be directed.","CPDV":"Open your works to the Lord, and your intentions will be set in order.","ASV":"Commit thy works unto Jehovah, And thy purposes shall be established.","BSB":"Commit your works to the LORD and your plans will be achieved.","BBE":"Put your works into the hands of the Lord, and your purposes will be made certain.","Darby":"Commit thy works unto Jehovah, and thy thoughts shall be established.","Geneva1599":"Commit thy workes vnto the Lord, and thy thoughts shalbe directed.","Webster":"Commit thy works to the LORD, and thy thoughts shall be established.","YLT":"Roll unto Jehovah thy works, And established are thy purposes,","NHEB":"Commit your deeds to the Lord, and your plans shall succeed."}},{"r":"Habakkuk 2:2","x":{"KJV":"And the LORD answered me, and said, Write the vision, and make it plain upon tables, that he may run that readeth it.","DRC":"And the Lord answered me, and said: Write the vision, and make it plain upon tables: that he that readeth it may run over it.","CPDV":"And the Lord responded to me and said: Write the vision and explain it on tablets, so that he who reads it may run through it.","ASV":"And Jehovah answered me, and said, Write the vision, and make it plain upon tablets, that he may run that readeth it.","BSB":"Then the LORD answered me: “Write down this vision and clearly inscribe it on tablets, so that a herald may run with it.","BBE":"And the Lord gave me an answer, and said, Put the vision in writing and make it clear on stones, so that the reader may go quickly.","Darby":"And Jehovah answered me and said, Write the vision, and engrave it upon tablets, that he may run that readeth it.","Geneva1599":"And the Lord answered me, and sayde, Write the vision, and make it plaine vpon tables, that he may runne that readeth it.","Webster":"And the LORD answered me, and said, Write the vision, and make [it] plain upon tables, that he may run that readeth it.","YLT":"And Jehovah answereth me and saith: `Write a vision, and explain on the tables, That he may run who is reading it.","NHEB":"The Lord answered me, \"Write the vision, and make it plain on tablets, that he who runs may read it."}},{"r":"Philippians 3:14","x":{"KJV":"I press toward the mark for the prize of the high calling of God in Christ Jesus.","DRC":"I press towards the mark, to the prize of the supernal vocation of God in Christ Jesus.","CPDV":"I pursue the destination, the prize of the heavenly calling of God in Christ Jesus.","ASV":"I press on toward the goal unto the prize of the high calling of God in Christ Jesus.","BSB":"I press on toward the goal to win the prize of God’s heavenly calling in Christ Jesus.","BBE":"I go forward to the mark, even the reward of the high purpose of God in Christ Jesus.","Darby":"I pursue, [looking] towards [the] goal, for the prize of the calling on high ofGod in Christ Jesus.","Geneva1599":"And follow hard toward the marke, for the prise of the hie calling of God in Christ Iesus.","Webster":"I press towards the mark for the prize of the high calling of God in Christ Jesus.","YLT":"to the mark I pursue for the prize of the high calling of God in Christ Jesus.","NHEB":"I press on toward the goal for the prize of the high calling of God in Christ Jesus."}}],"l":[{"r":"2 Nephi 31:20","x":"Wherefore, ye must press forward with a steadfastness in Christ, having a perfect brightness of hope, and a love of God and of all men. Wherefore, if ye shall press forward, feasting upon the word of Christ, and endure to the end, behold, thus saith the Father: Ye shall have eternal life."},{"r":"D&C 58:27","x":"Verily I say, men should be anxiously engaged in a good cause, and do many things of their own free will, and bring to pass much righteousness;"},{"r":"Alma 37:6","x":"Now ye may suppose that this is foolishness in me; but behold I say unto you, that by small and simple things are great things brought to pass; and small means in many instances doth confound the wise."}]},{"id":"knowing-gods-will","t":"knowing God's will","g":"Decisions and direction","p":["God's will","what does God want","God's plan for me","is this right"],"k":[],"v":[{"r":"Romans 12:2","x":{"KJV":"And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, an
