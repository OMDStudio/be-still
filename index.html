d perfect, will of God.","DRC":"And be not conformed to this world: but be reformed in the newness of your mind, that you may prove what is the good and the acceptable and the perfect will of God.","CPDV":"And do not choose to be conformed to this age, but instead choose to be reformed in the newness of your mind, so that you may demonstrate what is the will of God: what is good, and what is well-pleasing, and what is perfect.","ASV":"And be not fashioned according to this world: but be ye transformed by the renewing of your mind, that ye may prove what is the good and acceptable and perfect will of God.","BSB":"Do not be conformed to this world, but be transformed by the renewing of your mind. Then you will be able to test and approve what is the good, pleasing, and perfect will of God.","BBE":"And let not your behaviour be like that of this world, but be changed and made new in mind, so that by experience you may have knowledge of the good and pleasing and complete purpose of God.","Darby":"And be not conformed to this world, but be transformed by the renewing of [your] mind, that ye may prove what [is] the good and acceptable and perfect will ofGod.","Geneva1599":"And fashion not your selues like vnto this worlde, but bee yee changed by the renewing of your minde, that ye may prooue what that good, and acceptable and perfect will of God is.","Webster":"And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what [is] that good and acceptable, and perfect will of God.","YLT":"and be not conformed to this age, but be transformed by the renewing of your mind, for your proving what is the will of God--the good, and acceptable, and perfect.","NHEB":"And do not be conformed to this world, but be transformed by the renewing of your mind, so that you may prove what is the good, well-pleasing, and perfect will of God."}},{"r":"Micah 6:8","x":{"KJV":"He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","DRC":"I will shew thee, O man, what is good, and what the Lord requireth of thee: Verily to do judgment, and to love mercy, and to walk solicitous with thy God.","CPDV":"I will reveal to you, O man, what is good, and what the Lord requires from you, and how to act with judgment, and to love mercy, and to walk carefully with your God.","ASV":"He hath showed thee, O man, what is good; and what doth Jehovah require of thee, but to do justly, and to love kindness, and to walk humbly with thy God?","BSB":"He has shown you, O man, what is good. And what does the LORD require of you but to act justly, to love mercy, and to walk humbly with your God?","BBE":"He has made clear to you, O man, what is good; and what is desired from you by the Lord; only doing what is right, and loving mercy, and walking without pride before your God.","Darby":"He hath shewn thee, O man, what is good: and what doth Jehovah require of thee, but to do justly, and to love goodness, and to walk humbly with thyGod?","Geneva1599":"He hath shewed thee, O man, what is good, and what the Lord requireth of thee: surely to doe iustly, and to loue mercie, and to humble thy selfe, to walke with thy God.","Webster":"He hath shown thee, O man, what [is] good; and what the LORD doth require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","YLT":"He hath declared to thee, O man, what is good; Yea, what is Jehovah requiring of thee, Except--to do judgment, and love kindness, And lowly to walk with thy God?","NHEB":"He has shown you, O man, what is good. What does the Lord require of you, but to act justly, to love mercy, and to walk humbly with your God?"}},{"r":"1 Thessalonians 5:16-18","x":{"KJV":"Rejoice evermore. Pray without ceasing. In every thing give thanks: for this is the will of God in Christ Jesus concerning you.","DRC":"Always rejoice. Pray without ceasing. In all things give thanks for this is the will of God in Christ Jesus concerning you all.","CPDV":"Rejoice always. Pray without ceasing. Give thanks in everything. For this is the will of God in Christ Jesus for all of you.","ASV":"Rejoice always; pray without ceasing; in everything give thanks: for this is the will of God in Christ Jesus to you-ward.","BSB":"Rejoice at all times. Pray without ceasing. Give thanks in every circumstance, for this is God’s will for you in Christ Jesus.","BBE":"Have joy at all times. Keep on with your prayers. In everything give praise: for this is the purpose of God in Christ Jesus for you.","Darby":"rejoice always; pray unceasingly; in everything give thanks, for this is [the] will ofGod in Christ Jesus towards you;","Geneva1599":"Reioyce euermore. Pray continually. In all thinges giue thankes: for this is the will of God in Christ Iesus toward you.","Webster":"Rejoice evermore. Pray without ceasing. In every thing give thanks: for this is the will of God in Christ Jesus concerning you.","YLT":"always rejoice ye; continually pray ye; in every thing give thanks, for this is the will of God in Christ Jesus in regard to you.","NHEB":"Rejoice always. Pray without ceasing. In everything give thanks, for this is the will of God in Christ Jesus toward you."}}],"l":[{"r":"Moroni 10:4-5","x":"And when ye shall receive these things, I would exhort you that ye would ask God, the Eternal Father, in the name of Christ, if these things are not true; and if ye shall ask with a sincere heart, with real intent, having faith in Christ, he will manifest the truth of it unto you, by the power of the Holy Ghost. And by the power of the Holy Ghost ye may know the truth of all things."},{"r":"D&C 9:8","x":"But, behold, I say unto you, that you must study it out in your mind; then you must ask me if it be right, and if it is right I will cause that your bosom shall burn within you; therefore, you shall feel that it is right."},{"r":"2 Nephi 32:5","x":"For behold, again I say unto you that if ye will enter in by the way, and receive the Holy Ghost, it will show unto you all things what ye should do."}]},{"id":"serving-others","t":"serving others","g":"Living with others","p":["serve","help others","service","volunteer"],"k":[],"v":[{"r":"Matthew 25:40","x":{"KJV":"And the King shall answer and say unto them, Verily I say unto you, Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me.","DRC":"And the king answering shall say to them: Amen I say to you, as long as you did it to one of these my least brethren, you did it to me.","CPDV":"And in response, the King shall say to them, ‘Amen I say to you, whenever you did this for one of these, the least of my brothers, you did it for me.’","ASV":"And the King shall answer and say unto them, Verily I say unto you, Inasmuch as ye did it unto one of these my brethren, even these least, ye did it unto me.","BSB":"And the King will reply, ‘Truly I tell you, whatever you did for one of the least of these brothers of Mine, you did for Me.’","BBE":"And the King will make answer and say to them, Truly I say to you, Because you did it to the least of these my brothers, you did it to me.","Darby":"And the King answering shall say to them, Verily, I say to you, Inasmuch as ye have done it to one of the least of these my brethren, ye have done it to me.","Geneva1599":"And the King shall answere, and say vnto them, Verely I say vnto you, in as much as ye haue done it vnto one of the least of these my brethre, ye haue done it to me.","Webster":"And the king will answer and say to them, Verily I say to you, Inasmuch as ye have done [it] to one of the least of these my brethren, ye have done [it] to me.","YLT":"`And the king answering, shall say to them, Verily I say to you, Inasmuch as ye did it to one of these my brethren--the least--to me ye did it.","NHEB":"\"The King will answer them, 'Truly I tell you, inasmuch as you did it to one of the least of these my brothers, you did it to me.'"}},{"r":"Galatians 5:13","x":{"KJV":"For, brethren, ye have been called unto liberty; only use not liberty for an occasion to the flesh, but by love serve one another.","DRC":"For you, brethren, have been called unto liberty. Only make not liberty an occasion to the flesh: but by charity of the spirit serve one another.","CPDV":"For you, brothers, have been called to liberty. Only you must not make liberty into an occasion for the flesh, but instead, serve one another through the charity of the Spirit.","ASV":"For ye, brethren, were called for freedom; only use not your freedom for an occasion to the flesh, but through love be servants one to another.","BSB":"For you, brothers, were called to freedom; but do not use your freedom as an opportunity for the flesh. Rather, serve one another in love.","BBE":"Because you, brothers, were marked out to be free; only do not make use of your free condition to give the flesh its chance, but through love be servants one to another.","Darby":"For ye have been called to liberty, brethren; only [do] not [turn] liberty into an opportunity to the flesh, but by love serve one another.","Geneva1599":"For brethren, ye haue bene called vnto libertie: onely vse not your libertie as an occasion vnto the flesh, but by loue serue one another.","Webster":"For, brethren, ye have been called to liberty; only [use] not liberty for an occasion to the flesh, but by love serve one another.","YLT":"For ye--to freedom ye were called, brethren, only not the freedom for an occasion to the flesh, but through the love serve ye one another,","NHEB":"For you, brothers, were called for freedom. Only do not use your freedom for gain to the flesh, but through love be servants to one another."}},{"r":"Mark 10:45","x":{"KJV":"For even the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many.","DRC":"For the Son of man also is not come to be ministered unto: but to minister and to give his life a redemption for many.","CPDV":"So, too, the Son of man has not come so that they would minister to him, but so that he would minister and would give his life as a redemption for many.”","ASV":"For the Son of man also came not to be ministered unto, but to minister, and to give his life a ransom for many.","BSB":"For even the Son of Man did not come to be served, but to serve, and to give His life as a ransom for many.”","BBE":"For truly the Son of man did not come to have servants, but to be a servant, and to give his life for the salvation of men.","Darby":"For also the Son of man did not come to be ministered to, but to minister, and give his life a ransom for many.","Geneva1599":"For euen the Sonne of man came not to be serued, but to serue, and to giue his life for the raunsome of many.","Webster":"For even the son of man came not to be ministered to, but to minister, and to give his life a ransom for many.","YLT":"for even the Son of Man came not to be ministered to, but to minister, and to give his life a ransom for many.'","NHEB":"For the Son of Man also came not to be served, but to serve, and to give his life as a ransom for many.\""}}],"l":[{"r":"Mosiah 2:17","x":"And behold, I tell you these things that ye may learn wisdom; that ye may learn that when ye are in the service of your fellow beings ye are only in the service of your God."},{"r":"Mosiah 18:8-9","x":"And it came to pass that he said unto them: Behold, here are the waters of Mormon (for thus were they called) and now, as ye are desirous to come into the fold of God, and to be called his people, and are willing to bear one another's burdens, that they may be light; Yea, and are willing to mourn with those that mourn; yea, and comfort those that stand in need of comfort, and to stand as witnesses of God at all times and in all things, and in all places that ye may be in, even until death, that ye may be redeemed of God, and be numbered with those of the first resurrection, that ye may have eternal life—"},{"r":"D&C 81:5","x":"Wherefore, be faithful; stand in the office which I have appointed unto you; succor the weak, lift up the hands which hang down, and strengthen the feeble knees."}]},{"id":"kindness","t":"kindness","g":"Living with others","p":["be kind","kindness","gentle","tenderhearted"],"k":[],"v":[{"r":"Ephesians 4:32","x":{"KJV":"And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ's sake hath forgiven you.","DRC":"And be ye kind one to another: merciful, forgiving one another, even as God hath forgiven you in Christ.","CPDV":"And be kind and merciful to one another, forgiving one another, just as God has forgiven you in Christ.","ASV":"and be ye kind one to another, tenderhearted, forgiving each other, even as God also in Christ forgave you.","BSB":"Be kind and tenderhearted to one another, forgiving each other just as in Christ God forgave you.","BBE":"And be kind to one another, full of pity, having forgiveness for one another, even as God in Christ had forgiveness for you.","Darby":"and be to one another kind, compassionate, forgiving one another, so asGod also in Christ has forgiven you.","Geneva1599":"Be ye courteous one to another, and tender hearted, freely forgiuing one another, euen as God for Christes sake, freely forgaue you.","Webster":"And be ye kind one to another, tender-hearted, forgiving one another, even as God for Christ's sake hath forgiven you.","YLT":"and become one to another kind, tender-hearted, forgiving one another, according as also God in Christ did forgive you.","NHEB":"And be kind to one another, tenderhearted, forgiving each other, just as God also in Christ forgave you."}},{"r":"Colossians 3:12","x":{"KJV":"Put on therefore, as the elect of God, holy and beloved, bowels of mercies, kindness, humbleness of mind, meekness, longsuffering;","DRC":"Put ye on therefore, as the elect of God, holy and beloved, the bowels of mercy, benignity, humility, modesty, patience:","CPDV":"Therefore, clothe yourselves like the elect of God: holy and beloved, with hearts of mercy, kindness, humility, modesty, and patience.","ASV":"Put on therefore, as God’s elect, holy and beloved, a heart of compassion, kindness, lowliness, meekness, longsuffering;","BSB":"Therefore, as the elect of God, holy and beloved, clothe yourselves with hearts of compassion, kindness, humility, gentleness, and patience.","BBE":"As saints of God, then, holy and dearly loved, let your behaviour be marked by pity and mercy, kind feeling, a low opinion of yourselves, gentle ways, and a power of undergoing all things;","Darby":"Put on therefore, as [the] elect ofGod, holy and beloved, bowels of compassion, kindness, lowliness, meekness, longsuffering;","Geneva1599":"Now therfore as the elect of God holy and beloued, put on the bowels of mercies, kindnesse, humblenesse of minde, meekenesse, long suffering:","Webster":"Put on therefore, as the elect of God, holy and beloved, bowels of mercies, kindness, humbleness of mind, meekness, long-suffering;","YLT":"Put on, therefore, as choice ones of God, holy and beloved, bowels of mercies, kindness, humble-mindedness, meekness, long-suffering,","NHEB":"Put on therefore, as God's chosen ones, holy and beloved, a heart of compassion, kindness, lowliness, humility, and perseverance;"}},{"r":"Proverbs 11:17","x":{"KJV":"The merciful man doeth good to his own soul: but he that is cruel troubleth his own flesh.","DRC":"A merciful man doth good to his own soul: but he that is cruel casteth off even his own kindred.","CPDV":"A merciful man benefits his own soul. But whoever is cruel casts out even his close relatives.","ASV":"The merciful man doeth good to his own soul; But he that is cruel troubleth his own flesh.","BSB":"A kind man benefits himself, but a cruel man brings trouble on himself.","BBE":"The man who has mercy will be rewarded, but the cruel man is the cause of trouble to himself.","Darby":"The merciful man doeth good to his own soul; but the cruel troubleth his own flesh.","Geneva1599":"Hee that is mercifull, rewardeth his owne soule: but he that troubleth his own flesh, is cruel.","Webster":"The merciful man doeth good to his own soul: but [he that is] cruel troubleth his own flesh.","YLT":"A kind man is rewarding his own soul, And the fierce is troubling his own flesh.","NHEB":"The merciful man does good to his own soul, but he who is cruel troubles his own flesh."}}],"l":[{"r":"Moroni 7:45","x":"And charity suffereth long, and is kind, and envieth not, and is not puffed up, seeketh not her own, is not easily provoked, thinketh no evil, and rejoiceth not in iniquity but rejoiceth in the truth, beareth all things, believeth all things, hopeth all things, endureth all things."},{"r":"Alma 7:23","x":"And now I would that ye should be humble, and be submissive and gentle; easy to be entreated; full of patience and long-suffering; being temperate in all things; being diligent in keeping the commandments of God at all times; asking for whatsoever things ye stand in need, both spiritual and temporal; always returning thanks unto God for whatsoever things ye do receive."},{"r":"D&C 121:41-42","x":"No power or influence can or ought to be maintained by virtue of the priesthood, only by persuasion, by long-suffering, by gentleness and meekness, and by love unfeigned; By kindness, and pure knowledge, which shall greatly enlarge the soul without hypocrisy, and without guile—"}]},{"id":"the-poor","t":"the poor","g":"Living with others","p":["poverty","homeless","the needy","feeding the hungry"],"k":[],"v":[{"r":"Proverbs 19:17","x":{"KJV":"He that hath pity upon the poor lendeth unto the LORD; and that which he hath given will he pay him again.","DRC":"He that hath mercy on the poor, lendeth to the Lord: and he will repay him.","CPDV":"Whoever is merciful to the poor lends to the Lord. And he will repay him for his efforts.","ASV":"He that hath pity upon the poor lendeth unto Jehovah, And his good deed will he pay him again.","BSB":"Kindness to the poor is a loan to the LORD, and He will repay the lender.","BBE":"He who has pity on the poor gives to the Lord, and the Lord will give him his reward.","Darby":"He that is gracious to the poor lendeth unto Jehovah; and what he hath bestowed will he repay unto him.","Geneva1599":"He that hath mercy vpon the poore, lendeth vnto the Lord: and the Lord will recompense him that which he hath giuen.","Webster":"He that hath pity upon the poor, lendeth to the LORD; and that which he hath given will he pay him again.","YLT":"Whoso is lending to Jehovah is favouring the poor, And his deed He repayeth to him.","NHEB":"He who has pity on the poor lends to the Lord; he will reward him."}},{"r":"Matthew 25:35-36","x":{"KJV":"For I was an hungred, and ye gave me meat: I was thirsty, and ye gave me drink: I was a stranger, and ye took me in: Naked, and ye clothed me: I was sick, and ye visited me: I was in prison, and ye came unto me.","DRC":"For I was hungry, and you gave me to eat: I was thirsty, and you gave me to drink: I was a stranger, and you took me in: Naked, and you covered me: sick, and you visited me: I was in prison, and you came to me.","CPDV":"For I was hungry, and you gave me to eat; I was thirsty, and you gave me to drink; I was a stranger, and you took me in; naked, and you covered me; sick, and you visited me; I was in prison, and you came to me.’","ASV":"for I was hungry, and ye gave me to eat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in; naked, and ye clothed me; I was sick, and ye visited me; I was in prison, and ye came unto me.","BSB":"For I was hungry and you gave Me something to eat, I was thirsty and you gave Me something to drink, I was a stranger and you took Me in, I was naked and you clothed Me, I was sick and you looked after Me, I was in prison and you visited Me.’","BBE":"For I was in need of food, and you gave it to me: I was in need of drink, and you gave it to me: I was wandering, and you took me in; I had no clothing, and you gave it to me: when I was ill, or in prison, you came to me.","Darby":"for I hungered, and ye gave me to eat; I thirsted, and ye gave me to drink; I was a stranger, and ye took me in; naked, and ye clothed me; I was ill, and ye visited me; I was in prison, and ye came to me.","Geneva1599":"For I was an hungred, and ye gaue me meate: I thirsted, and ye gaue me drinke: I was a stranger, and ye tooke me in vnto you. I was naked, and ye clothed me: I was sicke, and ye visited me: I was in prison, and ye came vnto me.","Webster":"For I was hungry, and ye gave me food: I was thirsty, and ye gave me drink: I was a stranger, and ye took me in: Naked, and ye clothed me: I was sick, and ye visited me: I was in prison, and ye came to me.","YLT":"for I did hunger, and ye gave me to eat; I did thirst, and ye gave me to drink; I was a stranger, and ye received me; naked, and ye put around me; I was infirm, and ye looked after me; in prison I was, and ye came unto me.","NHEB":"for I was hungry, and you gave me food to eat. I was thirsty, and you gave me drink. I was a stranger, and you took me in. I was naked, and you clothed me. I was sick, and you visited me. I was in prison, and you came to me.'"}},{"r":"James 1:27","x":{"KJV":"Pure religion and undefiled before God and the Father is this, To visit the fatherless and widows in their affliction, and to keep himself unspotted from the world.","DRC":"Religion clean and undefiled before God and the Father is this: to visit the fatherless and widows in their tribulation and to keep one's self unspotted from this world.","CPDV":"This is religion, clean and undefiled before God the Father: to visit orphans and widows in their tribulations, and to keep yourself immaculate, apart from this age.","ASV":"Pure religion and undefiled before our God and Father is this, to visit the fatherless and widows in their affliction, and to keep oneself unspotted from the world.","BSB":"Pure and undefiled religion before our God and Father is this: to care for orphans and widows in their distress, and to keep oneself from being polluted by the world.","BBE":"The religion which is holy and free from evil in the eyes of our God and Father is this: to take care of children who have no fathers and of widows who are in trouble, and to keep oneself untouched by the world.","Darby":"Pure and undefiled religion beforeGod and the Father is this: to visit orphans and widows in their affliction, to keep oneself unspotted from the world.","Geneva1599":"Pure religion and vndefiled before God, euen the Father, is this, to visite the fatherlesse, and widdowes in their aduersitie, and to keepe himselfe vnspotted of the world.","Webster":"Pure religion and undefiled before God and the Father is this, To visit the fatherless and widows in their affliction, [and] to keep himself unspotted from the world.","YLT":"religion pure and undefiled with the God and Father is this, to look after orphans and widows in their tribulation--unspotted to keep himself from the world.","NHEB":"Pure religion and undefiled before our God and Father is this: to visit the fatherless and widows in their affliction, and to keep oneself unstained by the world."}}],"l":[{"r":"Mosiah 4:16","x":"And also, ye yourselves will succor those that stand in need of your succor; ye will administer of your substance unto him that standeth in need; and ye will not suffer that the beggar putteth up his petition to you in vain, and turn him out to perish."},{"r":"Mosiah 4:26","x":"And now, for the sake of these things which I have spoken unto you—that is, for the sake of retaining a remission of your sins from day to day, that ye may walk guiltless before God—I would that ye should impart of your substance to the poor, every man according to that which he hath, such as feeding the hungry, clothing the naked, visiting the sick and administering to their relief, both spiritually and temporally, according to their wants."},{"r":"Alma 34:28","x":"And now behold, my beloved brethren, I say unto you, do not suppose that this is all; for after ye have done all these things, if ye turn away the needy, and the naked, and visit not the sick and afflicted, and impart of your substance, if ye have, to those who stand in need—I say unto you, if ye do not any of these things, behold, your prayer is vain, and availeth you nothing, and ye are as hypocrites who do deny the faith."}]},{"id":"the-stranger","t":"the stranger","g":"Living with others","p":["immigrant","stranger","foreigner","welcome others"],"k":[],"v":[{"r":"Leviticus 19:34","x":{"KJV":"But the stranger that dwelleth with you shall be unto you as one born among you, and thou shalt love him as thyself; for ye were strangers in the land of Egypt: I am the LORD your God.","DRC":"But let him be among you as one of the same country. And you shall love him as yourselves: for you were strangers in the land of Egypt. I am the Lord your God.","CPDV":"but let him be among you like one native born. And you shall love him as yourselves. For you were also newcomers in the land of Egypt. I am the Lord your God.","ASV":"The stranger that sojourneth with you shall be unto you as the home-born among you, and thou shalt love him as thyself; for ye were sojourners in the land of Egypt: I am Jehovah your God.","BSB":"You must treat the foreigner living among you as native-born and love him as yourself, for you were foreigners in the land of Egypt. I am the LORD your God.","BBE":"Let him be to you as one of your countrymen and have love for him as for yourself; for you were living in a strange land, in the land of Egypt: I am the Lord your God.","Darby":"As one born among you shall the stranger who sojourneth with you be unto you; and thou shalt love him as thyself; for ye were strangers in the land of Egypt: I am Jehovah yourGod.","Geneva1599":"But the stranger that dwelleth with you, shalbe as one of your selues, and thou shalt loue him as thy selfe: for ye were strangers in the lad of Egypt: I am the Lord your God.","Webster":"[But] the stranger that dwelleth with you shall be to you as one born among you, and thou shalt love him as thyself; for ye were strangers in the land of Egypt: I [am] the LORD your God.","YLT":"as a native among you is the sojourner to you who is sojourning with you, and thou hast had love to him as to thyself, for sojourners ye have been in the land of Egypt; I am Jehovah your God.","NHEB":"The stranger who lives as a foreigner with you shall be to you as the native-born among you, and you shall love him as yourself; for you lived as foreigners in the land of Egypt. I am the Lord your God."}},{"r":"Hebrews 13:2","x":{"KJV":"Be not forgetful to entertain strangers: for thereby some have entertained angels unawares.","DRC":"And hospitality do not forget: for by this some, being not aware of it, have entertained angels.","CPDV":"And do not be willing to forget hospitality. For by it, certain persons, without realizing it, have received Angels as guests.","ASV":"Forget not to show love unto strangers: for thereby some have entertained angels unawares.","BSB":"Do not neglect to show hospitality to strangers, for by so doing some people have entertained angels without knowing it.","BBE":"Take care to keep open house: because in this way some have had angels as their guests, without being conscious of it.","Darby":"Be not forgetful of hospitality; for by it some have unawares entertained angels.","Geneva1599":"Be not forgetfull to intertaine strangers: for thereby some haue receiued Angels into their houses vnwares.","Webster":"Be not forgetful to entertain strangers: for by this some have entertained angels unawares.","YLT":"of the hospitality be not forgetful, for through this unawares certain did entertain messengers;","NHEB":"Do not forget to show hospitality to strangers, for in doing so, some have entertained angels without knowing it."}},{"r":"Matthew 25:35","x":{"KJV":"For I was an hungred, and ye gave me meat: I was thirsty, and ye gave me drink: I was a stranger, and ye took me in:","DRC":"For I was hungry, and you gave me to eat: I was thirsty, and you gave me to drink: I was a stranger, and you took me in:","CPDV":"For I was hungry, and you gave me to eat; I was thirsty, and you gave me to drink; I was a stranger, and you took me in;","ASV":"for I was hungry, and ye gave me to eat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in;","BSB":"For I was hungry and you gave Me something to eat, I was thirsty and you gave Me something to drink, I was a stranger and you took Me in,","BBE":"For I was in need of food, and you gave it to me: I was in need of drink, and you gave it to me: I was wandering, and you took me in;","Darby":"for I hungered, and ye gave me to eat; I thirsted, and ye gave me to drink; I was a stranger, and ye took me in;","Geneva1599":"For I was an hungred, and ye gaue me meate: I thirsted, and ye gaue me drinke: I was a stranger, and ye tooke me in vnto you.","Webster":"For I was hungry, and ye gave me food: I was thirsty, and ye gave me drink: I was a stranger, and ye took me in:","YLT":"for I did hunger, and ye gave me to eat; I did thirst, and ye gave me to drink; I was a stranger, and ye received me;","NHEB":"for I was hungry, and you gave me food to eat. I was thirsty, and you gave me drink. I was a stranger, and you took me in."}}],"l":[{"r":"Alma 1:30","x":"And thus, in their prosperous circumstances, they did not send away any who were naked, or that were hungry, or that were athirst, or that were sick, or that had not been nourished; and they did not set their hearts upon riches; therefore they were liberal to all, both old and young, both bond and free, both male and female, whether out of the church or in the church, having no respect to persons as to those who stood in need."},{"r":"D&C 38:24","x":"And let every man esteem his brother as himself, and practice virtue and holiness before me."},{"r":"Mosiah 4:16","x":"And also, ye yourselves will succor those that stand in need of your succor; ye will administer of your substance unto him that standeth in need; and ye will not suffer that the beggar putteth up his petition to you in vain, and turn him out to perish."}]},{"id":"mercy","t":"mercy","g":"Living with others","p":["show mercy","merciful","compassion","have mercy"],"k":[],"v":[{"r":"Matthew 5:7","x":{"KJV":"Blessed are the merciful: for they shall obtain mercy.","DRC":"Blessed are the merciful: for they shall obtain mercy.","CPDV":"Blessed are the merciful, for they shall obtain mercy.","ASV":"Blessed are the merciful: for they shall obtain mercy.","BSB":"Blessed are the merciful, for they will be shown mercy.","BBE":"Happy are those who have mercy: for they will be given mercy.","Darby":"Blessed the merciful, for they shall find mercy.","Geneva1599":"Blessed are the mercifull: for they shall obteine mercie.","Webster":"Blessed [are] the merciful: for they shall obtain mercy.","YLT":"`Happy the kind--because they shall find kindness.","NHEB":"Blessed are the merciful, for they shall obtain mercy."}},{"r":"Luke 6:36","x":{"KJV":"Be ye therefore merciful, as your Father also is merciful.","DRC":"Be ye therefore merciful, as your Father also is merciful.","CPDV":"Therefore, be merciful, just as your Father is also merciful.","ASV":"Be ye merciful, even as your Father is merciful.","BSB":"Be merciful, just as your Father is merciful.","BBE":"Be full of pity, even as your Father is full of pity.","Darby":"Be ye therefore merciful, even as your Father also is merciful.","Geneva1599":"Be ye therefore mercifull, as your Father also is mercifull.","Webster":"Be ye therefore merciful, as your Father also is merciful.","YLT":"be ye therefore merciful, as also your Father is merciful.","NHEB":"Therefore be merciful, even as your Father is also merciful."}},{"r":"Micah 6:8","x":{"KJV":"He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","DRC":"I will shew thee, O man, what is good, and what the Lord requireth of thee: Verily to do judgment, and to love mercy, and to walk solicitous with thy God.","CPDV":"I will reveal to you, O man, what is good, and what the Lord requires from you, and how to act with judgment, and to love mercy, and to walk carefully with your God.","ASV":"He hath showed thee, O man, what is good; and what doth Jehovah require of thee, but to do justly, and to love kindness, and to walk humbly with thy God?","BSB":"He has shown you, O man, what is good. And what does the LORD require of you but to act justly, to love mercy, and to walk humbly with your God?","BBE":"He has made clear to you, O man, what is good; and what is desired from you by the Lord; only doing what is right, and loving mercy, and walking without pride before your God.","Darby":"He hath shewn thee, O man, what is good: and what doth Jehovah require of thee, but to do justly, and to love goodness, and to walk humbly with thyGod?","Geneva1599":"He hath shewed thee, O man, what is good, and what the Lord requireth of thee: surely to doe iustly, and to loue mercie, and to humble thy selfe, to walke with thy God.","Webster":"He hath shown thee, O man, what [is] good; and what the LORD doth require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","YLT":"He hath declared to thee, O man, what is good; Yea, what is Jehovah requiring of thee, Except--to do judgment, and love kindness, And lowly to walk with thy God?","NHEB":"He has shown you, O man, what is good. What does the Lord require of you, but to act justly, to love mercy, and to walk humbly with your God?"}}],"l":[{"r":"Alma 34:16","x":"And thus mercy can satisfy the demands of justice, and encircles them in the arms of safety, while he that exercises no faith unto repentance is exposed to the whole law of the demands of justice; therefore only unto him that has faith unto repentance is brought about the great and eternal plan of redemption."},{"r":"Alma 41:14","x":"Therefore, my son, see that you are merciful unto your brethren; deal justly, judge righteously, and do good continually; and if ye do all these things then shall ye receive your reward; yea, ye shall have mercy restored unto you again; ye shall have justice restored unto you again; ye shall have a righteous judgment restored unto you again; and ye shall have good rewarded unto you again."},{"r":"3 Nephi 12:7","x":"And blessed are the merciful, for they shall obtain mercy."}]},{"id":"justice","t":"justice","g":"Living with others","p":["injustice","fairness","oppression","stand up for what's right"],"k":[],"v":[{"r":"Micah 6:8","x":{"KJV":"He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","DRC":"I will shew thee, O man, what is good, and what the Lord requireth of thee: Verily to do judgment, and to love mercy, and to walk solicitous with thy God.","CPDV":"I will reveal to you, O man, what is good, and what the Lord requires from you, and how to act with judgment, and to love mercy, and to walk carefully with your God.","ASV":"He hath showed thee, O man, what is good; and what doth Jehovah require of thee, but to do justly, and to love kindness, and to walk humbly with thy God?","BSB":"He has shown you, O man, what is good. And what does the LORD require of you but to act justly, to love mercy, and to walk humbly with your God?","BBE":"He has made clear to you, O man, what is good; and what is desired from you by the Lord; only doing what is right, and loving mercy, and walking without pride before your God.","Darby":"He hath shewn thee, O man, what is good: and what doth Jehovah require of thee, but to do justly, and to love goodness, and to walk humbly with thyGod?","Geneva1599":"He hath shewed thee, O man, what is good, and what the Lord requireth of thee: surely to doe iustly, and to loue mercie, and to humble thy selfe, to walke with thy God.","Webster":"He hath shown thee, O man, what [is] good; and what the LORD doth require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","YLT":"He hath declared to thee, O man, what is good; Yea, what is Jehovah requiring of thee, Except--to do judgment, and love kindness, And lowly to walk with thy God?","NHEB":"He has shown you, O man, what is good. What does the Lord require of you, but to act justly, to love mercy, and to walk humbly with your God?"}},{"r":"Isaiah 1:17","x":{"KJV":"Learn to do well; seek judgment, relieve the oppressed, judge the fatherless, plead for the widow.","DRC":"Learn to do well: seek judgment, relieve the oppressed, judge for the fatherless, defend the widow.","CPDV":"Learn to do good. Seek judgment, support the oppressed, judge for the orphan, defend the widow.","ASV":"learn to do well; seek justice, relieve the oppressed, judge the fatherless, plead for the widow.","BSB":"Learn to do right; seek justice and correct the oppressor. Defend the fatherless and plead the case of the widow.”","BBE":"Take pleasure in well-doing; let your ways be upright, keep down the cruel, give a right decision for the child who has no father, see to the cause of the widow.","Darby":"learn to do well: seek judgment, gladden the oppressed, do justice to the fatherless, plead for the widow.","Geneva1599":"Learne to doe well: seeke iudgement, relieue the oppressed: iudge the fatherlesse and defend the widowe.","Webster":"Learn to do well; seek judgment, relieve the oppressed, judge the fatherless, plead for the widow.","YLT":"Seek judgment, make happy the oppressed, Judge the fatherless, strive for the widow.","NHEB":"Learn to do well. Seek justice. Relieve the oppressed. Judge the fatherless. Plead for the widow.\""}},{"r":"Amos 5:24","x":{"KJV":"But let judgment run down as waters, and righteousness as a mighty stream.","DRC":"But judgment shall be revealed as water, and justice as a mighty torrent.","CPDV":"And judgment will be revealed like water, and justice like a mighty torrent.","ASV":"But let justice roll down as waters, and righteousness as a mighty stream.","BSB":"But let justice roll on like a river, and righteousness like an ever-flowing stream.","BBE":"But let the right go rolling on like waters, and righteousness like an ever-flowing stream.","Darby":"but let judgment roll down as waters, and righteousness as an ever-flowing stream.","Geneva1599":"And let iudgement runne downe as waters, and righteousnesse as a mightie riuer.","Webster":"But let judgment run down as waters, and righteousness as a mighty stream.","YLT":"And roll on as waters doth judgment, And righteousness as a perennial stream.","NHEB":"But let justice roll on like rivers, and righteousness like a mighty stream."}}],"l":[{"r":"Alma 41:14","x":"Therefore, my son, see that you are merciful unto your brethren; deal justly, judge righteously, and do good continually; and if ye do all these things then shall ye receive your reward; yea, ye shall have mercy restored unto you again; ye shall have justice restored unto you again; ye shall have a righteous judgment restored unto you again; and ye shall have good rewarded unto you again."},{"r":"Alma 42:15","x":"And now, the plan of mercy could not be brought about except an atonement should be made; therefore God himself atoneth for the sins of the world, to bring about the plan of mercy, to appease the demands of justice, that God might be a perfect, just God, and a merciful God also."},{"r":"Mosiah 4:13","x":"And ye will not have a mind to injure one another, but to live peaceably, and to render to every man according to that which is his due."}]},{"id":"gossip","t":"gossip","g":"Living with others","p":["gossip","talking behind backs","slander","rumors"],"k":[],"v":[{"r":"Proverbs 16:28","x":{"KJV":"A froward man soweth strife: and a whisperer separateth chief friends.","DRC":"A perverse man stirreth up quarrels: and one full of words separateth princes.","CPDV":"A perverse man stirs up lawsuits. And one who is verbose divides leaders.","ASV":"A perverse man scattereth abroad strife; And a whisperer separateth chief friends.","BSB":"A perverse man spreads dissension, and a gossip divides close friends.","BBE":"A man of twisted purposes is a cause of fighting everywhere: and he who says evil secretly makes trouble between friends.","Darby":"A false man soweth contention; and a talebearer separateth very friends.","Geneva1599":"A frowarde person soweth strife: and a tale teller maketh diuision among princes.","Webster":"A froward man soweth strife: and a whisperer separateth chief friends.","YLT":"A froward man sendeth forth contention, A tale-bearer is separating a familiar friend.","NHEB":"A perverse man stirs up strife. A whisperer separates close friends."}},{"r":"Ephesians 4:29","x":{"KJV":"Let no corrupt communication proceed out of your mouth, but that which is good to the use of edifying, that it may minister grace unto the hearers.","DRC":"Let no evil speech proceed from your mouth: but that which is good, to the edification of faith: that it may administer grace to the hearers.","CPDV":"Let no evil words proceed from your mouth, but only what is good, toward the edification of faith, so as to bestow grace upon those who listen.","ASV":"Let no corrupt speech proceed out of your mouth, but such as is good for edifying as the need may be, that it may give grace to them that hear.","BSB":"Let no unwholesome talk come out of your mouths, but only what is helpful for building up the one in need and bringing grace to those who listen.","BBE":"Let no evil talk come out of your mouth, but only what is good for giving necessary teaching, and for grace to those who give ear.","Darby":"Let no corrupt word go out of your mouth, but if [there be] any good one for needful edification, that it may give grace to those that hear [it].","Geneva1599":"Let no corrupt comunication proceed out of your mouths: but that which is good, to ye vse of edifying, that it may minister grace vnto the hearers.","Webster":"Let no corrupt communication proceed out of your mouth, but that which is good to the use of edifying, that it may minister grace to the hearers.","YLT":"Let no corrupt word out of your mouth go forth, but what is good unto the needful building up, that it may give grace to the hearers;","NHEB":"Let no corrupt speech proceed out of your mouth, but such as is good for building up as the need may be, that it may give grace to those who hear."}},{"r":"James 4:11","x":{"KJV":"Speak not evil one of another, brethren. He that speaketh evil of his brother, and judgeth his brother, speaketh evil of the law, and judgeth the law: but if thou judge the law, thou art not a doer of the law, but a judge.","DRC":"Detract not one another, my brethren. He that detracteth his brother, or he that judgeth his brother, detracteth the law and judgeth the law. But if thou judge the law, thou art not a doer of the law, but a judge.","CPDV":"Brothers, do not choose to slander one another. Whoever slanders his brother, or whoever judges his brother, slanders the law and judges the law. But if you judge the law, you are not a doer of the law, but a judge.","ASV":"Speak not one against another, brethren. He that speaketh against a brother, or judgeth his brother, speaketh against the law, and judgeth the law: but if thou judgest the law, thou art not a doer of the law, but a judge.","BSB":"Brothers, do not slander one another. Anyone who speaks against his brother or judges him speaks against the law and judges it. And if you judge the law, you are not a practitioner of the law, but a judge of it.","BBE":"Do not say evil against one another, my brothers. He who says evil against his brother or makes himself his brother's judge, says evil against the law and is judging the law: and in judging the law you become, not a doer of the law but a judge.","Darby":"Speak not against one another, brethren. He that speaks against [his] brother, or judges his brother, speaks against [the] law and judges [the] law. But if thou judgest [the] law, thou art not doer of [the] law, but judge.","Geneva1599":"Speake not euill one of another, brethren. He that speaketh euill of his brother, or he that condemneth his brother, speaketh euill of ye Law, and condemneth the Lawe: and if thou condemnest the Lawe, thou art not an obseruer of the Lawe, but a iudge.","Webster":"Speak not evil one of another, brethren. He that speaketh evil of [his] brother, and judgeth his brother, speaketh evil of the law, and judgeth the law: but if thou judgest the law, thou art not a doer of the law, but a judge.","YLT":"Speak not one against another, brethren; he who is speaking against a brother, and is judging his brother, doth speak against law, and doth judge law, and if law thou dost judge, thou art not a doer of law but a judge;","NHEB":"Do not speak against one another, brothers. He who speaks against a brother or judges his brother, speaks against the law and judges the law. But if you judge the law, you are not a doer of the law, but a judge."}}],"l":[{"r":"D&C 42:27","x":"Thou shalt not speak evil of thy neighbor, nor do him any harm."},{"r":"D&C 20:54","x":"And see that there is no iniquity in the church, neither hardness with each other, neither lying, backbiting, nor evil speaking;"},{"r":"Mosiah 4:30","x":"But this much I can tell you, that if ye do not watch yourselves, and your thoughts, and your words, and your deeds, and observe the commandments of God, and continue in the faith of what ye have heard concerning the coming of our Lord, even unto the end of your lives, ye must perish. And now, O man, remember, and perish not."}]},{"id":"honesty","t":"honesty","g":"Living with others","p":["lying","tell the truth","honest","integrity"],"k":["lying","truth"],"v":[{"r":"Proverbs 12:22","x":{"KJV":"Lying lips are abomination to the LORD: but they that deal truly are his delight.","DRC":"Lying lips are an abomination to the Lord: but they that deal faithfully, please him.","CPDV":"Lying lips are an abomination to the Lord. But whoever acts faithfully pleases him.","ASV":"Lying lips are an abomination to Jehovah; But they that deal truly are his delight.","BSB":"Lying lips are detestable to the LORD, but those who deal faithfully are His delight.","BBE":"False lips are hated by the Lord, but those whose acts are true are his delight.","Darby":"Lying lips are an abomination to Jehovah; but they that deal truly are his delight.","Geneva1599":"The lying lips are an abomination to the Lord: but they that deale truely are his delite.","Webster":"Lying lips [are] abomination to the LORD: but they that deal truly [are] his delight.","YLT":"An abomination to Jehovah are lying lips, And stedfast doers are his delight.","NHEB":"Lying lips are an abomination to the Lord, but those who do the truth are his delight."}},{"r":"Ephesians 4:25","x":{"KJV":"Wherefore putting away lying, speak every man truth with his neighbour: for we are members one of another.","DRC":"Wherefore, putting away lying, speak ye the truth, every man with his neighbour. For we are members one of another.","CPDV":"Because of this, setting aside lying, speak the truth, each one with his neighbor. For we are all part of one another.","ASV":"Wherefore, putting away falsehood, speak ye truth each one with his neighbor: for we are members one of another.","BSB":"Therefore each of you must put off falsehood and speak truthfully to his neighbor, for we are all members of one another.","BBE":"And so, putting away false words, let everyone say what is true to his neighbour: for we are parts one of another.","Darby":"Wherefore, having put off falsehood, speak truth every one with his neighbour, because we are members one of another.","Geneva1599":"Wherefore cast off lying, and speake euery man truth vnto his neighbour: for we are members one of another.","Webster":"Wherefore putting away lying, speak every man truth with his neighbor: for we are members one of another.","YLT":"Wherefore, putting away the lying, speak truth each with his neighbour, because we are members one of another;","NHEB":"Therefore, putting away falsehood, speak truth each one with his neighbor. For we are members of one another."}},{"r":"Proverbs 11:3","x":{"KJV":"The integrity of the upright shall guide them: but the perverseness of transgressors shall destroy them.","DRC":"The simplicity of the just shall guide them: and the deceitfulness of the wicked shall destroy them.","CPDV":"The simplicity of the just shall direct them, and the rebellion of the perverse will devastate them.","ASV":"The integrity of the upright shall guide them; But the perverseness of the treacherous shall destroy them.","BSB":"The integrity of the upright guides them, but the perversity of the faithless destroys them.","BBE":"The righteousness of the upright will be their guide, but the twisted ways of the false will be their destruction.","Darby":"The integrity of the upright guideth them; but the crookedness of the unfaithful destroyeth them.","Geneva1599":"The vprightnes of the iust shall guide them: but the frowardnes of the transgressers shall destroy them.","Webster":"The integrity of the upright shall guide them: but the perverseness of transgressors shall destroy them.","YLT":"The integrity of the upright leadeth them, And the perverseness of the treacherous destroyeth them.","NHEB":"The integrity of the upright shall guide them, but the perverseness of the treacherous shall destroy them."}}],"l":[{"r":"Articles of Faith 1:13","x":"We believe in being honest, true, chaste, benevolent, virtuous, and in doing good to all men; indeed, we may say that we follow the admonition of Paul—We believe all things, we hope all things, we have endured many things, and hope to be able to endure all things. If there is anything virtuous, lovely, or of good report or praiseworthy, we seek after these things."},{"r":"D&C 51:9","x":"And let every man deal honestly, and be alike among this people, and receive alike, that ye may be one, even as I have commanded you."},{"r":"Alma 53:20","x":"And they were all young men, and they were exceedingly valiant for courage, and also for strength and activity; but behold, this was not all—they were men who were true at all times in whatsoever thing they were entrusted."}]},{"id":"gracious-speech","t":"gracious speech","g":"Living with others","p":["watch my words","harsh words","what I say","tongue"],"k":[],"v":[{"r":"Colossians 4:6","x":{"KJV":"Let your speech be alway with grace, seasoned with salt, that ye may know how ye ought to answer every man.","DRC":"Let your speech be always in grace seasoned with salt: that you may know how you ought to answer every man.","CPDV":"Let your speech be ever graceful, seasoned with salt, so that you may know how you ought to respond to each person.","ASV":"Let your speech be always with grace, seasoned with salt, that ye may know how ye ought to answer each one.","BSB":"Let your speech always be gracious, seasoned with salt, so that you may know how to answer everyone.","BBE":"Let your talk be with grace, mixed with salt, so that you may be able to give an answer to everyone.","Darby":"[Let] your word [be] always with grace, seasoned with salt, [so as] to know how ye ought to answer each one.","Geneva1599":"Let your speach be gracious alwayes, and powdred with salt, that ye may know how to answere euery man.","Webster":"Let your speech [be] always with grace, seasoned with salt, that ye may know how ye ought to answer every man.","YLT":"your word always in grace--with salt being seasoned--to know how it behoveth you to answer each one.","NHEB":"Let your speech always be with grace, seasoned with salt, that you may know how you ought to answer each one."}},{"r":"Proverbs 15:1","x":{"KJV":"A soft answer turneth away wrath: but grievous words stir up anger.","DRC":"A mild answer breaketh wrath: but a harsh word stirreth up fury.","CPDV":"A mild response shatters anger. But a harsh word stirs up fury.","ASV":"A soft answer turneth away wrath; But a grievous word stirreth up anger.","BSB":"A gentle answer turns away wrath, but a harsh word stirs up anger.","BBE":"By a soft answer wrath is turned away, but a bitter word is a cause of angry feelings.","Darby":"A soft answer turneth away fury; but a grievous word stirreth up anger.","Geneva1599":"A soft answere putteth away wrath: but grieuous wordes stirre vp anger.","Webster":"A soft answer turneth away wrath: but grievous words stir up anger.","YLT":"A soft answer turneth back fury, And a grievous word raiseth up anger.","NHEB":"A gentle answer turns away wrath, but a harsh word stirs up anger."}},{"r":"Psalms 19:14","x":{"KJV":"Let the words of my mouth, and the meditation of my heart, be acceptable in thy sight, O LORD, my strength, and my redeemer.","DRC":"And the words of my mouth shall be such as may please: and the meditation of my heart always in thy sight. O Lord, my helper and my Redeemer.","CPDV":"And the eloquence of my mouth will be so as to please, along with the meditation of my heart, in your sight, forever, O Lord, my helper and my redeemer.","ASV":"Let the words of my mouth and the meditation of my heart Be acceptable in thy sight, O Jehovah, my rock, and my redeemer.","BSB":"May the words of my mouth and the meditation of my heart be pleasing in Your sight, O LORD, my Rock and my Redeemer.","BBE":"Let the words of my mouth and the thoughts of my heart be pleasing in your eyes, O Lord, my strength and my salvation.","Darby":"Let the words of my mouth and the meditation of my heart be acceptable in thy sight, O Jehovah, my rock, and my redeemer.","Geneva1599":"Let the wordes of my mouth, and the meditation of mine heart be acceptable in thy sight, O Lord, my strength, and my redeemer.","Webster":"Let the words of my mouth, and the meditation of my heart, be acceptable in thy sight, O LORD, my strength, and my redeemer.","YLT":"Let the sayings of my mouth, And the meditation of my heart, Be for a pleasing thing before Thee, O Jehovah, my rock, and my redeemer!","NHEB":"Let the words of my mouth and the meditation of my heart be acceptable in your sight, Lord, my rock, and my redeemer."},"a":{"DRC":"Psalms 18:15","CPDV":"Psalms 18:15"}}],"l":[{"r":"Mosiah 4:30","x":"But this much I can tell you, that if ye do not watch yourselves, and your thoughts, and your words, and your deeds, and observe the commandments of God, and continue in the faith of what ye have heard concerning the coming of our Lord, even unto the end of your lives, ye must perish. And now, O man, remember, and perish not."},{"r":"D&C 108:7","x":"Therefore, strengthen your brethren in all your conversation, in all your prayers, in all your exhortations, and in all your doings."},{"r":"D&C 20:54","x":"And see that there is no iniquity in the church, neither hardness with each other, neither lying, backbiting, nor evil speaking;"}]},{"id":"peacemaking","t":"peacemaking","g":"Living with others","p":["make peace","conflict","resolve a fight","reconcile"],"k":[],"v":[{"r":"Matthew 5:9","x":{"KJV":"Blessed are the peacemakers: for they shall be called the children of God.","DRC":"Blessed are the peacemakers: for they shall be called the children of God.","CPDV":"Blessed are the peacemakers, for they shall be called sons of God.","ASV":"Blessed are the peacemakers: for they shall be called sons of God.","BSB":"Blessed are the peacemakers, for they will be called sons of God.","BBE":"Happy are the peacemakers: for they will be named sons of God.","Darby":"Blessed the peace-makers, for they shall be called sons ofGod.","Geneva1599":"Blessed are the peace makers: for they shall be called the children of God.","Webster":"Blessed [are] the peace-makers: for they shall be called children of God.","YLT":"`Happy the peacemakers--because they shall be called Sons of God.","NHEB":"Blessed are the peacemakers, for they shall be called sons of God."}},{"r":"Romans 12:18","x":{"KJV":"If it be possible, as much as lieth in you, live peaceably with all men.","DRC":"If it be possible, as much as is in you, have peace with all men.","CPDV":"If it is possible, in so far as you are able, be at peace with all men.","ASV":"If it be possible, as much as in you lieth, be at peace with all men.","BSB":"If it is possible on your part, live at peace with everyone.","BBE":"As far as it is possible for you be at peace with all men.","Darby":"if possible, as far as depends on you, living in peace with all men;","Geneva1599":"If it bee possible, as much as in you is, haue peace with all men.","Webster":"If [it is] possible, as much as lieth in you, live peaceably with all men.","YLT":"If possible--so far as in you--with all men being in peace;","NHEB":"If it is possible, as much as it is up to you, be at peace with all men."}},{"r":"Hebrews 12:14","x":{"KJV":"Follow peace with all men, and holiness, without which no man shall see the Lord:","DRC":"Follow peace with all men and holiness: without which no man shall see God.","CPDV":"Pursue peace with everyone. Pursue sanctity, without which no one shall see God.","ASV":"Follow after peace with all men, and the sanctification without which no man shall see the Lord:","BSB":"Pursue peace with everyone, as well as holiness, without which no one will see the Lord.","BBE":"Let your desire be for peace with all men, and to be made holy, without which no man may see the Lord;","Darby":"Pursue peace with all, and holiness, without which no one shall see the Lord:","Geneva1599":"Followe peace with all men, and holinesse, without the which no man shall see ye Lord.","Webster":"Follow peace with all [men], and holiness, without which no man shall see the Lord:","YLT":"peace pursue with all, and the separation, apart from which no one shall see the Lord,","NHEB":"Follow after peace with all men, and the sanctification without which no man will see the Lord,"}}],"l":[{"r":"3 Nephi 12:9","x":"And blessed are all the peacemakers, for they shall be called the children of God."},{"r":"3 Nephi 11:29-30","x":"For verily, verily I say unto you, he that hath the spirit of contention is not of me, but is of the devil, who is the father of contention, and he stirreth up the hearts of men to contend with anger, one with another. Behold, this is not my doctrine, to stir up the hearts of men with anger, one against another; but this is my doctrine, that such things should be done away."},{"r":"Mosiah 4:13","x":"And ye will not have a mind to injure one another, but to live peaceably, and to render to every man according to that which is his due."}]},{"id":"who-jesus-is","t":"who Jesus is","g":"Christ and salvation","p":["who is Jesus","Jesus Christ","the Savior","son of God"],"k":[],"v":[{"r":"John 14:6","x":{"KJV":"Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me.","DRC":"Jesus saith to him: I am the way, and the truth, and the life. No man cometh to the Father, but by me.","CPDV":"Jesus said to him: “I am the Way, and the Truth, and the Life. No one comes to the Father, except through me.","ASV":"Jesus saith unto him, I am the way, and the truth, and the life: no one cometh unto the Father, but by me.","BSB":"Jesus answered, “I am the way and the truth and the life. No one comes to the Father except through Me.","BBE":"Jesus said to him, I am the true and living way: no one comes to the Father but by me.","Darby":"Jesus says to him, I am the way, and the truth, and the life. No one comes to the Father unless by me.","Geneva1599":"Iesus sayd vnto him, I am that Way, and that Trueth, and that Life. No man commeth vnto the Father, but by me.","Webster":"Jesus saith to him, I am the way, and the truth, and the life: no man cometh to the Father, but by me.","YLT":"Jesus saith to him, `I am the way, and the truth, and the life, no one doth come unto the Father, if not through me;","NHEB":"Jesus said to him, \"I am the way, the truth, and the life. No one comes to the Father, except through me."}},{"r":"John 1:14","x":{"KJV":"And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth.","DRC":"And the Word was made flesh and dwelt among us (and we saw his glory, the glory as it were of the only begotten of the Father), full of grace and truth.","CPDV":"And the Word became flesh, and he lived among us, and we saw his glory, glory like that of an only-begotten Son from the Father, full of grace and truth.","ASV":"And the Word became flesh, and dwelt among us (and we beheld his glory, glory as of the only begotten from the Father), full of grace and truth.","BSB":"The Word became flesh and made His dwelling among us. We have seen His glory, the glory of the one and only Son from the Father, full of grace and truth.","BBE":"And so the Word became flesh and took a place among us for a time; and we saw his glory--such glory as is given to an only son by his father--saw it to be true and full of grace.","Darby":"And the Word became flesh, and dwelt among us (and we have contemplated his glory, a glory as of an only-begotten with a father), full of grace and truth;","Geneva1599":"And that Word was made flesh, and dwelt among vs, (and we sawe the glorie thereof, as the glorie of the onely begotten Sonne of the Father) full of grace and trueth.","Webster":"And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth.","YLT":"And the Word became flesh, and did tabernacle among us, and we beheld his glory, glory as of an only begotten of a father, full of grace and truth.","NHEB":"The Word became flesh, and lived among us. We saw his glory, such glory as of the one and only Son of the Father, full of grace and truth."}},{"r":"Isaiah 9:6","x":{"KJV":"For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace.","DRC":"For a CHILD IS BORN to us, and a son is given to us, and the government is upon his shoulder: and his name shall be called Wonderful, Counsellor, God the Mighty, the Father of the world to come, the Prince of Peace.","CPDV":"For unto us a child is born, and unto us a son is given. And leadership is placed upon his shoulder. And his name shall be called: wonderful Counselor, mighty God, father of the future age, Prince of Peace.","ASV":"For unto us a child is born, unto us a son is given; and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, Mighty God, Everlasting Father, Prince of Peace.","BSB":"For unto us a child is born, unto us a son is given, and the government will be upon His shoulders. And He will be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace.","BBE":"For to us a child has come, to us a son is given; and the government has been placed in his hands; and he has been named Wise Guide, Strong God, Father for ever, Prince of Peace.","Darby":"For unto us a child is born, unto us a son is given; and the government shall be upon his shoulder; and his name is called Wonderful, Counsellor, MightyGod, Father of Eternity, Prince of Peace.","Geneva1599":"For vnto vs a childe is borne, and vnto vs a Sonne is giuen: and the gouernement is vpon his shoulder, and he shall call his name Wonderfull, Counseller, The mightie God, The euerlasting Father, The prince of peace,","Webster":"For to us a child is born, to us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counselor, The mighty God, The everlasting Father, The Prince of Peace.","YLT":"For a Child hath been born to us, A Son hath been given to us, And the princely power is on his shoulder, And He doth call his name Wonderful, Counsellor, Mighty God, Father of Eternity, Prince of Peace.","NHEB":"For to us a child is born. To us a son is given; and the government will be on his shoulders. His name will be called Wonderful, Counselor, Mighty God, Everlasting Father, Prince of Peace."}}],"l":[{"r":"2 Nephi 25:26","x":"And we talk of Christ, we rejoice in Christ, we preach of Christ, we prophesy of Christ, and we write according to our prophecies, that our children may know to what source they may look for a remission of their sins."},{"r":"Mosiah 3:8","x":"And he shall be called Jesus Christ, the Son of God, the Father of heaven and earth, the Creator of all things from the beginning; and his mother shall be called Mary."},{"r":"3 Nephi 11:10-11","x":"Behold, I am Jesus Christ, whom the prophets testified shall come into the world. And behold, I am the light and the life of the world; and I have drunk out of that bitter cup which the Father hath given me, and have glorified the Father in taking upon me the sins of the world, in the which I have suffered the will of the Father in all things from the beginning."}]},{"id":"the-atonement","t":"the Atonement","g":"Christ and salvation","p":["atonement","Gethsemane","Christ suffered for me","redeemer"],"k":[],"v":[{"r":"Isaiah 53:4-5","x":{"KJV":"Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted. But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed.","DRC":"Surely he hath borne our infirmities and carried our sorrows: and we have thought him as it were a leper, and as one struck by God and afflicted. But he was wounded for our iniquities, he was bruised for our sins: the chastisement of our peace was upon him, and by his bruises we are healed.","CPDV":"Truly, he has taken away our weaknesses, and he himself has carried our sorrows. And we thought of him as if he were a leper, or as if he had been struck by God and humiliated. But he himself was wounded because of our iniquities. He was bruised because of our wickedness. The discipline of our peace was upon him. And by his wounds, we are healed.","ASV":"Surely he hath borne our griefs, and carried our sorrows; yet we did esteem him stricken, smitten of God, and afflicted. But he was wounded for our transgressions, he was bruised for our iniquities; the chastisement of our peace was upon him; and with his stripes we are healed.","BSB":"Surely He took on our infirmities and carried our sorrows; yet we considered Him stricken by God, struck down and afflicted. But He was pierced for our transgressions, He was crushed for our iniquities; the punishment that brought us peace was upon Him, and by His stripes we are healed.","BBE":"But it was our pain he took, and our diseases were put on him: while to us he seemed as one diseased, on whom God's punishment had come. But it was for our sins he was wounded, and for our evil doings he was crushed: he took the punishment by which we have peace, and by his wounds we are made well.","Darby":"Surely he hath borne our griefs and carried our sorrows; and we, we did regard him stricken, smitten ofGod, and afflicted. But he was wounded for our transgressions, he was bruised for our iniquities; the chastisement of our peace was upon him, and with his stripes we are healed.","Geneva1599":"Surely hee hath borne our infirmities, and caried our sorowes: yet wee did iudge him, as plagued, and smitten of God, and humbled. But hee was wounded for our transgressions, hee was broken for our iniquities: the chastisement of our peace was vpon him, and with his stripes we are healed.","Webster":"Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten by God, and afflicted. But he [was] wounded for our transgression, [he was] bruised for our iniquities: the chastisement of our peace [was] upon him; and with his stripes we are healed.","YLT":"Surely our sicknesses he hath borne, And our pains--he hath carried them, And we--we have esteemed him plagued, Smitten of God, and afflicted. And he is pierced for our transgressions, Bruised for our iniquities, The chastisement of our peace is on him, And by his bruise there is healing to us.","NHEB":"Surely he has borne our sufferings, and carried our sorrows; yet we considered him plagued, struck by God, and afflicted. But he was pierced for our transgressions. He was crushed for our iniquities. The punishment that brought our peace was on him; and by his wounds we are healed."}},{"r":"Luke 22:42-44","x":{"KJV":"Saying, Father, if thou be willing, remove this cup from me: nevertheless not my will, but thine, be done. And there appeared an angel unto him from heaven, strengthening him. And being in an agony he prayed more earnestly: and his sweat was as it were great drops of blood falling down to the ground.","DRC":"Saying: Father, if thou wilt, remove this chalice from me: but yet not my will, but thine be done. And there appeared to him an angel from heaven, strengthening him. And being in an agony, he prayed the longer. And his sweat became as drops of blood, trickling down upon the ground.","CPDV":"saying: “Father, if you are willing, take this chalice away from me. Yet truly, let not my will, but yours, be done.” Then an Angel appeared to him from heaven, strengthening him. And being in agony, he prayed more intensely; and so his sweat became like drops of blood, running down to the ground.","ASV":"saying, Father, if thou be willing, remove this cup from me: nevertheless not my will, but thine, be done. And there appeared unto him an angel from heaven, strengthening him. And being in an agony he prayed more earnestly; and his sweat became as it were great drops of blood falling down upon the ground.","BSB":"“Father, if You are willing, take this cup from Me. Yet not My will, but Yours be done.” Then an angel from heaven appeared to Him and strengthened Him. And in His anguish, He prayed more earnestly, and His sweat became like drops of blood falling to the ground.","BBE":"Father, if it is your pleasure, take this cup from me: but still, let your pleasure, not mine, be done. And an angel from heaven came to him, to give him strength. And being in great trouble of soul, the force of his prayer became stronger, and great drops, like blood, came from him, falling to the earth.","Darby":"saying, Father, if thou wilt remove this cup from me: — but then, not my will, but thine be done. And an angel appeared to him from heaven strengthening him. And being in conflict he prayed more intently. And his sweat became as great drops of blood, falling down upon the earth.","Geneva1599":"Saying, Father, if thou wilt, take away this cuppe from mee: neuerthelesse, not my will, but thine be done. And there appeared an Angell vnto him from heauen, comforting him. But being in an agonie, hee prayed more earnestly: and his sweate was like drops of blood, trickling downe to the ground.","Webster":"Saying, Father, if thou art willing, remove this cup from me: nevertheless not my will, but thine be done. And there appeared to him an angel from heaven, strengthening him. And being in an agony, he prayed more earnestly: and his sweat was as it were great drops of blood falling to the ground.","YLT":"saying, `Father, if Thou be counselling to make this cup pass from me--;but, not my will, but Thine be done.' -- And there appeared to him a messenger from heaven strengthening him; and having been in agony, he was more earnestly praying, and his sweat became, as it were, great drops of blood falling upon the ground.","NHEB":"saying, \"Father, if you are willing, remove this cup from me. Nevertheless, not my will, but yours, be done.\" An angel from heaven appeared to him, strengthening him. Being in agony he prayed more earnestly. His sweat became like great drops of blood falling down on the ground."}},{"r":"Romans 5:11","x":{"KJV":"And not only so, but we also joy in God through our Lord Jesus Christ, by whom we have now received the atonement.","DRC":"And not only so: but also we glory in God, through our Lord Jesus Christ, by whom we have now received reconciliation.","CPDV":"And not only that, but we also glory in God through our Lord Jesus Christ, through whom we have now received reconciliation.","ASV":"and not only so, but we also rejoice in God through our Lord Jesus Christ, through whom we have now received the reconciliation.","BSB":"Not only that, but we also rejoice in God through our Lord Jesus Christ, through whom we have now received reconciliation.","BBE":"And not only so, but we have joy in God through our Lord Jesus Christ, through whom we are now at peace with God.","Darby":"And not only [that], but [we are] making our boast inGod, through our Lord Jesus Christ, through whom now we have received the reconciliation.","Geneva1599":"And not onely so, but we also reioyce in God through our Lord Iesus Christ, by whom we haue nowe receiued the atonement.","Webster":"And not only [so], but we also joy in God, through our Lord Jesus Christ, by whom we have now received the atonement.","YLT":"And not only so, but we are also boasting in God, through our Lord Jesus Christ, through whom now we did receive the reconciliation;","NHEB":"Not only so, but we also rejoice in God through our Lord Jesus Christ, through whom we have now received the reconciliation."}}],"l":[{"r":"Alma 7:11-12","x":"And he shall go forth, suffering pains and afflictions and temptations of every kind; and this that the word might be fulfilled which saith he will take upon him the pains and the sicknesses of his people. And he will take upon him death, that he may loose the bands of death which bind his people; and he will take upon him their infirmities, that his bowels may be filled with mercy, according to the flesh, that he may know according to the flesh how to succor his people according to their infirmities."},{"r":"D&C 19:16-19","x":"For behold, I, God, have suffered these things for all, that they might not suffer if they would repent; But if they would not repent they must suffer even as I; Which suffering caused myself, even God, the greatest of all, to tremble because of pain, and to bleed at every pore, and to suffer both body and spirit—and would that I might not drink the bitter cup, and shrink— Nevertheless, glory be to the Father, and I partook and finished my preparations unto the children of men."},{"r":"2 Nephi 2:8","x":"Wherefore, how great the importance to make these things known unto the inhabitants of the earth, that they may know that there is no flesh that can dwell in the presence of God, save it be through the merits, and mercy, and grace of the Holy Messiah, who layeth down his life according to the flesh, and taketh it again by the power of the Spirit, that he may bring to pass the resurrection of the dead, being the first that should rise."}]},{"id":"grace","t":"grace","g":"Christ and salvation","p":["grace","saved by grace","undeserved","enabling power"],"k":[],"v":[{"r":"2 Corinthians 12:9","x":{"KJV":"And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.","DRC":"And he said to me: My grace is sufficient for thee: for power is made perfect in infirmity. Gladly therefore will I glory in my infirmities, that the power of Christ may dwell in me.","CPDV":"And he said to me: “My grace is sufficient for you. For virtue is perfected in weakness.” And so, willingly shall I glory in my weaknesses, so that the virtue of Christ may live within me.","ASV":"And he hath said unto me, My grace is sufficient for thee: for my power is made perfect in weakness. Most gladly therefore will I rather glory in my weaknesses, that the power of Christ may rest upon me.","BSB":"But He said to me, “My grace is sufficient for you, for My power is perfected in weakness.” Therefore I will boast all the more gladly in my weaknesses, so that the power of Christ may rest on me.","BBE":"And he said to me, My grace is enough for you, for my power is made complete in what is feeble. Most gladly, then, will I take pride in my feeble body, so that the power of Christ may be on me.","Darby":"And he said to me, My grace suffices thee; for [my] power is perfected in weakness. Most gladly therefore will I rather boast in my weaknesses, that the power of the Christ may dwell upon me.","Geneva1599":"And he said vnto me, My grace is sufficient for thee: for my power is made perfect through weakenesse. Very gladly therefore will I reioyce rather in mine infirmities, that the power of Christ may dwell in me.","Webster":"And he said to me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.","YLT":"and He said to me, `Sufficient for thee is My grace, for My power in infirmity is perfected;' most gladly, therefore, will I rather boast in my infirmities, that the power of the Christ may rest on me:","NHEB":"He has said to me, \"My grace is sufficient for you, for power is made perfect in weakness.\" Most gladly therefore I will rather glory in my weaknesses, that the power of Christ may rest on me."}},{"r":"Ephesians 2:8","x":{"KJV":"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:","DRC":"For by grace you are saved through faith: and that not of yourselves, for it is the gift of God.","CPDV":"For by grace, you have been saved through faith. And this is not of yourselves, for it is a gift of God.","ASV":"for by grace have ye been saved through faith; and that not of yourselves, it is the gift of God;","BSB":"For it is by grace you have been saved through faith, and this not from yourselves; it is the gift of God,","BBE":"Because by grace you have salvation through faith; and that not of yourselves: it is given by God:","Darby":"For ye are saved by grace, through faith; and this not of yourselves; it isGod's gift:","Geneva1599":"For by grace are ye saued through faith, and that not of your selues: it is the gift of God,","Webster":"For by grace are ye saved, through faith; and that not of yourselves: [it is] the gift of God:","YLT":"for by grace ye are having been saved, through faith, and this not of you--of God the gift,","NHEB":"for by grace you have been saved through faith, and that not of yourselves; it is the gift of God,"}},{"r":"Hebrews 4:16","x":{"KJV":"Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need.","DRC":"Let us go therefore with confidence to the throne of grace: that we may obtain mercy and find grace in seasonable aid.","CPDV":"Therefore, let us go forth with confidence toward the throne of grace, so that we may obtain mercy, and find grace, in a helpful time.","ASV":"Let us therefore draw near with boldness unto the throne of grace, that we may receive mercy, and may find grace to help us in time of need.","BSB":"Let us then approach the throne of grace with confidence, so that we may receive mercy and find grace to help us in our time of need.","BBE":"Then let us come near to the seat of grace without fear, so that mercy may be given to us, and we may get grace for our help in time of need.","Darby":"Let us approach therefore with boldness to the throne of grace, that we may receive mercy, and find grace for seasonable help.","Geneva1599":"Let vs therefore goe boldly vnto ye throne of grace, that we may receiue mercy, and finde grace to helpe in time of neede.","Webster":"Let us therefore come boldly to the throne of grace, that we may obtain mercy, and find grace to help in time of need.","YLT":"we may come near, then, with freedom,
