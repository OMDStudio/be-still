 to the throne of the grace, that we may receive kindness, and find grace--for seasonable help.","NHEB":"Let us therefore draw near with boldness to the throne of grace, that we may receive mercy, and may find grace for help in time of need."}}],"l":[{"r":"2 Nephi 25:23","x":"For we labor diligently to write, to persuade our children, and also our brethren, to believe in Christ, and to be reconciled to God; for we know that it is by grace that we are saved, after all we can do."},{"r":"Ether 12:27","x":"And if men come unto me I will show unto them their weakness. I give unto men weakness that they may be humble; and my grace is sufficient for all men that humble themselves before me; for if they humble themselves before me, and have faith in me, then will I make weak things become strong unto them."},{"r":"Moroni 10:32","x":"Yea, come unto Christ, and be perfected in him, and deny yourselves of all ungodliness; and if ye shall deny yourselves of all ungodliness, and love God with all your might, mind and strength, then is his grace sufficient for you, that by his grace ye may be perfect in Christ; and if by the grace of God ye are perfect in Christ, ye can in nowise deny the power of God."}]},{"id":"salvation","t":"salvation","g":"Christ and salvation","p":["how am I saved","saved","salvation","redemption"],"k":[],"v":[{"r":"John 3:16","x":{"KJV":"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.","DRC":"For God so loved the world, as to give his only begotten Son: that whosoever believeth in him may not perish, but may have life everlasting.","CPDV":"For God so loved the world that he gave his only-begotten Son, so that all who believe in him may not perish, but may have eternal life.","ASV":"For God so loved the world, that he gave his only begotten Son, that whosoever believeth on him should not perish, but have eternal life.","BSB":"For God so loved the world that He gave His one and only Son, that everyone who believes in Him shall not perish but have eternal life.","BBE":"For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.","Darby":"ForGod so loved the world, that he gave his only-begotten Son, that whosoever believes on him may not perish, but have life eternal.","Geneva1599":"For God so loued the worlde, that hee hath giuen his onely begotten Sonne, that whosoeuer beleeueth in him, should not perish, but haue euerlasting life.","Webster":"For God so loved the world, that he gave his only-begotten Son, that whoever believeth in him, should not perish, but have everlasting life.","YLT":"for God did so love the world, that His Son--the only begotten--He gave, that every one who is believing in him may not perish, but may have life age-during.","NHEB":"For God so loved the world, that he gave his one and only Son, that whoever believes in him should not perish, but have eternal life."}},{"r":"Acts 4:12","x":{"KJV":"Neither is there salvation in any other: for there is none other name under heaven given among men, whereby we must be saved.","DRC":"Neither is there salvation in any other. For there is no other name under heaven given to men, whereby we must be saved.","CPDV":"And there is no salvation in any other. For there is no other name under heaven given to men, by which it is necessary for us to be saved.”","ASV":"And in none other is there salvation: for neither is there any other name under heaven, that is given among men, wherein we must be saved.","BSB":"Salvation exists in no one else, for there is no other name under heaven given to men by which we must be saved.”","BBE":"And in no other is there salvation: for there is no other name under heaven, given among men, through which we may have salvation.","Darby":"And salvation is in none other, for neither is there another name under heaven which is given among men by which we must be saved.","Geneva1599":"Neither is there saluation in any other: for among men there is giuen none other Name vnder heauen, whereby we must be saued.","Webster":"Neither is there salvation in any other: for there is no other name under heaven given among men, by which we must be saved.","YLT":"and there is not salvation in any other, for there is no other name under the heaven that hath been given among men, in which it behoveth us to be saved.'","NHEB":"And there is salvation in none other, for there is no other name under heaven, that is given among men by which we must be saved!\""}},{"r":"Romans 10:9","x":{"KJV":"That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead, thou shalt be saved.","DRC":"For if thou confess with thy mouth the Lord Jesus and believe in thy heart that God hath raised him up from the dead, thou shalt be saved.","CPDV":"For if you confess with your mouth the Lord Jesus, and if you believe in your heart that God has raised him up from the dead, you shall be saved.","ASV":"because if thou shalt confess with thy mouth Jesus as Lord, and shalt believe in thy heart that God raised him from the dead, thou shalt be saved:","BSB":"that if you confess with your mouth, “Jesus is Lord,” and believe in your heart that God raised Him from the dead, you will be saved.","BBE":"Because, if you say with your mouth that Jesus is Lord, and have faith in your heart that God has made him come back from the dead, you will have salvation:","Darby":"that if thou shalt confess with thy mouth Jesus as Lord, and shalt believe in thine heart thatGod has raised him from among [the] dead, thou shalt be saved.","Geneva1599":"For if thou shalt confesse with thy mouth the Lord Iesus, and shalt beleeue in thine heart, that God raised him vp from the dead, thou shalt be saued:","Webster":"That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thy heart that God hath raised him from the dead, thou shalt be saved.","YLT":"that if thou mayest confess with thy mouth the Lord Jesus, and mayest believe in thy heart that God did raise him out of the dead, thou shalt be saved,","NHEB":"that if you will confess with your mouth that Jesus is Lord, and believe in your heart that God raised him from the dead, you will be saved."}}],"l":[{"r":"2 Nephi 31:21","x":"And now, behold, my beloved brethren, this is the way; and there is none other way nor name given under heaven whereby man can be saved in the kingdom of God. And now, behold, this is the doctrine of Christ, and the only and true doctrine of the Father, and of the Son, and of the Holy Ghost, which is one God, without end. Amen."},{"r":"Mosiah 3:17","x":"And moreover, I say unto you, that there shall be no other name given nor any other way nor means whereby salvation can come unto the children of men, only in and through the name of Christ, the Lord Omnipotent."},{"r":"Alma 34:9","x":"For it is expedient that an atonement should be made; for according to the great plan of the Eternal God there must be an atonement made, or else all mankind must unavoidably perish; yea, all are hardened; yea, all are fallen and are lost, and must perish except it be through the atonement which it is expedient should be made."}]},{"id":"the-cross","t":"the cross","g":"Christ and salvation","p":["the cross","crucifixion","Calvary","died for me"],"k":[],"v":[{"r":"1 Peter 2:24","x":{"KJV":"Who his own self bare our sins in his own body on the tree, that we, being dead to sins, should live unto righteousness: by whose stripes ye were healed.","DRC":"Who his own self bore our sins in his body upon the tree: that we, being dead to sins, should live to justice: by whose stripes you were healed.","CPDV":"He himself bore our sins in his body upon the tree, so that we, having died to sin, would live for justice. By his wounds, you have been healed.","ASV":"who his own self bare our sins in his body upon the tree, that we, having died unto sins, might live unto righteousness; by whose stripes ye were healed.","BSB":"He Himself bore our sins in His body on the tree, so that we might die to sin and live to righteousness. “By His stripes you are healed.”","BBE":"He took our sins on himself, giving his body to be nailed on the tree, so that we, being dead to sin, might have a new life in righteousness, and by his wounds we have been made well.","Darby":"who himself bore our sins in his body on the tree, in order that, being dead to sins, we may live to righteousness: by whose stripes ye have been healed.","Geneva1599":"Who his owne selfe bare our sinnes in his body on the tree, that we being dead to sinne, should liue in righteousnesse: by whose stripes ye were healed.","Webster":"Who himself bore our sins in his own body on the tree, that we, being dead to sins, should live to righteousness; by whose stripes ye were healed.","YLT":"who our sins himself did bear in his body, upon the tree, that to the sins having died, to the righteousness we may live; by whose stripes ye were healed,","NHEB":"who his own self bore our sins in his body on the tree, that we, having died to sins, might live to righteousness; by his stripes you were healed."}},{"r":"John 19:30","x":{"KJV":"When Jesus therefore had received the vinegar, he said, It is finished: and he bowed his head, and gave up the ghost.","DRC":"Jesus therefore, when he had taken the vinegar, said: It is consummated. And bowing his head, he gave up the ghost.","CPDV":"Then Jesus, when he had received the vinegar, said: “It is consummated.” And bowing down his head, he surrendered his spirit.","ASV":"When Jesus therefore had received the vinegar, he said, It is finished: and he bowed his head, and gave up his spirit.","BSB":"When Jesus had received the sour wine, He said, “It is finished.” And bowing His head, He yielded up His spirit.","BBE":"So when Jesus had taken the wine he said, All is done. And with his head bent he gave up his spirit.","Darby":"When therefore Jesus had received the vinegar, he said, It is finished; and having bowed his head, he delivered up his spirit.","Geneva1599":"Nowe when Iesus had receiued of the vineger, he saide, It is finished, and bowed his head, and gaue vp the ghost.","Webster":"When Jesus therefore had received the vinegar, he said, It is finished: and he bowed his head, and expired.","YLT":"when, therefore, Jesus received the vinegar, he said, `It hath been finished;' and having bowed the head, gave up the spirit.","NHEB":"When Jesus therefore had received the vinegar, he said, \"It is finished.\" He bowed his head, and gave up his spirit."}},{"r":"Galatians 2:20","x":{"KJV":"I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh I live by the faith of the Son of God, who loved me, and gave himself for me.","DRC":"And I live, now not I: but Christ liveth in me. And that I live now in the flesh: I live in the faith of the Son of God, who loved me and delivered himself for me.","CPDV":"I live; yet now, it is not I, but truly Christ, who lives in me. And though I live now in the flesh, I live in the faith of the Son of God, who loved me and who delivered himself for me.","ASV":"I have been crucified with Christ; and it is no longer I that live, but Christ liveth in me: and that life which I now live in the flesh I live in faith, the faith which is in the Son of God, who loved me, and gave himself up for me.","BSB":"I have been crucified with Christ, and I no longer live, but Christ lives in me. The life I live in the body, I live by faith in the Son of God, who loved me and gave Himself up for me.","BBE":"I have been put to death on the cross with Christ; still I am living; no longer I, but Christ is living in me; and that life which I now am living in the flesh I am living by faith, the faith of the Son of God, who in love for me, gave himself up for me.","Darby":"I am crucified with Christ, and no longer live, I, but Christ lives in me; but [in] that I now live in flesh, I live by faith, the [faith] of the Son ofGod, who has loved me and given himself for me.","Geneva1599":"I am crucified with Christ, but I liue, yet not I any more, but Christ liueth in me: and in that that I now liue in the flesh, I liue by the faith in the Sonne of God, who hath loued me, and giuen him selfe for me.","Webster":"I am crucified with Christ: nevertheless, I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh, I live by the faith of the Son of God, who loved me, and gave himself for me.","YLT":"with Christ I have been crucified, and live no more do I, and Christ doth live in me; and that which I now live in the flesh--in the faith I live of the Son of God, who did love me and did give himself for me;","NHEB":"I have been crucified with Christ, and it is no longer I that live, but Christ living in me. That life which I now live in the flesh, I live by faith in the Son of God, who loved me, and gave himself up for me."}}],"l":[{"r":"3 Nephi 27:14","x":"And my Father sent me that I might be lifted up upon the cross; and after that I had been lifted up upon the cross, that I might draw all men unto me, that as I have been lifted up by men even so should men be lifted up by the Father, to stand before me, to be judged of their works, whether they be good or whether they be evil—"},{"r":"1 Nephi 11:33","x":"And I, Nephi, saw that he was lifted up upon the cross and slain for the sins of the world."},{"r":"D&C 76:41","x":"That he came into the world, even Jesus, to be crucified for the world, and to bear the sins of the world, and to sanctify the world, and to cleanse it from all unrighteousness;"}]},{"id":"resurrection","t":"resurrection","g":"Christ and salvation","p":["he is risen","resurrection","empty tomb","rise again"],"k":[],"v":[{"r":"Matthew 28:6","x":{"KJV":"He is not here: for he is risen, as he said. Come, see the place where the Lord lay.","DRC":"He is not here. For he is risen, as he said. Come, and see the place where the Lord was laid.","CPDV":"He is not here. For he has risen, just as he said. Come and see the place where the Lord was placed.","ASV":"He is not here; for he is risen, even as he said. Come, see the place where the Lord lay.","BSB":"He is not here; He has risen, just as He said! Come, see the place where He lay.","BBE":"He is not here, for he has come to life again, even as he said. Come, see the Lord's resting-place.","Darby":"He is not here, for he is risen, as he said. Come, see the place where the Lord lay.","Geneva1599":"He is not here, for he is risen; as he saide: come, see the place where the Lord was laid,","Webster":"He is not here: for he is risen, as he said. Come, see the place where the Lord lay.","YLT":"he is not here, for he rose, as he said; come, see the place where the Lord was lying;","NHEB":"He is not here, for he has risen, just like he said. Come, see the place where he was lying."}},{"r":"John 11:25","x":{"KJV":"Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:","DRC":"Jesus said to her: I am the resurrection and the life: he that believeth in me, although he be dead, shall live:","CPDV":"Jesus said to her: “I am the Resurrection and the Life. Whoever believes in me, even though he has died, he shall live.","ASV":"Jesus said unto her, I am the resurrection, and the life: he that believeth on me, though he die, yet shall he live;","BSB":"Jesus said to her, “I am the resurrection and the life. Whoever believes in Me will live, even though he dies.","BBE":"Jesus said to her, I am myself that day and that life; he who has faith in me will have life even if he is dead;","Darby":"Jesus said to her, I am the resurrection and the life: he that believes on me, though he have died, shall live;","Geneva1599":"Iesus saide vnto her, I am the resurrection and the life: he that beleeueth in me, though he were dead, yet shall he liue.","Webster":"Jesus said to her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:","YLT":"Jesus said to her, `I am the rising again, and the life; he who is believing in me, even if he may die, shall live;","NHEB":"Jesus said to her, \"I am the resurrection and the life. He who believes in me will still live, even if he dies."}},{"r":"1 Corinthians 15:20","x":{"KJV":"But now is Christ risen from the dead, and become the firstfruits of them that slept.","DRC":"But now Christ is risen from the dead, the firstfruits of them that sleep:","CPDV":"But now Christ has risen again from the dead, as the first-fruits of those who sleep.","ASV":"But now hath Christ been raised from the dead, the firstfruits of them that are asleep.","BSB":"But Christ has indeed been raised from the dead, the firstfruits of those who have fallen asleep.","BBE":"But now Christ has truly come back from the dead, the first-fruits of those who are sleeping.","Darby":"(But now Christ is raised from among [the] dead, first-fruits of those fallen asleep.","Geneva1599":"But nowe is Christ risen from the dead, and was made the first fruites of them that slept.","Webster":"But now is Christ raised from the dead, [and] become the first-fruits of them that slept.","YLT":"And now, Christ hath risen out of the dead--the first-fruits of those sleeping he became,","NHEB":"But now Christ has been raised from the dead, the first fruits of those who are asleep."}}],"l":[{"r":"Alma 11:43","x":"The spirit and the body shall be reunited again in its perfect form; both limb and joint shall be restored to its proper frame, even as we now are at this time; and we shall be brought to stand before God, knowing even as we know now, and have a bright recollection of all our guilt."},{"r":"Alma 40:23","x":"The soul shall be restored to the body, and the body to the soul; yea, and every limb and joint shall be restored to its body; yea, even a hair of the head shall not be lost; but all things shall be restored to their proper and perfect frame."},{"r":"3 Nephi 11:14-15","x":"Arise and come forth unto me, that ye may thrust your hands into my side, and also that ye may feel the prints of the nails in my hands and in my feet, that ye may know that I am the God of Israel, and the God of the whole earth, and have been slain for the sins of the world. And it came to pass that the multitude went forth, and thrust their hands into his side, and did feel the prints of the nails in his hands and in his feet; and this they did do, going forth one by one until they had all gone forth, and did see with their eyes and did feel with their hands, and did know of a surety and did bear record, that it was he, of whom it was written by the prophets, that should come."}]},{"id":"the-second-coming","t":"the Second Coming","g":"Christ and salvation","p":["second coming","Jesus coming back","end of the world","last days"],"k":[],"v":[{"r":"Acts 1:11","x":{"KJV":"Which also said, Ye men of Galilee, why stand ye gazing up into heaven? this same Jesus, which is taken up from you into heaven, shall so come in like manner as ye have seen him go into heaven.","DRC":"Who also said: Ye men of Galilee, why stand you looking up to heaven? This Jesus who is taken up from you into heaven, shall so come as you have seen him going into heaven.","CPDV":"And they said: “Men of Galilee, why do you stand here looking up toward heaven? This Jesus, who has been taken up from you into heaven, shall return in just the same way that you have seen him going up to heaven.”","ASV":"who also said, Ye men of Galilee, why stand ye looking into heaven? this Jesus, who was received up from you into heaven, shall so come in like manner as ye beheld him going into heaven.","BSB":"“Men of Galilee,” they said, “why do you stand here looking into the sky? This same Jesus, who has been taken from you into heaven, will come back in the same way you have seen Him go into heaven.”","BBE":"And said, O men of Galilee, why are you looking up into heaven? This Jesus, who was taken from you into heaven, will come again, in the same way as you saw him go into heaven.","Darby":"who also said, Men of Galilee, why do ye stand looking into heaven? This Jesus who has been taken up from you into heaven, shall thus come in the manner in which ye have beheld him going into heaven.","Geneva1599":"Which also sayde, Yee men of Galile, why stande yee gasing into heauen? This Iesus which is taken vp from you into heauen, shall so come, as yee haue seene him goe into heauen.","Webster":"Who also said, Ye men of Galilee, why stand ye gazing up to heaven? this same Jesus who is taken from you into heaven, shall so come in like manner as ye have seen him go into heaven.","YLT":"who also said, `Men, Galileans, why do ye stand gazing into the heaven? this Jesus who was received up from you into the heaven, shall so come in what manner ye saw him going on to the heaven.'","NHEB":"who also said, \"You men of Galilee, why do you stand looking into the sky? This Jesus, who was received up from you into the sky will come back in the same way as you saw him going into the sky.\""}},{"r":"John 14:3","x":{"KJV":"And if I go and prepare a place for you, I will come again, and receive you unto myself; that where I am, there ye may be also.","DRC":"And if I shall go and prepare a place for you, I will come again and will take you to myself: that where I am, you also may be.","CPDV":"And if I go and prepare a place for you, I will return again, and then I will take you to myself, so that where I am, you also may be.","ASV":"And if I go and prepare a place for you, I come again, and will receive you unto myself; that where I am, there ye may be also.","BSB":"And if I go and prepare a place for you, I will come back and welcome you into My presence, so that you also may be where I am.","BBE":"And if I go and make ready a place for you, I will come back again and will take you to be with me, so that you may be where I am.","Darby":"and if I go and shall prepare you a place, I am coming again and shall receive you to myself, that where I am ye also may be.","Geneva1599":"And if I go to prepare a place for you, I wil come againe, and receiue you vnto my selfe, that where I am, there may ye be also.","Webster":"And if I go and prepare a place for you, I will come again and receive you to myself; that where I am, [there] ye may be also.","YLT":"and if I go on and prepare for you a place, again do I come, and will receive you unto myself, that where I am ye also may be;","NHEB":"And if I go and prepare a place for you, I will come again, and will receive you to myself; that where I am, you may be there also."}},{"r":"Revelation 22:20","x":{"KJV":"He which testifieth these things saith, Surely I come quickly. Amen. Even so, come, Lord Jesus.","DRC":"He that giveth testimony of these things, saith: Surely, I come quickly: Amen. Come, Lord Jesus.","CPDV":"He who offers testimony to these things, says: “Even now, I am approaching quickly.” Amen. Come, Lord Jesus.","ASV":"He who testifieth these things saith, Yea: I come quickly. Amen: come, Lord Jesus.","BSB":"He who testifies to these things says, “Yes, I am coming soon.” Amen. Come, Lord Jesus!","BBE":"He who gives witness to these things says, Truly, I come quickly. Even so come, Lord Jesus.","Darby":"He that testifies these things says, Yea, I come quickly. Amen; come, Lord Jesus.","Geneva1599":"He which testifieth these things, saith, Surely, I come quickly. Amen. Euen so, come Lord Iesus.","Webster":"He who testifieth these things saith, Surely I come quickly: Amen. Even so, come, Lord Jesus.","YLT":"he saith--who is testifying these things--`Yes, I come quickly!' Amen! Yes, be coming, Lord Jesus!","NHEB":"He who testifies these things says, \"Yes, I come quickly.\" Amen! Come, Lord Jesus!"}}],"l":[{"r":"D&C 45:44","x":"And then they shall look for me, and, behold, I will come; and they shall see me in the clouds of heaven, clothed with power and great glory; with all the holy angels; and he that watches not for me shall be cut off."},{"r":"D&C 133:46","x":"And it shall be said: Who is this that cometh down from God in heaven with dyed garments; yea, from the regions which are not known, clothed in his glorious apparel, traveling in the greatness of his strength?"},{"r":"Moroni 7:48","x":"Wherefore, my beloved brethren, pray unto the Father with all the energy of heart, that ye may be filled with this love, which he hath bestowed upon all who are true followers of his Son, Jesus Christ; that ye may become the sons of God; that when he shall appear we shall be like him, for we shall see him as he is; that we may have this hope; that we may be purified even as he is pure. Amen."}]},{"id":"following-christ","t":"following Christ","g":"Christ and salvation","p":["follow Jesus","be a disciple","discipleship","take up your cross"],"k":[],"v":[{"r":"Matthew 16:24","x":{"KJV":"Then said Jesus unto his disciples, If any man will come after me, let him deny himself, and take up his cross, and follow me.","DRC":"Then Jesus said to his disciples: If any man will come after me, let him deny himself, and take up his cross, and follow me.","CPDV":"Then Jesus said to his disciples: “If anyone is willing to come after me, let him deny himself, and take up his cross, and follow me.","ASV":"Then said Jesus unto his disciples, If any man would come after me, let him deny himself, and take up his cross, and follow me.","BSB":"Then Jesus told His disciples, “If anyone wants to come after Me, he must deny himself and take up his cross and follow Me.","BBE":"Then Jesus said to his disciples, If any man would come after me, let him give up all, and take up his cross, and come after me.","Darby":"Then Jesus said to his disciples, If any one desires to come after me, let him deny himself and take up his cross and follow me.","Geneva1599":"Iesus then saide to his disciples, If any man will follow me, let him forsake himselfe: and take vp his crosse, and follow me.","Webster":"Then said Jesus to his disciples, If any [man] will come after me, let him deny himself, and take up his cross, and follow me.","YLT":"Then said Jesus to his disciples, `If any one doth will to come after me, let him disown himself, and take up his cross, and follow me,","NHEB":"Then Jesus said to his disciples, \"If anyone desires to come after me, let him deny himself, and take up his cross, and follow me."}},{"r":"John 8:12","x":{"KJV":"Then spake Jesus again unto them, saying, I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life.","DRC":"Again therefore, Jesus spoke to: them, saying: I am the light of the world. He that followeth me walketh not in darkness, but shall have the light of life.","CPDV":"Then Jesus spoke to them again, saying: “I am the light of the world. Whoever follows me does not walk in darkness, but shall have the light of life.”","ASV":"Again therefore Jesus spake unto them, saying, I am the light of the world: he that followeth me shall not walk in the darkness, but shall have the light of life.","BSB":"Once again, Jesus spoke to the people and said, “I am the light of the world. Whoever follows Me will never walk in the darkness, but will have the light of life.”","BBE":"Then again Jesus said to them, I am the light of the world; he who comes with me will not be walking in the dark but will have the light of life.","Darby":"Again therefore Jesus spoke to them, saying, I am the light of the world; he that follows me shall not walk in darkness, but shall have the light of life.","Geneva1599":"Then spake Iesus againe vnto them, saying, I am that light of the worlde: hee that followeth mee, shall not walke in darkenes, but shall haue that light of life.","Webster":"Then Jesus spoke again to them, saying, I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life.","YLT":"Again, therefore, Jesus spake to them, saying, `I am the light of the world; he who is following me shall not walk in the darkness, but he shall have the light of the life.'","NHEB":"Again, therefore, Jesus spoke to them, saying, \"I am the light of the world. He who follows me will not walk in the darkness, but will have the light of life.\""}},{"r":"Luke 9:23","x":{"KJV":"And he said to them all, If any man will come after me, let him deny himself, and take up his cross daily, and follow me.","DRC":"And he said to all: If any man will come after me, let him deny himself and take up his cross daily and follow me.","CPDV":"Then he said to everyone: “If anyone is willing to come after me: let him deny himself, and take up his cross every day, and follow me.","ASV":"And he said unto all, If any man would come after me, let him deny himself, and take up his cross daily, and follow me.","BSB":"Then Jesus said to all of them, “If anyone wants to come after Me, he must deny himself and take up his cross daily and follow Me.","BBE":"And he said to them all, If any man has a desire to come after me, let him give up all, and take up his cross every day, and come after me.","Darby":"And he said to [them] all, If any one will come after me, let him deny himself and take up his cross daily and follow me;","Geneva1599":"And he sayd to them all, If any man will come after me, let him denie himselfe, and take vp his crosse dayly, and follow me.","Webster":"And he said to [them] all, If any [man] will come after me, let him deny himself, and take up his cross daily, and follow me.","YLT":"And he said unto all, `If any one doth will to come after me, let him disown himself, and take up his cross daily, and follow me;","NHEB":"He said to all, \"If anyone desires to come after me, let him deny himself, take up his cross daily, and follow me."}}],"l":[{"r":"2 Nephi 31:10","x":"And he said unto the children of men: Follow thou me. Wherefore, my beloved brethren, can we follow Jesus save we shall be willing to keep the commandments of the Father?"},{"r":"3 Nephi 27:27","x":"And know ye that ye shall be judges of this people, according to the judgment which I shall give unto you, which shall be just. Therefore, what manner of men ought ye to be? Verily I say unto you, even as I am."},{"r":"3 Nephi 18:24","x":"Therefore, hold up your light that it may shine unto the world. Behold I am the light which ye shall hold up—that which ye have seen me do. Behold ye see that I have prayed unto the Father, and ye all have witnessed."}]},{"id":"being-born-again","t":"being born again","g":"Christ and salvation","p":["born again","new creature","change of heart","new life in Christ"],"k":[],"v":[{"r":"John 3:3","x":{"KJV":"Jesus answered and said unto him, Verily, verily, I say unto thee, Except a man be born again, he cannot see the kingdom of God.","DRC":"Jesus answered and said to him: Amen, amen, I say to thee, unless a man be born again, he cannot see the kingdom of God.","CPDV":"Jesus responded and said to him, “Amen, amen, I say to you, unless one has been reborn anew, he is not able to see the kingdom of God.”","ASV":"Jesus answered and said unto him, Verily, verily, I say unto thee, Except one be born anew, he cannot see the kingdom of God.","BSB":"Jesus replied, “Truly, truly, I tell you, no one can see the kingdom of God unless he is born again.”","BBE":"Jesus said to him, Truly, I say to you, Without a new birth no man is able to see the kingdom of God.","Darby":"Jesus answered and said to him, Verily, verily, I say unto thee, Except any one be born anew he cannot see the kingdom ofGod.","Geneva1599":"Iesus answered, and said vnto him, Verely, verely I say vnto thee, except a man be borne againe, he can not see the kingdome of God.","Webster":"Jesus answered and said to him, Verily, verily, I say to thee, Except a man be born again, he cannot see the kingdom of God.","YLT":"Jesus answered and said to him, `Verily, verily, I say to thee, If any one may not be born from above, he is not able to see the reign of God;'","NHEB":"Jesus answered him, \"Truly, truly, I tell you, unless one is born anew, he cannot see the Kingdom of God.\""}},{"r":"2 Corinthians 5:17","x":{"KJV":"Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.","DRC":"If then any be in Christ a new creature, the old things are passed away. Behold all things are made new.","CPDV":"So if anyone is a new creature in Christ, what is old has passed away. Behold, all things have been made new.","ASV":"Wherefore if any man is in Christ, he is a new creature: the old things are passed away; behold, they are become new.","BSB":"Therefore if anyone is in Christ, he is a new creation. The old has passed away. Behold, the new has come!","BBE":"So if any man is in Christ, he is in a new world: the old things have come to an end; they have truly become new.","Darby":"So if any one [be] in Christ, [there is] a new creation; the old things have passed away; behold all things have become new:","Geneva1599":"Therefore if any man be in Christ, let him be a newe creature. Olde things are passed away: beholde, all things are become newe.","Webster":"Therefore, if any man [is] in Christ, [he is] a new creature: old things have passed away; behold, all things have become new.","YLT":"so that if any one is in Christ-- he is a new creature; the old things did pass away, lo, become new have the all things.","NHEB":"Therefore if anyone is in Christ, he is a new creation. The old things have passed away. Behold, new things have come."}},{"r":"Ezekiel 36:26","x":{"KJV":"A new heart also will I give you, and a new spirit will I put within you: and I will take away the stony heart out of your flesh, and I will give you an heart of flesh.","DRC":"And I will give you a new heart, and put a new spirit within you: and I will take away the stony heart out of your flesh, and will give you a heart of flesh.","CPDV":"And I will give to you a new heart, and I will place in you a new spirit. And I will take away the heart of stone from your body, and I will give to you a heart of flesh.","ASV":"A new heart also will I give you, and a new spirit will I put within you; and I will take away the stony heart out of your flesh, and I will give you a heart of flesh.","BSB":"I will give you a new heart and put a new spirit within you; I will remove your heart of stone and give you a heart of flesh.","BBE":"And I will give you a new heart and put a new spirit in you: I will take away the heart of stone from your flesh, and give you a heart of flesh.","Darby":"And I will give you a new heart, and I will put a new spirit within you; and I will take away the stony heart out of your flesh, and I will give you a heart of flesh.","Geneva1599":"A newe heart also will I giue you, and a new spirit wil I put within you, and I will take away the stonie heart out of your body, and I will giue you an heart of flesh.","Webster":"A new heart also will I give you, and a new spirit will I put within you: and I will take away the stony heart out of your flesh, and I will give you a heart of flesh.","YLT":"And I have given to you a new heart, And a new spirit I give in your midst, And I have turned aside the heart of stone out of your flesh, And I have given to you a heart of flesh.","NHEB":"I will also give you a new heart, and I will put a new spirit within you; and I will take away the stony heart out of your flesh, and I will give you a heart of flesh."}}],"l":[{"r":"Mosiah 27:25","x":"And the Lord said unto me: Marvel not that all mankind, yea, men and women, all nations, kindreds, tongues and people, must be born again; yea, born of God, changed from their carnal and fallen state, to a state of righteousness, being redeemed of God, becoming his sons and daughters;"},{"r":"Mosiah 5:7","x":"And now, because of the covenant which ye have made ye shall be called the children of Christ, his sons, and his daughters; for behold, this day he hath spiritually begotten you; for ye say that your hearts are changed through faith on his name; therefore, ye are born of him and have become his sons and his daughters."},{"r":"Alma 5:14","x":"And now behold, I ask of you, my brethren of the church, have ye spiritually been born of God? Have ye received his image in your countenances? Have ye experienced this mighty change in your hearts?"}]},{"id":"eternal-life","t":"eternal life","g":"Christ and salvation","p":["eternal life","forever with God","everlasting","immortality"],"k":[],"v":[{"r":"John 17:3","x":{"KJV":"And this is life eternal, that they might know thee the only true God, and Jesus Christ, whom thou hast sent.","DRC":"Now this is eternal life: That they may know thee, the only true God, and Jesus Christ, whom thou hast sent.","CPDV":"And this is eternal life: that they may know you, the only true God, and Jesus Christ, whom you have sent.","ASV":"And this is life eternal, that they should know thee the only true God, and him whom thou didst send, even Jesus Christ.","BSB":"Now this is eternal life, that they may know You, the only true God, and Jesus Christ, whom You have sent.","BBE":"And this is eternal life: to have knowledge of you, the only true God, and of him whom you have sent, even Jesus Christ.","Darby":"And this is the eternal life, that they should know thee, the only trueGod, and Jesus Christ whom thou hast sent.","Geneva1599":"And this is life eternall, that they knowe thee to be the onely very God, and whom thou hast sent, Iesus Christ.","Webster":"And this is life eternal, that they may know thee the only true God, and Jesus Christ whom thou hast sent.","YLT":"and this is the life age-during, that they may know Thee, the only true God, and him whom Thou didst send--Jesus Christ;","NHEB":"This is eternal life, that they may know you, the only true God, and him whom you sent, Jesus Christ."}},{"r":"John 10:28","x":{"KJV":"And I give unto them eternal life; and they shall never perish, neither shall any man pluck them out of my hand.","DRC":"And I give them life everlasting: and they shall not perish for ever. And no man shall pluck them out of my hand.","CPDV":"And I give them eternal life, and they shall not perish, for eternity. And no one shall seize them from my hand.","ASV":"and I give unto them eternal life; and they shall never perish, and no one shall snatch them out of my hand.","BSB":"I give them eternal life, and they will never perish. No one can snatch them out of My hand.","BBE":"And I give them eternal life; they will never come to destruction, and no one will ever take them out of my hand.","Darby":"and I give them life eternal; and they shall never perish, and no one shall seize them out of my hand.","Geneva1599":"And I giue vnto them eternall life, and they shall neuer perish, neither shall any plucke them out of mine hand.","Webster":"And I give to them eternal life; and they shall never perish, neither shall any pluck them out of my hand.","YLT":"and life age-during I give to them, and they shall not perish--to the age, and no one shall pluck them out of my hand;","NHEB":"I give eternal life to them. They will never perish, and no one will snatch them out of my hand."}},{"r":"Romans 6:23","x":{"KJV":"For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord.","DRC":"For the wages of sin is death. But the grace of God, life everlasting in Christ Jesus our Lord.","CPDV":"For the wages of sin is death. But the free gift of God is eternal life in Christ Jesus our Lord.","ASV":"For the wages of sin is death; but the free gift of God is eternal life in Christ Jesus our Lord.","BSB":"For the wages of sin is death, but the gift of God is eternal life in Christ Jesus our Lord.","BBE":"For the reward of sin is death; but what God freely gives is eternal life in Jesus Christ our Lord.","Darby":"For the wages of sin [is] death; but the act of favour ofGod, eternal life in Christ Jesus our Lord.","Geneva1599":"For the wages of sinne is death: but the gift of God is eternall life, through Iesus Christ our Lord.","Webster":"For the wages of sin [is] death: but the gift of God [is] eternal life, through Jesus Christ our Lord.","YLT":"for the wages of the sin is death, and the gift of God is life age-during in Christ Jesus our Lord.","NHEB":"For the wages of sin is death, but the free gift of God is eternal life in Christ Jesus our Lord."}}],"l":[{"r":"Moses 1:39","x":"For behold, this is my work and my glory—to bring to pass the immortality and eternal life of man."},{"r":"D&C 14:7","x":"And, if you keep my commandments and endure to the end you shall have eternal life, which gift is the greatest of all the gifts of God."},{"r":"2 Nephi 31:20","x":"Wherefore, ye must press forward with a steadfastness in Christ, having a perfect brightness of hope, and a love of God and of all men. Wherefore, if ye shall press forward, feasting upon the word of Christ, and endure to the end, behold, thus saith the Father: Ye shall have eternal life."}]},{"id":"prayer","t":"prayer","g":"Spiritual life","p":["how to pray","prayer","pray","talk to God"],"k":["pray"],"v":[{"r":"Matthew 7:7","x":{"KJV":"Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you:","DRC":"Ask, and it shall be given you: seek, and you shall find: knock, and it shall be opened to you.","CPDV":"Ask, and it shall be given to you. Seek, and you shall find. Knock, and it shall be opened to you.","ASV":"Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you:","BSB":"Ask, and it will be given to you; seek, and you will find; knock, and the door will be opened to you.","BBE":"Make a request, and it will be answered; what you are searching for you will get; give the sign, and the door will be open to you:","Darby":"Ask, and it shall be given to you. Seek, and ye shall find. Knock, and it shall be opened to you.","Geneva1599":"Aske, and it shall be giuen you: seeke, and ye shall finde: knocke, and it shall be opened vnto you.","Webster":"Ask, and it shall be given you; seek, and ye shall find; knock, and the door shall be opened to you:","YLT":"`Ask, and it shall be given to you; seek, and ye shall find; knock, and it shall be opened to you;","NHEB":"\"Ask, and it will be given you. Seek, and you will find. Knock, and it will be opened for you."}},{"r":"1 Thessalonians 5:17","x":{"KJV":"Pray without ceasing.","DRC":"Pray without ceasing.","CPDV":"Pray without ceasing.","ASV":"pray without ceasing;","BSB":"Pray without ceasing.","BBE":"Keep on with your prayers.","Darby":"pray unceasingly;","Geneva1599":"Pray continually.","Webster":"Pray without ceasing.","YLT":"continually pray ye;","NHEB":"Pray without ceasing."}},{"r":"Jeremiah 33:3","x":{"KJV":"Call unto me, and I will answer thee, and shew thee great and mighty things, which thou knowest not.","DRC":"Cry to me and I will hear thee: and I will shew thee great things, and sure things which thou knowest not.","CPDV":"Cry out to me and I will heed you. And I will announce to you great things, things that are certain, though you do not know them.","ASV":"Call unto me, and I will answer thee, and will show thee great things, and difficult, which thou knowest not.","BSB":"Call to Me, and I will answer and show you great and unsearchable things you do not know.","BBE":"Let your cry come to me, and I will give you an answer, and let you see great things and secret things of which you had no knowledge.","Darby":"Call unto me, and I will answer thee, and I will shew thee great and hidden things, which thou knowest not.","Geneva1599":"Call vnto me, and I will answere thee, and shewe thee great and mightie things, which thou knowest not.","Webster":"Call to me, and I will answer thee, and show thee great and mighty things, which thou knowest not.","YLT":"Call unto Me, and I do answer thee, yea, I declare to thee great and fenced things--thou hast not known them.","NHEB":"'Call to me, and I will answer you, and will show you great things, and difficult, which you do not know.'"}}],"l":[{"r":"3 Nephi 18:20","x":"And whatsoever ye shall ask the Father in my name, which is right, believing that ye shall receive, behold it shall be given unto you."},{"r":"Alma 37:37","x":"Counsel with the Lord in all thy doings, and he will direct thee for good; yea, when thou liest down at night lie down unto the Lord, that he may watch over you in your sleep; and when thou risest in the morning let thy heart be full of thanks unto God; and if ye do these things, ye shall be lifted up at the last day."},{"r":"Enos 1:4","x":"And my soul hungered; and I kneeled down before my Maker, and I cried unto him in mighty prayer and supplication for mine own soul; and all the day long did I cry unto him; yea, and when the night came I did still raise my voice high that it reached the heavens."}]},{"id":"fasting","t":"fasting","g":"Spiritual life","p":["fast","fasting","going without food for God"],"k":[],"v":[{"r":"Matthew 6:17-18","x":{"KJV":"But thou, when thou fastest, anoint thine head, and wash thy face; That thou appear not unto men to fast, but unto thy Father which is in secret: and thy Father, which seeth in secret, shall reward thee openly.","DRC":"But thou, when thou fastest anoint thy head, and wash thy face; That thou appear not to men to fast, but to thy Father who is in secret: and thy Father who seeth in secret, will repay thee.","CPDV":"But as for you, when you fast, anoint your head and wash your face, so that your fasting will not be apparent to men, but to your Father, who is in secret. And your Father, who sees in secret, will repay you.","ASV":"But thou, when thou fastest, anoint thy head, and wash thy face; that thou be not seen of men to fast, but of thy Father who is in secret: and thy Father, who seeth in secret, shall recompense thee.","BSB":"But when you fast, anoint your head and wash your face, so that your fasting will not be obvious to men, but only to your Father, who is unseen. And your Father, who sees what is done in secret, will reward you.","BBE":"But when you go without food, put oil on your head and make your face clean; So that no one may see that you are going without food, but your Father in secret; and your Father, who sees in secret, will give you your reward.","Darby":"But thou, [when] fasting, anoint thy head and wash thy face, so that thou mayest not appear fasting unto men, but to thy Father who is in secret; and thy Father who sees in secret shall render [it] to thee.","Geneva1599":"But when thou fastest, anoint thine head, and wash thy face, That thou seeme not vnto men to fast, but vnto thy Father which is in secret: and thy Father which seeth in secret, will rewarde thee openly.","Webster":"But thou, when thou fastest, anoint thy head, and wash thy face; That thou mayest not appear to men to fast, but to thy Father, who is in secret: and thy Father, who seeth in secret, shall reward thee openly.","YLT":"`But thou, fasting, anoint thy head, and wash thy face, that thou mayest not appear to men fasting, but to thy Father who is in secret, and thy Father, who is seeing in secret, shall reward thee manifestly.","NHEB":"But you, when you fast, anoint your head, and wash your face; so that you are not seen by men to be fasting, but by your Father who is in secret, and your Father, who sees in secret, will reward you."}},{"r":"Isaiah 58:6","x":{"KJV":"Is not this the fast that I have chosen? to loose the bands of wickedness, to undo the heavy burdens, and to let the oppressed go free, and that ye break every yoke?","DRC":"Is not this rather the fast that I have chosen? loose the bands of wickedness, undo the bundles that oppress, let them that are broken go free, and break asunder every burden.","CPDV":"Is not this, instead, the kind of fast that I have chosen? Release the constraints of impiety; relieve the burdens that oppress; freely forgive those who are broken; and break apart every burden.","ASV":"Is not this the fast that I have chosen: to loose the bonds of wickedness, to undo the bands of the yoke, and to let the oppressed go free, and that ye break every yoke?","BSB":"Isn’t this the fast that I have chosen: to break the chains of wickedness, to untie the cords of the yoke, to set the oppressed free and tear off every yoke?","BBE":"Is not this the holy day for which I have given orders: to let loose those who have wrongly been made prisoners, to undo the bands of the yoke, and to let the crushed go free, and every yoke be broken?","Darby":"Is not this the fast which I have chosen: to loose the bands of wickedness, to undo the thongs of the yoke, and to send forth free the crushed, and that ye break every yoke?","Geneva1599":"Is not this the fasting, that I haue chosen, to loose the bandes of wickednes, to take off the heauie burdens, and to let the oppressed goe free, and that ye breake euery yoke?","Webster":"[Is] not this the fast that I have chosen? to loose the bands of wickedness, to undo the heavy burdens, and to let the oppressed go free, and that ye break every yoke?","YLT":"Is not this the fast that I chose--To loose the bands of wickedness, To shake off the burdens of the yoke, And to send out the oppressed free, And every yoke ye draw off?","NHEB":"\"Isn't this the fast that I have chosen: to release the bonds of wickedness, to undo the bands of the yoke, and to let the oppressed go free, and that you break every yoke?"}},{"r":"Joel 2:12","x":{"KJV":"Therefore also now, saith the LORD, turn ye even to me with all your heart, and with fasting, and with weeping, and with mourning:","DRC":"Now, therefore, saith the Lord. Be converted to me with all your heart, in fasting, and in weeping, and mourning.","CPDV":"Now, therefore, the Lord says: “Be converted to me with your whole heart, in fasting and weeping and mourning.”","ASV":"Yet even now, saith Jehovah, turn ye unto me with all your heart, and with fasting, and with weeping, and with mourning:","BSB":"“Yet even now,” declares the LORD, “return to Me with all your heart, with fasting, weeping, and mourning.”","BBE":"But even now, says the Lord, come back to me with all your heart, keeping from food, with weeping and with sorrow:","Darby":"Yet even now, saith Jehovah, turn to me with all your heart, and with fasting, and with weeping, and with mourning;","Geneva1599":"Therefore also now the Lord sayth, Turne you vnto me with all your heart, and with fasting, and with weeping, and with mourning,","Webster":"Therefore also now, saith the LORD, Turn ye even to me with all your heart, and with fasting, and with weeping, and with mourning:","YLT":"And also now--an affirmation of Jehovah, Turn ye back unto Me with all your heart, And with fasting, and with weeping, And with lamentation.","NHEB":"\"Yet even now,\" says the Lord, \"turn to me with all your heart, and with fasting, and with weeping, and with mourning.\""}}],"l":[{"r":"Alma 17:3","x":"But this is not all; they had given themselves to much prayer, and fasting; therefore they had the spirit of prophecy, and the spirit of revelation, and when they taught, they taught with power and authority of God."},{"r":"Omni 1:26","x":"And now, my beloved brethren, I would that ye should come unto Christ, who is the Holy One of Israel, and partake of his salvation, and the power of his redemption. Yea, come unto him, and offer your whole souls as an offering unto him, and continue in fasting and praying, and endure to the end; and as the Lord liveth ye will be saved."},{"r":"Helaman 3:35","x":"Nevertheless they did fast and pray oft, and did wax stronger and stronger in their humility, and firmer and firmer in the faith of Christ, unto the filling their souls with joy and consolation, yea, even to the purifying and the sanctification of their hearts, which sanctification cometh because of their yielding their hearts unto God."}]},{"id":"scripture-study","t":"scripture study","g":"Spiritual life","p":["read scriptures","study the word","Bible study","feast on the word"],"k":[],"v":[{"r":"Psalms 119:105","x":{"KJV":"Thy word is a lamp unto my feet, and a light unto my path.","DRC":"Thy word is a lamp to my feet, and a light to my paths.","CPDV":"Your word is a lamp to my feet and a light to my paths.","ASV":"Thy word is a lamp unto my feet, And light unto my path.","BSB":"Your word is a lamp to my feet and a light to my path.","BBE":"Your word is a light for my feet, ever shining on my way.","Darby":"NUN. Thy word is a lamp unto my feet, and a light unto my path.","Geneva1599":"NUN. Thy worde is a lanterne vnto my feete, and a light vnto my path.","Webster":"NUN. Thy word [is] a lamp to my feet, and a light to my path.","YLT":"Nun. A lamp to my foot is Thy word, And a light to my path.","NHEB":"Your word is a lamp to my feet, and a light for my path."},"a":{"DRC":"Psalms 118:105","CPDV":"Psalms 118:105"}},{"r":"2 Timothy 3:16","x":{"KJV":"All scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness:","DRC":"All scripture, inspired of God, is profitable to teach, to reprove, to correct, to instruct in justice:","CPDV":"All Scripture, having been divinely inspired, is useful for teaching, for reproof, for correction, and for instruction in justice,","ASV":"Every scripture inspired of God is also profitable for teaching, for reproof, for correction, for instruction which is in righteousness:","BSB":"All Scripture is God-breathed and is useful for instruction, for conviction, for correction, and for training in righteousness,","BBE":"Every holy Writing which comes from God is of profit for teaching, for training, for guiding, for education in righteousness:","Darby":"Every scripture [is] divinely inspired, and profitable for teaching, for conviction, for correction, for instruction in righteousness;","Geneva1599":"For the whole Scripture is giuen by inspiration of God, and is profitable to teache, to conuince, to correct, and to instruct in righteousnesse,","Webster":"All scripture [is] given by inspiration of God, and [is] profitable for doctrine, for reproof, for correction, for instruction in righteousness:","YLT":"every Writing is God-breathed, and profitable for teaching, for conviction, for setting aright, for instruction that is in righteousness,","NHEB":"Every Scripture is God-breathed and profitable for teaching, for reproof, for correction, and for instruction in righteousness,"}},{"r":"Joshua 1:8","x":{"KJV":"This book of the law shall not depart out of thy mouth; but thou shalt meditate therein day and night, that thou mayest observe to do according to all that is written therein: for then thou shalt make thy way prosperous, and then thou shalt have good success.","DRC":"Let not the book of this law depart from thy mouth: but thou shalt meditate on it day and night, that thou mayst observe and do all things that are written in it: then shalt thou direct thy way, and understand it.","CPDV":"The book of this law shall not depart from your mouth. Instead, you shall meditate upon it, day and night, so that you may observe and do all the things that are written in it. Then you shall direct your way and understand it.","ASV":"This book of the law shall not depart out of thy mouth, but thou shalt meditate thereon day and night, that thou mayest observe to do according to all that is written therein: for then thou shalt make thy way prosperous, and then thou shalt have good success.","BSB":"This Book of the Law must not depart from your mouth; meditate on it day and night, so that you may be careful to do everything written in it. For then you will prosper and succeed in all you do.","BBE":"Let this book of the law be ever on your lips and in your thoughts day and night, so that you may keep with care everything in it; then a blessing will be on all your way, and you will do well.","Darby":"This book of the law shall not depart from thy mouth; and thou shalt meditate upon it day and night, that thou mayest take heed to do according to all that is written therein; for then shalt thou have good success in thy ways, and then shalt thou prosper.","Geneva1599":"Let not this booke of the Law depart out of thy mouth, but meditate therin day and night, that thou mayest obserue and doe according to all that is written therein: for then shalt thou make thy way prosperous, and then shalt thou haue good successe.","Webster":"This book of the law shall not depart out of thy mouth; but thou shalt meditate in it day and night, that thou mayest observe to do according to all [that is] written therein: for then thou shalt make thy way prosperous, and then thou shalt have good success.","YLT":"the book of this law doth not depart out of thy mouth, and thou hast meditated in it by day and by night, so that thou dost observe to do according to all that is written in it, for then thou dost cause thy way to prosper, and then thou dost act wisely.","NHEB":"This scroll of the Law shall not depart out of your mouth, but you shall meditate on it day and night, that you may observe to do according to all that is written therein: for then you shall make your way prosperous, and then you shall have good success."}}],"l":[{"r":"2 Nephi 32:3","x":"Angels speak by the power of the Holy Ghost; wherefore, they speak the words of Christ. Wherefore, I said unto you, feast upon the words of Christ; for behold, the words of Christ will tell you all things what ye should do."},{"r":"Alma 17:2","x":"Now these sons of Mosiah were with Alma at the time the angel first appeared unto him; therefore Alma did rejoice exceedingly to see his brethren; and what added more to his joy, they were still his brethren in the Lord; yea, and they had waxed strong in the knowledge of the truth; for they were men of a sound understanding and they had searched the scriptures diligently, that they might know the word of God."},{"r":"1 Nephi 19:23","x":"And I did read many things unto them which were written in the books of Moses; but that I might more fully persuade them to believe in the Lord their Redeemer I did read unto them that which was written by the prophet Isaiah; for I did liken all scriptures unto us, that it might be for our profit and learning."}]},{"id":"the-holy-spirit","t":"the Holy Spirit","g":"Spiritual life","p":["Holy Spirit","Holy Ghost","the Comforter","feel the Spirit"],"k":[],"v":[{"r":"John 14:26","x":{"KJV":"But the Comforter, which is the Holy Ghost, whom the Father will send in my name, he shall teach you all things, and bring all things to your remembrance, whatsoever I have said unto you.","DRC":"But the Paraclete, the Holy Ghost, whom the Father will send in my name, he will teach you all things and bring all things to your mind, whatsoever I shall have said to you.","CPDV":"But the Advocate, the Holy Spirit, whom the Father will send in my name, will teach you all things and will suggest to you everything whatsoever that I have said to you.","ASV":"But the Comforter, even the Holy Spirit, whom the Father will send in my name, he shall teach you all things, and bring to your remembrance all that I said unto you.","BSB":"But the Advocate, the Holy Spirit, whom the Father will send in My name, will teach you all things and will remind you of everything I have told you.","BBE":"But the Helper, the Holy Spirit, whom the Father will send in my name, will be your teacher in all things and will put you in mind of everything I have said to you.","Darby":"but the Comforter, the Holy Spirit, whom the Father will send in my name, he shall teach you all things, and will bring to your remembrance all the things which I have said to you.","Geneva1599":"But the Comforter, which is the holy Ghost, whom the Father wil send in my Name, he shall teach you all things, and bring all things to your remembrance, which I haue tolde you.","Webster":"But the Comforter, [who is] the Holy Spirit, whom the Father will send in my name, he will teach you all things, and bring all things to your remembrance, whatever I have said to you.","YLT":"and the Comforter, the Holy Spirit, whom the Father will send in my name, he will teach you all things, and remind you of all things that I said to you.","NHEB":"But the Counselor, the Holy Spirit, whom the Father will send in my name, he will teach you all things, and will remind you of all that I said to you."}},{"r":"Galatians 5:22-23","x":{"KJV":"But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith, Meekness, temperance: against such there is no law.","DRC":"But the fruit of the Spirit is, charity, joy, peace, patience, benignity, goodness, longanimity, Mildness, faith, modesty, continency, chastity. Against such there is no law.","CPDV":"But the fruit of the Spirit is charity, joy, peace, patience, kindness, goodness, forbearance, meekness, faith, modesty, abstinence, chastity. There is no law against such things.","ASV":"But the fruit of the Spirit is love, joy, peace, longsuffering, kindness, goodness, faithfulness, meekness, self-control; against such there is no law.","BSB":"But the fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, and self-control. Against such things there is no law.","BBE":"But the fruit of the Spirit is love, joy, peace, a quiet mind, kind acts, well-doing, faith, Gentle behaviour, control over desires: against such there is no law.","Darby":"But the fruit of the Spirit is love, joy, peace, long-suffering, kindness, goodness, fidelity, meekness, self-control: against such things there is no law.","Geneva1599":"But the fruite of the Spirit is loue, ioye, peace, long suffering, gentlenes, goodnes, fayth, Meekenesse, temperancie: against such there is no lawe.","Webster":"But the fruit of the Spirit is love, joy, peace, long-suffering, gentleness, goodness, faith, Meekness, temperance: against such there is no law.","YLT":"And the fruit of the Spirit is: Love, joy, peace, long-suffering, kindness, goodness, faith, meekness, temperance: against such there is no law;","NHEB":"But the fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faith, gentleness, and self-control. Against such things there is no law."}},{"r":"Romans 8:26","x":{"KJV":"Likewise the Spirit also helpeth our infirmities: for we know not what we should pray for as we ought: but the Spirit itself maketh intercession for us with groanings which cannot be uttered.","DRC":"Likewise, the Spirit also helpeth our infirmity. For, we know not what we should pray for as we ought: but the Spirit himself asketh for us with unspeakable groanings,","CPDV":"And similarly, the Spirit also helps our weakness. For we do not know how to pray as we ought, but the Spirit himself asks on our behalf with ineffable sighing.","ASV":"And in like manner the Spirit also helpeth our infirmity: for we know not how to pray as we ought; but the Spirit himself maketh intercession for us with groanings which cannot be uttered;","BSB":"In the same way, the Spirit helps us in our weakness. For we do not know how we ought to pray, but the Spirit Himself intercedes for us with groans too deep for words.","BBE":"And in the same way the Spirit is a help to our feeble hearts: for we are not able to make prayer to God in the right way; but the Spirit puts our desires into words which are not in our power to say;","Darby":"And in like manner the Spirit joins also its help to our weakness; for we do not know what we should pray for as is fitting, but the Spirit itself makes intercession with groanings which cannot be uttered.","Geneva1599":"Likewise the Spirit also helpeth our infirmities: for we knowe not what to pray as wee ought: but the Spirit it selfe maketh request for vs with sighs, which cannot be expressed.","Webster":"Likewise the Spirit also helpeth our infirmities: for we know not what we should pray for as we ought: but the Spirit itself maketh intercession for us with groanings which cannot be uttered.","YLT":"And, in like manner also, the Spirit doth help our weaknesses; for, what we may pray for, as it behoveth us, we have not known, but the Spirit himself doth make intercession for us with groanings unutterable,","NHEB":"In the same way, the Spirit also helps our weaknesses, for we do not know how to pray as we ought. But the Spirit himself makes intercession for us with groanings which cannot be uttered."}}],"l":[{"r":"Moroni 10:5","x":"And by the power of the Holy Ghost ye may know the truth of all things."},{"r":"2 Nephi 32:5","x":"For behold, again I say unto you that if ye will enter in by the way, and receive the Holy Ghost, it will show unto you all things what ye should do."},{"r":"D&C 8:2","x":"Yea, behold, I will tell you in your mind and in your heart, by the Holy Ghost, which shall come upon you and which shall dwell in your heart."}]},{"id":"worship","t":"worship","g":"Spiritual life","p":["worship","praise","sing to God","adore"],"k":[],"v":[{"r":"Psalms 95:6","x":{"KJV":"O come, let us worship and bow down: let us kneel before the LORD our maker.","DRC":"Come let us adore and fall down: and weep before the Lord that made us.","CPDV":"Come, let us adore and fall prostrate, and let us weep before the Lord who made us.","ASV":"Oh come, let us worship and bow down; Let us kneel before Jehovah our Maker:","BSB":"O come, let us worship and bow down; let us kneel before the LORD our Maker.","BBE":"O come, let us give worship, falling down on our knees before the Lord our Maker.","Darby":"Come, let us worship and bow down; let us kneel before Jehovah our Maker.","Geneva1599":"Come, let vs worship and fall downe, and kneele before the Lord our maker.","Webster":"O come, let us worship and bow down: let us kneel before the LORD our maker.","YLT":"Come in, we bow ourselves, and we bend, We kneel before Jehovah our Maker.","NHEB":"Oh come, let's worship and bow down. Let's kneel before the Lord, our Maker,"},"a":{"DRC":"Psalms 94:6","CPDV":"Psalms 94:6"}},{"r":"John 4:24","x":{"KJV":"God is a Spirit: and they that worship him must worship him in spirit and in truth.","DRC":"God is a spirit: and they that adore him must adore him in spirit and in truth.","CPDV":"God is Spirit. And so, those who worship him must worship in spirit and in truth.”","ASV":"God is a Spirit: and they that worship him must worship in spirit and truth.","BSB":"God is Spirit, and His worshipers must worship Him in spirit and in truth.”","BBE":"God is Spirit: then let his worshippers give him worship in the true way of the spirit.","Darby":"God [is] a spirit; and they who worship him must worship [him] in spirit and truth.","Geneva1599":"God is a Spirite, and they that worship him, must worship him in spirit and trueth.","Webster":"God [is] a Spirit: and they that worship him, must worship [him] in spirit and in truth.","YLT":"God is a Spirit, and those worshipping Him, in spirit and truth it doth behove to worship.'","NHEB":"God is spirit, and those who worship him must worship in spirit and truth.\""}},{"r":"Psalms 100:1-2","x":{"KJV":"Make a joyful noise unto the LORD, all ye lands. Serve the LORD with gladness: come before his presence with singing.","DRC":"A psalm of praise. Sing joyfully to God, all the earth: serve ye the Lord with gladness. Come in before his presence with exceeding great joy.","CPDV":"A Psalm of Confession. Shout joyfully to God, all the earth. Serve the Lord with rejoicing. Enter into his sight in exultation.","ASV":"A Psalm of thanksgiving. Make a joyful noise unto Jehovah, all ye lands. Serve Jehovah with gladness: Come before his presence with singing.","BSB":"A Psalm of thanksgiving. Make a joyful noise to the LORD, all the earth. Serve the LORD with gladness; come into His presence with joyful songs.","BBE":"Make a glad sound to the Lord, all the earth. Give worship to the Lord with joy; come before him with a song.","Darby":"A Psalm of thanksgiving. Shout aloud unto Jehovah, all the earth! Serve Jehovah with joy: come before his presence with exultation.","Geneva1599":"A Psalme of Praise. Sing ye loude vnto the Lord, all the earth. Serue the Lord with gladnes: come before him with ioyfulnes.","Webster":"A Psalm of praise. Make a joyful noise to the LORD, all ye lands. Serve the LORD with gladness: come before his presence with singing.","YLT":"A Psalm of Thanksgiving. Shout to Jehovah, all the earth. Serve Jehovah with joy, come before him with singing.","NHEB":"A Psalm of thanksgiving. Shout for joy to the Lord, all you lands! Serve the Lord with gladness. Come before his presence with singing."},"a":{"DRC":"Psalms 99:1-2","CPDV":"Psalms 99:1-2"}}],"l":[{"r":"2 Nephi 25:29","x":"And now behold, I say unto you that the right way is to believe in Christ, and deny him not; and Christ is the Holy One of Israel; wherefore ye must bow down before him, and worship him with all your might, mind, and strength, and your whole soul; and if ye do this ye shall in nowise be cast out."},{"r":"D&C 25:12","x":"For my soul delighteth in the song of the heart; yea, the song of the righteous is a prayer unto me, and it shall be answered with a blessing upon their heads."},{"r":"Alma 26:8","x":"Blessed be the name of our God; let us sing to his praise, yea, let us give thanks to his holy name, for he doth work righteousness forever."}]},{"id":"gratitude","t":"gratitude","g":"Spiritual life","p":["thankful","grateful","gratitude","count my blessings"],"k":["thankful","grateful"],"v":[{"r":"1 Thessalonians 5:18","x":{"KJV":"In every thing give thanks: for this is the will of God in Christ Jesus concerning you.","DRC":"In all things give thanks for this is the will of God in Christ Jesus concerning you all.","CPDV":"Give thanks in everything. For this is the will of God in Christ Jesus for all of you.","ASV":"in everything give thanks: for this is the will of God in Christ Jesus to you-ward.","BSB":"Give thanks in every circumstance, for this is God’s will for you in Christ Jesus.","BBE":"In everything give praise: for this is the purpose of God in Christ Jesus for you.","Darby":"in everything give thanks, for this is [the] will ofGod in Christ Jesus towards you;","Geneva1599":"In all thinges giue thankes: for this is the will of God in Christ Iesus toward you.","Webster":"In every thing give thanks: for this is the will of God in Christ Jesus concerning you.","YLT":"in every thing give thanks, for this is the will of God in Christ Jesus in regard to you.","NHEB":"In everything give thanks, for this is the will of God in Christ Jesus toward you."}},{"r":"Psalms 107:1","x":{"KJV":"O give thanks unto the LORD, for he is good: for his mercy endureth for ever.","DRC":"Give glory to the Lord, for he is good: for his mercy endureth for ever.","CPDV":"Alleluia. Confess to the Lord, for he is good, for his mercy is with every generation.","ASV":"O give thanks unto Jehovah; for he is good; For his lovingkindness endureth for ever.","BSB":"Give thanks to the LORD, for He is good; His loving devotion endures forever.","BBE":"O give praise to the Lord, for he is good: for his mercy is unchanging for ever.","Darby":"Give ye thanks unto Jehovah; for he is good; for his loving-kindness [endureth] for ever.","Geneva1599":"Praise the Lord, because he is good: for his mercie endureth for euer.","Webster":"O give thanks to the LORD, for [he is] good; for his mercy [endureth] for ever.","YLT":"`Give ye thanks to Jehovah, For good, for to the age is His kindness:'","NHEB":"Give thanks to the Lord, for he is good, for his loving kindness endures forever."},"a":{"DRC":"Psalms 106:1","CPDV":"Psalms 106:1"}},{"r":"Colossians 3:17","x":{"KJV":"And whatsoever ye do in word or deed, do all in the name of the Lord Jesus, giving thanks to God and the Father by him.","DRC":"All whatsoever you do in word or in work, do all in the name of the Lord Jesus Christ, giving thanks to God and the Father by him.","CPDV":"Let everything whatsoever that you do, whether in word or in deed, be done all in the name of the Lord Jesus Christ, giving thanks to God the Father through him.","ASV":"And whatsoever ye do, in word or in deed, do all in the name of the Lord Jesus, giving thanks to God the Father through him.","BSB":"And whatever you do, in word or deed, do it all in the name of the Lord Jesus, giving thanks to God the Father through Him.","BBE":"And whatever you do, in word or in act, do all in the name of the Lord Jesus, giving praise to God the Father through him.","Darby":"And everything, whatever ye may do in word or in deed, [do] all things in [the] name of [the] Lord Jesus, giving thanks toGod the Father by him.","Geneva1599":"And whatsoeuer ye shall doe, in worde or deede, doe all in the Name of the Lord Iesus, giuing thankes to God euen the Father by him.","Webster":"And whatever ye do in word or deed, [do] all in the name of the Lord Jesus, giving thanks to God and the Father by him.","YLT":"and all, whatever ye may do in word or in work, do all things in the name of the Lord Jesus--giving thanks to the God and Father, through him.","NHEB":"Whatever you do, in word or in deed, do all in the name of the Lord Jesus, giving thanks to God the Father, through him."}}],"l":[{"r":"D&C 59:21","x":"And in nothing doth man offend God, or against none is his wrath kindled, save those who confess not his hand in all things, and obey not his commandments."},{"r":"Alma 34:38","x":"That ye contend no more against the Holy Ghost, but that ye receive it, and take upon you the name of Christ; that ye humble yourselves even to the dust, and worship God, in whatsoever place ye may be in, in spirit and in truth; and that ye live in thanksgiving daily, for the many mercies and blessings which he doth bestow upon you."},{"r":"D&C 78:19","x":"And he who receiveth all things with thankfulness shall be made glorious; and the things of this earth shall be added unto him, even an hundred fold, yea, more."}]},{"id":"sacrament-or-communion","t":"Sacrament or Communion","g":"Spiritual life","p":["sacrament","communion","Lord's supper","bread and wine"],"k":[],"v":[{"r":"Luke 22:19-20","x":{"KJV":"And he took bread, and gave thanks, and brake it, and gave unto them, saying, This is my body which is given for you: this do in remembrance of me. Likewise also the cup after supper, saying, This cup is the new testament in my blood, which is shed for you.","DRC":"And taking bread, he gave thanks and brake and gave to them, saying: This is my body, which is given for you. Do this for a commemoration of me. In like manner, the chalice also, after he had supped, saying: This is the chalice, the new testament in my blood, which shall be shed for you.","CPDV":"And taking bread, he gave thanks and broke it and gave it to them, saying: “This is my body, which is given for you. Do this as a commemoration of me.” Similarly also, he took the chalice, after he had eaten the meal, saying: “This chalice is the new covenant in my blood, which will be shed for you.","ASV":"And he took bread, and when he had given thanks, he brake it, and gave to them, saying, This is my body which is given for you: this do in remembrance of me. And the cup in like manner after supper, saying, This cup is the new covenant in my blood, even that which is poured out for you.","BSB":"And He took the bread, gave thanks and broke it, and gave it to them, saying, “This is My body, given for you; do this in remembrance of Me.” In the same way, after supper He took the cup, saying, “This cup is the new covenant in My blood, which is poured out for you.","BBE":"And he took bread and, having given praise, he gave it to them when it had been broken, saying, This is my body, which is given for you: do this in memory of me. And in the same way, after the meal, he took the cup, saying, This cup is the new testament, made with my blood which is given for you.","Darby":"And having taken a loaf, when he had given thanks, he broke [it], and gave [it] to them, saying, This is my body which is given for you: this do in remembrance of me. In like manner also the cup, after having supped, saying, This cup [is] the new covenant in my blood, which is poured out for you.","Geneva1599":"And he tooke bread, and when he had giuen thankes, he brake it, and gaue to them, saying, This is my body, which is giuen for you: doe this in the remembrance of me. Likewise also after supper he tooke the cup, saying, This cup is that newe Testament in my blood, which is shed for you.","Webster":"And he took bread, and gave thanks, and broke [it], and gave to them, saying, This is my body which is given for you: this do in remembrance of me. Likewise also the cup after supper, saying, This cup [is] the new testament in my blood, which is shed for you.","YLT":"And having taken bread, having given thanks, he brake and gave to them, saying, `This is my body, that for you is being given, this do ye--to remembrance of me.' In like manner, also, the cup after the supping, saying, `This cup is the new covenant in my blood, that for you is being poured forth.","NHEB":"He took bread, and when he had given thanks, he broke it, and gave to them, saying, \"This is my body which is given for you. Do this in memory of me.\" Likewise, he took the cup after supper, saying, \"This cup is the New Covenant in my blood, which is poured out for you."}},{"r":"1 Corinthians 11:23-26","x":{"KJV":"For I have received of the Lord that which also I delivered unto you, That the Lord Jesus the same night in which he was betrayed took bread: And when he had given thanks, he brake it, and said, Take, eat: this is my body, which is broken for you: this do in remembrance of me. After the same manner also he took the cup, when he had supped, saying, This cup is the new testament in my blood: this do ye, as oft as ye drink it, in remembrance of me. For as often as ye eat this bread, and drink this cup, ye do shew the Lord's death till he come.","DRC":"For I have received of the Lord that which also I delivered unto you, that the Lord Jesus, the same night in which he was betrayed, took bread, And giving thanks, broke and said: Take ye and eat: This is my body, which shall be delivered for you. This do for the commemoration of me. In like manner also the chalice, after he had supped, saying: This chalice is the new testament in my blood. This do ye, as often as you shall drink, for the commemoration of me. For as often as you shall eat this bread and drink the chalice, you shall shew the death of the Lord, until he come.","CPDV":"For I have received from the Lord what I have also delivered to you: that the Lord Jesus, on the same night that he was handed over, took bread, and giving thanks, he broke it, and said: “Take and eat. This is my body, which shall be given up for you. Do this in remembrance of me.” Similarly also, the cup, after he had eaten supper, saying: “This cup is the new covenant in my blood. Do this, as often as you drink it, in remembrance of me.” For whenever you eat this bread and drink this cup, you proclaim the death of the Lord, until he returns.","ASV":"For I received of the Lord that which also I delivered unto you, that the Lord Jesus in the night in which he was betrayed took bread; and when he had given thanks, he brake it, and said, This is my body, which is for you: this do in remembrance of me. In like manner also the cup, after supper, saying, This cup is the new covenant in my blood: this do, as often as ye drink it, in remembrance of me. For as often as ye eat this bread, and drink the cup, ye proclaim the Lord’s death till he come.","BSB":"For I received from the Lord what I also passed on to you: The Lord Jesus, on the night He was betrayed, took bread, and when He had given thanks, He broke it and said, “This is My body, which is for you; do this in remembrance of Me.” In t
