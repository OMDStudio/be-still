pe the vnitie of the Spirit in the bond of peace.","Webster":"With all lowliness and meekness, with long-suffering, forbearing one another in love; Endeavoring to keep the unity of the Spirit in the bond of peace.","YLT":"with all lowliness and meekness, with long-suffering, forbearing one another in love, being diligent to keep the unity of the Spirit in the bond of the peace;","NHEB":"with all lowliness and humility, with patience, bearing with one another in love; being eager to keep the unity of the Spirit in the bond of peace."}}],"l":[{"r":"D&C 42:22","x":"Thou shalt love thy wife with all thy heart, and shalt cleave unto her and none else."},{"r":"Moroni 7:45","x":"And charity suffereth long, and is kind, and envieth not, and is not puffed up, seeketh not her own, is not easily provoked, thinketh no evil, and rejoiceth not in iniquity but rejoiceth in the truth, beareth all things, believeth all things, hopeth all things, endureth all things."},{"r":"D&C 64:10","x":"I, the Lord, will forgive whom I will forgive, but of you it is required to forgive all men."}]},{"id":"divorce","t":"divorce","g":"Relationships","p":["getting divorced","my divorce","separated","ex husband","ex wife"],"k":[],"v":[{"r":"Psalms 147:3","x":{"KJV":"He healeth the broken in heart, and bindeth up their wounds.","DRC":"Who healeth the broken of heart, and bindeth up their bruises.","CPDV":"He heals the contrite of heart, and he binds up their sorrows.","ASV":"He healeth the broken in heart, And bindeth up their wounds.","BSB":"He heals the brokenhearted and binds up their wounds.","BBE":"He makes the broken-hearted well, and puts oil on their wounds.","Darby":"He healeth the broken in heart, and bindeth up their wounds.","Geneva1599":"He healeth those that are broken in heart, and bindeth vp their sores.","Webster":"He healeth the broken in heart, and bindeth up their wounds.","YLT":"Who is giving healing to the broken of heart, And is binding up their griefs.","NHEB":"He heals the bro am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.","DRC":"Fear not, for I am with thee: turn not aside, for I am thy God: I have strengthened thee, and have helped thee, and the right hand of my just one hath upheld thee.","CPDV":"Do not be afraid, for I am with you. Do not turn away, for I am your God. I have strengthened you, and I have assisted you, and the right hand of my just one has upheld you.","ASV":"fear thou not, for I am with thee; be not dismayed, for I am thy God; I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.","BSB":"Do not fear, for I am with you; do not be afraid, for I am your God. I will strengthen you; I will surely help you; I will uphold you with My right hand of righteousness.","BBE":"Have no fear, for I am with you; do not be looking about in trouble, for I am your God; I will give you strength, yes, I will be your helper; yes, my true right hand will be your support.","Darby":"— Fear not, for I [am] with thee; be not dismayed, for I [am] thyGod: I will strengthen thee, yea, I will help thee, yea, I will uphold thee with the right hand of my righteousness.","Geneva1599":"Feare thou not, for I am with thee: be not afraide, for I am thy God: I will strengthen thee, and helpe thee, and will susteine thee with the right hand of my iustice.","Webster":"Fear thou not; for I [am] with thee: be not dismayed; for I [am] thy God: I will strengthen thee; yes, I will help thee; yes, I will uphold thee with the right hand of my righteousness.","YLT":"Be not afraid, for with thee I am, Look not around, for I am thy God, I have strengthened thee, Yea, I have helped thee, yea, I upheld thee, With the right hand of My righteousness.","NHEB":"Do not be afraid, for I am with you. Do not be dismayed, for I am your God. I will strengthen you. Yes, I will help you. Yes, I will uphold you with the right hand of my righteousness. also in Christ has forgiven you.","Geneva1599":"Be ye courteous one to another, and tender hearted, freely forgiuing one another, euen as God for Christes sake, freely forgaue you.","Webster":"And be ye kind one to another, tender-hearted, forgiving one another, even as God for Christ's sake hath forgiven you.","YLT":"and become one to another kind, tender-hearted, forgiving one another, according as also God in Christ did forgive you.","NHEB":"And be kind to one another, tenderhearted, forgiving each other, just as God also in Christ forgave you."}},{"r":"Matthew 6:14","x":{"KJV":"For if ye forgive men their trespasses, your heavenly Father will also forgive you:","DRC":"For if you will forgive men their offences, your heavenly Father will forgive you also your offences.","CPDV":"For if you will forgive men their sins, your heavenly Father also will forgive you your offenses.","ASV":"For if ye forgive men their trespasses, your heavenly Father will also forgive you.","BSB":"For if you forgive men their trespasses, your heavenly Father will also forgive you.","BBE":"For if you let men have forgiveness for their sins, you will have forgiveness from your Father in heaven.","Darby":"For if ye forgive men their offences, your heavenly Father also will forgive you [yours],","Geneva1599":"For if ye doe forgiue men their trespasses, your heauenly Father will also forgiue you.","Webster":"For, if ye forgive men their trespasses, your heavenly Father will also forgive you:","YLT":"`For, if ye may forgive men their trespasses He also will forgive you--your Father who is in the heavens;","NHEB":"\"For if you forgive men their trespasses, your heavenly Father will also forgive you."}},{"r":"Colossians 3:13","x":{"KJV":"Forbearing one another, and forgiving one another, if any man have a quarrel against any: even as Christ forgave you, so also do ye.","DRC":"Bearing with one another and forgiving one another, if any have a complaint against another. Even as the Lord hath forgiven you, so do you also.","CPDV":"Support one another, and, if anyone has a complaint against another, forgive one another. For just as the Lord has forgiven you, so also must you do.","ASV":"forbearing one another, and forgiving each other, if any man have a complaint against any; even as the Lord forgave you, so also do ye:","BSB":"Bear with one another and forgive any complaint you may have against someone else. Forgive as the Lord forgave you.","BBE":"Being gentle to one another and having forgiveness for one another, if anyone has done wrong to his brother, even as the Lord had forgiveness for you:","Darby":"forbearing one another, and forgiving one another, if any should have a complaint against any; even as the Christ has forgiven you, so also [do] ye.","Geneva1599":"Forbearing one another, and forgiuing one another, if any man haue a quarel to another: euen as Christ forgaue, euen so doe ye.","Webster":"Forbearing one another, and forgiving one another, if any man hath a quarrel against any: even as Christ forgave you, so also [do] ye.","YLT":"forbearing one another, and forgiving each other, if any one with any one may have a quarrel, as also the Christ did forgive you--so also ye;","NHEB":"bearing with one another, and forgiving each other, if anyone has a complaint against another; even as the Lord forgave you, so you also do."}}],"l":[{"r":"D&C 64:10","x":"I, the Lord, will forgive whom I will forgive, but of you it is required to forgive all men."},{"r":"D&C 64:9","x":"Wherefore, I say unto you, that ye ought to forgive one another; for he that forgiveth not his brother his trespasses standeth condemned before the Lord; for there remaineth in him the greater sin."},{"r":"3 Nephi 13:14","x":"For, if ye forgive men their trespasses your heavenly Father will also forgive you;"}]},{"id":"betrayal","t":"betrayal","g":"Relationships","p":["betrayed","they lied to me","cheated on me","stabbed in the back"],"k":["lied","lie","liar","cheated","betray"],"v":[{"r":"Psalms 55:12-14","x":{"KJV":"For it was not an enemy that reproached me; then I could have borne it: neither was it he that hated me that did magnify himself against me; then I would have hid myself from him: But it was thou, a man mine equal, my guide, and mine acquaintance. We took sweet counsel together, and walked unto the house of God in company.","DRC":"For if my enemy had reviled me, I would verily have borne with it. And if he that hated me had spoken great things against me, I would perhaps have hidden my self from him. But thou a man of one mind, my guide, and my familiar, Who didst take sweetmeats together with me: in the house of God we walked with consent.","CPDV":"For if my enemy had spoken evil about me, certainly, I would have sustained it. And if he who hated me had been speaking great things against me, I would perhaps have hidden myself from him. Truly, you are a man of one mind: my leader and my acquaintance, who took sweet food together with me. In the house of God, we walked side-by-side.","ASV":"For it was not an enemy that reproached me; Then I could have borne it: Neither was it he that hated me that did magnify himself against me; Then I would have hid myself from him: But it was thou, a man mine equal, My companion, and my familiar friend. We took sweet counsel together; We walked in the house of God with the throng.","BSB":"For it is not an enemy who insults me; that I could endure. It is not a foe who rises against me; from him I could hide. But it is you, a man like myself, my companion and close friend. We shared sweet fellowship together; we walked with the crowd into the house of God.","BBE":"For it was not my hater who said evil of me; that would have been no grief to me; it was not one outside the number of my friends who made himself strong against me, or I would have kept myself from him in a secret place; But it was you, my equal, my guide, my well-loved friend. We had loving talk together, and went to the house of God in company.","Darby":"For it is not an enemy that hath reproached me — then could I have borne it; neither is it he that hateth me that hath magnified [himself] against me — then would I have hidden myself from him; But it was thou, a man mine equal, mine intimate, my familiar friend.... We who held sweet intercourse together. To the house ofGod we walked amid the throng.","Geneva1599":"Surely mine enemie did not defame mee: for I could haue borne it: neither did mine aduersarie exalt himselfe against mee: for I would haue hid me from him. But it was thou, O man, euen my companion, my guide and my familiar: Which delited in consulting together, and went into the House of God as companions.","Webster":"For [it was] not an enemy [that] reproached me; then I could have borne [it]: neither [was it] he that hated me [that] magnified [himself] against me; then I would have hid myself from him: But [it was] thou, a man my equal, my guide, and my acquaintance. We took sweet counsel together, [and] walked to the house of God in company.","YLT":"For an enemy reproacheth me not, or I bear it, He who is hating me Hath not magnified himself against me, Or I hide from him. But thou, a man--as mine equal, My familiar friend, and mine acquaintance. When together we sweeten counsel, Into the house of God we walk in company.","NHEB":"For it was not an enemy who insulted me, then I could have endured it. Neither was it he who hated me who raised himself up against me, then I would have hid myself from him. But it was you, a man like me, my companion, and my familiar friend. We took sweet fellowship together. We walked in God's house with company."},"a":{"DRC":"Psalms 54:13-15","CPDV":"Psalms 54:13-15"}},{"r":"Psalms 41:9","x":{"KJV":"Yea, mine own familiar friend, in whom I trusted, which did eat of my bread, hath lifted up his heel against me.","DRC":"For even the man of my peace, in whom I trusted, who ate my bread, hath greatly supplanted me.","CPDV":"For even the man of my peace, in whom I hoped, who ate my bread, has greatly supplanted me.","ASV":"Yea, mine own familiar friend, in whom I trusted, Who did eat of my bread, Hath lifted up his heel against me.","BSB":"Even my close friend whom I trusted, the one who shared my bread, has lifted up his heel against me.","BBE":"Even my dearest friend, in whom I had faith, who took bread with me, is turned against me.","Darby":"Yea, mine own familiar friend, in whom I confided, who did eat of my bread, hath lifted up [his] heel against me.","Geneva1599":"Yea, my familiar friend, whom I trusted, which did eate of my bread, hath lifted vp the heele against me.","Webster":"Yes, my own familiar friend, in whom I trusted, who ate of my bread, hath lifted up [his] heel against me.","YLT":"Even mine ally, in whom I trusted, One eating my bread, made great the heel against me,","NHEB":"Yes, my own familiar friend, in whom I trusted, who ate bread with me, has lifted up his heel against me."},"a":{"DRC":"Psalms 40:10","CPDV":"Psalms 40:10"}},{"r":"Romans 12:19","x":{"KJV":"Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord.","DRC":"Revenge not yourselves, my dearly beloved; but give place unto wrath, for it is written: Revenge is mine, I will repay, saith the Lord.","CPDV":"Do not defend yourselves, dearest ones. Instead, step aside from wrath. For it is written: “Vengeance is mine. I shall give retribution, says the Lord.”","ASV":"Avenge not yourselves, beloved, but give place unto the wrath of God: for it is written, Vengeance belongeth unto me; I will recompense, saith the Lord.","BSB":"Do not avenge yourselves, beloved, but leave room for God’s wrath. For it is written: “Vengeance is Mine; I will repay, says the Lord.”","BBE":"Do not give punishment for wrongs done to you, dear brothers, but give way to the wrath of God; for it is said in the holy Writings, Punishment is mine, I will give reward, says the Lord.","Darby":"not avenging yourselves, beloved, but give place to wrath; for it is written, Vengeance [belongs] to me, I will recompense, saith the Lord.","Geneva1599":"Dearely beloued, auenge not your selues, but giue place vnto wrath: for it is written, Vengeance is mine: I will repay, saith the Lord.","Webster":"Dearly beloved, avenge not yourselves, but [rather] give place to wrath: for it is written, Vengeance [is] mine; I will repay, saith the Lord.","YLT":"not avenging yourselves, beloved, but give place to the wrath, for it hath been written, `Vengeance is Mine,","NHEB":"Do not seek revenge yourselves, beloved, but give place to God's wrath. For it is written, \"Vengeance belongs to me; I will repay, says the Lord.\""}}],"l":[{"r":"D&C 121:7-8","x":"My son, peace be unto thy soul; thine adversity and thine afflictions shall be but a small moment; And then, if thou endure it well, God shall exalt thee on high; thou shalt triumph over all thy foes."},{"r":"D&C 122:7","x":"And if thou shouldst be cast into the pit, or into the hands of murderers, and the sentence of death passed upon thee; if thou be cast into the deep; if the billowing surge conspire against thee; if fierce winds become thine enemy; if the heavens gather blackness, and all the elements combine to hedge up the way; and above all, if the very jaws of hell shall gape open the mouth wide after thee, know thou, my son, that all these things shall give thee experience, and shall be for thy good."},{"r":"D&C 64:10","x":"I, the Lord, will forgive whom I will forgive, but of you it is required to forgive all men."}]},{"id":"enemies","t":"enemies","g":"Relationships","p":["someone hates me","enemy","people against me","persecuted"],"k":[],"v":[{"r":"Matthew 5:44","x":{"KJV":"But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you;","DRC":"But I say to you, Love your enemies: do good to them that hate you: and pray for them that persecute and calumniate you:","CPDV":"But I say to you: Love your enemies. Do good to those who hate you. And pray for those who persecute and slander you.","ASV":"but I say unto you, Love your enemies, and pray for them that persecute you;","BSB":"But I tell you, love your enemies and pray for those who persecute you,","BBE":"But I say to you, Have love for those who are against you, and make prayer for those who are cruel to you;","Darby":"But I say unto you, Love your enemies, [bless those who curse you,] do good to those who hate you, and pray for those who [insult you and] persecute you,","Geneva1599":"But I say vnto you, Loue your enemies: blesse them that curse you: doe good to them that hate you, and pray for them which hurt you, and persecute you,","Webster":"But I say to you, Love your enemies, bless them that curse you, do good to them that hate you, and pray for them who despitefully use you, and persecute you;","YLT":"but I--I say to you, Love your enemies, bless those cursing you, do good to those hating you, and pray for those accusing you falsely, and persecuting you,","NHEB":"But I tell you, love your enemies, and pray for those who persecute you,"}},{"r":"Romans 12:20-21","x":{"KJV":"Therefore if thine enemy hunger, feed him; if he thirst, give him drink: for in so doing thou shalt heap coals of fire on his head. Be not overcome of evil, but overcome evil with good.","DRC":"But if the enemy be hungry, give him to eat; if he thirst, give him to drink. For, doing this, thou shalt heap coals of fire upon his head. Be not overcome by evil: but overcome evil by good.","CPDV":"So if an enemy is hungry, feed him; if he is thirsty, give him a drink. For in doing so, you will heap burning coals upon his head. Do not allow evil to prevail, instead prevail over evil by means of goodness.","ASV":"But if thine enemy hunger, feed him; if he thirst, give him to drink: for in so doing thou shalt heap coals of fire upon his head. Be not overcome of evil, but overcome evil with good.","BSB":"On the contrary, “If your enemy is hungry, feed him; if he is thirsty, give him a drink. For in so doing, you will heap burning coals on his head.” Do not be overcome by evil, but overcome evil with good.","BBE":"But if one who has hate for you is in need of food or of drink, give it to him, for in so doing you will put coals of fire on his head. Do not let evil overcome you, but overcome evil by good.","Darby":"If therefore thine enemy should hunger, feed him; if he should thirst, give him drink; for, so doing, thou shalt heap coals of fire upon his head. Be not overcome by evil, but overcome evil with good.","Geneva1599":"Therefore, if thine enemie hunger, feede him: if he thirst, giue him drinke: for in so doing, thou shalt heape coales of fire on his head. Bee not ouercome of euill, but ouercome euill with goodnesse.","Webster":"Therefore if thy enemy hungereth, feed him; if he thirsteth, give him drink: for in so doing thou shalt heap coals of fire on his head. Be not overcome by evil, but overcome evil with good.","YLT":"I will recompense again, saith the Lord;' if, then, thine enemy doth hunger, feed him; if he doth thirst, give him drink; for this doing, coals of fire thou shalt heap upon his head; Be not overcome by the evil, but overcome, in the good, the evil.","NHEB":"Therefore \"If your enemy is hungry, feed him. If he is thirsty, give him a drink; for in doing so, you will heap coals of fire on his head.\" Do not be overcome by evil, but overcome evil with good."}},{"r":"Psalms 27:1","x":{"KJV":"The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?","DRC":"The psalm of David before he was anointed. The Lord is my light and my salvation, whom shall I fear? The Lord is the protector of my life: of whom shall I be afraid?","CPDV":"A Psalm of David, before he was sealed. The Lord is my light and my salvation, whom shall I fear? The Lord is the protec  one an other through loue, Endeuouring to keepe the vnitie of the Spirit in the bond of peace.","Webster":"With all lowliness and meekness, with long-suffering, forbearing one another in love; Endeavoring to keep the unity of the Spirit in the bond of peace.","YLT":"with all lowliness and meekness, with long-suffering, forbearing one another in love, being diligent to keep the unity of the Spirit in the bond of the peace;","NHEB":"with all lowliness and humility, with patience, bearing with one another in love; being eager to keep the unity of the Spirit in the bond of peace."}},{"r":"Colossians 3:13","x":{"KJV":"Forbearing one another, and forgiving one another, if any man have a quarrel against any: even as Christ forgave you, so also do ye.","DRC":"Bearing with one another and forgiving one another, if any have a complaint against another. Even as the Lord hath forgiven you, so do you also.","CPDV":"Support one another, and, if anyone has a complaint against another, forgive one another. For just as the Lord has forgiven you, so also must you do.","ASV":"forbearing one another, and forgiving each other, if any man have a complaint against any; even as the Lord forgave you, so also do ye:","BSB":"Bear with one another and forgive any complaint you may have against someone else. Forgive as the Lord forgave you.","BBE":"Being gentle to one another and having forgiveness for one another, if anyone has done wrong to his brother, even as the Lord had forgiveness for you:","Darby":"forbearing one another, and forgiving one another, if any should have a complaint against any; even as the Christ has forgiven you, so also [do] ye.","Geneva1599":"Forbearing one another, and forgiuing one another, if any man haue a quarel to another: euen as Christ forgaue, euen so doe ye.","Webster":"Forbearing one another, and forgiving one another, if any man hath a quarrel against any: even as Christ forgave you, so also [do] ye.","YLT":"forbearing one another, and forgiving each other, if any one with any one may have a quarrel, as also the Christ did forgive you--so also ye;","NHEB":"bearing with one another, and forgiving each other, if anyone has a complaint against another; even as the Lord forgave you, so you also do."}}],"l":[{"r":"D&C 64:10","x":"I, the Lord, will forgive whom I will forgive, but of you it is required to forgive all men."},{"r":"Mosiah 4:14-15","x":"And ye will not suffer your children that they go hungry, or naked; neither will ye suffer that they transgress the laws of God, and fight and quarrel one with another, and serve the devil, who is the master of sin, or who is the evil spirit which hath been spoken of by our fathers, he being an enemy to all righteousness. But ye will teach them to walk in the ways of truth and soberness; ye will teach them to love one another, and to serve one another."},{"r":"Moroni 7:45","x":"And charity suffereth long, and is kind, and envieth not, and is not puffed up, seeketh not her own, is not easily provoked, thinketh no evil, and rejoiceth not in iniquity but rejoiceth in the truth, beareth all things, believeth all things, hopeth all things, endureth all things."}]},{"id":"friendship","t":"friendship","g":"Relationships","p":["friends","a good friend","friendship","losing a friend"],"k":[],"v":[{"r":"Proverbs 17:17","x":{"KJV":"A friend loveth at all times, and a brother is born for adversity.","DRC":"He that is a friend loveth at all times: and a brother is proved in distress.","CPDV":"Whoever is a friend loves at all times. And a brother is proved by distress.","ASV":"A friend loveth at all times; And a brother is born for adversity.","BSB":"A friend loves at all times, and a brother is born for adversity.","BBE":"A friend is loving at all times, and becomes a brother in times of trouble.","Darby":"The friend loveth at all times, and a brother is born for adversity.","Geneva1599":"A friende loueth at all times: and a brother is borne for aduersitie.","Webster":"A friend loveth at all times, and a brother is born for adversity.","YLT":"At all times is the friend loving, And a brother for adversity is born.","NHEB":"A friend loves at all times; and a brother is born for adversity."}},{"r":"John 15:13","x":{"KJV":"Greater love hath no man than this, that a man lay down his life for his friends.","DRC":"Greater love than this no man hath, that a man lay down his life for his friends.","CPDV":"No one has a greater love than this: that he lay down his life for his friends.","ASV":"Greater love hath no man than this, that a man lay down his life for his friends.","BSB":"Greater love has no one than this, that he lay down his life for his friends.","BBE":"Greater love has no man than this, that a man gives up his life for his friends.","Darby":"No one has greater love than this, that one should lay down his life for his friends.","Geneva1599":"Greater loue then this hath no man, when any man bestoweth his life for his friendes.","Webster":"Greater love hath no man than this, that a man lay down his life for his friends.","YLT":"greater love than this hath no one, that any one his life may lay down for his friends;","NHEB":"Greater love has no one than this, that someone lay down his life for his friends."}},{"r":"Ecclesiastes 4:9-10","x":{"KJV":"Two are better than one; because they have a good reward for their labour. For if they fall, the one will lift up his fellow: but woe to him that is alone when he falleth; for he hath not another to help him up.","DRC":"It is better therefore that two should be together, than one: for they have the advantage of their society: If one fall he shall be supported by the other: woe to him that is alone, for when he falleth, he hath none to lift him up.","CPDV":"Therefore, it is better for two to be together, than for one to be alone. For they have the advantage of their companionship. If one falls, he shall be supported by the other. Woe to one who is alone. For when he falls, he has no one to lift him up.","ASV":"Two are better than one, because they have a good reward for their labor. For if they fall, the one will lift up his fellow; but woe to him that is alone when he falleth, and hath not another to lift him up.","BSB":"Two are better than one, because they have a good return for their labor. For if one falls down, his companion can lift him up; but pity the one who falls without another to help him up!","BBE":"Two are better than one, because they have a good reward for their work. And if one has a fall, the other will give him a hand; but unhappy is the man who is by himself, because he has no helper.","Darby":"Two are better than one; because they have a good reward for their labour. For if they fall, the one will lift up his fellow; but woe to him that is alone when he falleth, and who hath not another to lift him up!","Geneva1599":"Two are better then one: for they haue better wages for their labour. For if they fal, the one wil lift vp his felow: but wo vnto him that is alone: for he falleth, and there is not a second to lift him vp.","Webster":"Two [are] better than one; because they have a good reward for their labor. For if they fall, the one will lift up his fellow: but woe to him [that is] alone when he falleth; for [he hath] not another to help him to rise.","YLT":"The two are better than the one, in that they have a good reward by their labour. For if they fall, the one raiseth up his companion, but woe to the one who falleth and there is not a second to raise him up!","NHEB":"Two are better than one, because they have a good reward for their labor. For if they fall, the one will lift up his fellow; but woe to him who is alone when he falls, and doesn't have another to lift him up."}}],"l":[{"r":"D&C 121:9","x":"Thy friends do stand by thee, and they shall hail thee again with warm hearts and friendly hands."},{"r":"D&C 84:63","x":"And as I said unto mine apostles, even so I say unto you, for you are mine apostles, even God's high priests; ye are they whom my Father hath given me; ye are my friends;"},{"r":"Mosiah 18:8-9","x":"And it came to pass that he said unto them: Behold, here are the waters of Mormon (for thus were they called) and now, as ye are desirous to come into the fold of God, and to be called his people, and are willing to bear one another's burdens, that they may be light; Yea, and are willing to mourn with those that mourn; yea, and comfort those that stand in need of comfort, and to stand as witnesses of God at all times and in all things, and in all places that ye may be in, even until death, that ye may be redeemed of God, and be numbered with those of the first resurrection, that ye may have eternal life—"}]},{"id":"loneliness","t":"loneliness","g":"Relationships","p":["I'm lonely","alone","no one cares","isolated","no friends"],"k":["alone","lonely"],"v":[{"r":"Deuteronomy 31:8","x":{"KJV":"And the LORD, he it is that doth go before thee; he will be with thee, he will not fail thee, neither forsake thee: fear not, neither be dismayed.","DRC":"And the Lord who is your leader, he himself will be with thee: he will not leave thee, nor forsake thee: fear not, neither be dismayed.","CPDV":"And the Lord, who is your commander, will himself be with you. He will neither renounce nor abandon you. Do not be afraid, and do not dread.”","ASV":"And Jehovah, he it is that doth go before thee; he will be with thee, he will not fail thee, neither forsake thee: fear not, neither be dismayed.","BSB":"The LORD Himself goes before you; He will be with you. He will never leave you nor forsake you. Do not be afraid or discouraged.”","BBE":"It is the Lord who goes before you; he will be with you, he will not take away his help from you or give you up: so have no fear.","Darby":"And Jehovah, he it is that goeth before thee: he will be with thee; he will not leave thee, nor forsake thee; fear not, neither be dismayed.","Geneva1599":"And the Lord him selfe doeth go before thee: he will be with thee: he will not faile thee, neither forsake thee: feare not therefore, nor be discomforted.","Webster":"And the LORD, he [it is] that doth go before thee; he will be with thee, he will not fail thee, neither forsake thee: fear not, neither be dismayed.","YLT":"and Jehovah is He who is going before thee, He himself is with thee; He doth not fail thee nor forsake thee; fear not, nor be affrighted.'","NHEB":"The Lord, he it is who does go before you; he will be with you, he will not fail you, neither forsake you: do not be afraid, neither be dismayed.\""}},{"r":"Psalms 68:6","x":{"KJV":"God setteth the solitary in families: he bringeth out those which are bound with chains: but the rebellious dwell in a dry land.","DRC":"God who maketh men of one manner to dwell in a house: Who bringeth out them that were bound in strength; in like manner them that provoke, that dwell in sepulchres.","CPDV":"It is God who makes men dwell in a house under one custom. He leads out those who are strongly bound, and similarly, those who exasperate, who dwell in sepulchers.","ASV":"God setteth the solitary in families: He bringeth out the prisoners into prosperity; But the rebellious dwell in a parched land.","BSB":"God settles the lonely in families; He leads the prisoners out to prosperity, but the rebellious dwell in a sun-scorched land.","BBE":"Those who are without friends, God puts in families; he makes free those who are in chains; but those who are turned away from him are given a dry land.","Darby":"God maketh the solitary into families; those that were bound he bringeth out into prosperity: but the rebellious dwell in a parched [land].","Geneva1599":"God maketh the solitarie to dwell in families, and deliuereth them that were prisoners in stocks: but the rebellious shall dwell in a dry land.","Webster":"God setteth the solitary in families: he bringeth out those who are bound with chains: but the rebellious dwell in a dry [land].","YLT":"God--causing the lonely to dwell at home, Bringing out bound ones into prosperity, Only--the refractory have inhabited a dry place.","NHEB":"God sets the lonely in families. He brings out the prisoners with singing, but the rebellious dwell in a sun-scorched land."},"a":{"DRC":"Psalms 67:7","CPDV":"Psalms 67:7"}},{"r":"Matthew 28:20","x":{"KJV":"Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen.","DRC":"Teaching them to observe all things whatsoever I have commanded you. And behold I am with you all days, even to the consummation of the world.","CPDV":"teaching them to observe all that I have ever commanded you. And behold, I am with you always, even to the consummation of the age.”","ASV":"teaching them to observe all things whatsoever I commanded you: and lo, I am with you always, even unto the end of the world.","BSB":"and teaching them to obey all that I have commanded you. And surely I am with you always, even to the end of the age.”","BBE":"Teaching them to keep all the rules which I have given you: and see, I am ever with you, even to the end of the world.","Darby":"teaching them to observe all things whatsoever I have enjoined you. And behold, I am with you all the days, until the completion of the age.","Geneva1599":"Teaching them to obserue all things, whatsoeuer I haue commanded you: and lo, I am with you alway, vntill the ende of the worlde, Amen.","Webster":"Teaching them to observe all things whatever I have commanded you: and lo, I am with you always, [even] to the end of the world. Amen.","YLT":"teaching them to observe all, whatever I did command you,) and lo, I am with you all the days--till the full end of the age.'","NHEB":"teaching them to observe all things that I commanded you. Behold, I am with you always, even to the end of the age.\""}}],"l":[{"r":"D&C 84:88","x":"And whoso receiveth you, there I will be also, for I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up."},{"r":"D&C 121:9","x":"Thy friends do stand by thee, and they shall hail thee again with warm hearts and friendly hands."},{"r":"Alma 7:12","x":"And he will take upon him death, that he may loose the bands of death which bind his people; and he will take upon him their infirmities, that his bowels may be filled with mercy, according to the flesh, that he may know according to the flesh how to succor his people according to their infirmities."}]},{"id":"being-single","t":"being single","g":"Relationships","p":["single","will I ever marry","dating","waiting for the right person"],"k":[],"v":[{"r":"Psalms 37:4","x":{"KJV":"Delight thyself also in the LORD; and he shall give thee the desires of thine heart.","DRC":"Delight in the Lord, and he will give thee the requests of thy heart.","CPDV":"Delight in the Lord, and he will grant to you the petitions of your heart.","ASV":"Delight thyself also in Jehovah; And he will give thee the desires of thy heart.","BSB":"Delight yourself in the LORD, and He will give you the desires of your heart.","BBE":"So will your delight be in the Lord, and he will give you your heart's desires.","Darby":"and delight thyself in Jehovah, and he will give thee the desires of thy heart.","Geneva1599":"And delite thy selfe in the Lord, and hee shall giue thee thine hearts desire.","Webster":"Delight thyself also in the LORD; and he will give thee the desires of thy heart.","YLT":"And delight thyself on Jehovah, And He giveth to thee the petitions of thy heart.","NHEB":"Also delight yourself in the Lord, and he will give you the desires of your heart."},"a":{"DRC":"Psalms 36:4","CPDV":"Psalms 36:4"}},{"r":"1 Corinthians 7:32","x":{"KJV":"But I would have you without carefulness. He that is unmarried careth for the things that belong to the Lord, how he may please the Lord:","DRC":"But I would have you to be without solicitude. He that is without a wife is solicitous for the things that belong  bad parent","my kids"],"k":[],"v":[{"r":"Proverbs 22:6","x":{"KJV":"Train up a child in the way he should go: and when he is old, he will not depart from it.","DRC":"It is a proverb: A young man according to his way, even when he is old, he will not depart from it.","CPDV":"The proverb is: A youth is close to his way; even when he is old, he will not withdraw from it.","ASV":"Train up a child in the way he should go, And even when he is old he will not depart from it.","BSB":"Train up a child in the way he should go, and when he is old he will not depart from it.","BBE":"If a child is trained up in the right way, even when he is old he will not be turned away from it.","Darby":"Train up the child according to the tenor of his way, and when he is old he will not depart from it.","Geneva1599":"Teache a childe in the trade of his way, and when he is olde, he shall not depart from it.","Webster":"Train up a child in the way he should go: and when he is old, he will not depart from it.","YLT":"Give instruction to a youth about his way, Even when he is old he turneth not from it.","NHEB":"Train up a child in the way he should go, and when he is old he will not depart from it."}},{"r":"Ephesians 6:4","x":{"KJV":"And, ye fathers, provoke not your children to wrath: but bring them up in the nurture and admonition of the Lord.","DRC":"And you, fathers, provoke not your children to anger: but bring them up in the discipline and correction of the Lord.","CPDV":"And you, fathers, do not provoke your children to anger, but educate them with the discipline and correction of the Lord.","ASV":"And, ye fathers, provoke not your children to wrath: but nurture them in the chastening and admonition of the Lord.","BSB":"Fathers, do not provoke your children to wrath; instead, bring them up in the discipline and instruction of the Lord.","BBE":"And, you fathers, do not make your children angry: but give them training in the teaching and fear of the Lord.","Darby":"And [ye] fathers, do not provoke your children to anger, but bring them up in [the] discipline and admonition of [the] Lord.","Geneva1599":"And ye, fathers, prouoke not your children to wrath: but bring them vp in instruction and information of the Lord.","Webster":"And, ye fathers, provoke not your children to wrath: but bring them up in the nurture and admonition of the Lord.","YLT":"And the fathers! provoke not your children, but nourish them in the instruction and admonition of the Lord.","NHEB":"You fathers, do not provoke your children to wrath, but nurture them in the discipline and instruction of the Lord."}},{"r":"Deuteronomy 6:6-7","x":{"KJV":"And these words, which I command thee this day, shall be in thine heart: And thou shalt teach them diligently unto thy children, and shalt talk of them when thou sittest in thine house, and when thou walkest by the way, and when thou liest down, and when thou risest up.","DRC":"And these words which I command thee this day, shall be in thy heart: And thou shalt tell them to thy children, and thou shalt meditate upon them sitting in thy house, and walking on thy journey, sleeping and rising.","CPDV":"And these words, which I instruct to you this day, shall be in your heart. And you shall explain them to your sons. And you shall meditate upon them sitting in your house, and walking on a journey, when lying down and when rising up.","ASV":"And these words, which I command thee this day, shall be upon thy heart; and thou shalt teach them diligently unto thy children, and shalt talk of them when thou sittest in thy house, and when thou walkest by the way, and when thou liest down, and when thou risest up.","BSB":"These words I am commanding you today are to be upon your hearts. And you shall teach them diligently to your children and speak of them when you sit at home and when you walk along the road, when you lie down and when you get up.","BBE":"Keep these words, which I say to you this day, deep in your hearts; Teaching them to your children with all care, talking of them when you are at rest in your house or walking by the way, when you go to sleep and when you get up.","Darby":"And these words, which I command thee this day, shall be in thy heart; and thou shalt impress them on thy sons, and shalt talk of them when thou sittest in thy house, and when thou goest on the way, and when thou liest down, and when thou risest up.","Geneva1599":"And these wordes which I commaund thee this day, shalbe in thine heart. And thou shalt rehearse them continually vnto thy children, and shalt talke of them when thou tariest in thine house, and as thou walkest by the way, and when thou liest downe, and when thou risest vp:","Webster":"And these words which I command thee this day, shall be in thy heart: And thou shalt teach them diligently to thy children, and shalt talk of them when thou sittest in thy house, and when thou walkest by the way, and when thou liest down, and when thou risest up.","YLT":"and these words which I am commanding thee to-day have been on thine heart, and thou hast repeated them to thy sons, and spoken of them in thy sitting in thine house, and in thy walking in the way, and in thy lying down, and in thy rising up,","NHEB":"These words, which I command you this day, shall be on your heart; and you shall teach them diligently to your children, and shall talk of them when you sit in your house, and when you walk by the way, and when you lie down, and when you rise up."}}],"l":[{"r":"Mosiah 4:14-15","x":"And ye will not suffer your children that they go hungry, or naked; neither will ye suffer that they transgress the laws of God, and fight and quarrel one with another, and serve the devil, who is the master of sin, or who is the evil spirit which hath been spoken of by our fathers, he being an enemy to all righteousness. But ye will teach them to walk in the ways of truth and soberness; ye will teach them to love one another, and to serve one another."},{"r":"D&C 68:25","x":"And again, inasmuch as parents have children in Zion, or in any of her stakes which are organized, that teach them not to understand the doctrine of repentance, faith in Christ the Son of the living God, and of baptism and the gift of the Holy Ghost by the laying on of the hands, when eight years old, the sin be upon the heads of the parents."},{"r":"2 Nephi 25:26","x":"And we talk of Christ, we rejoice in Christ, we preach of Christ, we prophesy of Christ, and we write according to our prophecies, that our children may know to what source they may look for a remission of their sins."}]},{"id":"a-wayward-child","t":"a wayward child","g":"Family and parenting","p":["my child left the church","my son is lost","prodigal","my daughter won't talk to me"],"k":["son","daughter"],"v":[{"r":"Luke 15:20","x":{"KJV":"And he arose, and came to his father. But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him.","DRC":"And rising up, he came to his father. And when he was yet a great way off, his father saw him and was moved with compassion and running to him fell upon his neck and kissed him.","CPDV":"And rising up, he went to his father. But while he was still at a distance, his father saw him, and he was moved with compassion, and running to him, he fell upon his neck and kissed him.","ASV":"And he arose, and came to his father. But while he was yet afar off, his father saw him, and was moved with compassion, and ran, and fell on his neck, and kissed him.","BSB":"So he got up and went to his father. But while he was still in the distance, his father saw him and was filled with compassion. He ran to his son, embraced him, and kissed him.","BBE":"And he got up and went to his father. But while he was still far away, his father saw him and was moved with pity for him and went quickly and took him in his arms and gave him a kiss.","Darby":"And he rose up and went to his own father. But while he was yet a long way off, his father saw him, and was moved with compassion, and ran, and fell upon his neck, and covered him with kisses.","Geneva1599":"So hee arose and came to his father, and when hee was yet a great way off, his father sawe him, and had compassion, and ranne and fell on his necke, and kissed him.","Webster":"And he arose, and came to his father. But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him.","YLT":"`And having risen, he went unto his own father, and he being yet far distant, his father saw him, and was moved with compassion, and having ran he fell upon his neck and kissed him;","NHEB":"\"He arose, and came to his father. But while he was still far off, his father saw him, and was moved with compassion, and ran, and fell on his neck, and kissed him."}},{"r":"Isaiah 49:25","x":{"KJV":"But thus saith the LORD, Even the captives of the mighty shall be taken away, and the prey of the terrible shall be delivered: for I will contend with him that contendeth with thee, and I will save thy children.","DRC":"For thus saith the Lord: Yea verily, even the captivity shall be taken away from the strong: and that which was taken by the mighty, shall be delivered. But I will judge those that have judged thee, and thy children I will save.","CPDV":"For thus says the Lord: Certainly, even the captives will be taken away from the strong, even what has been taken by the powerful will be saved. And truly, I will judge those who have judged you, and I will save your children.","ASV":"But thus saith Jehovah, Even the captives of the mighty shall be taken away, and the prey of the terrible shall be delivered; for I will contend with him that contendeth with thee, and I will save thy children.","BSB":"Indeed, this is what the LORD says: “Even the captives of the mighty will be taken away, and the plunder of the tyrant will be retrieved; I will contend with those who contend with you, and I will save your children.","BBE":"But the Lord says, Even the prisoners of the strong will be taken from him, and the cruel made to let go his goods: for I will take up your cause against your haters, and I will keep your children safe.","Darby":"For thus saith Jehovah: Even the captive of the mighty shall be taken away, and the prey of the terrible shall be delivered; and I will strive with him that striveth with thee, and I will save thy children.","Geneva1599":"But thus sayeth the Lord, euen the captiuitie of the mightie shall be taken away: and the pray of the tyrant shall be deliuered: for I wil contend with him that contendeth with thee, and I will saue thy children,","Webster":"But thus saith the LORD, Even the captives of the mighty shall be taken away, and the prey of the terrible shall be delivered: for I will contend with him that contendeth with thee, and I will save thy children.","YLT":"For thus said Jehovah: Even the captive of the mighty is taken, And the prey of the terrible is delivered, And with thy striver I strive, and thy sons I save.","NHEB":"But thus says the Lord, \"Even the captives of the mighty shall be taken away, and the prey of the terrible shall be delivered; for I will contend with him who contends with you, and I will save your children."}},{"r":"Luke 15:4","x":{"KJV":"What man of you, having an hundred sheep, if he lose one of them, doth not leave the ninety and nine in the wilderness, and go after that which is lost, until he find it?","DRC":"What man of you that hath an hundred sheep, and if he shall lose one of them, doth he not leave the ninety-nine in the desert and go after that which was lost, until he find it?","CPDV":"“What man among you, who has one hundred sheep, and if he will have lost one of them, would not leave the ninety-nine in the desert and go after the one whom he had lost, until he finds it?","ASV":"What man of you, having a hundred sheep, and having lost one of them, doth not leave the ninety and nine in the wilderness, and go after that which is lost, until he find it?","BSB":"“What man among you, if he has a hundred sheep and loses one of them, does not leave the ninety-nine in the pasture and go after the one that is lost, until he finds it?","BBE":"What man of you, having a hundred sheep, if one of them gets loose and goes away, will not let the ninety-nine be in the waste land by themselves, and go after the wandering one, till he sees where it is?","Darby":"What man of you having a hundred sheep, and having lost one of them, does not leave the ninety and nine in the wilderness and go after that which is lost, until he find it?","Geneva1599":"What man of you hauing an hundreth sheepe, if hee lose one of them, doeth not leaue ninetie and nine in the wildernesse, and goe after that which is lost, vntill he finde it?","Webster":"What man of you having a hundred sheep, if he loseth one of them, doth not leave the ninety and nine in the wilderness, and go after that which is lost, until he findeth it?","YLT":"`What man of you having a hundred sheep, and having lost one out of them, doth not leave behind the ninety-nine in the wilderness, and go on after the lost one, till he may find it?","NHEB":"\"Which of you men, if you had one hundred sheep, and lost one of them, would not leave the ninety-nine in the wilderness, and go after the one that was lost, until he found it?"}}],"l":[{"r":"Mosiah 27:14","x":"And again, the angel said: Behold, the Lord hath heard the prayers of his people, and also the prayers of his servant, Alma, who is thy father; for he has prayed with much faith concerning thee that thou mightest be brought to the knowledge of the truth; therefore, for this purpose have I come to convince thee of the power and authority of God, that the prayers of his servants might be answered according to their faith."},{"r":"Alma 36:17-18","x":"And it came to pass that as I was thus racked with torment, while I was harrowed up by the memory of my many sins, behold, I remembered also to have heard my father prophesy unto the people concerning the coming of one Jesus Christ, a Son of God, to atone for the sins of the world. Now, as my mind caught hold upon this thought, I cried within my heart: O Jesus, thou Son of God, have mercy on me, who am in the gall of bitterness, and am encircled about by the everlasting chains of death."},{"r":"3 Nephi 18:32","x":"Nevertheless, ye shall not cast him out of your synagogues, or your places of worship, for unto such shall ye continue to minister; for ye know not but what they will return and repent, and come unto me with full purpose of heart, and I shall heal them; and ye shall be the means of bringing salvation unto them."}]},{"id":"teenagers","t":"teenagers","g":"Family and parenting","p":["my teenager","teen","rebellious teen","raising teens"],"k":[],"v":[{"r":"1 Timothy 4:12","x":{"KJV":"Let no man despise thy youth; but be thou an example of the believers, in word, in conversation, in charity, in spirit, in faith, in purity.","DRC":"Let no man despise thy youth: but be thou an example of the faithful, in word, in conversation, in charity, in faith, in chastity.","CPDV":"Let no one despise your youth, but be an example among the faithful in word, in behavior, in charity, in faith, in chastity.","ASV":"Let no man despise thy youth; but be thou an ensample to them that believe, in word, in manner of life, in love, in faith, in purity.","BSB":"Let no one despise your youth, but set an example for the believers in speech, in conduct, in love, in faith, in purity.","BBE":"Let no one make little of you because you are young, but be an example to the church in word, in behaviour, in love, in faith, in holy living.","Darby":"Let no one despise thy youth, but be a model of the believers, in word, in conduct, in love, in faith, in purity.","Geneva1599":"Let no man despise thy youth, but be vnto them that beleeue, an ensample, in worde, in conuersation, in loue, in spirit, in faith, and in purenesse.","Webster":"Let no man despise thy youth; but be thou an example of the believers, in word, in deportment, in charity, in spirit, in faith, in purity.","YLT":"let no one despise thy youth, but a pattern become thou of those believing in word, in behaviour, in love, in spirit, in faith, in purity;","NHEB":"Let no man despise your youth; but be an example to those who believe, in word, in your way of life, in love, in faith, and in purity."}},{"r":"Ecclesiastes 12:1","x":{"KJV":"Remember now thy Creator in the days of thy youth, while the evil days come not, nor the years draw nigh, when thou shalt say, I have no pleasure in them;","DRC":"Remember thy Creator in the days of thy youth, before the time of affliction come, and the years draw nigh of which thou shalt say: They please me not:","CPDV":"Remember your Creator in the days of your youth, before the time of affliction arrives and the years draw near, about which you will say, “These do not please me.”","ASV":"Remember also thy Creator in the days of thy youth, before the evil days come, and the years draw nigh, when thou shalt say, I have no pleasure in them;","BSB":"Remember your Creator in the days of your youth, before the days of adversity come and the years approach of which you will say, “I find no pleasure in them,”","BBE":"Let your mind be turned to your Maker in the days of your strength, while the evil days come not, and the years are far away when you will say, I have no pleasure in them;","Darby":"And remember thy Creator in the days of thy youth, before the evil days come, and the years draw nigh, of which thou shalt say, I have no pleasure in them;","Geneva1599":"Remember nowe thy Creator in the daies of thy youth, whiles the euill daies come not, nor the yeeres approche, wherein thou shalt say, I haue no pleasure in them:","Webster":"Remember now thy Creator in the days of thy youth, while the evil days come not, nor the years draw nigh, when thou shalt say, I have no pleasure in them;","YLT":"Remember also thy Creators in days of thy youth, While that the evil days come not, Nor the years have arrived, that thou sayest, `I have no pleasure in them.'","NHEB":"Remember also your Creator in the days of your youth, before the evil days come, and the years draw near, when you will say, \"I have no pleasure in them;\""}},{"r":"Psalms 119:9","x":{"KJV":"Wherewithal shall a young man cleanse his way? by taking heed thereto according to thy word.","DRC":"By what doth a young man correct his way? by observing thy words.","CPDV":"By what does an adolescent correct his way? By keeping to your words.","ASV":"Wherewith shall a young man cleanse his way? By taking heed thereto according to thy word.","BSB":"How can a young man keep his way pure? By guarding it according to Your word.","BBE":"How may a young man make his way clean? by guiding it after your word.","Darby":"BETH. Wherewithal shall a young man cleanse his path? by taking heed according to thy word.","Geneva1599":"BETH. Wherewith shall a yong man redresse his waie? in taking heede thereto according to thy woorde.","Webster":"BETH. Wherewith shall a young man cleanse his way? by taking heed [to it], according to thy word.","YLT":"Beth. With what doth a young man purify his path? To observe--according to Thy word.","NHEB":"How can a young man keep his way pure? By living according to your word."},"a":{"DRC":"Psalms 118:9","CPDV":"Psalms 118:9"}}],"l":[{"r":"Alma 37:35","x":"O, remember, my son, and learn wisdom in thy youth; yea, learn in thy youth to keep the commandments of God."},{"r":"Alma 53:20-21","x":"And they were all young men, and they were exceedingly valiant for courage, and also for strength and activity; but behold, this was not all—they were men who were true at all times in whatsoever thing they were entrusted. Yea, they were men of truth and soberness, for they had been taught to keep the commandments of God and to walk uprightly before him."},{"r":"Alma 56:47-48","x":"Now they never had fought, yet they did not fear death; and they did think more upon the liberty of their fathers than they did upon their lives; yea, they had been taught by their mothers, that if they did not doubt, God would deliver them. And they rehearsed unto me the words of their mothers, saying: We do not doubt our mothers knew it."}]},{"id":"raising-children-in-faith","t":"raising children in faith","g":"Family and parenting","p":["teach my kids about God","faith at home","family prayer"],"k":[],"v":[{"r":"Deuteronomy 6:6-7","x":{"KJV":"And these words, which I command thee this day, shall be in thine heart: And thou shalt teach them diligently unto thy children, and shalt talk of them when thou sittest in thine house, and when thou walkest by the way, and when thou liest down, and when thou risest up.","DRC":"And these words which I command thee this day, shall be in thy heart: And thou shalt tell them to thy children, and thou shalt meditate upon them sitting in thy house, and walking on thy journey, sleeping and rising.","CPDV":"And these words, which I instruct to you this day, shall be in your heart. And you shall explain them to your sons. And you shall meditate upon them sitting in your house, and walking on a journey, when lying down and when rising up.","ASV":"And these words, which I command thee this day, shall be upon thy heart; and thou shalt teach them diligently unto thy children, and shalt talk of them when thou sittest in thy house, and when thou walkest by the way, and when thou liest down, and when thou risest up.","BSB":"These words I am commanding you today are to be upon your hearts. And you shall teach them diligently to your children and speak of them when you sit at home and when you walk along the road, when you lie down and when you get up.","BBE":"Keep these words, which I say to you this day, deep in your hearts; Teaching them to your children with all care, talking of them when you are at rest in your house or walking by the way, when you go to sleep and when you get up.","Darby":"And these words, which I command thee this day, shall be in thy heart; and thou shalt impress them on thy sons, and shalt talk of them when thou sittest in thy house, and when thou goest on the way, and when thou liest down, and when thou risest up.","Geneva1599":"And these wordes which I commaund thee this day, shalbe in thine heart. And thou shalt rehearse them continually vnto thy children, and shalt talke of them when thou tariest in thine house, and as thou walkest by the way, and when thou liest downe, and when thou risest vp:","Webster":"And these words which I command thee this day, shall be in thy heart: And thou shalt teach them diligently to thy children, and shalt talk of them when thou sittest in thy house, and when thou walkest by the way, and when thou liest down, and when thou risest up.","YLT":"and these words which I am commanding thee to-day have been on thine heart, and thou hast repeated them to thy sons, and spoken of them in thy sitting in thine house, and in thy walking in the way, and in thy lying down, and in thy rising up,","NHEB":"These words, which I command you this day, shall be on your heart; and you shall teach them diligently to your children, and shall talk of them when you sit in your house, and when you walk by the way, and when you lie down, and when you rise up."}},{"r":"Proverbs 22:6","x":{"KJV":"Train up a child in the way he should go: and when he is old, he will not depart from it.","DRC":"It is a proverb: A young man according to his way, even when he is old, he will not depart from it.","CPDV":"The proverb is: A youth is close to his way; even when he is old, he will not withdraw from it.","ASV":"Train up a child in the way he should go, And even when he is old he will not depart from it.","BSB":"Train up a child in the way he should go, and when he is old he will not depart from it.","BBE":"If a child is trained up in the right way, even when he is old he will not be turned away from it.","Darby":"Train up the child according to the tenor of his way, and when he is old he will not depart from it.","Geneva1599":"Teache a childe in the trade of his way, and when he is olde, he shall not depart from it.","Webster":"Train up a child in the way he should go: and when he is old, he will not depart from it.","YLT":"Give instruction to a youth about his way, Even when he is old he turneth not from it.","NHEB":"Train up a child in the way he should go, and when he is old he will not depart from it."}},{"r":"Joshua 24:15","x":{"KJV":"And if it seem evil unto you to serve the LORD, choose you this day whom ye will serve; whether the gods which your fathers served that were on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the LORD.","DRC":"But if it seem evil to you to serve the Lord, you have your choice: choose this day that which pleaseth you, whom you would rather serve, whether the gods which your fathers served in Mesopotamia, or the gods of the Amorrhites, in whose land you dwell: but as for me and my house we will serve thee Lord,","CPDV":"But if it seems evil to you that you would serve the Lord, a choice is given to you. Choose today what pleases you, and whom you ought to serve above all else, either the gods that your fathers served in Mesopotamia, or the gods of the Amorites, in whose land you live: but as for me and my house, we will serve the Lord.”","ASV":"And if it seem evil unto you to serve Jehovah, choose you this day whom ye will serve; whether the gods which your fathers served that were beyond the River, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve Jehovah.","BSB":"But if it is unpleasing in your sight to serve the LORD, then choose for yourselves this day whom you will serve, whether the gods your fathers served beyond the Euphrates, or the gods of the Amorites in whose land you are living. As for me and my house, we will serve the LORD!”","BBE":"And if it seems evil to you to be the servants of the Lord, make the decision this day whose servants you will be: of the gods whose servants your fathers were across the River, or of the gods of the Amorites in whose land you are living: but I and my house will be the servants of the Lord.","Darby":"And if it seem evil unto you to serve Jehovah, choose you this day whom ye will serve; whether thegods whom your fathers that were on the other side of the river served, or thegods of the Amorite, in whose land ye dwell; but as for me and my house, we will serve Jehovah.","Geneva1599":"And if it seeme euill vnto you to serue the Lord, choose you this day whome yee will serue, whether the gods which your fathers serued (that were beyond the flood) or the gods of the Amorites, in whose land ye dwel: but I and mine house will serue the Lord.","Webster":"And if it seemeth evil to you to serve the LORD, choose you this day whom ye will serve, whether the gods which your fathers served that [were] on the other side of the flood, or the gods of the Amorites in whose land ye dwell: but as for me and my house, we will serve the LORD.","YLT":"and if wrong in your eyes to serve Jehovah--choose for you to-day whom ye do serve; --whether the gods whom your fathers served, which are beyond the River, or the gods of the Amorite in whose land ye are dwelling; and I and my house--we serve Jehovah.'","NHEB":"If it seems evil to you to serve the Lord, choose this day whom you will serve; whether the gods which your fathers served that were beyond the River, or the gods of the Amorites, in whose land you dwell: but as for me and my house, we will serve the Lord.\""}}],"l":[{"r":"2 Nephi 25:26","x":"And we talk of Christ, we rejoice in Christ, we preach of Christ, we prophesy of Christ, and we write according to our prophecies, that our children may know to what source they may look for a remission of their sins."},{"r":"D&C 68:25","x":"And again, inasmuch as parents have children in Zion, or in , so will I comfort you, and you shall be comforted in Jerusalem.","CPDV":"In the manner of one whom a mother caresses, so will I console you. And you will be consoled in Jerusalem.","ASV":"As one whom his mother comforteth, so will I comfort you; and ye shall be comforted in Jerusalem.","BSB":"As a mother comforts her son, so will I comfort you, and you will be consoled over Jerusalem.”","BBE":"As to one who is comforted by his mother, so will I give you comfort: and you will be comforted in Jerusalem.","Darby":"As one whom his mother comforteth, so will I comfort you; and ye shall be comforted in Jerusalem.","Geneva1599":"As one whom his mother comforteth, so will I comfort you, and ye shall be comforted in Ierusalem.","Webster":"As one whom his mother comforteth, so will I comfort you; and ye shall be comforted in Jerusalem.","YLT":"As one whom his mother comforteth, so do I comfort you, Yea, in Jerusalem ye are comforted.","NHEB":"As one whom his mother comforts, so will I comfort you; and you will be comforted in Jerusalem.\""}},{"r":"Isaiah 40:11","x":{"KJV":"He shall feed his flock like a shepherd: he shall gather the lambs with his arm, and carry them in his bosom, and shall gently lead those that are with young.","DRC":"He shall feed his flock like a shepherd: he shall gather together the lambs with his arm, and shall take them up in his bosom, and he himself shall carry them that are with young.","CPDV":"He will pasture his flock like a shepherd. He will gather together the lambs with his arm, and he will lift them up to his bosom, and he himself will carry the very young.","ASV":"He will feed his flock like a shepherd, he will gather the lambs in his arm, and carry them in his bosom, and will gently lead those that have their young.","BSB":"He tends His flock like a shepherd; He gathers the lambs in His arms and carries them close to His heart. He gently leads the nursing ewes.","BBE":"He will give food to his flock like a keeper of sheep; with his arm he l return to thee at this same time, life accompanying, and Sara shall have a son.","CPDV":"Is anything difficult for God? According to the announcement, he will return to you at this same time, with life as a companion, and Sarah will have a son.”","ASV":"Is anything too hard for Jehovah? At the set time I will return unto thee, when the season cometh round, and Sarah shall have a son.","BSB":"Is anything too difficult for the LORD? At the appointed time I will return to you—in about a year—and Sarah will have a son.”","BBE":"Is there any wonder which the Lord is not able to do? At the time I said, in the spring, I will come back to you, and Sarah will have a child.","Darby":"Is [any] matter too wonderful for Jehovah? At the time appointed I will return to thee, at [this] time of the year, and Sarah shall have a son.","Geneva1599":"(Shall any thing be hard to the Lord? at the time appointed will I returne vnto thee, euen according to the time of life, and Sarah shall haue a sonne.)","Webster":"Is any thing too hard for the LORD? At the time appointed I will return to thee, according to the time of life, and Sarah shall have a son.","YLT":"And Jehovah saith unto Abraham, `Why is this? Sarah hath laughed, saying, Is it true really--I bear--and I am aged? Is any thing too wonderful for Jehovah? at the appointed time I return unto thee, about the time of life, and Sarah hath a son.'","NHEB":"Is anything too hard for the Lord? At the set time I will return to you, when the season comes round, and Sarah will have a son.\""}}],"l":[{"r":"Moroni 7:41","x":"And what is it that ye shall hope for? Behold I say unto you that ye shall have hope through the atonement of Christ and the power of his resurrection, to be raised unto life eternal, and this because of your faith in him according to the promise."},{"r":"Ether 12:4","x":"Wherefore, whoso believeth in God might with surety hope for a better world, yea, even a place at the right hand of God, which hope cometh of faith, maketh an anchor to the souls of men, which would make them sure and steadfast, always abounding in good works, being led to glorify God."},{"r":"D&C 90:24","x":"Search diligently, pray always, and be believing, and all things shall work together for your good, if ye walk uprightly and remember the covenant wherewith ye have covenanted one with another."}]},{"id":"anger","t":"anger","g":"Emotions","p":["I'm angry","furious","so mad","rage","temper"],"k":["angry","mad","furious","rage"],"v":[{"r":"Ephesians 4:26","x":{"KJV":"Be ye angry, and sin not: let not the sun go down upon your wrath:","DRC":"Be angry: and sin not. Let not the sun go down upon your anger.","CPDV":"“Be angry, but do not be willing to sin.” Do not let the sun set over your anger.","ASV":"Be ye angry, and sin not: let not the sun go down upon your wrath:","BSB":"“Be angry, yet do not sin.” Do not let the sun set upon your anger,","BBE":"Be angry without doing wrong; let not the sun go down on your wrath;","Darby":"Be angry, and do not sin; let not the sun set upon your wrath,","Geneva1599":"Bee angrie, but sinne not: let not the sunne goe downe vpon your wrath,","Webster":"Be ye angry, and sin not: let not the sun go down upon your wrath:","YLT":"be angry and do not sin; let not the sun go down upon your wrath,","NHEB":"\"Be angry, and do not sin.\" Do not let the sun go down on your wrath,"}},{"r":"James 1:19-20","x":{"KJV":"Wherefore, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath: For the wrath of man worketh not the righteousness of God.","DRC":"You know, my dearest brethren. And let every man be swift to hear, but slow to speak and slow to anger. For the anger of man worketh not the justice of God.","CPDV":"You know this, my most beloved brothers. So let every man be quick to listen, but slow to speak and slow to anger. For the anger of man does not accomplish the justice of God.","ASV":"Ye know this, my beloved brethren. But let every man be swift to hear, slow to speak, slow to wrath: for the wrath of man worketh not the righteousness of God.","BSB":"My beloved brothers, understand this: Everyone should be quick to listen, slow to speak, and slow to anger, for man’s anger does not bring about the righteousness that God desires.","BBE":"You have knowledge of this, dear brothers. But let every man be quick in hearing, slow in words, slow to get angry; For the righteousness of God does not come about by the wrath of man.","Darby":"So that, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath; for man's wrath does not workGod's righteousness.","Geneva1599":"Wherefore my deare brethren, let euery man be swift to heare, slowe to speake, and slowe to wrath. For the wrath of man doeth not accomplish the righteousnesse of God.","Webster":"Wherefore, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath: For the wrath of man worketh not the righteousness of God.","YLT":"So then, my brethren beloved, let every man be swift to hear, slow to speak, slow to anger, for the wrath of a man the righteousness of God doth not work;","NHEB":"This you know, my beloved brothers. But let every man be swift to hear, slow to speak, and slow to anger; for the anger of man does not accomplish the righteousness of God."}},{"r":"Proverbs 15:1","x":{"KJV":"A soft answer turneth away wrath: but grievous words stir up anger.","DRC":"A mild answer breaketh wrath: but a harsh word stirreth up fury.","CPDV":"A mild response shatters anger. But a harsh word stirs up fury.","ASV":"A soft answer turneth away wrath; But a grievous word stirreth up anger.","BSB":"A gentle answer turns away wrath, but a harsh word stirs up anger.","BBE":"By a soft answer wrath is turned away, but a bitter word is a cause of angry feelings.","Darby":"A soft answer turneth away fury; but a grievous word stirreth up anger.","Geneva1599":"A soft answere putteth away wrath: but grieuous wordes stirre vp anger.","Webster":"A soft answer turneth away wrath: but grievous words stir up anger.","YLT":"A soft answer turneth back fury, And a grievous word raiseth up anger.","NHEB":"A gentle answer turns away wrath, but a harsh word stirs up anger."}}],"l":[{"r":"3 Nephi 11:29-30","x":"For verily, verily I say unto you, he that hath the spirit of contention is not of me, but is of the devil, who is the father of contention, and he stirreth up the hearts of men to contend with anger, one with another. Behold, this is not my doctrine, to stir up the hearts of men with anger, one against another; but this is my doctrine, that such things should be done away."},{"r":"3 Nephi 12:22","x":"But I say unto you, that whosoever is angry with his brother shall be in danger of his judgment. And whosoever shall say to his brother, Raca, shall be in danger of the council; and whosoever shall say, Thou fool, shall be in danger of hell fire."},{"r":"Moroni 7:45","x":"And charity suffereth long, and is kind, and envieth not, and is not puffed up, seeketh not her own, is not easily provoked, thinketh no evil, and rejoiceth not in iniquity but rejoiceth in the truth, beareth all things, believeth all things, hopeth all things, endureth all things."}]},{"id":"sadness","t":"sadness","g":"Emotions","p":["I'm sad","feeling down","unhappy","sorrow"],"k":[],"v":[{"r":"Psalms 42:11","x":{"KJV":"Why art thou cast down, O my soul? and why art thou disquieted within me? hope thou in God: for I shall yet praise him, who is the health of my countenance, and my God.","DRC":"Why art thou cast down, O my soul? and why dost thou disquiet me? Hope thou in God, for I will still give praise to him: the salvation of my countenance, and my God.","CPDV":"My soul, why are you saddened? And why do you disquiet me? Hope in God, for I will still confess to him: the salvation of my countenance and my God.","ASV":"Why art thou cast down, O my soul? And why art thou disquieted within me? Hope thou in God; for I shall yet praise him, Who is the help of my countenance, and my God.","BSB":"Why are you downcast, O my soul? Why the unease within me? Put your hope in God, for I will yet praise Him, my Savior and my God.","BBE":"Why are you crushed down, O my soul? and why are you troubled in me? put your hope in God; for I will again give him praise who is my help and my God.","Darby":"Why art thou cast down, my soul? and why art thou disquieted within me? hope inGod; for I shall yet praise him, [who is] the health of my countenance, and myGod.","Geneva1599":"Why art thou cast downe, my soule? and why art thou disquieted within mee? waite on God: for I wil yet giue him thankes: he is my present helpe, and my God.","Webster":"Why art thou cast down, O my soul? and why art thou disquieted within me? hope thou in God: for I shall yet praise him, [who is] the health of my countenance, and my God.","YLT":"What! bowest thou thyself, O my soul? And what! art thou troubled within me? Wait for God, for still I confess Him, The salvation of my countenance, and my God!","NHEB":"Why are you in despair, my soul? Why are you disturbed within me? Hope in God! For I shall still praise him, the saving help of my countenance, and my God."},"a":{"DRC":"Psalms 41:12","CPDV":"Psalms 41:12"}},{"r":"Psalms 30:5","x":{"KJV":"For his anger endureth but a moment; in his favour is life: weeping may endure for a night, but joy cometh in the morning.","DRC":"For wrath is in his indignation; and life in his good will. In the evening weeping shall have place, and in the morning gladness.","CPDV":"For wrath is in his indignation, and life is in his will. Toward evening, weeping will linger, and toward morning, gladness.","ASV":"For his anger is but for a moment; His favor is for a life-time: Weeping may tarry for the night, But joy cometh in the morning.","BSB":"For His anger is fleeting, but His favor lasts a lifetime. Weeping may stay the night, but joy comes in the morning.","BBE":"For his wrath is only for a minute; in his grace there is life; weeping may be for a night, but joy comes in the morning.","Darby":"For a moment [is passed] in his anger, a life in his favour; at even weeping cometh for the night, and at morn there is rejoicing.","Geneva1599":"For he endureth but a while in his anger: but in his fauour is life: weeping may abide at euening, but ioy commeth in the morning.","Webster":"For his anger [endureth but] a moment; in his favor [is] life: weeping may endure for a night, but joy [cometh] in the morning.","YLT":"For--a moment is in His anger, Life is in His good-will, At even remaineth weeping, and at morn singing.","NHEB":"For his anger is but for a moment. His favor is for a lifetime. Weeping may stay for the night, but joy comes in the morning."},"a":{"DRC":"Psalms 29:6","CPDV":"Psalms 29:6"}},{"r":"John 16:22","x":{"KJV":"And ye now therefore have sorrow: but I will see you again, and your heart shall rejoice, and your joy no man taketh from you.","DRC":"So also you now indeed have sorrow: but I will see you again and your heart shall rejoice. And your joy no man shall take from you.","CPDV":"Therefore, you also, indeed, have sorrow now. But I will see you again, and your heart shall rejoice. And no one will take away your joy from you.","ASV":"And ye therefore now have sorrow: but I will see you again, and your heart shall rejoice, and your joy no one taketh away from you.","BSB":"So also you have sorrow now, but I will see you again and your hearts will rejoice, and no one will take away your joy.","BBE":"So you have sorrow now: but I will see you again, and your hearts will be glad, and no one will take away your joy.","Darby":"And ye now therefore have grief; but I will see you again, and your heart shall rejoice, and your joy no one takes from you.","Geneva1599":"And ye nowe therefore are in sorowe: but I will see you againe, and your hearts shall reioyce, and your ioy shall no man take from you.","Webster":"And ye now therefore have sorrow: but I will see you again, and your heart shall rejoice, and your joy no man taketh from you.","YLT":"`And ye, therefore, now, indeed, have sorrow; and again I will see you, and your heart shall rejoice, and your joy no one doth take from you,","NHEB":"Therefore you now have sorrow, but I will see you again, and your heart will rejoice, and no one will take your joy away from you."}}],"l":[{"r":"D&C 136:29","x":"If thou art sorrowful, call on the Lord thy God with supplication, that your souls may be joyful."},{"r":"Alma 36:20","x":"And oh, what joy, and what marvelous light I did behold; yea, my soul was filled with joy as exceeding as was my pain!"},{"r":"D&C 19:23","x":"Learn of me, and listen to my words; walk in the meekness of my Spirit, and you shall have peace in me."}]},{"id":"depression","t":"depression","g":"Emotions","p":["depressed","hopeless","darkness","I don't want to get up","empty inside"],"k":["depressed","hopeless"],"v":[{"r":"Psalms 40:1-2","x":{"KJV":"I waited patiently for the LORD; and he inclined unto me, and heard my cry. He brought me up also out of an horrible pit, out of the miry clay, and set my feet upon a rock, and established my goings.","DRC":"With expectation I have waited for the Lord, and he was attentive to me. And he heard my prayers, and brought me out of the pit of misery and the mire of dregs. And he set my feet upon a rock, and directed my steps.","CPDV":"I have waited expectantly for the Lord, and he was attentive to me. And he heard my prayers and he led me out of the pit of misery and the quagmire. And he stationed my feet upon a rock, and he directed my steps.","ASV":"For the Chief Musician. A Psalm of David. I waited patiently for Jehovah; And he inclined unto me, and heard my cry. He brought me up also out of a horrible pit, out of the miry clay; And he set my feet upon a rock, and established my goings.","BSB":"For the choirmaster. A Psalm of David. I waited patiently for the LORD; He inclined to me and heard my cry. He lifted me up from the pit of d
