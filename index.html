y cometh in the morning.","DRC":"For wrath is in his indignation; and life in his good will. In the evening weeping shall have place, and in the morning gladness.","CPDV":"For wrath is in his indignation, and life is in his will. Toward evening, weeping will linger, and toward morning, gladness.","ASV":"For his anger is but for a moment; His favor is for a life-time: Weeping may tarry for the night, But joy cometh in the morning.","BSB":"For His anger is fleeting, but His favor lasts a lifetime. Weeping may stay the night, but joy comes in the morning.","BBE":"For his wrath is only for a minute; in his grace there is life; weeping may be for a night, but joy comes in the morning.","Darby":"For a moment [is passed] in his anger, a life in his favour; at even weeping cometh for the night, and at morn there is rejoicing.","Geneva1599":"For he endureth but a while in his anger: but in his fauour is life: weeping may abide at euening, but ioy commeth in the morning.","Webster":"For his anger [endureth but] a moment; in his favor [is] life: weeping may endure for a night, but joy [cometh] in the morning.","YLT":"For--a moment is in His anger, Life is in His good-will, At even remaineth weeping, and at morn singing.","NHEB":"For his anger is but for a moment. His favor is for a lifetime. Weeping may stay for the night, but joy comes in the morning."},"a":{"DRC":"Psalms 29:6","CPDV":"Psalms 29:6"}},{"r":"2 Corinthians 4:17-18","x":{"KJV":"For our light affliction, which is but for a moment, worketh for us a far more exceeding and eternal weight of glory; While we look not at the things which are seen, but at the things which are not seen: for the things which are seen are temporal; but the things which are not seen are eternal.","DRC":"For that which is at present momentary and light of our tribulation worketh for us above measure, exceedingly an eternal weight of glory. While we look not at the things which are seen, but at the things which are not seen. For the things which are seen are temporal: but the things which are not seen, are eternal.","CPDV":"For though our tribulation is, at the present time, brief and light, it accomplishes in us the weight of a sublime eternal glory, beyond measure. And we are contemplating, not the things that are seen, but the things that are unseen. For the things that are seen are temporal, whereas the things that are not seen are eternal.","ASV":"For our light affliction, which is for the moment, worketh for us more and more exceedingly an eternal weight of glory; while we look not at the things which are seen, but at the things which are not seen: for the things which are seen are temporal; but the things which are not seen are eternal.","BSB":"For our light and momentary affliction is producing for us an eternal weight of glory that is far beyond comparison. So we fix our eyes not on what is seen, but on what is unseen. For what is seen is temporary, but what is unseen is eternal.","BBE":"For our present trouble, which is only for a short time, is working out for us a much greater weight of glory; While our minds are not on the things which are seen, but on the things which are not seen: for the things which are seen are for a time; but the things which are not seen are eternal.","Darby":"For our momentary [and] light affliction works for us in surpassing measure an eternal weight of glory; while we look not at the things that are seen, but at the things that are not seen; for the things that are seen [are] for a time, but those that are not seen eternal.","Geneva1599":"For our light affliction which is but for a moment, causeth vnto vs a farre most excellent and an eternall waight of glorie: While we looke not on the thinges which are seene, but on the things which are not seene: for the things which are seene, are temporall: but the things which are not seene, are eternall.","Webster":"For our light affliction, which is but for a moment, worketh out for us a far more exceeding [and] eternal weight of glory; While we look not at the things which are seen, but at the things which are not seen: for the things which are seen [are] temporal; but the things which are not seen [are] eternal.","YLT":"for the momentary light matter of our tribulation, more and more exceedingly an age-during weight of glory doth work out for us-- we not looking to the things seen, but to the things not seen; for the things seen are temporary, but the things not seen are age-during.","NHEB":"For our light affliction, which is for the moment, works for us more and more exceedingly an eternal weight of glory; while we do not look at the things which are seen, but at the things which are not seen. For the things which are seen are temporal, but the things which are not seen are eternal."}}],"l":[{"r":"D&C 130:2","x":"And that same sociality which exists among us here will exist among us there, only it will be coupled with eternal glory, which glory we do not now enjoy."},{"r":"Alma 40:12","x":"And then shall it come to pass, that the spirits of those who are righteous are received into a state of happiness, which is called paradise, a state of rest, a state of peace, where they shall rest from all their troubles and from all care, and sorrow."},{"r":"D&C 42:45","x":"Thou shalt live together in love, insomuch that thou shalt weep for the loss of them that die, and more especially for those that have not hope of a glorious resurrection."}]},{"id":"mourning","t":"mourning","g":"Grief and loss","p":["mourn","weeping","tears won't stop","crying all the time"],"k":[],"v":[{"r":"Ecclesiastes 3:1-4","x":{"KJV":"To every thing there is a season, and a time to every purpose under the heaven: A time to be born, and a time to die; a time to plant, and a time to pluck up that which is planted; A time to kill, and a time to heal; a time to break down, and a time to build up; A time to weep, and a time to laugh; a time to mourn, and a time to dance;","DRC":"All things have their season, and in their times all things pass under heaven. A time to be born and a time to die. A time to plant, and a time to pluck up that which is planted. A time to kill, and a time to heal. A time to destroy, and a time to build. A time to weep, and a time to laugh. A time to mourn, and a time to dance.","CPDV":"All things have their time, and all things under heaven continue during their interval. A time to be born, and a time to die. A time to plant, and a time to pull up what was planted. A time to kill, and a time to heal. A time to tear down, and a time to build up. A time to weep, and a time to laugh. A time to mourn, and a time to dance.","ASV":"For everything there is a season, and a time for every purpose under heaven: a time to be born, and a time to die; a time to plant, and a time to pluck up that which is planted; a time to kill, and a time to heal; a time to break down, and a time to build up; a time to weep, and a time to laugh; a time to mourn, and a time to dance;","BSB":"To everything there is a season, and a time for every purpose under heaven: a time to be born and a time to die, a time to plant and a time to uproot, a time to kill and a time to heal, a time to break down and a time to build, a time to weep and a time to laugh, a time to mourn and a time to dance,","BBE":"For everything there is a fixed time, and a time for every business under the sun. A time for birth and a time for death; a time for planting and a time for uprooting; A time to put to death and a time to make well; a time for pulling down and a time for building up; A time for weeping and a time for laughing; a time for sorrow and a time for dancing;","Darby":"To everything there is a season, and a time to every purpose under the heavens: A time to be born, and a time to die; A time to plant, and a time to pluck up that which is planted; A time to kill, and a time to heal; A time to break down, and a time to build up; A time to weep, and a time to laugh; A time to mourn, and a time to dance;","Geneva1599":"To all things there is an appointed time, and a time to euery purpose vnder the heauen. A time to bee borne, and a time to die: a time to plant, and a time to plucke vp that which is planted. A time to slay, and a time to heale: a time to breake downe, and a time to builde. A time to weepe, and a time to laugh: a time to mourne, and a time to dance.","Webster":"To every [thing there is] a season, and a time to every purpose under the heaven: A time to be born, and a time to die; a time to plant, and a time to pluck up [that which is] planted; A time to kill, and a time to heal; a time to break down, and a time to build up; A time to weep, and a time to laugh; a time to mourn, and a time to dance;","YLT":"To everything--a season, and a time to every delight under the heavens: A time to bring forth, And a time to die. A time to plant, And a time to eradicate the planted. A time to slay, And a time to heal, A time to break down, And a time to build up. A time to weep, And a time to laugh. A time to mourn, And a time to skip.","NHEB":"For everything there is a season, and a time for every purpose under heaven: a time to be born, and a time to die; a time to plant, and a time to pluck up that which is planted; a time to kill, and a time to heal; a time to break down, and a time to build up; a time to weep, and a time to laugh; a time to mourn, and a time to dance;"}},{"r":"Psalms 30:11","x":{"KJV":"Thou hast turned for me my mourning into dancing: thou hast put off my sackcloth, and girded me with gladness;","DRC":"Thou hast turned for me my mourning into joy: thou hast cut my sackcloth, and hast compassed me with gladness:","CPDV":"You have turned my mourning into gladness for me. You have cut off my sackcloth, and you have surrounded me with joy.","ASV":"Thou hast turned for me my mourning into dancing; Thou hast loosed my sackcloth, and girded me with gladness;","BSB":"You turned my mourning into dancing; You peeled off my sackcloth and clothed me with joy,","BBE":"By you my sorrow is turned into dancing; you have taken away my clothing of grief, and given me robes of joy;","Darby":"Thou hast turned for me my mourning into dancing; thou hast loosed my sackcloth, and girded me with gladness;","Geneva1599":"Thou hast turned my mourning into ioy: thou hast loosed my sacke and girded mee with gladnesse.","Webster":"Thou hast turned for me my mourning into dancing: thou hast put off my sackcloth, and girded me with gladness;","YLT":"Thou hast turned my mourning to dancing for me, Thou hast loosed my sackcloth, And girdest me with joy.","NHEB":"You have turned my mourning into dancing for me. You have removed my sackcloth, and clothed me with gladness,"},"a":{"DRC":"Psalms 29:12","CPDV":"Psalms 29:12"}},{"r":"John 11:35","x":{"KJV":"Jesus wept.","DRC":"And Jesus wept.","CPDV":"And Jesus wept.","ASV":"Jesus wept.","BSB":"Jesus wept.","BBE":"And Jesus himself was weeping.","Darby":"Jesus wept.","Geneva1599":"And Iesus wept.","Webster":"Jesus wept.","YLT":"Jesus wept.","NHEB":"Jesus wept."}}],"l":[{"r":"Mosiah 18:9","x":"Yea, and are willing to mourn with those that mourn; yea, and comfort those that stand in need of comfort, and to stand as witnesses of God at all times and in all things, and in all places that ye may be in, even until death, that ye may be redeemed of God, and be numbered with those of the first resurrection, that ye may have eternal life—"},{"r":"D&C 42:45","x":"Thou shalt live together in love, insomuch that thou shalt weep for the loss of them that die, and more especially for those that have not hope of a glorious resurrection."},{"r":"Alma 7:11-12","x":"And he shall go forth, suffering pains and afflictions and temptations of every kind; and this that the word might be fulfilled which saith he will take upon him the pains and the sicknesses of his people. And he will take upon him death, that he may loose the bands of death which bind his people; and he will take upon him their infirmities, that his bowels may be filled with mercy, according to the flesh, that he may know according to the flesh how to succor his people according to their infirmities."}]},{"id":"comfort-at-a-funeral","t":"comfort at a funeral","g":"Grief and loss","p":["funeral","memorial service","words for a funeral","eulogy"],"k":[],"v":[{"r":"John 14:1-3","x":{"KJV":"Let not your heart be troubled: ye believe in God, believe also in me. In my Father's house are many mansions: if it were not so, I would have told you. I go to prepare a place for you. And if I go and prepare a place for you, I will come again, and receive you unto myself; that where I am, there ye may be also.","DRC":"Let not your heart be troubled. You believe in God: believe also in me. In my Father's house there are many mansions. If not, I would have told you: because I go to prepare a place for you. And if I shall go and prepare a place for you, I will come again and will take you to myself: that where I am, you also may be.","CPDV":"“Do not let your heart be troubled. You believe in God. Believe in me also. In my Father’s house, there are many dwelling places. If there were not, I would have told you. For I go to prepare a place for you. And if I go and prepare a place for you, I will return again, and then I will take you to myself, so that where I am, you also may be.","ASV":"Let not your heart be troubled: believe in God, believe also in me. In my Father’s house are many mansions; if it were not so, I would have told you; for I go to prepare a place for you. And if I go and prepare a place for you, I come again, and will receive you unto myself; that where I am, there ye may be also.","BSB":"“Do not let your hearts be troubled. You believe in God; believe in Me as well. In My Father’s house are many rooms. If it were not so, would I have told you that I am going there to prepare a place for you? And if I go and prepare a place for you, I will come back and welcome you into My presence, so that you also may be where I am.","BBE":"Let not your heart be troubled: have faith in God and have faith in me. In my Father's house are rooms enough; if it was not so, would I have said that I am going to make ready a place for you? And if I go and make ready a place for you, I will come back again and will take you to be with me, so that you may be where I am.","Darby":"Let not your heart be troubled; ye believe onGod, believe also on me. In my Father's house there are many abodes; were it not so, I had told you: for I go to prepare you a place; and if I go and shall prepare you a place, I am coming again and shall receive you to myself, that where I am ye also may be.","Geneva1599":"Let not your heart be troubled: ye beleeue in God, beleeue also in me. In my Fathers house are many dwelling places: if it were not so, I would haue tolde you: I go to prepare a place for you. And if I go to prepare a place for you, I wil come againe, and receiue you vnto my selfe, that where I am, there may ye be also.","Webster":"Let not your heart be troubled: ye believe in God, believe also in me. In my Father's house are many mansions: if [it were] not [so], I would have told you. I go to prepare a place for you. And if I go and prepare a place for you, I will come again and receive you to myself; that where I am, [there] ye may be also.","YLT":"`Let not your heart be troubled, believe in God, also in me believe; in the house of my Father are many mansions; and if not, I would have told you; I go on to prepare a place for you; and if I go on and prepare for you a place, again do I come, and will receive you unto myself, that where I am ye also may be;","NHEB":"\"Do not let your heart be troubled. Believe in God. Believe also in me. In my Father's house are many dwelling places. If it weren't so, I would have told you; for I go to prepare a place for you. And if I go and prepare a place for you, I will come again, and will receive you to myself; that where I am, you may be there also."}},{"r":"Psalms 23:1-4","x":{"KJV":"The LORD is my shepherd; I shall not want. He maketh me to lie down in green pastures: he leadeth me beside the still waters. He restoreth my soul: he leadeth me in the paths of righteousness for his name's sake. Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me.","DRC":"A psalm for David. The Lord ruleth me: and I shall want nothing. He hath set me in a place of pasture. He hath brought me up, on the water of refreshment: He hath converted my soul. He hath led me on the paths of justice, for his own name's sake. For though I should walk in the midst of the shadow of death, I will fear no evils, for thou art with me. Thy rod and thy staff, they have comforted me.","CPDV":"A Psalm of David. The Lord directs me, and nothing will be lacking to me. He has settled me here, in a place of pasture. He has led me out to the water of refreshment. He has converted my soul. He has led me away on the paths of justice, for the sake of his name. For, even if I should walk in the midst of the shadow of death, I will fear no evils. For you are with me. Your rod and your staff, they have given me consolation.","ASV":"A Psalm of David. Jehovah is my shepherd; I shall not want. He maketh me to lie down in green pastures; He leadeth me beside still waters. He restoreth my soul: He guideth me in the paths of righteousness for his name’s sake. Yea, though I walk through the valley of the shadow of death, I will fear no evil; for thou art with me; Thy rod and thy staff, they comfort me.","BSB":"A Psalm of David. The LORD is my shepherd; I shall not want. He makes me lie down in green pastures; He leads me beside quiet waters. He restores my soul; He guides me in the paths of righteousness for the sake of His name. Even though I walk through the valley of the shadow of death, I will fear no evil, for You are with me; Your rod and Your staff, they comfort me.","BBE":"The Lord takes care of me as his sheep; I will not be without any good thing. He makes a resting-place for me in the green fields: he is my guide by the quiet waters. He gives new life to my soul: he is my guide in the ways of righteousness because of his name. Yes, though I go through the valley of deep shade, I will have no fear of evil; for you are with me, your rod and your support are my comfort.","Darby":"A Psalm of David. Jehovah is my shepherd; I shall not want. He maketh me to lie down in green pastures; he leadeth me beside still waters. He restoreth my soul; he leadeth me in paths of righteousness for his name's sake. Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff, they comfort me.","Geneva1599":"A Psalme of David. The Lord is my shepheard, I shall not want. He maketh me to rest in greene pasture, and leadeth me by the still waters. He restoreth my soule, and leadeth me in the paths of righteousnesse for his Names sake. Yea, though I should walke through the valley of the shadowe of death, I will feare no euill: for thou art with me: thy rod and thy staffe, they comfort me.","Webster":"A Psalm of David. The LORD [is] my shepherd; I shall not want. He maketh me to lie down in green pastures: he leadeth me beside the still waters. He restoreth my soul: he leadeth me in the paths of righteousness for his name's sake. Yes, though I walk through the valley of the shades of death, I will fear no evil: for thou [art] with me; thy rod and thy staff they comfort me.","YLT":"A Psalm of David. Jehovah is my shepherd, I do not lack, In pastures of tender grass He causeth me to lie down, By quiet waters He doth lead me. My soul He refresheth, He leadeth me in paths of righteousness, For His name's sake, Also--when I walk in a valley of death-shade, I fear no evil, for Thou art with me, Thy rod and Thy staff--they comfort me.","NHEB":"A Psalm by David. The Lord is my shepherd: I shall lack nothing. He makes me lie down in green pastures. He leads me beside still waters. He restores my soul. He guides me in the paths of righteousness for his name's sake. Even though I walk through the valley of the shadow of death, I will fear no evil, for you are with me. Your rod and your staff, they comfort me."},"a":{"DRC":"Psalms 22:1-4","CPDV":"Psalms 22:1-4"}},{"r":"Romans 8:38-39","x":{"KJV":"For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord.","DRC":"For I am sure that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, nor might, Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God which is in Christ Jesus our Lord.","CPDV":"For I am certain that neither death, nor life, nor Angels, nor Principalities, nor Powers, nor the present things, nor the future things, nor strength, nor the heights, nor the depths, nor any other created thing, will be able to separate us from the love of God, which is in Christ Jesus our Lord.","ASV":"For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor powers, nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord.","BSB":"For I am convinced that neither death nor life, neither angels nor principalities, neither the present nor the future, nor any powers, neither height nor depth, nor anything else in all creation, will be able to separate us from the love of God that is in Christ Jesus our Lord.","BBE":"For I am certain that not death, or life, or angels, or rulers, or things present, or things to come, or powers, Or things on high, or things under the earth, or anything which is made, will be able to come between us and the love of God which is in Christ Jesus our Lord.","Darby":"For I am persuaded that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor powers, nor height, nor depth, nor any other creature, shall be able to separate us from the love ofGod, which [is] in Christ Jesus our Lord.","Geneva1599":"For I am perswaded that neither death, nor life, nor Angels, nor principalities, nor powers, nor things present, nor things to come, Nor height, nor depth, nor any other creature shalbe able to separate vs from the loue of God, which is in Christ Iesus our Lord.","Webster":"For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, Nor hight, nor depth, nor any other creature, will be able to separate us from the love of God which is in Christ Jesus our Lord.","YLT":"for I am persuaded that neither death, nor life, nor messengers, nor principalities, nor powers, nor things present, nor things about to be, nor height, nor depth, nor any other created thing, shall be able to separate us from the love of god, that is in Christ Jesus our Lord.","NHEB":"For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor powers, nor height, nor depth, nor any other created thing, will be able to separate us from the love of God, which is in Christ Jesus our Lord."}}],"l":[{"r":"Alma 40:12","x":"And then shall it come to pass, that the spirits of those who are righteous are received into a state of happiness, which is called paradise, a state of rest, a state of peace, where they shall rest from all their troubles and from all care, and sorrow."},{"r":"D&C 42:46","x":"And it shall come to pass that those that die in me shall not taste of death, for it shall be sweet unto them;"},{"r":"Mosiah 16:8","x":"But there is a resurrection, therefore the grave hath no victory, and the sting of death is swallowed up in Christ."}]},{"id":"suffering","t":"suffering","g":"Pain and suffering","p":["why am I suffering","it hurts so much","in pain","affliction"],"k":[],"v":[{"r":"Romans 8:18","x":{"KJV":"For I reckon that the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us.","DRC":"For I reckon that the sufferings of this time are not worthy to be compared with the glory to come that shall be revealed in us.","CPDV":"For I consider that the sufferings of this time are not worthy to be compared with that future glory which shall be revealed in us.","ASV":"For I reckon that the sufferings of this present time are not worthy to be compared with the glory which shall be revealed to us-ward.","BSB":"I consider that our present sufferings are not comparable to the glory that will be revealed in us.","BBE":"I am of the opinion that there is no comparison between the pain of this present time and the glory which we will see in the future.","Darby":"For I reckon that the sufferings of this present time are not worthy [to be compared] with the coming glory to be revealed to us.","Geneva1599":"For I count that the afflictions of this present time are not worthy of the glory, which shalbe shewed vnto vs.","Webster":"For I reckon, that the sufferings of this present time [are] not worthy [to be compared] with the glory which shall be revealed in us.","YLT":"For I reckon that the sufferings of the present time are not worthy to be compared with the glory about to be revealed in us;","NHEB":"For I consider that the sufferings of this present time are not worthy to be compared with the glory which will be revealed toward us."}},{"r":"2 Corinthians 4:17","x":{"KJV":"For our light affliction, which is but for a moment, worketh for us a far more exceeding and eternal weight of glory;","DRC":"For that which is at present momentary and light of our tribulation worketh for us above measure, exceedingly an eternal weight of glory.","CPDV":"For though our tribulation is, at the present time, brief and light, it accomplishes in us the weight of a sublime eternal glory, beyond measure.","ASV":"For our light affliction, which is for the moment, worketh for us more and more exceedingly an eternal weight of glory;","BSB":"For our light and momentary affliction is producing for us an eternal weight of glory that is far beyond comparison.","BBE":"For our present trouble, which is only for a short time, is working out for us a much greater weight of glory;","Darby":"For our momentary [and] light affliction works for us in surpassing measure an eternal weight of glory;","Geneva1599":"For our light affliction which is but for a moment, causeth vnto vs a farre most excellent and an eternall waight of glorie:","Webster":"For our light affliction, which is but for a moment, worketh out for us a far more exceeding [and] eternal weight of glory;","YLT":"for the momentary light matter of our tribulation, more and more exceedingly an age-during weight of glory doth work out for us--","NHEB":"For our light affliction, which is for the moment, works for us more and more exceedingly an eternal weight of glory;"}},{"r":"1 Peter 5:10","x":{"KJV":"But the God of all grace, who hath called us unto his eternal glory by Christ Jesus, after that ye have suffered a while, make you perfect, stablish, strengthen, settle you.","DRC":"But the God of all grace, who hath called us unto his eternal glory in Christ Jesus, after you have suffered a little, will himself perfect you and confirm you and establish you.","CPDV":"But the God of all grace, who has called us to his eternal glory in Christ Jesus, will himself perfect, confirm, and establish us, after a brief time of suffering.","ASV":"And the God of all grace, who called you unto his eternal glory in Christ, after that ye have suffered a little while, shall himself perfect, establish, strengthen you.","BSB":"And after you have suffered for a little while, the God of all grace, who has called you to His eternal glory in Christ, will Himself restore you, secure you, strengthen you, and establish you.","BBE":"And after you have undergone pain for a little time, the God of all grace who has given you a part in his eternal glory through Christ Jesus, will himself give you strength and support, and make you complete in every good thing;","Darby":"But theGod of all grace who has called you to his eternal glory in Christ Jesus, when ye have suffered for a little while, himself shall make perfect, stablish, strengthen, ground:","Geneva1599":"And the God of all grace, which hath called vs vnto his eternall glory by Christ Iesus, after that ye haue suffered a litle, make you perfite, confirme, strengthen and stablish you.","Webster":"But the God of all grace, who hath called us to his eternal glory by Christ Jesus, after ye have suffered a while, make you perfect, establish, strengthen, settle [you].","YLT":"And the God of all grace, who did call you to His age-during glory in Christ Jesus, having suffered a little, Himself make you perfect, establish, strengthen, settle you;","NHEB":"And the God of all grace, who called you to his eternal glory in Christ, after you have suffered a little while, will himself restore, confirm, strengthen and establish you."}}],"l":[{"r":"D&C 121:7-8","x":"My son, peace be unto thy soul; thine adversity and thine afflictions shall be but a small moment; And then, if thou endure it well, God shall exalt thee on high; thou shalt triumph over all thy foes."},{"r":"D&C 122:7","x":"And if thou shouldst be cast into the pit, or into the hands of murderers, and the sentence of death passed upon thee; if thou be cast into the deep; if the billowing surge conspire against thee; if fierce winds become thine enemy; if the heavens gather blackness, and all the elements combine to hedge up the way; and above all, if the very jaws of hell shall gape open the mouth wide after thee, know thou, my son, that all these things shall give thee experience, and shall be for thy good."},{"r":"Alma 36:3","x":"And now, O my son Helaman, behold, thou art in thy youth, and therefore, I beseech of thee that thou wilt hear my words and learn of me; for I do know that whosoever shall put their trust in God shall be supported in their trials, and their troubles, and their afflictions, and shall be lifted up at the last day."}]},{"id":"chronic-pain","t":"chronic pain","g":"Pain and suffering","p":["pain every day","chronic illness","constant pain","my body hurts"],"k":[],"v":[{"r":"2 Corinthians 12:9","x":{"KJV":"And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.","DRC":"And he said to me: My grace is sufficient for thee: for power is made perfect in infirmity. Gladly therefore will I glory in my infirmities, that the power of Christ may dwell in me.","CPDV":"And he said to me: “My grace is sufficient for you. For virtue is perfected in weakness.” And so, willingly shall I glory in my weaknesses, so that the virtue of Christ may live within me.","ASV":"And he hath said unto me, My grace is sufficient for thee: for my power is made perfect in weakness. Most gladly therefore will I rather glory in my weaknesses, that the power of Christ may rest upon me.","BSB":"But He said to me, “My grace is sufficient for you, for My power is perfected in weakness.” Therefore I will boast all the more gladly in my weaknesses, so that the power of Christ may rest on me.","BBE":"And he said to me, My grace is enough for you, for my power is made complete in what is feeble. Most gladly, then, will I take pride in my feeble body, so that the power of Christ may be on me.","Darby":"And he said to me, My grace suffices thee; for [my] power is perfected in weakness. Most gladly therefore will I rather boast in my weaknesses, that the power of the Christ may dwell upon me.","Geneva1599":"And he said vnto me, My grace is sufficient for thee: for my power is made perfect through weakenesse. Very gladly therefore will I reioyce rather in mine infirmities, that the power of Christ may dwell in me.","Webster":"And he said to me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.","YLT":"and He said to me, `Sufficient for thee is My grace, for My power in infirmity is perfected;' most gladly, therefore, will I rather boast in my infirmities, that the power of the Christ may rest on me:","NHEB":"He has said to me, \"My grace is sufficient for you, for power is made perfect in weakness.\" Most gladly therefore I will rather glory in my weaknesses, that the power of Christ may rest on me."}},{"r":"Psalms 73:26","x":{"KJV":"My flesh and my heart faileth: but God is the strength of my heart, and my portion for ever.","DRC":"For thee my flesh and my heart hath fainted away: thou art the God of my heart, and the God that is my portion for ever.","CPDV":"My body has failed, and my heart: O God of my heart, and God my portion, into eternity.","ASV":"My flesh and my heart faileth; But God is the strength of my heart and my portion for ever.","BSB":"My flesh and my heart may fail, but God is the strength of my heart and my portion forever.","BBE":"My flesh and my heart are wasting away: but God is the Rock of my heart and my eternal heritage.","Darby":"My flesh and my heart faileth:God is the rock of my heart and my portion for ever.","Geneva1599":"My flesh fayleth and mine heart also: but God is the strength of mine heart, and my portion for euer.","Webster":"My flesh and my heart faileth: [but] God [is] the strength of my heart, and my portion for ever.","YLT":"Consumed hath been my flesh and my heart, The rock of my heart and my portion is God to the age.","NHEB":"My flesh and my heart fails, but God is the strength of my heart and my portion forever."},"a":{"DRC":"Psalms 72:26","CPDV":"Psalms 72:26"}},{"r":"Isaiah 40:29","x":{"KJV":"He giveth power to the faint; and to them that have no might he increaseth strength.","DRC":"It is he that giveth strength to the weary, and increaseth force and might to them that are not.","CPDV":"It is he who gives strength to the weary, and it is he who increases fortitude and strength in those who are failing.","ASV":"He giveth power to the faint; and to him that hath no might he increaseth strength.","BSB":"He gives power to the faint and increases the strength of the weak.","BBE":"He gives power to the feeble, increasing the strength of him who has no force.","Darby":"He giveth power to the faint; and to him that hath no might he increaseth strength.","Geneva1599":"But he giueth strength vnto him that fainteth, and vnto him that hath no strength, he encreaseth power.","Webster":"He giveth power to the faint; and to [them that have] no might he increaseth strength.","YLT":"He is giving power to the weary, And to those not strong He increaseth might.","NHEB":"He gives power to the weak. He increases the strength of him who has no might."}}],"l":[{"r":"Alma 7:11-12","x":"And he shall go forth, suffering pains and afflictions and temptations of every kind; and this that the word might be fulfilled which saith he will take upon him the pains and the sicknesses of his people. And he will take upon him death, that he may loose the bands of death which bind his people; and he will take upon him their infirmities, that his bowels may be filled with mercy, according to the flesh, that he may know according to the flesh how to succor his people according to their infirmities."},{"r":"Ether 12:27","x":"And if men come unto me I will show unto them their weakness. I give unto men weakness that they may be humble; and my grace is sufficient for all men that humble themselves before me; for if they humble themselves before me, and have faith in me, then will I make weak things become strong unto them."},{"r":"Mosiah 24:14","x":"And I will also ease the burdens which are put upon your shoulders, that even you cannot feel them upon your backs, even while you are in bondage; and this will I do that ye may stand as witnesses for me hereafter, and that ye may know of a surety that I, the Lord God, do visit my people in their afflictions."}]},{"id":"illness","t":"illness","g":"Pain and suffering","p":["I'm sick","diagnosis","cancer","disease","hospital"],"k":["cancer","sick","surgery","hospital"],"v":[{"r":"James 5:14-15","x":{"KJV":"Is any sick among you? let him call for the elders of the church; and let them pray over him, anointing him with oil in the name of the Lord: And the prayer of faith shall save the sick, and the Lord shall raise him up; and if he have committed sins, they shall be forgiven him.","DRC":"Is any man sick among you? Let him bring in the priests of the church and let them pray over him, anointing him with oil in the name of the Lord. And the prayer of faith shall save the sick man. And the Lord shall raise him up: and if he be in sins, they shall be forgiven him.","CPDV":"Is anyone ill among you? Let him bring in the priests of the Church, and let them pray over him, anointing him with oil in the name of the Lord. And a prayer of faith will save the infirm, and the Lord will alleviate him. And if he has sins, these will be forgiven him.","ASV":"Is any among you sick? let him call for the elders of the church; and let them pray over him, anointing him with oil in the name of the Lord: and the prayer of faith shall save him that is sick, and the Lord shall raise him up; and if he have committed sins, it shall be forgiven him.","BSB":"Is any one of you sick? He should call the elders of the church to pray over him and anoint him with oil in the name of the Lord. And the prayer offered in faith will restore the one who is sick. The Lord will raise him up. If he has sinned, he will be forgiven.","BBE":"Is anyone among you ill? let him send for the rulers of the church; and let them say prayers over him, putting oil on him in the name of the Lord. And by the prayer of faith the man who is ill will be made well, and he will be lifted up by the Lord, and for any sin which he has done he will have forgiveness.","Darby":"Is any sick among you? let him call to [him] the elders of the assembly, and let them pray over him, anointing him with oil in the name of [the] Lord; and the prayer of faith shall heal the sick, and the Lord shall raise him up; and if he be one who has committed sins, it shall be forgiven him.","Geneva1599":"Is any sicke among you? Let him call for the Elders of the Church, and let them pray for him, and anoynt him with oyle in the Name of the Lord. And the prayer of faith shall saue the sicke, and the Lord shall raise him vp: and if he haue committed sinnes, they shalbe forgiuen him.","Webster":"Is any sick among you? let him call for the elders of the church; and let them pray over him, anointing him with oil in the name of the Lord: And the prayer of faith will save the sick, and the Lord will raise him up; and if he hath committed sins, they will be forgiven him.","YLT":"is any infirm among you? let him call for the elders of the assembly, and let them pray over him, having anointed him with oil, in the name of the Lord, and the prayer of the faith shall save the distressed one, and the Lord shall raise him up, and if sins he may have committed, they shall be forgiven to him.","NHEB":"Is any among you sick? Let him call for the elders of the church, and let them pray over him, anointing him with oil in the name of the Lord, and the prayer of faith will heal him who is sick, and the Lord will raise him up. If he has committed sins, he will be forgiven."}},{"r":"Psalms 41:3","x":{"KJV":"The LORD will strengthen him upon the bed of languishing: thou wilt make all his bed in his sickness.","DRC":"The Lord help him on his bed of sorrow: thou hast turned all his couch in his sickness.","CPDV":"May the Lord preserve him and give him life, and make him blessed upon the earth. And may he not hand him over to the will of his adversaries.","ASV":"Jehovah will support him upon the couch of languishing: Thou makest all his bed in his sickness.","BSB":"The LORD will sustain him on his bed of illness and restore him from his bed of sickness.","BBE":"The Lord will be his support on his bed of pain: by you will all his grief be turned to strength.","Darby":"Jehovah will sustain him upon the bed of languishing: thou turnest all his bed in his sickness.","Geneva1599":"The Lord wil strengthen him vpon ye bed of sorow: thou hast turned al his bed in his sicknes.","Webster":"The LORD will strengthen him upon the bed of languishing: thou wilt make all his bed in his sickness.","YLT":"Jehovah supporteth on a couch of sickness, All his bed Thou hast turned in his weakness.","NHEB":"The Lord will sustain him on his sickbed, and restore him from his bed of illness."},"a":{"DRC":"Psalms 40:4","CPDV":"Psalms 40:3"}},{"r":"Jeremiah 17:14","x":{"KJV":"Heal me, O LORD, and I shall be healed; save me, and I shall be saved: for thou art my praise.","DRC":"Heal me, O Lord, and I shall be healed: save me, and I shall be saved: for thou art my praise.","CPDV":"Heal me, O Lord, and I will be healed. Save me, and I will be saved. For you are my praise.","ASV":"Heal me, O Jehovah, and I shall be healed; save me, and I shall be saved: for thou art my praise.","BSB":"Heal me, O LORD, and I will be healed; save me, and I will be saved, for You are my praise.","BBE":"Make me well, O Lord, and I will be well; be my saviour, and I will be safe: for you are my hope.","Darby":"Heal me, Jehovah, and I shall be healed; save me, and I shall be saved: for thou art my praise.","Geneva1599":"Heale me, O Lord, and I shall bee whole: saue me, and I shall bee saued: for thou art my prayse.","Webster":"Heal me, O LORD, and I shall be healed; save me, and I shall be e healed."}},{"r":"Psalms 147:3","x":{"KJV":"He healeth the broken in heart, and bindeth up their wounds.","DRC":"Who healeth the broken of heart, and bindeth up their bruises.","CPDV":"He heals the contrite of heart, and he binds up their sorrows.","ASV":"He healeth the broken in heart, And bindeth up their wounds.","BSB":"He heals the brokenhearted and binds up their wounds.","BBE":"He makes the broken-hearted well, and puts oil on their wounds.","Darby":"He healeth the broken in heart, and bindeth up their wounds.","Geneva1599":"He healeth those that are broken in heart, and bindeth vp their sores.","Webster":"He healeth the broken in heart, and bindeth up their wounds.","YLT":"Who is giving healing to the broken of heart, And is binding up their griefs.","NHEB":"He heals the broken in heart, and binds up their wounds."},"a":{"DRC":"Psalms 146:3","CPDV":"Psalms 146:3"}}],"l":[{"r":"3 Nephi 17:7","x":"Have ye any that are sick among you? Bring them hither. Have ye any that are lame, or blind, or halt, or maimed, or leprous, or that are withered, or that are deaf, or that are afflicted in any manner? Bring them hither and I will heal them, for I have compassion upon you; my bowels are filled with mercy."},{"r":"3 Nephi 9:13","x":"O all ye that are spared because ye were more righteous than they, will ye not now return unto me, and repent of your sins, and be converted, that I may heal you?"},{"r":"D&C 42:48","x":"And again, it shall come to pass that he that hath faith in me to be healed, and is not appointed unto death, shall be healed."}]},{"id":"a-sick-child","t":"a sick child","g":"Pain and suffering","p":["my child is sick","my baby is in the hospital","sick son","sick daughter"],"k":[],"v":[{"r":"Mark 5:36","x":{"KJV":"As soon as Jesus heard the word that was spoken, he saith unto the ruler of the synagogue, Be not afraid, only believe.","DRC":"But Jesus having heard the word that was spoken, saith to the ruler of the synagogue: Fear not, only believe.","CPDV":"But Jesus, having heard the word that was spoken, said to the ruler of the synagogue: “Do not be afraid. You need only believe.”","ASV":"But Jesus, not heeding the word spoken, saith unto the ruler of the synagogue, Fear not, only believe.","BSB":"But Jesus overheard their conversation and said to Jairus, “Do not be afraid; just believe.”","BBE":"But Jesus, giving no attention to their words, said to the ruler of the Synagogue, Have no fear, only have faith.","Darby":"But Jesus [immediately], having heard the word spoken, says to the ruler of the synagogue, Fear not; only believe.","Geneva1599":"Assoone as Iesus heard that word spoken, he said vnto the ruler of the Synagogue, Be not afraide: onely beleeue.","Webster":"As soon as Jesus heard the word that was spoken, he saith to the ruler of the synagogue, Be not afraid, only believe,","YLT":"And Jesus immediately, having heard the word that is spoken, saith to the chief of the synagogue, `Be not afraid, only believe.'","NHEB":"But Jesus, overhearing the message spoken, said to the ruler of the synagogue, \"Do not be afraid, only believe.\""}},{"r":"Mark 10:14","x":{"KJV":"But when Jesus saw it, he was much displeased, and said unto them, Suffer the little children to come unto me, and forbid them not: for of such is the kingdom of God.","DRC":"Whom when Jesus saw, he was much displeased and saith to them: Suffer the little children to come unto me and forbid them not: for of such is the kingdom of God.","CPDV":"But when Jesus saw this, he took offense, and he said to them: “Allow the little ones to come to me, and do not prohibit them. For of such as these is the kingdom of God.","ASV":"But when Jesus saw it, he was moved with indignation, and said unto them, Suffer the little children to come unto me; forbid them not: for to such belongeth the kingdom of God.","BSB":"But when Jesus saw this, He was indignant and told them, “Let the little children come to Me, and do not hinder them! For the kingdom of God belongs to such as these.","BBE":"And when Jesus saw it, he was angry, and said to them, Let the little children come to me, and do not keep them away; for of such is the kingdom of God.","Darby":"But Jesus seeing [it], was indignant, and said to them, Suffer the little children to come to me; forbid them not; for of such is the kingdom ofGod.","Geneva1599":"But when Iesus sawe it, he was displeased, and said to them, Suffer the litle children to come vnto me, and forbid them not: for of such is the kingdome of God.","Webster":"But when Jesus saw [it], he was much displeased, and said to them, Suffer the little children to come to me, and forbid them not: for of such is the kingdom of God.","YLT":"and Jesus having seen, was much displeased, and he said to them, `Suffer the children to come unto me, and forbid them not, for of such is the reign of God;","NHEB":"But when Jesus saw it, he was moved with indignation, and said to them, \"Allow the little children to come to me! Do not forbid them, for the Kingdom of God belongs to such as these."}},{"r":"Isaiah 40:11","x":{"KJV":"He shall feed his flock like a shepherd: he shall gather the lambs with his arm, and carry them in his bosom, and shall gently lead those that are with young.","DRC":"He shall feed his flock like a shepherd: he shall gather together the lambs with his arm, and shall take them up in his bosom, and he himself shall carry them that are with young.","CPDV":"He will pasture his flock like a shepherd. He will gather together the lambs with his arm, and he will lift them up to his bosom, and he himself will carry the very young.","ASV":"He will feed his flock like a shepherd, he will gather the lambs in his arm, and carry them in his bosom, and will gently lead those that have their young.","BSB":"He tends His flock like a shepherd; He gathers the lambs in His arms and carries them close to His heart. He gently leads the nursing ewes.","BBE":"He will give food to his flock like a keeper of sheep; with his arm he will get it together, and will take up the lambs on his breast, gently guiding those which are with young.","Darby":"He will feed his flock like a shepherd: he will gather the lambs with his arm, and carry them in his bosom; he will gently lead those that give suck.","Geneva1599":"He shall feede his flocke like a shepheard: he shall gather the lambes with his arme, and cary them in his bosome, and shall guide them with young.","Webster":"He will feed his flock like a shepherd: he will gather the lambs with his arm, and carry [them] in his bosom, [and] will gently lead those that are with young.","YLT":"As a shepherd His flock He feedeth, With His arm He gathereth lambs, And in His bosom He carrieth them: Suckling ones He leadeth.","NHEB":"He will feed his flock like a shepherd. He will gather the lambs in his arm, and carry them in his bosom. He will gently lead those who have their young."}}],"l":[{"r":"3 Nephi 17:7","x":"Have ye any that are sick among you? Bring them hither. Have ye any that are lame, or blind, or halt, or maimed, or leprous, or that are withered, or that are deaf, or that are afflicted in any manner? Bring them hither and I will heal them, for I have compassion upon you; my bowels are filled with mercy."},{"r":"3 Nephi 17:21","x":"And when he had said these words, he wept, and the multitude bare record of it, and he took their little children, one by one, and blessed them, and prayed unto the Father for them."},{"r":"D&C 42:48","x":"And again, it shall come to pass that he that hath faith in me to be healed, and is not appointed unto death, shall be healed."}]},{"id":"waiting-on-a-diagnosis","t":"waiting on a diagnosis","g":"Pain and suffering","p":["waiting for test results","waiting on the doctor","scan results","biopsy"],"k":[],"v":[{"r":"Psalms 112:7","x":{"KJV":"He shall not be afraid of evil tidings: his heart is fixed, trusting in the LORD.","DRC":"The just shall be in everlasting remembrance: he shall not fear the evil hearing. His nd is steadfast in perfect peace, because he trusts in you."}},{"r":"Philippians 4:6-7","x":{"KJV":"Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.","DRC":"Be nothing solicitous: but in every thing, by prayer and supplication, with thanksgiving, let your petitions be made known to God. And the peace of God, which surpasseth all understanding, keep your hearts and minds in Christ Jesus.","CPDV":"Be anxious about nothing. But in all things, with prayer and supplication, with acts of thanksgiving, let your petitions be made known to God. And so shall the peace of God, which exceeds all understanding, guard your hearts and minds in Christ Jesus.","ASV":"In nothing be anxious; but in everything by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall guard your hearts and your thoughts in Christ Jesus.","BSB":"Be anxious for nothing, but in everything, by prayer and petition, with thanksgiving, present your requests to God. And the peace of God, which surpasses all understanding, will guard your hearts and your minds in Christ Jesus.","BBE":"Have no cares; but in everything with prayer and praise put your requests before God. And the peace of God, which is deeper than all knowledge, will keep your hearts and minds in Christ Jesus.","Darby":"Be careful about nothing; but in everything, by prayer and supplication with thanksgiving, let your requests be made known toGod; and the peace ofGod, which surpasses every understanding, shall guard your hearts and your thoughts by Christ Jesus.","Geneva1599":"Be nothing carefull, but in all thinges let your requestes be shewed vnto God in praier, and supplication with giuing of thankes. And the peace of God which passeth all vnderstanding, shall preserue  are not your thoughts, and your ways are not my ways, says the Lord. For just as the heavens are exalted above the earth, so also are my ways exalted above your ways, and my thoughts above your thoughts.","ASV":"For my thoughts are not your thoughts, neither are your ways my ways, saith Jehovah. For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","BSB":"“For My thoughts are not your thoughts, neither are your ways My ways,” declares the LORD. “For as the heavens are higher than the earth, so My ways are higher than your ways and My thoughts than your thoughts.","BBE":"For my thoughts are not your thoughts, or your ways my ways, says the Lord. For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","Darby":"For my thoughts are not your thoughts, neither are your ways my ways, saith Jehovah. For [as] the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","Geneva1599":"For my thoughtes are not your thoughts, neither are your wayes my wayes, sayth the Lord. For as ye heauens are higher then the earth, so are my wayes higher then your wayes, and my thoughtes aboue your thoughts.","Webster":"For my thoughts [are] not your thoughts, neither [are] your ways my ways, saith the LORD. For [as] the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","YLT":"For not My thoughts are your thoughts, Nor your ways My ways, --an affirmation of Jehovah, For high have the heavens been above the earth, So high have been My ways above your ways, And My thoughts above your thoughts.","NHEB":"\"For my thoughts are not your thoughts, neither are your ways my ways,\" says the Lord. \"For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts."}},{"r":"Romans 8:28","x":{"KJV":"And we know that all things work together for good to them that love God, to them who are the called according to his purpose.","DRC":"And we know that to them that love God all things work together unto good: to such as, according to his purpose, are called to be saints.","CPDV":"And we know that, for those who love God, all things work together unto good, for those who, in accordance with his purpose, are called to be saints.","ASV":"And we know that to them that love God all things work together for good, even to them that are called according to his purpose.","BSB":"And we know that God works all things together for the good of those who love Him, who are called according to His purpose.","BBE":"And we are conscious that all things are working together for good to those who have love for God, and have been marked out by his purpose.","Darby":"But we do know that all things work together for good to those who loveGod, to those who are called according to purpose.","Geneva1599":"Also we knowe that all thinges worke together for the best vnto them that loue God, euen to them that are called of his purpose.","Webster":"And we know that all things work together for good, to them that love God, to them who are the called according to [his] purpose.","YLT":"And we have known that to those loving God all things do work together for good, to those who are called according to purpose;","NHEB":"We know that all things work together for good for those who love God, to those who are called according to his purpose."}},{"r":"John 16:33","x":{"KJV":"These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world.","DRC":"These things I have spoken to you, that in me you may have peace. In the world you shall have distress. But have confidence. I have overcome the world.","CPDV":"These things I have spoken to you, so that you may have peace in me. In the world, you will have difficulties. But have confidence: I have overcome the world.”","ASV":"These things have I spoken unto you, that in me ye may have peace. In the world ye have tribulation: but be of good cheer; I have overcome the world.","BSB":"I have told you these things so that in Me you may have peace. In the world you will have tribulation. But take courage; I have overcome the world!”","BBE":"I have said all these things to you so that in me you may have peace. In the world you have trouble: but take heart! I have overcome the world.","Darby":"These things have I spoken to you that in me ye might have peace. In the world ye have tribulation; but be of good courage: I have overcome the world.","Geneva1599":"These thinges haue I spoken vnto you, that in me ye might haue peace: in the world ye shall haue affliction, but be of good comfort: I haue ouercome the world.","Webster":"These things I have spoken to you, that in me ye may have peace. In the world ye will have tribulation, but be of good cheer: I have overcome the world.","YLT":"these things I have spoken to you, that in me ye may have peace, in the world ye shall have tribulation, but take courage--I have overcome the world.'","NHEB":"I have told you these things, that in me you may have peace. In the world you have oppression; but cheer up! I have overcome the world.\""}}],"l":[{"r":"2 Nephi 2:11","x":"For it must needs be, that there is an opposition in all things. If not so, my firstborn in the wilderness, righteousness could not be brought to pass, neither wickedness, neither holiness nor misery, neither good nor bad. Wherefore, all things must needs be a compound in one; wherefore, if it should be one body it must needs remain as dead, having no life neither death, nor corruption nor incorruption, happiness nor misery, neither sense nor insensibility."},{"r":"D&C 122:7","x":"And if thou shouldst be cast into the pit, or into the hands of murderers, and the sentence of death passed upon thee; if thou be cast into the deep; if the billowing surge conspire against thee; if fierce winds become thine enemy; if the heavens gather blackness, and all the elements combine to hedge up the way; and above all, if the very jaws of hell shall gape open the mouth wide after thee, know thou, my son, that all these things shall give thee experience, and shall be for thy good."},{"r":"Ether 12:6","x":"And now, I, Moroni, would speak somewhat concerning these things; I would show unto the world that faith is things which are hoped for and not seen; wherefore, dispute not because ye see not, for ye receive no witness until after the trial of your faith."}]},{"id":"trials","t":"trials","g":"Pain and suffering","p":["going through a hard time","this trial","tested","hardship"],"k":[],"v":[{"r":"James 1:2-4","x":{"KJV":"My brethren, count it all joy when ye fall into divers temptations; Knowing this, that the trying of your faith worketh patience. But let patience have her perfect work, that ye may be perfect and entire, wanting nothing.","DRC":"My brethren, count it all joy, when you shall fall into divers temptations: Knowing that the trying of your faith worketh patience And patience hath a perfect work: that you may be perfect and entire, failing in nothing.","CPDV":"My brothers, when you have fallen into various trials, consider everything a joy, knowing that the proving of your faith exercises patience, and patience brings a work to perfection, so that you may be perfect and whole, deficient in nothing.","ASV":"Count it all joy, my brethren, when ye fall into manifold temptations; knowing that the proving of your faith worketh patience. And let patience have its perfect work, that ye may be perfect and entire, lacking in nothing.","BSB":"Consider it pure joy, my brothers, when you encounter trials of many kinds, because you know that the testing of your faith develops perseverance. Allow perseverance to finish its work, so that you may be mature and complete, not lacking anything.","BBE":"Let it be all joy to you, my brothers, when you undergo tests of every sort; Because you have the knowledge that the testing of your faith gives you the power of going on in hope; But let this power have its full effect, so that you may be made complete, needing nothing.","Darby":"Count it all joy, my brethren, when ye fall into various temptations, knowing that the proving of your faith works endurance. But let endurance have [its] perfect work, that ye may be perfect and complete, lacking in nothing.","Geneva1599":"My brethren, count it exceeding ioy, when ye fall into diuers tentations, Knowing that ye trying of your faith bringeth forth patience, And let patience haue her perfect worke, that ye may be perfect and entier, lacking nothing.","Webster":"My brethren, count it all joy when ye fall into divers temptations. Knowing [this], that the trying of your faith worketh patience. But let patience have [her] perfect work, that ye may be perfect and entire, wanting nothing.","YLT":"All joy count it, my brethren, when ye may fall into temptations manifold; knowing that the proof of your faith doth work endurance, and let the endurance have a perfect work, that ye may be perfect and entire--in nothing lacking;","NHEB":"Count it all joy, my brothers, when you fall into various temptations, knowing that the testing of your faith produces endurance. Let endurance have its perfect work, that you may be perfect and complete, lacking in nothing."}},{"r":"1 Peter 1:6-7","x":{"KJV":"Wherein ye greatly rejoice, though now for a season, if need be, ye are in heaviness through manifold temptations: That the trial of your faith, being much more precious than of gold that perisheth, though it be tried with fire, might be found unto praise and honour and glory at the appearing of Jesus Christ:","DRC":"Wherein you shalt greatly rejoice, if now you must be for a little time made sorrowful in divers temptations: That the trial of your faith (much more precious than gold which is tried by the fire) may be found unto praise and glory and honour at the appearing of Jesus Christ.","CPDV":"In this, you should exult, if now, for a brief time, it is necessary to be made sorrowful by various trials, so that the testing of your faith, which is much more precious than gold tested by fire, may be found in praise and glory and honor at the revelation of Jesus Christ.","ASV":"Wherein ye greatly rejoice, though now for a little while, if need be, ye have been put to grief in manifold trials, that the proof of your faith, being more precious than gold that perisheth though it is proved by fire, may be found unto praise and glory and honor at the revelation of Jesus Christ:","BSB":"In this you greatly rejoice, though now for a little while you may have had to suffer grief in various trials so that the proven character of your faith—more precious than gold, which perishes even though refined by fire—may result in praise, glory, and honor at the revelation of Jesus Christ.","BBE":"You have cause for great joy in this, though it may have been necessary for you to be troubled for a little time, being tested in all sorts of ways, So that the true metal of your faith, being of much greater value than gold (which, though it comes to an end, is tested by fire), may come to light in praise and glory and honour, at the revelation of Jesus Christ:","Darby":"Wherein ye exult, for a little while at present, if needed, put to grief by various trials, that the proving of your faith, much more precious than of gold which perishes, though it be proved by fire, be found to praise and glory and honour in [the] revelation of Jesus Christ:","Geneva1599":"Wherein yee reioyce, though nowe for a season (if neede require) yee are in heauinesse, through manifolde tentations, That the triall of your faith, being much more precious then golde that perisheth (though it be tried with fire) might bee founde vnto your praise, and honour and glorie at the appearing of Iesus Christ:","Webster":"In which ye greatly rejoice, though now for a season (if need be) ye are in heaviness through manifold temptations: That the trial of your faith, being much more precious than of gold that perisheth, though tried with fire, might be found to praise, and honor, and glory, at the appearing of Jesus Christ:","YLT":"in which ye are glad, a little now, if it be necessary, being made to sorrow in manifold trials, that the proof of your faith--much more precious than of gold that is perishing, and through fire being approved--may be found to praise, and honour, and glory, in the revelation of Jesus Christ,","NHEB":"Wherein you greatly rejoice, though now for a little while, if need be, you have been put to grief in various trials, that the proof of your faith, which is more precious than gold that perishes even though it is tested by fire, may be found to result in praise, glory, and honor at the revelation of Jesus Christ-"}},{"r":"1 Corinthians 10:13","x":{"KJV":"There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it.","DRC":"Let no temptation take hold on you, but such as is human. And God is faithful, who will not suffer you to be tempted above that which you are able: but will make also with temptation issue, that you may be able to bear it.","CPDV":"Temptation should not take hold of you, except what is human. For God is faithful, and he will not permit you to be tempted beyond your ability. Instead, he will effect his Providence, even during temptation, so that you may be able to bear it.","ASV":"There hath no temptation taken you but such as man can bear: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation make also the way of escape, that ye may be able to endure it.","BSB":"No temptation has seized you except what is common to man. And God is faithful; He will not let you be tempted beyond what you can bear. But when you are tempted, He will also provide an escape, so that you can stand up under it.","BBE":"You have been put to no test but such as is common to man: and God is true, who will not let any test come on you which you are not able to undergo; but he will make with the test a way out of it, so that you may be able to go through it.","Darby":"No temptation has taken you but such as is according to man's nature; andGod is faithful, who will not suffer you to be tempted above what ye are able [to bear], but will with the temptation make the issue also, so that [ye] should be able to bear [it].","Geneva1599":"There hath no tentation taken you, but such as appertaine to man: and God is faithfull, which will not suffer you to be tempted aboue that you be able, but wil euen giue the issue with the tentation, that ye may be able to beare it.","Webster":"There hath no temptation taken you but such as is common to man: but God [is] faithful, who will not suffer you to be tempted above what ye are able; but will with the temptation also make a way to escape, that ye may be able to bear [it].","YLT":"No temptation hath taken you--except human; and God is faithful, who will not suffer you to be tempted above what ye are able, but He will make, with the temptation, also the outlet, for your being able to bear it.","NHEB":"No temptation has taken you except what is common to man. God is faithful, who will not allow you to be tempted above what you are able, but will with the temptation also make the way of escape, that you may be able to endure it."}}],"l":[{"r":"Ether 12:6","x":"And now, I, Moroni, would speak somewhat concerning these things; I would show unto the world that faith is things which are hoped for and not seen; wherefore, dispute not because ye see not, for ye receive no witness until after the trial of your faith."},{"r":"D&C 122:7","x":"And if thou shouldst be cast into the pit, or into the hands of murderers, and the sentence of death passed upon thee; if thou be cast into the deep; if the billowing surge conspire against thee; if fierce winds become thine enemy; if the heavens gather blackness, and all the elements combine to hedge up the way; and above all, if the very jaws of hell shall gape open the mouth wide after thee, know thou, my son, that all these things shall give thee experience, and shall be for thy good."},{"r":"Alma 36:3","x":"And now, O my son Helaman, behold, thou art in thy youth, and therefore, I beseech of thee that thou wilt hear my words and learn of me; for I do know that whosoever shall put their trust in God shall be supported in their trials, and their troubles, and their afflictions, and shall be lifted up at the last day."}]},{"id":"endurance","t":"endurance","g":"Pain and suffering","p":["I can't keep going","hold on","endure","persevere","keep going"],"k":[],"v":[{"r":"Galatians 6:9","x":{"KJV":"And let us not be weary in well doing: for in due season we shall reap, if we faint not.","DRC":"And in doing good, let us not fail. For in due time we shall reap, not failing.","CPDV":"And so, let us not be deficient in doing good. For in due time, we shall reap without fail.","ASV":"And let us not be weary in well-doing: for in due season we shall reap, if we faint not.","BSB":"Let us not grow weary in well-doing, for in due time we will reap a harvest if we do not give up.","BBE":"And let us not get tired of well-doing; for at the right time we will get in the grain, if we do not give way to weariness.","Darby":"but let us not lose heart in doing good; for in due time, if we do not faint, we shall reap.","Geneva1599":"Let vs not therefore be weary of well doing: for in due season we shall reape, if we faint not.","Webster":"And let us not be weary in well-doing: for in due season we shall reap, if we faint not.","YLT":"and in the doing good we may not be faint-hearted, for at the proper time we shall reap--not desponding;","NHEB":"Let us not be weary in doing good, for we will reap in due season, if we do not give up."}},{"r":"Hebrews 12:1-2","x":{"KJV":"Wherefore seeing we also are compassed about with so great a cloud of witnesses, let us lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us, Looking unto Jesus the author and finisher of our faith; who for the joy that was set before him endured the cross, despising the shame, and is set down at the right hand of the throne of God.","DRC":"And therefore we also having so great a cloud of witnesses over our head, laying aside every weight and sin which surrounds us, let us run by patience to the fight proposed to us: Looking on Jesus, the author and finisher of faith, who, having joy set before him, endured the cross, despising the shame, and now sitteth on the right hand of the throne of God.","CPDV":"Furthermore, since we also have so great a cloud of witnesses over us, let us set aside every burden and sin which may surround us, and advance, through patience, to the struggle offered to us. Let us gaze upon Jesus, as the Author and the completion of our faith, who, having joy laid out before him, endured the cross, disregarding the shame, and who now sits at the right hand of the throne of God.","ASV":"Therefore let us also, seeing we are compassed about with so great a cloud of witnesses, lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us, looking unto Jesus the author and perfecter of our faith, who for the joy that was set before him endured the cross, despising shame, and hath sat down at the right hand of the throne of God.","BSB":"Therefore, since we are surrounded by such a great cloud of witnesses, let us throw off every encumbrance and the sin that so easily entangles, and let us run with endurance the race set out for us. Let us fix our eyes on Jesus, the author and perfecter of our faith, who for the joy set before Him endured the cross, scorning its shame, and sat down at the right hand of the throne of God.","BBE":"For this reason, as we are circled by so great a cloud of witnesses, putting off every weight, and the sin into which we come so readily, let us keep on running in the way which is marked out for us, Having our eyes fixed on Jesus, the guide and end of our faith, who went through the pains of the cross, not caring for the shame, because of the joy which was before him, and who has now taken his place at the right hand of God's seat of power.","Darby":"Let us also therefore, having so great a cloud of witnesses surrounding us, laying aside every weight, and sin which so easily entangles us, run with endurance the race that lies before us, looking stedfastly on Jesus the leader and completer of faith: who, in view of the joy lying before him, endured [the] cross, having despised [the] shame, and is set down at the right hand of the throne ofGod.","Geneva1599":"Wherefore, let vs also, seeing that we are compassed with so great a cloude of witnesses, cast away euery thing that presseth downe, and the sinne that hangeth so fast on: let vs runne with patience the race that is set before vs, Looking vnto Iesus the authour and finisher of our faith, who for the ioy that was set before him, endured the crosse, and despised the shame, and is set at the right hand of the throne of God.","Webster":"Wherefore, seeing we also are encompassed with so great a cloud of witnesses, let us lay aside every weight, and the sin which doth so easily beset [us], and let us run with patience the race that is set before us, Looking to Jesus the author and finisher of [our] faith; who for the joy that was set before him endured the cross, despising the shame, and is set down at the right hand of the throne of God.","YLT":"Therefore, we also having so great a cloud of witnesses set around us, every weight having put off, and the closely besetting sin, through endurance may we run the contest that is set before us, looking to the author and perfecter of faith--Jesus, who, over-against the joy set before him--did endure a cross, shame having despised, on the right hand also of the throne of God did sit down;","NHEB":"Therefore let us also, seeing we are surrounded by so great a cloud of witnesses, lay aside every weight and the sin which so easily entangles us, and let us run with patience the race that is set before us, looking to Jesus, the author and perfecter of faith, who for the joy that was set before him endured the cross, disregarding its shame, and has sat down at the right hand of the throne of God."}},{"r":"Isaiah 40:31","x":{"KJV":"But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.","DRC":"But they that hope in the Lord shall renew their strength, they shall take wings as eagles, they shall run and not be weary, they shall walk and not faint.","CPDV":"But those who hope in the Lord will renew their strength. They will take up wings like eagles. They will run and not struggle. They will walk and not tire.","ASV":"but they that wait for Jehovah shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; they shall walk, and not faint.","BSB":"But those who wait upon the LORD will renew their strength; they will mount up with wings like eagles; they will run and not grow weary, they will walk and not faint.","BBE":"But those who are waiting for the Lord will have new strength; they will get wings like eagles: running, they will not be tired, and walking, they will have no weariness.","Darby":"but they that wait upon Jehovah shall renew [their] strength: they shall mount up with wings as eagles; they shall run, and not tire; they shall walk, and not faint.","Geneva1599":"But they that waite vpon the Lord, shall renue their strength: they shall lift vp the wings as the eagles: they shall runne, and not be wearie, and they shall walke and not faint.","Webster":"But they that wait upon the LORD shall renew [their] strength; they shall mount up with wings as eagles; they shall run, and not be weary; they shall walk, and not faint.","YLT":"But those expecting Jehovah pass to power, They raise up the pinion as eagles, They run and are not fatigued, They go on and do not faint!","NHEB":"But those who wait for the Lord will renew their strength. They will mount up with wings like eagles. They will run, and not be weary. They will walk, and not faint."}}],"l":[{"r":"2 Nephi 31:20","x":"Wherefore, ye must press forward with a steadfastness in Christ, having a perfect brightness of hope, and a love of God and of all men. Wherefore, if ye shall press forward, feasting upon the word of Christ, and endure to the end, behold, thus saith the Father: Ye shall have eternal life."},{"r":"D&C 121:8","x":"And then, if thou endure it well, God shall exalt thee on high; thou shalt triumph over all thy foes."},{"r":"Mosiah 24:15","x":"And now it came to pass that the burdens which were laid upon Alma and his brethren were made light; yea, the Lord did strengthen them that they could bear up their burdens with ease, and they did submit cheerfully and with patience to all the will of the Lord."}]},{"id":"weakness","t":"weakness","g":"Pain and suffering","p":["I feel weak","not strong enough","I'm failing","my weakness"],"k":[],"v":[{"r":"2 Corinthians 12:9-10","x":{"KJV":"And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me. Therefore I take pleasure in infirmities, in reproaches, in necessities, in persecutions, in distresses for Christ's sake: for when I am weak, then am I strong.","DRC":"And he said to me: My grace is sufficient for thee: for power is made perfect in infirmity. Gladly therefore will I glory in my infirmities, that the power of Christ may dwell in me. For which cause I please myself in my infirmities, in reproaches, in necessities, in persecutions, in distresses, for Christ. For when I am weak, then am I powerful.","CPDV":"And he said to me: “My grace is sufficient for you. For virtue is perfected in weakness.” And so, willingly shall I glory in my weaknesses, so that the virtue of Christ may live within me. Because of this, I am pleased in my infirmity: in reproaches, in difficulties, in persecutions, in distresses, for the sake of Christ. For when I am weak, then I am powerful.","ASV":"And he hath said unto me, My grace is sufficient for thee: for my power is made perfect in weakness. Most gladly therefore will I rather glory in my weaknesses, that the power of Christ may rest upon me. Wherefore I take pleasure in weaknesses, in injuries, in necessities, in persecutions, in distresses, for Christ’s sake: for when I am weak, then am I strong.","BSB":"But He said to me, “My grace is sufficient for you, for My power is perfected in weakness.” Therefore I will boast all the more gladly in my weaknesses, so that the power of Christ may rest on me. That is why, for the sake of Christ, I delight in weaknesses, in insults, in hardships, in persecutions, in difficulties. For when I am weak, then I am strong.","BBE":"And he said to me, My grace is enough for you, for my power is made complete in what is feeble. Most gladly, then, will I take pride in my feeble body, so that the power of Christ may be on me. So I take pleasure in being feeble, in unkind words, in needs, in cruel attacks, in troubles, on account of Christ: for when I am feeble, then am I strong.","Darby":"And he said to me, My grace suffices thee; for [my] power is perfected in weakness. Most gladly therefore will I rather boast in my weaknesses, that the power of the Christ may dwell upon me. Wherefore I take pleasure in weaknesses, in insults, in necessities, in persecutions,
